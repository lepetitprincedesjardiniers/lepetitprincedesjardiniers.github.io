<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Trésor Public - Accueil</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; 
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff; overflow-x: hidden; min-height: 100vh; position: relative;
        }

        /* --- ÉTOILES ANIMÉES --- */
        .star { 
            position: fixed; background: #FFFFFF; border-radius: 50%; z-index: -1; box-shadow: 0 0 8px #FFFFFF;
            animation: twinkle var(--duration) infinite ease-in-out, moveStar var(--move-duration) infinite linear;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes moveStar {
            from { transform: translateY(0); }
            to { transform: translateY(-100vh); }
        }

        /* --- MENU AVEC EFFETS --- */
        .menu-table { margin: 20px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; position: relative; z-index: 10; overflow: hidden; }
        .menu-table td { border: 1px solid #FFFFFF; padding: 0; transition: 0.3s; }
        .menu-table a { display: block; padding: 12px 20px; text-decoration: none; color: #FFFFFF; font-weight: bold; transition: 0.3s; }
        .menu-table td:hover { background-color: #00b3b3; box-shadow: inset 0 0 10px white; }
        .menu-table a:hover { transform: scale(1.1); color: #fff; text-shadow: 0 0 5px white; }
        
        #btn-son { position: fixed; top: 10px; right: 10px; z-index: 1000; background: rgba(255,255,255,0.2); border: 1px solid white; color: white; border-radius: 50%; cursor: pointer; padding: 8px; font-size: 20px; transition: 0.3s; }

        /* --- HEADER : BOUQUETS SYMÉTRIQUES --- */
        .header-container { display: flex; align-items: center; justify-content: center; gap: 40px; margin: 30px auto; }
        .petit-bouquet-gauche { font-size: 50px; transform: rotate(-15deg); } /* Penché à gauche */
        .petit-bouquet-droite { font-size: 50px; transform: rotate(15deg); } /* Symétrie inverse : penché à droite */
        
        .soleil-cadre {
            width: 180px; height: 180px; background: #FFD700; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px #FFA500; animation: soleilScintille 4s ease-in-out infinite;
        }
        .soleil-cadre h1 { font-size: 1.1em; margin: 0; color: #000080; }
        @keyframes soleilScintille { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* --- TERRE INTERACTIVE --- */
        .terre-don {
            width: 250px; height: 250px; margin: 20px auto; border-radius: 50%;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Solarsystemscope_texture_2k_earth_daymap.jpg/1200px-Solarsystemscope_texture_2k_earth_daymap.jpg');
            background-size: cover; background-repeat: repeat-x;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; color: white; font-weight: bold;
            box-shadow: inset -20px -20px 50px rgba(0,0,0,0.8), 0 0 20px rgba(0,191,255,0.5);
            animation: rotationTerre 30s linear infinite; /* Rotation lente de base */
            transition: animation-duration 0.5s ease;
            position: relative; z-index: 5; overflow: hidden;
        }
        
        /* Accélération au survol */
        .terre-don:hover { 
            animation-duration: 8s; /* Tourne plus vite quand on approche la souris */
        }
        
        @keyframes rotationTerre {
            from { background-position: 0 0; }
            to { background-position: 500px 0; }
        }

        /* --- RUBRIQUES --- */
        .bulles-grid { display: flex; justify-content: center; align-items: stretch; gap: 25px; flex-wrap: wrap; padding: 20px; max-width: 1200px; margin: auto; position: relative; z-index: 5; }
        .nuage { background: #e0f7fa; border: 3px solid #008080; border-radius: 50px; padding: 20px; width: 320px; min-height: 250px; text-decoration: none; color: #000080; display: flex; flex-direction: column; justify-content: center; transition: 0.3s; }
        .etoile-justice { 
            background: #E6E6FA; border: 3px solid #9370DB; width: 300px; min-height: 250px; 
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            text-decoration: none; color: #333; transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .etoile-justice:hover { clip-path: circle(50% at 50% 50%); border-radius: 50%; transform: scale(1.1); background: #efedff; }

        footer { padding: 40px; position: relative; z-index: 10; }
    </style>
</head>
<body>

    <audio id="chantOiseaux" loop src="oiseaux.mp3"></audio>
    <button id="btn-son" onclick="toggleSon()">🐦</button>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impot.html">Impôts Publics</a></td>
            <td><a href="regulation.html">Régulation</a></td>
        </tr>
    </table>

    <div class="header-container">
        <div class="petit-bouquet-gauche">💐</div>
        <div class="soleil-cadre"><h1>Le Trésor Public</h1></div>
        <div class="petit-bouquet-droite">💐</div>
    </div>

    <p><strong>Le Petit Prince des Jardiniers</strong></p>

    <a href="jardin.html" class="terre-don">
        <div style="text-shadow: 2px 2px 6px black; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 10px;">🌍<br>ESPACE DU DON ENTIER</div>
    </a>

    <div class="bulles-grid">
        <a href="impot.html" class="nuage">
            <h3 style="color:#008080; margin:0; text-transform:uppercase;">📜 Impôts Publics</h3>
            <p style="margin:5px 0; font-weight: bold;">Travaux publics en libre participation.</p>
        </a>

        <a href="regulation.html" class="etoile-justice">
            <h3 style="margin:0;">⚖️ Régulation Citoyenne</h3>
            <p style="font-size:0.85em; padding:10px 30px;">Médiation, équité et harmonie.</p>
        </a>
    </div>

    <div id="coffre-magique">🎁</div>

    <footer>
        <a href="transition-externe.html" style="color: white; text-decoration: none;">© 2000 lepetitprince des jardiniers</a>
    </footer>

    <script>
        const audio = document.getElementById('chantOiseaux');
        function toggleSon() {
            if (audio.paused) { audio.volume = 0.4; audio.play(); } 
            else { audio.pause(); }
        }

        function createStars() {
            for(let i=0; i<85; i++) {
                let star = document.createElement('div');
                star.className = 'star';
                let size = (Math.random() * 3 + 2) + 'px';
                star.style.width = star.style.height = size;
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.setProperty('--move-duration', (Math.random() * 60 + 120) + 's');
                star.style.animationDelay = (Math.random() * 10) + 's';
                document.body.appendChild(star);
            }
        }
        createStars();

        // Le reste de ton script (messenger, loop, etc.) reste identique
        const phrases = ["L'Impôt Public est un geste de cœur", "Graines de générosité"];
        const emojis = ['🕊️', '🦋'];
        let messagerActif = null;
        const coffre = document.getElementById('coffre-magique');
        let cadeauPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let targetCadeau = { x: Math.random() * (window.innerWidth - 100), y: Math.random() * (window.innerHeight - 300) };

        function loop() {
            cadeauPos.x += (targetCadeau.x - cadeauPos.x) * 0.008;
            cadeauPos.y += (targetCadeau.y - cadeauPos.y) * 0.008;
            coffre.style.left = cadeauPos.x + "px";
            coffre.style.top = (cadeauPos.y + Math.sin(Date.now()*0.002)*40) + "px";
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
