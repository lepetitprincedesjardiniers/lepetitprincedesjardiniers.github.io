        body {

            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff; overflow-x: hidden; min-height: 100vh; position: relative;
        }

        /* --- STYLE DU TRADUCTEUR (DISCRET ET HAUT) --- */
        #google_translate_element { 
            position: absolute; 
            top: 5px; 
            left: 10px; 
            z-index: 2000; 
            opacity: 0.6; 
            transition: opacity 0.3s;
        }
        #google_translate_element:hover { opacity: 1; }

        /* --- ÉTOILES (CORRIGÉES) --- */
        .star { 
            position: fixed; 
            background: white; 
            border-radius: 50%; 
            z-index: 0; 
            box-shadow: 0 0 10px white;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

        /* --- MENU --- */
        .menu-table { margin: 55px auto 20px; border-radius: 10px; background-color: #008080; border-collapse: collapse; position: relative; z-index: 10; overflow: hidden; }
        .menu-table td { border: 1px solid #FFFFFF; transition: 0.3s; }
        .menu-table a { display: block; padding: 12px 20px; text-decoration: none; color: #FFFFFF; font-weight: bold; }
        .menu-table td:hover { background-color: #00b3b3; box-shadow: inset 0 0 10px white; }
        
        #btn-son { position: fixed; top: 10px; right: 10px; z-index: 1000; background: rgba(255,255,255,0.2); border: 1px solid white; color: white; border-radius: 50%; cursor: pointer; padding: 8px; font-size: 20px; }

        @keyframes soleilScintille { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

            background-size: cover; background-repeat: repeat-x; display: flex; align-items: center; justify-content: center;
            text-decoration: none; color: white; font-weight: bold; box-shadow: inset -20px -20px 50px rgba(0,0,0,0.8), 0 0 20px rgba(0,191,255,0.5);
            animation: rotationTerre 30s linear infinite; transition: 0.5s; position: relative; z-index: 5; overflow: hidden;
        }
        .terre-don:hover { animation-duration: 8s; }
        @keyframes rotationTerre { from { background-position: 0 0; } to { background-position: 500px 0; } }
