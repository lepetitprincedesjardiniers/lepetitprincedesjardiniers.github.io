<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Trésor Public - Accueil</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; 
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff; 
            overflow-x: hidden; min-height: 100vh; 
            position: relative;
        }

        /* Éléments spatiaux */
        .star { position: fixed; background: white; border-radius: 50%; opacity: 0.8; z-index: -1; }
        .planet { position: fixed; border-radius: 50%; z-index: -1; opacity: 0.7; }
        #ufo { 
            position: fixed; font-size: 40px; z-index: 1000; top: 20%; left: -100px; 
            filter: drop-shadow(0 0 10px #00ff00);
        }

        #google_translate_element { padding: 10px; background: rgba(255,255,255,0.1); border-bottom: 1px solid #008080; min-height: 40px; position: relative; z-index: 10; }

        .menu-table { margin: 20px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; position: relative; z-index: 10; }
        .menu-table td { padding: 10px 15px; border: 1px solid #FFFFFF; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; }

        .header-container { display: flex; align-items: center; justify-content: center; gap: 40px; margin: 50px auto; position: relative; z-index: 10; }
        .petit-bouquet-gauche { font-size: 35px; transform: rotate(0deg); } 
        .petit-bouquet-droite { font-size: 35px; transform: rotate(25deg); } 

        .terre-container {
            width: 250px; height: 250px;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Earth_Western_Hemisphere_transparent_background.png/600px-Earth_Western_Hemisphere_transparent_background.png');
            background-size: cover; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            animation: rainbow-glow 3s linear infinite;
        }

        .terre-container h1 { color: white; text-shadow: 2px 2px 4px #000; font-size: 1.5em; }

        @keyframes rainbow-glow {
            0% { box-shadow: 0 0 20px red; }
            33% { box-shadow: 0 0 20px yellow; }
            66% { box-shadow: 0 0 20px blue; }
            100% { box-shadow: 0 0 20px red; }
        }

        .soleil-don {
            background: #FFD700; width: 180px; height: 180px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 50px #FFA500; margin: 40px auto; cursor: pointer;
            text-decoration: none; color: #000080; font-weight: bold; position: relative; z-index: 10;
        }

        .bulles-grid { display: flex; justify-content: center; gap: 25px; flex-wrap: wrap; padding: 20px; position: relative; z-index: 10; }
        .nuage { background: rgba(224, 247, 250, 0.9); border-radius: 50px; padding: 20px; width: 300px; color: #333; text-decoration: none; }
        .etoile-justice { 
            background: #E6E6FA; width: 300px; min-height: 250px; 
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); 
            display: flex; align-items: center; justify-content: center; color: #333; text-decoration: none;
        }

        footer { margin: 60px 0 20px; color: white; position: relative; z-index: 10; }
    </style>
</head>
<body>

    <div id="ufo">🛸</div>

    <div id="google_translate_element"></div>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impot.html">Impôts Publics</a></td>
            <td><a href="regulation.html">Régulation</a></td>
        </tr>
    </table>

    <div class="header-container">
        <div class="petit-bouquet-gauche">💐</div>
        <div class="terre-container">
            <h1 style="margin:0;">Le Trésor Public</h1>
        </div>
        <div class="petit-bouquet-droite">💐</div>
    </div>

    <p><strong>Le Petit Prince des Jardiniers</strong></p>

    <a href="jardin.html" class="soleil-don">
        <div>☀️<br>ESPACE DU DON ENTIER</div>
    </a>

    <div class="bulles-grid">
        <a href="impot.html" class="nuage"><h3>📜 Impôts Publics</h3><p>Travaux publics en libre participation.</p></a>
        <a href="regulation.html" class="etoile-justice"><div><h3>⚖️ Régulation</h3><p>Justice avec délicatesse.</p></div></a>
    </div>

    <div id="coffre-magique" style="position:fixed; font-size:60px; bottom:20px; left:50%; z-index:100;">🎁</div>

    <footer>© 2000 lepetitprince des jardiniers</footer>

    <script>
        // 1. GÉNÉRATION DE L'ESPACE (Étoiles et Planètes)
        const spaceColors = ['#ffcc00', '#ff5733', '#33ff57', '#3357ff', '#f0f0f0'];
        
        function createSpace() {
            // Étoiles
            for(let i=0; i<150; i++) {
                let star = document.createElement('div');
                star.className = 'star';
                let size = Math.random() * 3 + 'px';
                star.style.width = size;
                star.style.height = size;
                star.style.top = Math.random() * 100 + 'vh';
                star.style.left = Math.random() * 100 + 'vw';
                if(Math.random() > 0.8) star.style.animation = `scintiller ${Math.random()*2+1}s infinite`;
                document.body.appendChild(star);
            }
            // Planètes
            for(let i=0; i<8; i++) {
                let p = document.createElement('div');
                p.className = 'planet';
                let size = Math.random() * 40 + 10 + 'px';
                p.style.width = size; p.style.height = size;
                p.style.top = Math.random() * 100 + 'vh';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.background = spaceColors[Math.floor(Math.random()*spaceColors.length)];
                p.style.boxShadow = 'inset -5px -5px 10px rgba(0,0,0,0.5)';
                document.body.appendChild(p);
                
                // Mouvement lent
                animateFloating(p);
            }
        }

        function animateFloating(el) {
            let x = 0, y = 0;
            let angle = Math.random() * Math.PI * 2;
            setInterval(() => {
                x += Math.cos(angle) * 0.2;
                y += Math.sin(angle) * 0.2;
                el.style.transform = `translate(${x}px, ${y}px)`;
            }, 50);
        }

        // 2. LA SOUCOUPE VOLANTE (Traverse une seule fois)
        function launchUFO() {
            const ufo = document.getElementById('ufo');
            let pos = -100;
            let drift = 20;
            const fly = setInterval(() => {
                pos += 3;
                ufo.style.left = pos + 'px';
                ufo.style.top = (drift + Math.sin(pos/50)*50) + 'px';
                if(pos > window.innerWidth + 100) {
                    clearInterval(fly);
                    ufo.remove();
                }
            }, 20);
        }

        // Initialisation
        createSpace();
        setTimeout(launchUFO, 2000); // Décollage après 2 secondes

        // Correction pour le coffre et les messages (version simplifiée)
        const coffre = document.getElementById('coffre-magique');
        document.addEventListener('click', () => {
             coffre.animate([{transform: 'scale(1)'}, {transform: 'scale(1.5)'}, {transform: 'scale(1)'}], 300);
        });
    </script>
</body>
</html>
