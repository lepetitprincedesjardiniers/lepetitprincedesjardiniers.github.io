<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Voyage du Petit Prince - Transition Intelligente</title>
    <style>
        :root {
            --rainbow: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            --space: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
        }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: 'Comic Sans MS', cursive;
            background: var(--space); color: white; cursor: crosshair;
        }
        #canvas-bg { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
        #scene {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; z-index: 10; text-align: center;
        }
        .messenger-wrapper {
            position: absolute; z-index: 100;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            animation: entree 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            cursor: pointer;
        }
        @keyframes entree {
            from { transform: translateY(100vh) scale(0); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .bulle {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px); color: #ffffff;
            padding: 12px 25px; border-radius: 50px; font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 215, 0, 0.5); font-size: 1.2rem;
            max-width: 80vw;
        }
        .animal-icon { font-size: 4rem; filter: drop-shadow(0 0 15px white); }
        .envol-arc-en-ciel { animation: envol 1.5s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards !important; }
        @keyframes envol { to { transform: translate(120vw, -100vh) scale(2) rotate(30deg); opacity: 0; } }
        .trail {
            position: fixed; border-radius: 50%; pointer-events: none;
            background: var(--rainbow); z-index: 90; animation: trail-fade 0.6s forwards;
        }
        @keyframes trail-fade { to { opacity: 0; transform: scale(0.1); } }
        .flash-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 2000;
        }
        #skip {
            position: fixed; bottom: 30px; right: 30px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 10px 20px; border-radius: 30px;
            cursor: pointer; opacity: 0; transition: 0.5s; z-index: 1000;
        }
        .poesie {
            position: absolute; bottom: 10%; font-style: italic; opacity: 0.5; font-size: 0.9rem;
        }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>
<div id="flash" class="flash-overlay"></div>
<div id="scene">
    <div id="messenger-container"></div>
    <div class="poesie" id="poetic-line"></div>
</div>
<button id="skip" onclick="finishTransition()">Passer ➔</button>

<script>
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    const flash = document.getElementById('flash');
    
    // Traductions intégrées
    const translations = {
        fr: {
            phrases: ["Sème la générosité", "Le pardon est une force", "La fraternité est un jardin", "Un don est une fleur"],
            poesie: "Le silence d'un astre, l'éclair d'un instant...",
            skip: "Passer ➔"
        },
        en: {
            phrases: ["Sow generosity", "Forgiveness is strength", "Brotherhood is a garden", "A gift is a flower"],
            poesie: "The silence of a star, the flash of a moment...",
            skip: "Skip ➔"
        },
        es: {
            phrases: ["Siembra generosidad", "El perdón es fuerza", "La fraternidad es un jardín", "Un regalo es una flor"],
            poesie: "El silencio de un astro, el destello de un instante...",
            skip: "Pasar ➔"
        }
    };

    // Fonction pour lire la langue depuis le cookie de Google Translate
    function getGoogleLang() {
        const name = "googtrans=";
        const decodedCookie = decodeURIComponent(document.cookie);
        const ca = decodedCookie.split(';');
        for(let i = 0; i < ca.length; i++) {
            let c = ca[i].trim();
            if (c.indexOf(name) == 0) {
                // googtrans format: /fr/en ou /fr/es
                return c.substring(name.length).split('/').pop().toLowerCase();
            }
        }
        return "fr";
    }

    const userLang = getGoogleLang();
    const content = translations[userLang] || translations['fr'];

    const animaux = ['🕊️', '🦊', '🐱', '🦄', '🦋', '🦌', '🦢'];
    let stars = [];
    const isHoliday = [11, 0].includes(new Date().getMonth());

    function init() {
        document.getElementById('poetic-line').innerText = content.poesie;
        document.getElementById('skip').innerText = content.skip;
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        for(let i=0; i<180; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2, speed: Math.random() * 0.2, opacity: Math.random() });
        }
        animate();
        createMessenger();
        setTimeout(() => document.getElementById('skip').style.opacity = 0.7, 2000);
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
            ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
            ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
            s.y += s.speed; if(s.y > canvas.height) s.y = 0;
            s.opacity = Math.sin(Date.now() * 0.001 * 3) * 0.4 + 0.6;
        });
        requestAnimationFrame(animate);
    }

    function createMessenger() {
        const container = document.getElementById('messenger-container');
        const wrapper = document.createElement('div');
        wrapper.className = 'messenger-wrapper';
        const icon = isHoliday ? '✨' : animaux[Math.floor(Math.random()*animaux.length)];
        const text = content.phrases[Math.floor(Math.random()*content.phrases.length)];
        
        wrapper.innerHTML = `<div class="bulle">${text}</div><div class="animal-icon" id="target-animal">${icon}</div>`;
        wrapper.onclick = (e) => { triggerJoy(e.clientX, e.clientY); startDeparture(wrapper); };
        container.appendChild(wrapper);
        setTimeout(() => startDeparture(wrapper), 4000);
    }

    function startDeparture(el) {
        if(el.classList.contains('envol-arc-en-ciel')) return;
        el.classList.add('envol-arc-en-ciel');
        const trailTimer = setInterval(() => {
            const node = document.getElementById('target-animal');
            if(!node) return;
            const rect = node.getBoundingClientRect();
            createTrailDot(rect.left + rect.width/2, rect.top + rect.height/2);
        }, 25);
        setTimeout(() => { clearInterval(trailTimer); finishTransition(); }, 1300);
    }

    function createTrailDot(x, y) {
        const t = document.createElement('div');
        t.className = 'trail'; t.style.width = t.style.height = '12px';
        t.style.left = x + 'px'; t.style.top = y + 'px';
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 600);
    }

    function triggerJoy(x, y) {
        for(let i=0; i<30; i++) {
            const p = document.createElement('div');
            p.style.position = 'fixed'; p.style.left = x + 'px'; p.style.top = y + 'px';
            p.innerHTML = ['🌈','❤️','✨','💎'][Math.floor(Math.random()*4)];
            p.style.pointerEvents = 'none'; document.body.appendChild(p);
            const angle = Math.random() * Math.PI * 2;
            p.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(angle)*180}px, ${Math.sin(angle)*180}px) scale(0)`, opacity: 0 }], { duration: 900, easing: 'ease-out' });
            setTimeout(() => p.remove(), 900);
        }
    }

    function finishTransition() {
        flash.style.opacity = 1;
        flash.style.transition = "opacity 0.6s ease-in";
        const params = new URLSearchParams(window.location.search);
        const next = params.get('page') || 'index.html';
        setTimeout(() => window.location.href = next, 600);
    }

    window.onload = init;
</script>
</body>
</html>
