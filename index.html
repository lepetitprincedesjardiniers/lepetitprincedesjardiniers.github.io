<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Trésor Public - La Fraternité</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; 
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff; overflow-x: hidden; min-height: 100vh; position: relative;
        }

        /* TITRE ET SOLEIL */
        .titre-fraternite { 
            display: block; padding-top: 20px; font-size: 1.8em; letter-spacing: 3px; 
            color: #f0e68c; text-shadow: 0 0 10px rgba(255,255,255,0.3); z-index: 25;
        }
        .soleil-cadre { 
            width: 130px; height: 130px; background: #FFD700; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 0 25px #FFA500; margin: 15px auto; position: relative; z-index: 20; transition: 0.5s; 
        }
        .soleil-cadre:hover { transform: scale(1.1); box-shadow: 0 0 50px white; }
        .soleil-cadre::before {
            content: ""; position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%; background: conic-gradient(red, orange, yellow, green, blue, indigo, violet, red);
            z-index: -1; opacity: 0; transition: opacity 0.5s;
        }
        .soleil-cadre:hover::before { opacity: 1; animation: rotateRainbow 2s linear infinite; }
        @keyframes rotateRainbow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* ÉTOILES ★ */
        .star { position: fixed; color: white; z-index: -1; animation: twinkle var(--duration) infinite ease-in-out, drift var(--drift-duration) linear infinite; text-shadow: 0 0 5px #fff; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
        @keyframes drift { from { transform: translateX(0); } to { transform: translateX(80px); } }

        /* CADEAU ET PARTICULES */
        #coffre-magique { position: fixed; font-size: 55px; z-index: 500; cursor: pointer; filter: drop-shadow(0 0 15px gold); transition: opacity 0.3s; }
        .particule { position: fixed; pointer-events: none; z-index: 1000; font-size: 30px; }

        /* OISEAUX ET MESSAGES */
        .oiseau { position: fixed; font-size: 40px; z-index: 100; transition: transform 6s linear; pointer-events: none; }
        .message-volant { 
            position: fixed; background: #fff; color: #d32f2f; padding: 6px 12px; 
            border-radius: 20px; font-size: 0.8em; font-weight: bold; border: 2px solid #ffca28; 
            z-index: 600; box-shadow: 0 0 15px rgba(255,255,255,0.8);
            pointer-events: none; transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* FOOTER */
        footer { padding: 40px; }
        .lien-copyright { color: rgba(255,255,255,0.6); text-decoration: none; transition: 0.4s; }
        .lien-copyright:hover { color: #fff; text-shadow: 0 0 10px gold; transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="titre-fraternite">La fraternité du palais nature</div>
    <div class="soleil-cadre"><h1 style="font-size: 1em; color: #333;">Le Trésor Public</h1></div>

    <div id="coffre-magique">🎁</div>

    <footer>
        <a href="#" class="lien-copyright">© 2000 le petit prince des jardiniers</a>
    </footer>

    <script>
        // Création des étoiles
        for(let i=0; i<60; i++) {
            let s = document.createElement('div'); s.className = 'star'; s.innerHTML = '★';
            s.style.left = Math.random()*100+'vw'; s.style.top = Math.random()*100+'vh';
            s.style.setProperty('--duration', (Math.random()*3+2)+'s');
            s.style.setProperty('--drift-duration', (Math.random()*20+10)+'s');
            s.style.fontSize = (Math.random()*12 + 8) + 'px';
            document.body.appendChild(s);
        }

        // Mouvement du cadeau
        const cadeau = document.getElementById('coffre-magique');
        let cX = window.innerWidth/2, cY = window.innerHeight/2;
        let tX = Math.random()*(window.innerWidth-100), tY = Math.random()*(window.innerHeight-200);

        function animCadeau() {
            cX += (tX - cX) * 0.02; cY += (tY - cY) * 0.02;
            if(Math.abs(cX-tX)<50) { tX=Math.random()*(window.innerWidth-100); tY=Math.random()*(window.innerHeight-200); }
            cadeau.style.left = cX+'px'; cadeau.style.top = cY+'px';
            requestAnimationFrame(animCadeau);
        }
        animCadeau();

        // Explosion
        function exploser() {
            const fleurs = ['🌸', '🌺', '🌼', '✨', '⭐', '🌻', '🌈'];
            for(let i=0; i<40; i++) {
                const p = document.createElement('div');
                p.className = 'particule';
                p.innerHTML = fleurs[Math.floor(Math.random()*fleurs.length)];
                p.style.left = cX + 'px'; p.style.top = cY + 'px';
                document.body.appendChild(p);
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 200 + 50;
                p.animate([
                    { transform: 'translate(0,0) scale(1.5)', opacity: 1 },
                    { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0)`, opacity: 0 }
                ], { duration: 1200, easing: 'ease-out' });
                setTimeout(() => p.remove(), 1200);
            }
            cadeau.style.opacity = '0.3';
            setTimeout(() => cadeau.style.opacity = '1', 1500);
        }

        // L'Oiseau qui lance le message
        function lancerOiseau() {
            const o = document.createElement('div'); o.className = 'oiseau'; o.innerHTML = '🕊️';
            o.style.left = '-60px'; o.style.top = (Math.random()*50 + 10)+'vh';
            document.body.appendChild(o);
            
            // Vol de l'oiseau
            setTimeout(() => o.style.transform = 'translateX(120vw)', 100);

            // Moment du lancer (quand il arrive vers le milieu)
            setTimeout(() => {
                const m = document.createElement('div'); m.className = 'message-volant';
                m.innerHTML = "Un vœu ! ✨";
                const r = o.getBoundingClientRect();
                m.style.left = r.left + 'px'; m.style.top = r.top + 'px';
                document.body.appendChild(m);

                // Propulsion vers le cadeau
                setTimeout(() => {
                    m.style.left = (cX + 20) + 'px';
                    m.style.top = (cY + 20) + 'px';
                    m.style.transform = 'scale(0.5) rotate(720deg)';
                }, 50);

                // Impact
                setTimeout(() => {
                    exploser();
                    m.remove();
                }, 1250);

            }, 2000 + Math.random()*2000);

            setTimeout(() => o.remove(), 7000);
        }

        setInterval(lancerOiseau, 8000);
    </script>
</body>
</html>
