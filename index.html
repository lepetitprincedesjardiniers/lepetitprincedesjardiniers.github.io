<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Trésor Public - Accueil</title>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <style>
        body { 
            font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; 
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff; overflow-x: hidden; min-height: 100vh; position: relative;
        }

        #google_translate_element { position: absolute; top: 5px; left: 5px; z-index: 3000; opacity: 0.4; transform: scale(0.7); filter: grayscale(1); }
        
        .titre-fraternite { 
            display: block; padding-top: 20px; font-size: 1.8em; letter-spacing: 3px; 
            color: #f0e68c; text-shadow: 0 0 10px rgba(255,255,255,0.3); z-index: 25;
        }

        .soleil-cadre { 
            width: 130px; height: 130px; background: #FFD700; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 0 25px #FFA500; margin: 15px auto; position: relative; z-index: 20; transition: 0.5s; 
        }
        .soleil-cadre h1 { font-size: 1.0em; color: #333; margin: 0; padding: 10px; line-height: 1.1; }

        /* ÉTOILES ★ */
        .star { position: fixed; color: white; z-index: -1; animation: twinkle var(--duration) infinite ease-in-out, drift var(--drift-duration) linear infinite; text-shadow: 0 0 5px #fff; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
        @keyframes drift { from { transform: translateX(0); } to { transform: translateX(80px); } }

        /* MENU & TERRE */
        .menu-table { margin: 10px auto 20px; border-radius: 10px; background-color: #008080; border-collapse: collapse; position: relative; z-index: 10; }
        .menu-table td { border: 1px solid #FFFFFF; }
        .menu-table a { display: block; padding: 12px 20px; text-decoration: none; color: #FFFFFF; font-weight: bold; }
        .terre-don { 
            width: 320px; height: 320px; margin: 30px auto; border-radius: 50%; 
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Solarsystemscope_texture_2k_earth_daymap.jpg/1200px-Solarsystemscope_texture_2k_earth_daymap.jpg'); 
            background-size: cover; display: flex; align-items: center; justify-content: center; 
            text-decoration: none; color: white; font-weight: bold; 
            box-shadow: inset -30px -30px 60px rgba(0,0,0,0.9); 
            animation: rotationTerre 40s linear infinite; position: relative; z-index: 5;
        }
        @keyframes rotationTerre { from { background-position: 0 0; } to { background-position: 1000px 0; } }

        /* RUBRIQUES */
        .bulles-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 20px; position: relative; z-index: 5; }
        .nuage, .cadre-aide { background: #e0f7fa; border: 3px solid #008080; border-radius: 50px; padding: 20px; width: 300px; color: #000080; }

        /* MESSAGERS & MESSAGES */
        .messager { 
            position: fixed; font-size: 55px; z-index: 100; pointer-events: none; 
            transition: left 6s linear, top 1.5s ease-in-out; 
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.6));
        }
        
        .message-volant { 
            position: fixed; background: #ffffff; color: #2E7D32; padding: 12px 24px; 
            border-radius: 30px; font-size: 1.1em; font-weight: 900; border: 4px solid #FFD700; 
            z-index: 600; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            pointer-events: none; transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #coffre-magique { position: fixed; font-size: 65px; z-index: 500; filter: drop-shadow(0 0 20px gold); transition: transform 0.2s; }
        .particule { position: fixed; pointer-events: none; z-index: 1000; font-size: 30px; }
    </style>
</head>
<body>

    <div class="titre-fraternite">La fraternité du palais nature</div>
    <div class="soleil-cadre"><h1>Le Trésor Public</h1></div>
    
    <div id="google_translate_element"></div>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impot.html">Impôts Publics</a></td>
            <td><a href="regulation.html">Régulation</a></td>
        </tr>
    </table>

    <a href="jardin.html" class="terre-don">
        <div style="text-shadow: 2px 2px 8px black; font-size: 1.2em;">🌍<br>ESPACE DU DON ENTIER</div>
    </a>

    <div id="coffre-magique">🎁</div>

    <script>
        // ÉTOILES ★
        for(let i=0; i<60; i++) {
            let s = document.createElement('div'); s.className = 'star'; s.innerHTML = '★';
            s.style.left = Math.random()*100+'vw'; s.style.top = Math.random()*100+'vh';
            s.style.setProperty('--duration', (Math.random()*3+2)+'s');
            s.style.setProperty('--drift-duration', (Math.random()*20+10)+'s');
            s.style.fontSize = (Math.random()*12 + 8) + 'px';
            document.body.appendChild(s);
        }

        // CADEAU
        const cadeau = document.getElementById('coffre-magique');
        let cX = window.innerWidth/2, cY = window.innerHeight/2;
        let tX = Math.random()*(window.innerWidth-100), tY = Math.random()*(window.innerHeight-200);

        function animCadeau() {
            cX += (tX - cX) * 0.02; cY += (tY - cY) * 0.02;
            if(Math.abs(cX-tX)<50) { tX=Math.random()*(window.innerWidth-100); tY=Math.random()*(window.innerHeight-200); }
            cadeau.style.left = cX+'px'; cadeau.style.top = cY+'px';
            requestAnimationFrame(animCadeau);
        }
        animCadeau();

        function exploser() {
            const fleurs = ['🌸', '🌺', '✨', '⭐', '🌻', '🌈', '💫'];
            for(let i=0; i<40; i++) {
                const p = document.createElement('div'); p.className = 'particule';
                p.innerHTML = fleurs[Math.floor(Math.random()*fleurs.length)];
                p.style.left = (cX + 30) + 'px'; p.style.top = (cY + 30) + 'px';
                document.body.appendChild(p);
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 250 + 50;
                p.animate([{ transform: 'translate(0,0) scale(1.5)', opacity: 1 }, { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0)`, opacity: 0 }], { duration: 1500, easing: 'ease-out' });
                setTimeout(() => p.remove(), 1500);
            }
        }

        // MESSAGERS QUI POUSSENT LE MESSAGE
        function lancerMessager() {
            const icons = ['🕊️', '🦋', '🐝', '🐲', '🧚', '🛸'];
            const textes = ["Paix ✨", "Cadeau 🎁", "Joie 🌸", "Espoir 🌟"];
            
            const m = document.createElement('div');
            m.className = 'messager';
            m.innerHTML = icons[Math.floor(Math.random()*icons.length)];
            
            // Départ (gauche ou droite aléatoire)
            const deGauche = Math.random() > 0.5;
            m.style.left = deGauche ? '-100px' : (window.innerWidth + 100) + 'px';
            m.style.top = (Math.random() * 60 + 10) + 'vh';
            
            // Direction de la tête (scaleX(-1) pour retourner l'emoji si besoin)
            m.style.transform = deGauche ? 'scaleX(-1)' : 'scaleX(1)';
            
            document.body.appendChild(m);

            // Vol vers le centre
            setTimeout(() => {
                m.style.left = deGauche ? '30vw' : '70vw';
            }, 100);

            // Le message apparaît devant sa tête
            setTimeout(() => {
                const msg = document.createElement('div');
                msg.className = 'message-volant';
                msg.innerHTML = textes[Math.floor(Math.random()*textes.length)];
                
                const r = m.getBoundingClientRect();
                // Positionnement "devant la tête"
                msg.style.left = deGauche ? (r.right + 10) + 'px' : (r.left - 150) + 'px';
                msg.style.top = r.top + 'px';
                document.body.appendChild(msg);

                // L'animal donne un petit coup de tête (animation)
                m.style.transition = "all 0.3s ease-out";
                setTimeout(() => {
                    m.style.transform = (deGauche ? 'scaleX(-1)' : 'scaleX(1)') + ' translateX(' + (deGauche ? 30 : -30) + 'px)';
                    
                    // Le message est propulsé vers le cadeau
                    msg.style.left = (cX + 10) + 'px';
                    msg.style.top = (cY + 10) + 'px';
                    msg.style.transform = 'scale(0.3) rotate(360deg)';
                }, 800);

                setTimeout(() => { 
                    exploser(); 
                    msg.remove();
                    // L'animal repart après avoir poussé
                    m.style.left = deGauche ? '120vw' : '-120vw';
                }, 2000);

            }, 2500);

            setTimeout(() => m.remove(), 10000);
        }

        setInterval(lancerMessager, 9000);
    </script>
</body>
</html>
