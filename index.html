<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Voyage du Petit Prince</title>
    <style>
        :root {
            --rainbow: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            --space: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
        }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: 'Comic Sans MS', cursive;
            background: var(--space); color: white;
        }
        #canvas-bg { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
        #scene {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; z-index: 10; text-align: center;
        }
        .messenger-wrapper {
            position: absolute; z-index: 100;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            animation: entree 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            cursor: pointer;
        }
        @keyframes entree {
            from { transform: translateY(100vh) scale(0); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .bulle {
            background: rgba(255, 255, 255, 0.95); color: #004d40;
            padding: 15px 30px; border-radius: 50px; font-weight: bold;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            border: 2px solid #FFD700; font-size: 1.3rem;
        }
        .animal-icon { font-size: 4.5rem; filter: drop-shadow(0 0 15px white); }
        .envol-arc-en-ciel { animation: envol 1.8s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards !important; }
        @keyframes envol { to { transform: translate(120vw, -100vh) scale(2.5) rotate(40deg); opacity: 0; } }
        .trail { position: fixed; border-radius: 50%; pointer-events: none; background: var(--rainbow); z-index: 90; animation: trail-fade 0.7s forwards; }
        @keyframes trail-fade { to { opacity: 0; transform: scale(0.1); } }
        .flash-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 2000; }
        #skip {
            position: fixed; bottom: 30px; right: 30px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 12px 25px; border-radius: 30px;
            cursor: pointer; opacity: 0; transition: 0.5s; z-index: 1000; font-weight: bold;
        }
        #skip:hover { background: var(--rainbow); }
        .poesie { margin-top: 30px; font-style: italic; opacity: 0.7; }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>
<div id="flash" class="flash-overlay"></div>
<div id="scene">
    <div id="messenger-container"></div>
    <div class="poesie" id="poetic-line"></div>
</div>

<button id="skip" onclick="finishTransition()">Continuer le voyage ➔</button>

<script>
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    const flash = document.getElementById('flash');
    
    const translations = {
        fr: { phrases: ["Sème la générosité", "Le pardon est une force", "La fraternité est un jardin", "Chaque don est une fleur"], poesie: "Un silence irréel, un éclair de gloire... l'humanité s'éveille.", skip: "Continuer ➔" },
        en: { phrases: ["Sow generosity", "Forgiveness is strength", "Brotherhood is a garden", "Every gift is a flower"], poesie: "An unreal silence, a flash of glory... humanity awakens.", skip: "Continue ➔" },
        es: { phrases: ["Siembra generosidad", "El perdón es fuerza", "La fraternidad es un jardín", "Cada regalo es una flor"], poesie: "Un silencio irreal, un destello de gloria... la humanidad despierta.", skip: "Continuar ➔" }
    };

    function getLang() {
        const name = "googtrans=";
        const decodedCookie = decodeURIComponent(document.cookie);
        const ca = decodedCookie.split(';');
        for(let i = 0; i < ca.length; i++) {
            let c = ca[i].trim();
            if (c.indexOf(name) == 0) return c.substring(name.length).split('/').pop().toLowerCase();
        }
        return "fr";
    }

    const content = translations[getLang()] || translations['fr'];
    const animaux = ['🕊️', '🦊', '🐈', '🦄', '🦋', '🦢'];
    let stars = [];

    function init() {
        document.getElementById('poetic-line').innerText = content.poesie;
        document.getElementById('skip').innerText = content.skip;
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        for(let i=0; i<200; i++) stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2, speed: Math.random() * 0.4, opacity: Math.random() });
        animate(); createMessenger();
        setTimeout(() => document.getElementById('skip').style.opacity = 1, 1500);
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
            ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
            ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
            s.y += s.speed; if(s.y > canvas.height) s.y = 0;
            s.opacity = Math.sin(Date.now() * 0.001 * 5) * 0.5 + 0.5;
        });
        requestAnimationFrame(animate);
    }

    function createMessenger() {
        const container = document.getElementById('messenger-container');
        const wrapper = document.createElement('div');
        wrapper.className = 'messenger-wrapper';
        const icon = animaux[Math.floor(Math.random()*animaux.length)];
        const text = content.phrases[Math.floor(Math.random()*content.phrases.length)];
        wrapper.innerHTML = `<div class="bulle">${text}</div><div class="animal-icon" id="target-animal">${icon}</div>`;
        wrapper.onclick = (e) => { spawnExplosion(e.clientX, e.clientY); startDeparture(wrapper); };
        container.appendChild(wrapper);
        setTimeout(() => startDeparture(wrapper), 5000);
    }

    function startDeparture(el) {
        if(el.classList.contains('envol-arc-en-ciel')) return;
        el.classList.add('envol-arc-en-ciel');
        const trailTimer = setInterval(() => {
            const node = document.getElementById('target-animal');
            if(!node) return;
            const rect = node.getBoundingClientRect();
            const t = document.createElement('div');
            t.className = 'trail'; t.style.width = t.style.height = '18px';
            t.style.left = (rect.left + rect.width/2) + 'px'; t.style.top = (rect.top + rect.height/2) + 'px';
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 700);
        }, 25);
        setTimeout(() => { clearInterval(trailTimer); finishTransition(); }, 1500);
    }

    function spawnExplosion(x, y) {
        for(let i=0; i<30; i++) {
            const p = document.createElement('div');
            p.style.position = 'fixed'; p.innerHTML = ['🌸','✨','💎','🌈'][Math.floor(Math.random()*4)];
            p.style.left = x + 'px'; p.style.top = y + 'px'; p.style.pointerEvents = 'none';
            document.body.appendChild(p);
            const angle = Math.random() * Math.PI * 2;
            const velocity = 5 + Math.random() * 10;
            p.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(angle)*200}px, ${Math.sin(angle)*200}px) scale(0)`, opacity: 0 }], { duration: 1000 });
            setTimeout(() => p.remove(), 1000);
        }
    }

    function finishTransition() {
        flash.style.opacity = 1;
        flash.style.transition = "opacity 0.7s ease-in";
        const params = new URLSearchParams(window.location.search);
        let nextDestination = params.get('page') || localStorage.getItem('nextPage') || 'index.html';
        setTimeout(() => { window.location.href = nextDestination; }, 700);
    }

    window.onload = init;
</script>
</body>
</html>
