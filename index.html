<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sur l'Arc-en-Ciel...</title>
    <style>
        :root {
            --rainbow: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
        }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: 'Comic Sans MS', cursive;
            background-color: #000; cursor: crosshair;
        }

        #scene {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.8s ease-in;
        }

        /* --- LE PONT ARC-EN-CIEL --- */
        .rainbow-bridge {
            position: absolute; bottom: 0; width: 200%; height: 20vh;
            background: var(--rainbow);
            filter: blur(20px); opacity: 0.5;
            animation: slide 10s linear infinite;
        }
        @keyframes slide { from { transform: translateX(-50%); } to { transform: translateX(0); } }

        /* --- ÉLÉMENTS INTERACTIFS --- */
        .interact-element {
            position: absolute; z-index: 100; cursor: pointer;
            animation: envol 4s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }
        .bulle-bonheur {
            background: white; color: #008080; padding: 12px 25px;
            border-radius: 30px; font-size: 1.1rem; font-weight: bold;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 2px solid #FFD700;
        }

        @keyframes envol {
            0% { transform: translate(-100vw, 10vh) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translate(100vw, -20vh) scale(1.2); opacity: 0; }
        }

        /* --- BOUTON PASSER --- */
        #skip-btn {
            position: fixed; bottom: 30px; right: 30px;
            background: rgba(255,255,255,0.2); border: 1px solid white;
            color: white; padding: 10px 20px; border-radius: 20px;
            cursor: pointer; opacity: 0; transition: 0.5s; z-index: 1000;
            font-size: 0.8rem;
        }
        #skip-btn:hover { background: white; color: black; }

        /* --- EXPLOSIONS --- */
        .particle {
            position: absolute; pointer-events: none;
            animation: particleAnim 0.8s forwards ease-out;
        }
        @keyframes particleAnim {
            0% { opacity: 1; transform: translate(0,0) scale(1); }
            100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(0); }
        }

        /* --- EFFET TUNNEL FINAL --- */
        .flash {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--rainbow); opacity: 0; pointer-events: none;
            transition: opacity 0.5s; z-index: 2000;
        }
    </style>
</head>
<body>

<div id="scene">
    <div class="rainbow-bridge"></div>
    <div id="container"></div>
    <div style="color:white; text-align:center; z-index:10; font-style:italic;">
        "Le silence s'efface devant l'éclat de l'arc-en-ciel..."
    </div>
</div>

<button id="skip-btn" onclick="goToNext()">Passer le voyage ➔</button>
<div id="flash" class="flash"></div>

<script>
    const phrases = [
        "Ici, on sème des graines de générosité pour récolter de l'altruisme",
        "Attention : zone de gratuité absolue pour cadeau réellement efficace",
        "La meilleure justice est encore le pardon",
        "Cadeaux sans détour, cadeaux sans demande de retour",
        "Regardez la fraternité s'épanouir au gré des dons du monde entier...",
        "Chaque don est une fleur qui ne se fane jamais"
    ];

    const container = document.getElementById('container');
    const flash = document.getElementById('flash');
    const skipBtn = document.getElementById('skip-btn');
    const urlParams = new URLSearchParams(window.location.search);
    const destination = urlParams.get('page') || 'index.html';

    function createMessenger() {
        const messenger = document.createElement('div');
        messenger.className = 'interact-element';
        messenger.innerHTML = `
            <div style="display:flex; align-items:center; gap:10px;">
                <span style="font-size:3rem">🕊️</span>
                <div class="bulle-bonheur">${phrases[Math.floor(Math.random()*phrases.length)]}</div>
            </div>`;
        messenger.onclick = (e) => explode(e.clientX, e.clientY);
        container.appendChild(messenger);
    }

    function explode(x, y) {
        for(let i=0; i<15; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerHTML = ['🌈','✨','❤️','🌟'][Math.floor(Math.random()*4)];
            p.style.left = x + 'px'; p.style.top = y + 'px';
            p.style.setProperty('--x', (Math.random()*200 - 100) + 'px');
            p.style.setProperty('--y', (Math.random()*200 - 100) + 'px');
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 800);
        }
    }

    function goToNext() {
        flash.style.opacity = '1';
        document.getElementById('scene').style.transform = 'scale(2)';
        setTimeout(() => { window.location.href = destination; }, 600);
    }

    // Apparition du bouton "Passer"
    setTimeout(() => { skipBtn.style.opacity = "1"; }, 1500);

    // Redirection automatique
    setTimeout(goToNext, 4500);

    window.onload = createMessenger;
</script>
</body>
</html>
