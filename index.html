        body { 
            font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; 
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff; overflow-x: hidden; min-height: 100vh; position: relative;
        }

        /* --- TRADUCTEUR TOUT EN HAUT À GAUCHE --- */
        #google_translate_element { 
            position: absolute; top: 5px; left: 5px; z-index: 3000; 
            opacity: 0.5; transform: scale(0.8); transform-origin: top left; filter: grayscale(1);
        }
        #google_translate_element:hover { opacity: 1; filter: grayscale(0); }

        /* --- ÉTOILES SYNCILLANTES ET MOBILES --- */
        .star { 
            position: fixed; background: white; border-radius: 50%; z-index: -1; 
            box-shadow: 0 0 10px white; 
            animation: twinkle var(--duration) infinite ease-in-out, moveStar var(--speed) linear infinite; 
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
        @keyframes moveStar { from { transform: translateX(-10vw); } to { transform: translateX(110vw); } }

        /* --- MENU --- */
        .menu-table { margin: 60px auto 20px; border-radius: 10px; background-color: #008080; border-collapse: collapse; position: relative; z-index: 10; }
        .menu-table td { border: 1px solid #FFFFFF; transition: 0.3s; }
        .menu-table a { display: block; padding: 12px 20px; text-decoration: none; color: #FFFFFF; font-weight: bold; }
        .menu-table td:hover { background-color: #00b3b3; }
        
        #btn-son { position: fixed; top: 10px; right: 10px; z-index: 1000; background: rgba(255,255,255,0.2); border: 1px solid white; color: white; border-radius: 50%; cursor: pointer; padding: 8px; font-size: 20px; }

        .soleil-cadre:hover {
            box-shadow:

        .soleil-cadre h1 { font-size: 1.1em; margin: 0; color: #000080; }
        @keyframes soleilScintille { 0%, 100% { transform: scale(0.95); } 50% { transform: scale(1.05); } }

        /* --- TERRE --- */
        .terre-don {
            width: 250px; height: 250px; margin: 20px auto; border-radius: 50%;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Solarsystemscope_texture_2k_earth_daymap.jpg/1200px-Solarsystemscope_texture_2k_earth_daymap.jpg');

        }
