<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Trésor Public - Accueil</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; 
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff; overflow-x: hidden; min-height: 100vh; position: relative;
        }

        /* --- DÉCOR : ÉTOILES FLOTTANTES --- */
        .star { 
            position: fixed; background: white; border-radius: 50%; opacity: 0.8; z-index: -1; 
        }

        /* --- TRADUCTEUR & MENU --- */
        #google_translate_element { padding: 10px; background: rgba(255,255,255,0.1); border-bottom: 1px solid #008080; }
        .menu-table { margin: 20px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; }
        .menu-table td { padding: 0; border: 1px solid #FFFFFF; }
        .menu-table a { 
            display: block; padding: 10px 15px; text-decoration: none; color: #FFFFFF; 
            font-weight: bold; transition: all 0.3s ease;
        }
        .menu-table a:hover { background-color: #ffffff; color: #008080; transform: scale(1.05); }

        /* --- HEADER (Soleil Scintillant) --- */
        .header-container { display: flex; align-items: center; justify-content: center; gap: 40px; margin: 30px auto; }
        .soleil-cadre {
            width: 250px; height: 250px;
            background: #FFD700; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 40px #FFA500;
            animation: scintiller 4s ease-in-out infinite; 
        }
        .soleil-cadre h1 { font-size: 1.5em; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); margin: 0; color: #000080; }

        @keyframes scintiller {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px #FFA500; }
            50% { transform: scale(1.03); box-shadow: 0 0 65px #FFD700; }
        }

        /* --- BOUTON DON (Terre avec Rotation au Survol) --- */
        .terre-don {
            width: 180px; height: 180px; 
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Earth_Western_Hemisphere_transparent_background.png/600px-Earth_Western_Hemisphere_transparent_background.png');
            background-size: cover; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 40px auto; cursor: pointer; transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none; color: white; font-weight: bold;
            animation: rainbow-shadow 4s linear infinite;
        }
        .terre-don:hover { transform: rotate(360deg) scale(1.1); }
        
        @keyframes rainbow-shadow {
            0% { box-shadow: 0 0 15px red; }
            33% { box-shadow: 0 0 15px green; }
            66% { box-shadow: 0 0 15px blue; }
            100% { box-shadow: 0 0 15px red; }
        }

        /* --- RUBRIQUES --- */
        .bulles-grid { display: flex; justify-content: center; align-items: stretch; gap: 25px; flex-wrap: wrap; padding: 20px; max-width: 1200px; margin: auto; }
        .nuage { background: #e0f7fa; border: 3px solid #008080; border-radius: 50px; padding: 20px; width: 320px; min-height: 250px; text-decoration: none; color: #000080; display: flex; flex-direction: column; justify-content: center; transition: 0.3s; }
        .nuage:hover { transform: translateY(-10px); }

        .etoile-justice { background: #E6E6FA; border: 3px solid #9370DB; width: 300px; min-height: 250px; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); transition: 0.6s ease-in-out; text-decoration: none; color: #333; display: flex; align-items: center; justify-content: center; }
        .etoile-justice:hover { clip-path: polygon(50% 0%, 100% 0%, 100% 100%, 100% 100%, 100% 100%, 50% 100%, 0% 100%, 0% 100%, 0% 0%, 0% 0%); border-radius: 50%; }

        #coffre-magique { position: fixed; font-size: 60px; z-index: 800; pointer-events: none; left: 50%; transform: translateX(-50%); }
        footer { margin: 60px 0 20px; font-size: 0.9em; }
    </style>
</head>
<body>

    <audio id="chantOiseaux" loop><source src="oiseaux.mp3" type="audio/mpeg"></audio>
    <div id="google_translate_element"></div>
    <script>function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element'); }</script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impot.html">Impôts Publics</a></td>
            <td><a href="regulation.html">Régulation</a></td>
        </tr>
    </table>

    <div class="header-container">
        <div class="petit-bouquet-gauche">💐</div>
        <div class="soleil-cadre"><h1>Le Trésor Public</h1></div>
        <div class="petit-bouquet-droite">💐</div>
    </div>

    <p><strong>Le Petit Prince des Jardiniers</strong></p>

    <a href="jardin.html" class="terre-don">
        <div style="text-shadow: 2px 2px 4px black;">🌍<br>ESPACE DU DON ENTIER</div>
    </a>

    <div class="bulles-grid">
        <a href="impot.html" class="nuage">
            <h3 style="color:#008080; margin:0; text-transform:uppercase;">📜 Impôts Publics</h3>
            <p style="margin:5px 0; font-weight: bold;">Travaux publics en libre participation.</p>
        </a>
        <a href="regulation.html" class="etoile-justice">
            <div style="width:75%;">
                <h3>⚖️ Régulation Citoyenne</h3>
                <p>Justice avec délicatesse.</p>
            </div>
        </a>
    </div>

    <div id="coffre-magique">🎁</div>

    <footer>
        <a href="transition-externe.html" style="color: white; text-decoration: none;">© 2000 lepetitprince des jardiniers</a>
    </footer>

    <script>
        /* LOGIQUE DES ÉTOILES : MOUVEMENT ALÉATOIRE DOUX */
        function createSpace() {
            const count = 60;
            for(let i=0; i<count; i++) {
                let star = document.createElement('div');
                star.className = 'star';
                let s = Math.random() * 2.5 + 'px';
                star.style.width = s; star.style.height = s;
                
                // Position initiale
                let startX = Math.random() * 100;
                let startY = Math.random() * 100;
                star.style.left = startX + 'vw';
                star.style.top = startY + 'vh';

                // Animation de déplacement aléatoire
                const duration = 15000 + Math.random() * 20000; // Entre 15 et 35 secondes
                star.animate([
                    { transform: 'translate(0, 0)' },
                    { transform: `translate(${(Math.random() - 0.5) * 100}px, ${(Math.random() - 0.5) * 100}px)` },
                    { transform: 'translate(0, 0)' }
                ], {
                    duration: duration,
                    iterations: Infinity,
                    easing: 'ease-in-out'
                });

                document.body.appendChild(star);
            }
        }

        /* LOGIQUE JS ORIGINALE (Messagers, Coffre, etc.) */
        const basePhrases = ["L'Impôt Public est un geste de cœur", "Graines de générosité", "Le pardon est justice", "Besoin d'un câlin"];
        let disponibles = [...basePhrases];
        const typesAnimaux = ['🕊️', '🦋', '🐝', '🐞'];
        let messagerActif = null;
        let count = 0;
        const coffre = document.getElementById('coffre-magique');
        let coffreX = window.innerWidth / 2 - 30;
        let coffreY = window.innerHeight - 150;

        document.addEventListener('click', () => { 
            const a = document.getElementById('chantOiseaux');
            if(a.paused) { a.volume = 0.05; a.play().catch(e => {}); } 
        });

        function exploserEtEnvoler() {
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.innerHTML = ['❤️', '✨', '🌸', '🌟'][Math.floor(Math.random() * 4)];
                p.style.position = 'fixed'; p.style.left = (coffreX + 30) + 'px'; p.style.top = (coffreY + 30) + 'px';
                p.style.fontSize = '25px'; p.style.zIndex = '1000'; document.body.appendChild(p);
                const angle = Math.random() * Math.PI * 2; const dist = Math.random() * 180;
                p.animate([{ transform: 'translate(0, 0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0)`, opacity: 0 }], 1000);
                setTimeout(() => p.remove(), 1000);
            }
            coffre.animate([{ transform: 'translateY(0) scale(1.5)', opacity: 1 }, { transform: 'translateY(-1200px) scale(0.5)', opacity: 0 }], { duration: 1500, easing: 'ease-in', fill: 'forwards' });
            setTimeout(() => { coffreY = window.innerHeight - 150; coffre.style.opacity = "1"; }, 3000);
        }

        function createMessenger() {
            if (count >= 3 || messagerActif || disponibles.length === 0) return;
            const txt = disponibles.splice(Math.floor(Math.random()*disponibles.length), 1)[0];
            const div = document.createElement('div');
            div.className = "animal-container";
            div.innerHTML = `<div class="bulle-texte" style="width:0px">${txt}</div><div class="emoji" style="font-size:60px">${typesAnimaux[Math.floor(Math.random()*4)]}</div>`;
            document.body.appendChild(div);
            messagerActif = { el: div, bulle: div.firstChild, emoji: div.lastChild, x: -200, y: window.innerHeight / 2, tx: 150, state: "ENTRÉE" };
        }

        function loop() {
            if (messagerActif) {
                let m = messagerActif;
                if (m.state === "ENTRÉE") {
                    m.x += (m.tx - m.x) * 0.05;
                    if (Math.abs(m.tx - m.x) < 5) {
                        m.state = "SORTIR_MESSAGE";
                        m.bulle.style.opacity = 1;
                        m.bulle.animate([{width: "0px", transform: "scale(0)"}, {width: "250px", transform: "scale(1)"}], {duration: 600, fill: 'forwards'});
                        setTimeout(() => { m.state = "POUSSER"; }, 2000);
                    }
                } else if (m.state === "POUSSER") {
                    m.state = "PROJECTION";
                    m.emoji.animate([{transform: "translateX(0)"}, {transform: "translateX(30px)"}, {transform: "translateX(0)"}], {duration: 200});
                    const targetX = coffreX - m.x; const targetY = coffreY - m.y;
                    m.bulle.animate([{ transform: 'translate(0, 0) scale(1)', opacity: 1 }, { transform: `translate(${targetX}px, ${targetY}px) rotate(20deg) scale(0.1)`, opacity: 0 }], { duration: 500, easing: 'ease-in', fill: 'forwards' });
                    setTimeout(() => { exploserEtEnvoler(); m.state = "SORTIE"; }, 500);
                } else if (m.state === "SORTIE") {
                    m.x -= 10;
                    if (m.x < -300) { m.el.remove(); messagerActif = null; count++; }
                }
                m.el.style.left = m.x + "px";
                m.el.style.top = (m.y + Math.sin(Date.now()*0.005)*20) + "px";
            }
            coffre.style.left = coffreX + "px"; coffre.style.top = coffreY + "px";
            requestAnimationFrame(loop);
        }

        createSpace();
        setInterval(createMessenger, 4000);
        loop();
    </script>
</body>
</html>
