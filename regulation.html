<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Régulation Citoyenne - Le Petit Prince</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Comic Sans MS', cursive, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
            background-color: #E8F5E9; /* Vert tendre */
            color: #004d40; 
            padding-bottom: 80px; 
        }

        .header-tools { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; }
        #google_translate_element { transform: scale(0.85); transform-origin: top left; opacity: 0.7; }
        #google_translate_element:hover { opacity: 1; }

        .menu-table { 
            margin: 20px auto; 
            background-color: #008080; 
            border-collapse: collapse; 
            border-radius: 10px; 
            overflow: hidden; 
        }
        .menu-table td { padding: 10px 15px; border: 1px solid #FFFFFF; }
        .menu-table td a { text-decoration: none; color: #FFFFFF; font-weight: bold; display: block; }
        .menu-table td:hover { background-color: #00b3b3; }

        .phrase-rose { color: #d81b60; font-weight: bold; font-size: 1.1em; text-shadow: 1px 1px 2px #f8bbd0; margin-top: 5px; }

        /* FORMULAIRE */
        .etoile-form { 
            background: #ffffff; 
            border: 3px solid #008080; 
            width: 90%; 
            max-width: 600px; 
            margin: 20px auto; 
            padding: 25px; 
            border-radius: 20px;
            box-shadow: 0px 10px 20px rgba(0, 128, 128, 0.2);
            text-align: left;
        }
        label { display: block; margin-top: 10px; font-weight: bold; color: #00695c; font-size: 0.9em; }
        input, textarea, select { 
            width: 100%; padding: 10px; margin: 5px 0 10px 0; 
            border-radius: 10px; border: 2px solid #008080; 
            background: #fafafa; color: #333; font-family: inherit;
        }
        .btn-envoi { 
            background: #008080; color: white; border: none; 
            padding: 12px; border-radius: 20px; 
            font-weight: bold; cursor: pointer; font-size: 1.1em; 
            width: 100%; margin-top: 10px; font-family: inherit;
        }
        .btn-envoi:hover { background: #2e7d32; }

        #searchBox { 
            width: 90%; max-width: 650px; padding: 10px; 
            margin: 20px auto; border-radius: 25px; 
            border: 2px solid #008080; display: block;
            background: #ffffff; font-family: inherit;
        }

        /* --- GRILLE ET CARTES --- */
        .mur-reel { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 10px; padding: 10px; max-width: 98vw; margin: 0 auto; }
        @media (max-width: 768px) { .mur-reel { grid-template-columns: repeat(2, 1fr); } }

        .carte-message { background: white; border: 2px solid #008080; border-radius: 12px; padding: 10px; box-shadow: 3px 3px 0px #008080; display: flex; flex-direction: column; height: 280px; cursor: pointer; position: relative; text-align: left; color: #333; transition: transform 0.2s; }
        .carte-message:hover { transform: translateY(-3px); }
        .nom-prenom { color: #2e7d32; font-weight: bold; font-size: 0.85em; border-bottom: 1px solid #eee; margin-bottom: 4px; padding-bottom: 2px; }
        .rubrique-tag { font-size: 0.55em; background: #008080; color: white; padding: 1px 4px; border-radius: 5px; position: absolute; top: 8px; right: 8px; }
        .texte-annonce { flex-grow: 1; font-style: italic; color: #004d40; overflow-y: auto; font-size: 0.75em; margin: 5px 0; line-height: 1.3; padding-right: 4px; }
        .details-bas { font-size: 0.7em; color: #666; line-height: 1.3; border-top: 1px solid #eee; padding-top: 5px; background: white; }

        /* --- MODALE GRAND MESSAGE STABLE --- */
        #fond-sombre { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: rgba(0,0,0,0.85); 
            z-index: 9999; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
        }
        .message-geant { 
            background: #F1F8E9; 
            width: 90%; 
            max-width: 700px; 
            max-height: 85vh; 
            padding: 25px; 
            border-radius: 25px; 
            border: 6px solid #008080; 
            position: relative; 
            overflow-y: auto; 
            color: #004d40; 
            text-align: left; 
            box-shadow: 0 10px 30px rgba(0,128,128,0.6); 
        }
        .bouton-fermer { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            background: #008080; 
            color: white; 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            cursor: pointer; 
            border: 2px solid white; 
            font-weight: bold; 
            font-size: 1.1em; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 10;
        }
        .bouton-fermer:hover { background: #005f5f; }
    </style>
</head>
<body>

    <div class="header-tools">
        <div id="google_translate_element"></div>
    </div>

    <table class="menu-table">
        <tr>
            <td><a href="index.html" onmouseover="playPop()">Accueil</a></td>
            <td><a href="formulaire.html" onmouseover="playPop()">Semer</a></td>
            <td><a href="jardin.html" onmouseover="playPop()">Le Jardin</a></td>
            <td><a href="impot.html" onmouseover="playPop()">Impôts</a></td>
            <td><a href="regulation.html" onmouseover="playPop()">Régulation</a></td>
            <td><a href="aide.html" onmouseover="playPop()">Aide</a></td>
        </tr>
    </table>

    <h2 style="color:#00695c; margin: 10px 0;">⚖ Zone de Régulation Citoyenne ⚖️</h2>
    <div class="phrase-rose">Expose ton conflit avec sincérité. La communauté répondra avec délicatesse.</div>

    <div class="etoile-form">
        <form id="regForm" onsubmit="envoyerConflit(event)">
            <input type="hidden" name="type" value="REGULATION">
            
            <label>👤 Ton nom ou pseudo :</label>
            <input type="text" name="nom" placeholder="Ton nom..." required>

            <label>📍 Zone Géographique (Pays, Ville) :</label>
            <input type="text" name="localisation" placeholder="Ex: France, Paris..." required>

            <label>⏳ Durée de validité (en jours) :</label>
            <input type="number" name="duree_validite" value="30" min="1" required>

            <label>💬 Expose ton conflit :</label>
            <textarea name="message" rows="4" placeholder="Décris la situation ici..." required></textarea>

            <button type="submit" id="btnEnvoi" class="btn-envoi" onmouseover="playPop()">SOUMETTRE À L'ENSEMBLE 🕊️</button>
        </form>
    </div>

    <div style="max-width: 650px; margin: auto; padding: 10px;">
        <input type="text" id="searchBox" onkeyup="filtrer()" placeholder="🔍 Chercher une ville, un nom...">
    </div>

    <div style="max-width: 95vw; margin: 40px auto; padding: 10px;">
        <h3 style="color:#00695c; margin-bottom: 20px;">🕊️ Dossiers en cours de résolution</h3>
        <div id="chargement" style="font-weight:bold; color:#004d40;">Appel de la sagesse citoyenne...</div>
        <div id="flux-conflits" class="mur-reel"></div>
    </div>

    <!-- Modale Grand Message -->
    <div id="fond-sombre" onclick="fermerGrandMessage()">
        <div class="message-geant" onclick="event.stopPropagation()">
            <button class="bouton-fermer" onclick="fermerGrandMessage()">X</button>
            <div id="geant-contenu"></div>
        </div>
    </div>

    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxxToz22V88elCCjxLqjRtsb5iBIC156cbBFRIlTsju2SwOj9yNnKqzAwFITXMg_wij/exec";
        let globalData = [];
        let annonceActiveId = null;

        function googleTranslateElementInit() { 
            new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element'); 
        }

        // --- SONS SYNTHÉTIQUES NATIFS ---
        function playPop() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.04);
            } catch(e) {}
        }

        // Véritable son de cloche / gong harmonieux (multi-fréquences métalliques)
        function playGong() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                const freqs = [146.83, 293.66, 440.00, 587.33]; // Fréquences de résonance type cloche

                freqs.forEach((f, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = index === 0 ? 'sine' : 'triangle';
                    osc.frequency.setValueAtTime(f, now);
                    osc.frequency.exponentialRampToValueAtTime(f * 0.99, now + 2.0); // Légère baisse réaliste
                    
                    gain.gain.setValueAtTime(0.2 / (index + 1), now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start(now);
                    osc.stop(now + 2.2);
                });
            } catch(e) {}
        }
        // ---------------------------------

        async function envoyerConflit(event) {
            event.preventDefault();
            playGong();

            const btn = document.getElementById('btnEnvoi');
            const texteInitial = btn.innerText;
            btn.innerText = "Transmission en cours...";
            btn.disabled = true;

            const form = document.getElementById('regForm');
            const formData = new FormData(form);
            const urlParams = new URLSearchParams(formData);

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: urlParams
                });

                setTimeout(() => {
                    alert("Ton dossier a été déposé avec succès. 🕊️");
                    form.reset();
                    chargerConflits();
                }, 1000);

            } catch (err) {
                console.error(err);
                alert("Erreur lors de l'envoi.");
            } finally {
                setTimeout(() => {
                    btn.innerText = texteInitial;
                    btn.disabled = false;
                }, 1000);
            }
        }

        async function chargerConflits() {
            try {
                const response = await fetch(WEB_APP_URL + "?v=" + Date.now());
                globalData = await response.json();
                
                document.getElementById('chargement').style.display = 'none';
                const flux = document.getElementById('flux-conflits');
                flux.innerHTML = "";

                const conflits = globalData.filter(d => {
                    const typeVal = String(d.type || "").trim().toUpperCase();
                    return typeVal === "REGULATION";
                });

                if (annonceActiveId) {
                    const toujoursExiste = conflits.find(c => (c.Horodateur || c.nom) === annonceActiveId);
                    if (!toujoursExiste) {
                        fermerGrandMessage();
                    }
                }

                if (conflits.length === 0) {
                    flux.innerHTML = `<div style="grid-column: span 5; padding: 20px; font-weight: bold; background: white; border-radius: 10px; color: #008080;">Aucun dossier en cours pour l'instant... 🕊️</div>`;
                    return;
                }

                conflits.reverse();

                conflits.forEach(c => {
                    const d = document.createElement('div');
                    d.className = 'carte-message';
                    d.onclick = () => ouvrirGrandMessage(c);
                    d.innerHTML = `
                        <div class="nom-prenom">${c.nom || "Anonyme"}</div>
                        <div class="rubrique-tag">Régulation</div>
                        <div class="texte-annonce">"${c.message}"</div>
                        <div class="details-bas">
                            📍 ${c.localisation || 'N/C'}<br>
                            ⏳ Validité : ${c.duree_validite || '30'}j<br>
                            📅 ${c.Horodateur || c.date || 'Récemment'}
                        </div>
                    `;
                    flux.appendChild(d);
                });
            } catch (error) {
                console.error("Erreur de chargement :", error);
                document.getElementById('chargement').innerText = "La justice est en repos... Impossible de charger le registre.";
            }
        }

        function ouvrirGrandMessage(ann) {
            playPop();
            annonceActiveId = ann.Horodateur || ann.nom;

            // Bloquer le fond pour empêcher tout tremblement/scroll parasite
            document.body.style.overflow = 'hidden';

            const reponses = globalData.filter(d => {
                const typeVal = String(d.type || "").trim().toUpperCase();
                return typeVal === "REPONSE_REGULATION" && d.localisation === ("Ref:" + annonceActiveId);
            });
            reponses.reverse();

            let htmlReponses = "";
            if (reponses.length > 0) {
                htmlReponses += `<h4 style="color: #00695c; margin-top: 15px; margin-bottom: 8px;">💬 Réponses de la communauté (${reponses.length}) :</h4>`;
                htmlReponses += `<div style="max-height: 160px; overflow-y: auto; border: 2px solid #008080; border-radius: 10px; padding: 10px; background: #ffffff;">`;
                
                reponses.forEach(r => {
                    htmlReponses += `
                        <div style="background: #E8F5E9; border-left: 4px solid #2e7d32; padding: 8px 10px; margin-bottom: 8px; border-radius: 6px; font-size: 0.9em; text-align: left; color: #004d40;">
                            <strong>🕊️ ${r.nom || "Un sage"} :</strong> ${r.message}
                            <div style="font-size: 0.7em; color: #555; margin-top: 3px;">📅 ${r.Horodateur || 'Récemment'}</div>
                        </div>
                    `;
                });
                htmlReponses += `</div>`;
            } else {
                htmlReponses += `<p style="font-style: italic; color: #555; margin-top: 15px;">Aucune réponse pour l'instant. Soyez le premier à apporter votre sagesse ! 🌿</p>`;
            }

            document.getElementById('geant-contenu').innerHTML = `
                <div style="font-size:1.4em; color:#00695c; font-weight:bold; border-bottom:3px solid #008080; margin-bottom:12px; padding-bottom:5px;">⚖️ Dossier de ${ann.nom || "Anonyme"}</div>
                
                <div style="background:white; padding:15px; border-radius:12px; border-left:8px solid #008080; font-size:1em; color:#333; text-align:left; margin-bottom:12px; max-height: 180px; overflow-y: auto; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); word-break: break-word;">"${ann.message}"</div>
                
                <div style="text-align:left; background:#E0F2F1; padding:10px; border-radius:8px; font-size:0.9em; color:#004d40; margin-bottom:12px;">
                    <strong>📍 Localisation :</strong> ${ann.localisation || "N/C"}<br>
                    <strong>⏳ Durée de validité :</strong> ${ann.duree_validite || "30"} jours<br>
                    <strong>📅 Date :</strong> ${ann.Horodateur || ann.date || "N/C"}
                </div>

                <div id="section-reponses">
                    ${htmlReponses}
                </div>

                <div style="margin-top: 15px; background: white; padding: 12px; border-radius: 10px; border: 2px dashed #008080;">
                    <h4 style="margin-top: 0; color: #00695c; margin-bottom: 6px; font-size: 1em;">🌿 Apporter une réponse délicate :</h4>
                    <form id="formReponse" onsubmit="envoyerReponse(event, '${annonceActiveId}')">
                        <input type="text" id="repNom" placeholder="Votre nom ou pseudo..." required style="margin-bottom: 6px; padding: 8px;">
                        <textarea id="repMessage" rows="2" placeholder="Rédigez votre réponse bienveillante ici..." required style="margin-bottom: 6px; padding: 8px;"></textarea>
                        <button type="submit" style="background: #008080; color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%;">Envoyer ma réponse 🕊️</button>
                    </form>
                </div>
            `;
            document.getElementById('fond-sombre').style.display = 'flex';
        }

        async function envoyerReponse(event, refId) {
            event.preventDefault();
            playGong();

            const nomRep = document.getElementById('repNom').value;
            const msgRep = document.getElementById('repMessage').value;

            const formData = new URLSearchParams();
            formData.append('type', 'REPONSE_REGULATION');
            formData.append('nom', nomRep);
            formData.append('localisation', 'Ref:' + refId);
            formData.append('message', msgRep);
            formData.append('duree_validite', '30');

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formData
                });

                alert("Votre réponse pleine de sagesse a été transmise ! 🕊️");
                
                const response = await fetch(WEB_APP_URL + "?v=" + Date.now());
                globalData = await response.json();
                
                const annonceActuelle = globalData.find(d => (d.Horodateur || d.nom) === refId);
                if (annonceActuelle) {
                    ouvrirGrandMessage(annonceActuelle);
                }
                chargerConflits();

            } catch (err) {
                console.error(err);
                alert("Erreur lors de l'envoi de la réponse.");
            }
        }

        function fermerGrandMessage() { 
            annonceActiveId = null;
            document.getElementById('fond-sombre').style.display = 'none'; 
            // Restaurer le scroll de la page principale
            document.body.style.overflow = 'auto';
        }

        function filtrer() {
            let val = document.getElementById('searchBox').value.toLowerCase();
            let cards = document.getElementsByClassName('carte-message');
            for (let c of cards) {
                let match = c.innerText.toLowerCase().includes(val);
                c.style.display = match ? "" : "none";
            }
        }

        window.onload = chargerConflits;
    </script>
</body>
</html>
