<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Régulation Citoyenne - Le Petit Prince</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', cursive; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
            background-color: #FFFF00; 
            color: #000080; 
        }

        /* TRADUCTEUR */
        #google_translate_element { padding: 10px; }

        /* MENU */
        .menu-table { 
            margin: 20px auto; 
            background-color: #008080; 
            border-collapse: collapse; 
            border-radius: 10px; 
            overflow: hidden; 
        }
        .menu-table td { padding: 12px 20px; border: 1px solid #FFFFFF; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; }
        .menu-table td:hover { background-color: #00b3b3; }

        /* FORMULAIRE */
        .form-container { 
            background: #E6E6FA; 
            border: 5px solid #9370DB; 
            border-radius: 30px; 
            width: 90%; 
            max-width: 650px; 
            margin: 20px auto; 
            padding: 25px; 
            box-shadow: 10px 10px 0px #9370DB; 
        }
        label { display: block; margin-top: 15px; font-weight: bold; text-align: left; }
        input, textarea, select { 
            width: 100%; padding: 12px; margin: 8px 0; 
            border-radius: 12px; border: 2px solid #9370DB; 
            box-sizing: border-box; font-family: inherit; 
        }

        .btn-envoi { 
            background: #9370DB; color: white; border: none; 
            padding: 18px 40px; border-radius: 25px; 
            font-weight: bold; cursor: pointer; font-size: 1.2em; 
            transition: 0.3s; width: 100%; margin-top: 20px;
        }
        .btn-envoi:hover { transform: scale(1.05); background: #7a5eb3; }

        /* LISTE DES CONFLITS */
        .liste-conflits { max-width: 700px; margin: 40px auto; padding: 20px; }
        .carte-conflit { 
            background: white; border-left: 10px solid #9370DB; 
            border-radius: 15px; padding: 20px; margin-bottom: 20px; 
            text-align: left; box-shadow: 4px 4px 10px rgba(0,0,0,0.1); 
        }
        .reponse-sage { 
            margin-left: 20px; margin-top: 10px; padding: 10px; 
            background: #F3E5F5; border-left: 4px solid #9370DB; 
            border-radius: 8px; font-size: 0.9em; color: #4a148c;
        }
        
        #searchBox { 
            width: 90%; max-width: 650px; padding: 12px; 
            margin: 20px auto; border-radius: 25px; 
            border: 2px solid #9370DB; display: block;
        }

        .btn-avis {
            display: inline-block; margin-top: 10px; color: #9370DB; 
            cursor: pointer; font-weight: bold; font-size: 0.85em; 
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div id="google_translate_element"></div>
    <script>
        function googleTranslateElementInit() { 
            new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element'); 
        }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impot.html">Impôts</a></td>
            <td><a href="regulation.html">Régulation</a></td>
            <td><a href="aide.html">Aide</a></td>
            <td><a href="savoirs.html">Savoirs</a></td>
        </tr>
    </table>

    <h1>⚖️ Zone de Régulation Citoyenne</h1>
    <p><i>Expose ton conflit avec sincérité. La communauté répondra avec délicatesse.</i></p>

    <div class="form-container">
        <form id="regForm">
            <label>Ton identité amoureuse ou pseudo :</label>
            <input type="text" id="nom" placeholder="Ton nom..." required>

            <label>Zone Géographique :</label>
            <input type="text" id="ville" placeholder="Ex: France, Paris..." required>

            <label>Durée de l'affichage :</label>
            <select id="duree">
                <option value="1 mois">1 mois</option>
                <option value="6 mois">6 mois</option>
                <option value="A vie">A vie</option>
            </select>

            <label>Nature du conflit ou de la peine :</label>
            <textarea id="message" rows="5" placeholder="Décris la situation ici..." required></textarea>

            <button type="submit" id="btnEnvoi" class="btn-envoi">SOUMETTRE À L'ENSEMBLE 🕊️</button>
        </form>
    </div>

    <input type="text" id="searchBox" onkeyup="filtrer()" placeholder="🔍 Chercher une ville, un nom...">

    <div class="liste-conflits">
        <h3 style="color:#9370DB;">🕊️ Dossiers en cours de résolution</h3>
        <div id="chargement">Appel de la sagesse citoyenne...</div>
        <div id="flux-conflits"></div>
    </div>

    <script>
        const URL_SERVEUR = "https://script.google.com/macros/s/AKfycbz4ncs9qw_AfmKSER5QST-P0OeKQggQaq86QC6liS53uZ9sx4Lo_-4-h1knXKWqgQMc/exec";

        // 1. ENVOI DU CONFLIT
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnEnvoi');
            btn.innerText = "Transmission...";
            btn.disabled = true;

            const donnees = {
                date: new Date().toLocaleDateString('fr-FR'),
                type: "Conflit",
                nom: document.getElementById('nom').value,
                localisation: document.getElementById('ville').value + " (" + document.getElementById('duree').value + ")",
                message: document.getElementById('message').value
            };

            fetch(URL_SERVEUR, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(donnees)
            }).then(() => {
                alert("Ton dossier a été déposé.");
                location.reload();
            });
        });

        // 2. RÉCUPÉRATION ET AFFICHAGE
        fetch(URL_SERVEUR)
            .then(r => r.json())
            .then(data => {
                document.getElementById('chargement').style.display = 'none';
                const flux = document.getElementById('flux-conflits');
                
                // On sépare conflits et avis
                const conflits = data.filter(d => d.type === "Conflit").reverse();
                const avis = data.filter(d => d.type === "Avis");

                conflits.forEach(c => {
                    let avisHTML = "";
                    // On cherche les avis qui répondent à ce nom
                    avis.filter(a => a.localisation.includes(c.nom)).forEach(a => {
                        avisHTML += `<div class="reponse-sage"><b>🌿 ${a.nom} :</b> ${a.message}</div>`;
                    });

                    const div = document.createElement('div');
                    div.className = 'carte-conflit';
                    div.innerHTML = `
                        <small>${c.date} - <b>${c.nom}</b> à ${c.localisation}</small>
                        <p style="font-weight:bold; margin:10px 0;">"${c.message}"</p>
                        ${avisHTML}
                        <div class="btn-avis" onclick="apporterAvis('${c.nom}')">⚖️ Apporter un avis délicat</div>
                    `;
                    flux.appendChild(div);
                });
            })
            .catch(err => {
                document.getElementById('chargement').innerText = "Erreur de connexion au registre.";
            });

        // 3. APPORTER UN AVIS
        function apporterAvis(nomCible) {
            const messageAvis = prompt("Quel est ton avis de sage pour résoudre ce conflit ?");
            if (messageAvis) {
                const nomSage = prompt("Ton nom ou pseudo de sage :") || "Anonyme";
                const donneesAvis = {
                    date: new Date().toLocaleDateString('fr-FR'),
                    type: "Avis",
                    nom: nomSage,
                    localisation: "Réponse à " + nomCible,
                    message: messageAvis
                };
                fetch(URL_SERVEUR, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(donneesAvis)
                }).then(() => {
                    alert("Avis ajouté au registre.");
                    location.reload();
                });
            }
        }

        // RECHERCHE
        function filtrer() {
            let val = document.getElementById('searchBox').value.toLowerCase();
            let cards = document.getElementsByClassName('carte-conflit');
            for (let c of cards) {
                c.style.display = c.innerText.toLowerCase().includes(val) ? "" : "none";
            }
        }
    </script>
</body>
</html>
