<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Régulation Citoyenne - Le Petit Prince</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: #fffdf0;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #d4af37;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
            border: 2px solid #f3e5ab;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        input, textarea {
            padding: 12px;
            border: 2px solid #f3e5ab;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
        }
        button {
            padding: 12px;
            background-color: #d4af37;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #b89728;
        }
        .barre-recherche {
            margin-bottom: 20px;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        .mur-reel {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .carte-conflit {
            background: #fffef8;
            border: 2px solid #e6d585;
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚖️ Régulation Citoyenne</h1>
        <p>Exposer les conflits pour chercher ensemble la sagesse des étoiles.</p>
        <div id="google_translate_element"></div>
    </header>

    <div class="container">
        <!-- Formulaire de soumission de conflit relié à la fonction universelle -->
        <form id="form-regulation" onsubmit="envoyerFormulaireGoogleScript(event, 'VOTRE_URL_GOOGLE_APPS_SCRIPT_REGULATION', chargerConflits)">
            <input type="text" name="citoyen" placeholder="Votre nom ou citoyenneté" required>
            <input type="text" name="sujet" placeholder="Sujet ou titre du conflit" required>
            <textarea name="description" rows="4" placeholder="Décrivez la situation en toute sérénité..." required></textarea>
            <button type="submit">Soumettre à la sagesse 📜</button>
        </form>

        <h2>Conflits en cours de régulation</h2>
        <input type="text" id="recherche" class="barre-recherche" placeholder="Filtrer par mot-clé..." onkeyup="filtrerConflits()">
        
        <div class="mur-reel" id="mur-conflits">
            <!-- Les fiches de conflits injectées apparaîtront ici -->
        </div>
    </div>

    <script>
        // Fonction d'envoi universelle (commune aux deux pages)
        async function envoyerFormulaireGoogleScript(event, urlScript, callbackSuccess) {
            event.preventDefault();
            const form = event.target;
            const submitBtn = form.querySelector('button[type="submit"]');
            const texteInitial = submitBtn ? submitBtn.innerText : 'Envoyer';
            
            if (submitBtn) {
                submitBtn.innerText = 'Envoi en cours...';
                submitBtn.disabled = true;
            }

            try {
                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());
                data.dateSoumission = new Date().toISOString();

                await fetch(urlScript, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                alert('✨ Votre situation a bien été transmise à la communauté !');
                form.reset();

                if (typeof callbackSuccess === 'function') {
                    callbackSuccess();
                }
            } catch (error) {
                console.error('Erreur :', error);
                alert('Une erreur est survenue lors de l\'envoi.');
            } finally {
                if (submitBtn) {
                    submitBtn.innerText = texteInitial;
                    submitBtn.disabled = false;
                }
            }
        }

        function chargerConflits() {
            // Espace pour votre logique de récupération GET des données si nécessaire
        }

        function filtrerConflits() {
            const filtre = document.getElementById('recherche').value.toLowerCase();
            const cartes = document.querySelectorAll('.carte-conflit');
            cartes.forEach(carte => {
                const texte = carte.innerText.toLowerCase();
                carte.style.display = texte.includes(filtre) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
