<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Registre de Régulation - Le Petit Prince</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; background-color: #E3F2FD; color: #01579b; }
        .menu-table { margin: 15px auto; background-color: #0288d1; border-collapse: collapse; border-radius: 10px; overflow: hidden; }
        .menu-table td { padding: 10px 18px; border: 1px solid #FFFFFF; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; }
        .container { background: white; padding: 20px; border-radius: 20px; width: 90%; max-width: 800px; display: inline-block; border: 3px solid #0288d1; margin-top: 20px; }
        .carte { background: #f1f8ff; border: 2px solid #0288d1; border-radius: 15px; padding: 15px; margin: 10px 0; text-align: left; }
        .titre { color: #E67E22; font-weight: bold; display: flex; justify-content: space-between; }
        #loader { color: #0288d1; font-style: italic; }
    </style>
</head>
<body>
    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="regulation.html">Régulation</a></td>
            <td><a href="registre_public.html">Registre Public</a></td>
        </tr>
    </table>
    <h2>⚖️ Suivi des Avis & Médiations</h2>
    <div class="container">
        <div id="loader">Appel au Conseil des Sages...</div>
        <div id="flux"></div>
    </div>

    <script>
        const URL_SERVEUR = "https://script.google.com/macros/s/AKfycbz4ncs9qw_AfmKSER5QST-P0OeKQggQaq86QC6liS53uZ9sx4Lo_-4-h1knXKWqgQMc/exec";
        async function charger() {
            try {
                const r = await fetch(URL_SERVEUR);
                const data = await r.json();
                document.getElementById('loader').style.display = "none";
                const flux = document.getElementById('flux');
                data.filter(d => d.type === "regulation").reverse().forEach(item => {
                    const d = document.createElement('div');
                    d.className = 'carte';
                    d.innerHTML = `<div class="titre"><span>⚖️ ${item.nom}</span><small>📍 ${item.localisation}</small></div>
                                   <p>${item.message}</p><small>Le ${item.date}</small>`;
                    flux.appendChild(d);
                });
            } catch(e) { document.getElementById('loader').innerText = "Erreur de chargement."; }
        }
        charger();
    </script>
</body>
</html>
