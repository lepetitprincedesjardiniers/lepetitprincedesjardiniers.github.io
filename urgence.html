<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>URGENCES - L'Étoile de la Main Tendue</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; 
            background: radial-gradient(circle at center, #4a0000 0%, #000000 100%);
            color: #ffffff; overflow-x: hidden; min-height: 100vh;
        }

        .menu-table { margin: 10px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; position: relative; z-index: 10; }
        .menu-table td { border: 1px solid #FFFFFF; }
        .menu-table a { display: block; padding: 12px 20px; text-decoration: none; color: #FFFFFF; font-weight: bold; }

        .etoile-sos {
            background: #ff1493; width: 160px; height: 160px; margin: 20px auto;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            display: flex; align-items: center; justify-content: center;
            animation: pulse 1.5s infinite; box-shadow: 0 0 30px #ff1493; font-weight: bold;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .form-container { 
            background: #FFF0F5; border: 5px solid #ff1493; border-radius: 30px; 
            width: 90%; max-width: 600px; margin: 20px auto; padding: 25px; color: #8b0000;
        }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: 2px solid #ff1493; box-sizing: border-box; font-family: inherit; }
        .btn-envoi { background: #ff1493; color: white; border: none; padding: 18px; border-radius: 25px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1em; }

        .liste-annonces { max-width: 700px; margin: 40px auto; padding: 20px; }
        .carte { background: white; border-left: 10px solid #ff1493; border-radius: 15px; padding: 20px; margin-bottom: 20px; text-align: left; color: #333; box-shadow: 0 4px 15px rgba(255,20,147,0.3); }
    </style>
</head>
<body>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impot.html">Impôts</a></td>
            <td><a href="regulation.html">Régulation</a></td>
            <td><a href="urgence.html">Urgences</a></td>
            <td><a href="aide.html">Aide</a></td>
            <td><a href="savoirs.html">Savoirs</a></td>
        </tr>
    </table>

    <div class="etoile-sos">S.O.S</div>
    <h1>L'Éspace Urgence & Détresse</h1>
    <p><i>Soutien médical et matériel : Le cri du corps.</i></p>

    <div class="form-container">
        <form id="urgForm">
            <input type="text" id="nomU" placeholder="Ton nom / Ton cri" required>
            <textarea id="msgU" rows="4" placeholder="Ex: J'ai besoin de me faire opérer la cervelle... Ma charpente vacille..." required></textarea>
            <button type="submit" class="btn-envoi">LANCER L'APPEL 🕊️</button>
        </form>
    </div>

    <div class="liste-annonces">
        <h2 style="color: #ffb6c1;">🚨 Appels Critiques</h2>
        <div id="flux-urgences">Chargement...</div>
    </div>

    <script>
        const URL = "https://script.google.com/macros/s/AKfycbz4ncs9qw_AfmKSER5QST-P0OeKQggQaq86QC6liS53uZ9sx4Lo_-4-h1knXKWqgQMc/exec";

        document.getElementById('urgForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "L'appel voyage..."; btn.disabled = true;
            const d = { date: new Date().toLocaleDateString('fr-FR'), type: "URGENCE", nom: document.getElementById('nomU').value, localisation: "Espace Urgence", message: document.getElementById('msgU').value };
            fetch(URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(d) }).then(() => { alert("Appel envoyé à la communauté."); location.reload(); });
        });

        fetch(URL).then(r => r.json()).then(data => {
            const f = document.getElementById('flux-urgences'); f.innerHTML = "";
            data.filter(i => i.type === "URGENCE").reverse().forEach(i => {
                f.innerHTML += `<div class="carte"><small>${i.date}</small><br><b>${i.nom} :</b><p>"${i.message}"</p></div>`;
            });
        });
    </script>
</body>
</html>
