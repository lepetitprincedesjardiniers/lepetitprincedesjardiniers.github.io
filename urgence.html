<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>URGENCES - L'Étoile de la Main Tendue</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; 
            background: radial-gradient(circle, #4a0000 0%, #000000 100%);
            color: #ffffff; overflow-x: hidden; min-height: 100vh;
        }

        /* MENU ET TRADUCTEUR (IDENTIQUE INDEX) */
        .menu-table { margin: 20px auto; background-color: #008080; border-collapse: collapse; border-radius: 10px; z-index: 100; position: relative;}
        .menu-table td { border: 1px solid #FFFFFF; }
        .menu-table a { display: block; padding: 12px 20px; text-decoration: none; color: #FFFFFF; font-weight: bold; }
        
        /* L'ÉTOILE D'URGENCE */
        .etoile-sos {
            background: #ff1493; width: 200px; height: 200px; margin: 30px auto;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            display: flex; align-items: center; justify-content: center;
            animation: pulse 2s infinite; box-shadow: 0 0 50px #ff1493;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); opacity: 0.8; } 100% { transform: scale(1); } }

        /* FORMULAIRE */
        .form-urgence {
            background: white; color: #333; max-width: 600px; margin: 20px auto;
            padding: 25px; border-radius: 30px; border: 5px solid #ff1493;
        }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border-radius: 10px; border: 2px solid #ff1493; box-sizing: border-box; }
        .btn-envoi { background: #ff1493; color: white; border: none; padding: 15px 30px; border-radius: 20px; font-weight: bold; cursor: pointer; width: 100%; }

        /* AFFICHAGE ANNONCES */
        .liste-urgences { max-width: 800px; margin: 40px auto; padding: 10px; }
        .carte-urgence { background: rgba(255,255,255,0.9); color: black; border-left: 10px solid #ff1493; margin-bottom: 15px; padding: 20px; border-radius: 10px; text-align: left; }

        /* EFFETS (Étoiles) */
        .star { position: fixed; color: white; z-index: -1; animation: twinkle 3s infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="regulation.html">Régulation</a></td>
            <td><a href="urgence.html">Urgences</a></td>
            <td><a href="aide.html">Aide</a></td>
        </tr>
    </table>

    <div class="etoile-sos"><b>S.O.S</b></div>
    <h1>Urgence & Détresse Vitale</h1>
    <p><i>Soutien médical, nourriture de vie, charpente qui vacille...</i></p>

    <div class="form-urgence">
        <form id="urgForm">
            <input type="text" id="nom" placeholder="Ton nom / Ton Cri" required>
            <input type="text" id="loc" placeholder="Où es-tu ? (Ville / Pays)" required>
            <textarea id="msg" rows="4" placeholder="Décris l'urgence (Ex: Besoin d'opérer la cervelle...)" required></textarea>
            <button type="submit" class="btn-envoi">LANCER L'APPEL 🕊️</button>
        </form>
    </div>

    <div class="liste-urgences" id="flux-urgences">
        </div>

    <footer>
        <a href="transition-externe.html" style="color: grey; text-decoration: none;">© 2000 le petit prince des jardiniers</a>
    </footer>

    <script>
        const URL_SERVEUR = "https://script.google.com/macros/s/AKfycbz4ncs9qw_AfmKSER5QST-P0OeKQggQaq86QC6liS53uZ9sx4Lo_-4-h1knXKWqgQMc/exec";

        document.getElementById('urgForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const d = { 
                date: new Date().toLocaleDateString('fr-FR'), type: "URGENCE", 
                nom: document.getElementById('nom').value, localisation: document.getElementById('loc').value, 
                message: document.getElementById('msg').value 
            };
            fetch(URL_SERVEUR, { method: 'POST', mode: 'no-cors', body: JSON.stringify(d) })
            .then(() => { alert("Appel envoyé !"); location.reload(); });
        });

        fetch(URL_SERVEUR).then(r => r.json()).then(data => {
            const flux = document.getElementById('flux-urgences');
            data.filter(i => i.type === "URGENCE").reverse().forEach(i => {
                flux.innerHTML += `<div class="carte-urgence"><b>${i.nom}</b> (${i.date}) - ${i.localisation}<br><i>"${i.message}"</i></div>`;
            });
        });
    </script>
</body>
</html>
