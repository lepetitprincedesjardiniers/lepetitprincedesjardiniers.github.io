<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Voyage du Petit Prince...</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: 'Comic Sans MS', cursive;
            display: flex; align-items: center; justify-content: center;
            background-color: #000;
        }

        #scene {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            transition: all 2s ease-in-out;
        }

        /* --- MESSAGES VOLANTS --- */
        .oiseau-message {
            position: absolute;
            white-space: nowrap;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 100;
            animation: envol 4s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }

        .bulle-bonheur {
            background: white;
            color: #008080;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 2px solid #FFD700;
        }

        @keyframes envol {
            0% { transform: translate(-100vw, 20vh) scale(0.5); opacity: 0; }
            30% { opacity: 1; transform: translate(0, 0) scale(1.1); }
            70% { opacity: 1; transform: translate(10vw, -10vh) scale(1); }
            100% { transform: translate(100vw, -30vh) scale(0.8); opacity: 0; }
        }

        /* --- THÈME 1 : ÉTOILES --- */
        .star {
            position: absolute; background: white; border-radius: 50%;
            animation: scintiller 1.5s infinite alternate;
        }
        @keyframes scintiller { from { opacity: 0.3; transform: scale(1); } to { opacity: 1; transform: scale(1.5); } }

        /* --- THÈME 2 : DÉSERT À PRAIRIE --- */
        .sable { position: absolute; bottom: 0; width: 100%; height: 0%; background: #edc9af; transition: height 2s; }
        .fleur-pousse {
            position: absolute; font-size: 2.5rem;
            bottom: -50px; animation: floraison 2.5s forwards ease-out;
        }
        @keyframes floraison {
            0% { transform: translateY(0) scale(0); }
            50% { transform: translateY(-40vh) scale(1.2) rotate(10deg); }
            100% { transform: translateY(-35vh) scale(1) rotate(0deg); }
        }

        /* --- THÈME 3 : NUAGES --- */
        .nuage-volant {
            position: absolute; color: white; font-size: 5rem;
            opacity: 0.8; animation: nuageMove 4s linear forwards;
        }
        @keyframes nuageMove {
            from { transform: translateX(-100vw) translateY(var(--y)); }
            to { transform: translateX(100vw) translateY(var(--y)); }
        }

        .chargement-texte {
            position: absolute; bottom: 30px; color: rgba(255,255,255,0.6);
            font-style: italic; letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div id="scene">
    <div id="elements-spectacle"></div>
    <div class="chargement-texte">L'humanité s'épanouit...</div>
</div>

<script>
    const phrases = [
        "Ici, on sème des graines de générosité pour récolter de l'altruisme",
        "Attention : zone de gratuité absolue pour cadeau réellement efficace",
        "La meilleure justice est encore le pardon",
        "Cadeaux sans détour, cadeaux sans demande de retour",
        "Regardez la fraternité s'épanouir au gré des dons du monde entier...",
        "Chaque don est une fleur qui ne se fane jamais"
    ];

    const themes = ['astral', 'metamorphose', 'cielethéré'];
    const scene = document.getElementById('scene');
    const container = document.getElementById('elements-spectacle');

    function jouerSpectacle() {
        const theme = themes[Math.floor(Math.random() * themes.length)];
        
        // 1. Lancer le message "Oiseau" (Commun à tous les thèmes)
        const oiseau = document.createElement('div');
        oiseau.className = 'oiseau-message';
        oiseau.innerHTML = `
            <span style="font-size: 3rem;">🕊️</span>
            <div class="bulle-bonheur">${phrases[Math.floor(Math.random()*phrases.length)]}</div>
        `;
        container.appendChild(oiseau);

        // 2. Mise en scène spécifique
        if (theme === 'astral') {
            scene.style.background = "radial-gradient(circle, #1a2a6c, #000)";
            for(let i=0; i<80; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                s.style.width = s.style.height = Math.random()*3 + 'px';
                s.style.left = Math.random()*100 + 'vw';
                s.style.top = Math.random()*100 + 'vh';
                s.style.animationDelay = Math.random()*2 + 's';
                container.appendChild(s);
            }
        } 
        else if (theme === 'metamorphose') {
            scene.style.background = "#87CEEB"; // Ciel bleu
            // Désert qui devient prairie
            for(let i=0; i<20; i++) {
                setTimeout(() => {
                    const f = document.createElement('div');
                    f.className = 'fleur-pousse';
                    f.style.left = Math.random()*90 + 'vw';
                    f.innerHTML = ['🌸','🌻','🌼','🌷','🌹'][Math.floor(Math.random()*5)];
                    container.appendChild(f);
                }, i * 100);
            }
        } 
        else {
            // Nuages qui s'envolent
            scene.style.background = "linear-gradient(#4facfe, #00f2fe)";
            for(let i=0; i<6; i++) {
                const n = document.createElement('div');
                n.className = 'nuage-volant';
                n.innerHTML = '☁️';
                n.style.setProperty('--y', (Math.random()*60 - 30) + 'vh');
                n.style.animationDelay = (i * 0.5) + 's';
                container.appendChild(n);
            }
        }

        // 3. Redirection intelligente
        const params = new URLSearchParams(window.location.search);
        const destination = params.get('page') || 'index.html';

        setTimeout(() => {
            scene.style.opacity = '0';
            scene.style.transform = 'scale(1.1)';
            setTimeout(() => {
                window.location.href = destination;
            }, 1000);
        }, 4000); // Durée du spectacle : 4 secondes
    }

    window.onload = jouerSpectacle;
</script>
</body>
</html>
