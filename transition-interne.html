<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Voyage du Petit Prince</title>
    <style>
        :root {
            --rainbow: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            --space: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
        }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: 'Comic Sans MS', cursive;
            background: var(--space); color: white; cursor: crosshair;
        }

        #canvas-bg { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }

        #scene {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; z-index: 10; text-align: center;
        }

        /* --- MESSAGER INTERACTIF --- */
        .messenger {
            position: absolute; cursor: pointer; z-index: 100;
            animation: orbit 5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            display: flex; align-items: center; gap: 15px;
        }
        .bulle {
            background: rgba(255, 255, 255, 0.95); color: #004d40;
            padding: 15px 25px; border-radius: 50px; font-weight: bold;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            border: 2px solid #FFD700; white-space: nowrap;
        }

        @keyframes orbit {
            0% { transform: translate(-100vw, 20vh) scale(0.5); opacity: 0; }
            30% { opacity: 1; transform: translate(0, 0) scale(1.2); }
            100% { transform: translate(100vw, -30vh) scale(1.5); opacity: 0; }
        }

        /* --- ÉCLAIR ET ARC-EN-CIEL --- */
        #rainbow-bridge {
            position: fixed; bottom: 0; width: 100%; height: 10px;
            background: var(--rainbow); box-shadow: 0 0 20px rgba(255,255,255,0.8);
            transform: scaleX(0); transition: transform 4s linear;
        }

        .flash-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 2000;
        }

        /* --- BOUTON PASSER --- */
        #skip {
            position: fixed; bottom: 30px; right: 30px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 10px 20px; border-radius: 30px;
            cursor: pointer; opacity: 0; transition: 0.5s; z-index: 1000;
        }
        #skip:hover { background: var(--rainbow); border-color: transparent; }

        .poesie {
            margin-top: 20px; font-style: italic; opacity: 0.8;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>
<div id="rainbow-bridge"></div>
<div id="flash" class="flash-overlay"></div>

<div id="scene">
    <div id="messenger-container"></div>
    <div class="poesie">
        "Un silence irréel, un éclair de gloire... l'humanité s'éveille."
    </div>
</div>

<button id="skip" onclick="finishTransition()">Passer le voyage ➔</button>

<script>
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    const phrases = [
        "Ici, on sème des graines de générosité pour récolter de l'altruisme",
        "Attention : zone de gratuité absolue pour un cadeau réellement efficace",
        "La meilleure justice est encore le pardon",
        "Cadeaux sans détour, cadeaux sans demande de retour",
        "Regardez la fraternité s'épanouir au gré des dons du monde entier...",
        "Chaque don est une fleur qui ne se fane jamais"
    ];

    let stars = [];
    const isHoliday = [11, 0].includes(new Date().getMonth()); // Décembre ou Janvier

    function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        for(let i=0; i<200; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5,
                opacity: Math.random()
            });
        }
        animate();
        createMessenger();
        document.getElementById('rainbow-bridge').style.transform = "scaleX(1)";
        setTimeout(() => document.getElementById('skip').style.opacity = 1, 1500);
        setTimeout(finishTransition, 5000);
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
            ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
            s.y += s.speed;
            if(s.y > canvas.height) s.y = 0;
            s.opacity = Math.sin(Date.now() * 0.001 * s.speed * 5) * 0.5 + 0.5;
        });
        requestAnimationFrame(animate);
    }

    function createMessenger() {
        const container = document.getElementById('messenger-container');
        const m = document.createElement('div');
        m.className = 'messenger';
        const icon = isHoliday ? '✨' : '🕊️';
        m.innerHTML = `<span style="font-size:3.5rem">${icon}</span><div class="bulle">${phrases[Math.floor(Math.random()*phrases.length)]}</div>`;
        
        m.onclick = (e) => {
            for(let i=0; i<30; i++) createParticle(e.clientX, e.clientY);
            m.style.transform = "scale(0)";
            m.style.transition = "0.3s";
        };
        container.appendChild(m);
    }

    function createParticle(x, y) {
        const p = document.createElement('div');
        p.style.position = 'fixed';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.innerHTML = ['🌈','⭐','❤️','❄️','💎'][Math.floor(Math.random()*5)];
        p.style.pointerEvents = 'none';
        p.style.zIndex = '1000';
        document.body.appendChild(p);

        const angle = Math.random() * Math.PI * 2;
        const velocity = 5 + Math.random() * 10;
        let posX = 0, posY = 0, op = 1;

        const pAnim = setInterval(() => {
            posX += Math.cos(angle) * velocity;
            posY += Math.sin(angle) * velocity;
            op -= 0.02;
            p.style.transform = `translate(${posX}px, ${posY}px) scale(${op * 2})`;
            p.style.opacity = op;
            if(op <= 0) { clearInterval(pAnim); p.remove(); }
        }, 16);
    }

    // Poussière d'étoiles au mouvement de souris
    window.addEventListener('mousemove', (e) => {
        if(Math.random() > 0.8) {
            const dust = document.createElement('div');
            dust.style.position = 'fixed';
            dust.style.left = e.clientX + 'px';
            dust.style.top = e.clientY + 'px';
            dust.style.width = '4px'; dust.style.height = '4px';
            dust.style.background = 'gold'; dust.style.borderRadius = '50%';
            dust.style.boxShadow = '0 0 10px gold';
            dust.style.pointerEvents = 'none';
            document.body.appendChild(dust);
            
            dust.animate([
                { opacity: 1, transform: 'scale(1)' },
                { opacity: 0, transform: 'scale(4) translateY(20px)' }
            ], { duration: 1000, fill: 'forwards' });
            setTimeout(() => dust.remove(), 1000);
        }
    });

    function finishTransition() {
        const flash = document.getElementById('flash');
        flash.style.opacity = 1;
        const params = new URLSearchParams(window.location.search);
        const next = params.get('page') || 'index.html';
        setTimeout(() => window.location.href = next, 600);
    }

    window.onload = init;
</script>
</body>
</html>
