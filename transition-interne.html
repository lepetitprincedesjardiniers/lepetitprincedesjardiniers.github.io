<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chargement...</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
        }
        #canvas-bg { position: fixed; top: 0; left: 0; z-index: 1; }
        .flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 2000;
        }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>
<div id="flash" class="flash"></div>

<script>
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        // Création d'étoiles filantes pour l'effet de vitesse
        for(let i=0; i<80; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: 4 + Math.random() * 10, // Vitesse élevée
                opacity: Math.random()
            });
        }
        animate();
        // Redirection très rapide (1 seconde de voyage)
        setTimeout(finish, 1000);
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;
        stars.forEach(s => {
            // Dessine des traînées pour l'effet de vitesse
            ctx.beginPath();
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(s.x, s.y + s.speed * 2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${s.opacity})`;
            ctx.stroke();
            
            s.y += s.speed;
            if(s.y > canvas.height) {
                s.y = -20;
                s.x = Math.random() * canvas.width;
            }
        });
        requestAnimationFrame(animate);
    }

    function finish() {
        const flash = document.getElementById('flash');
        flash.style.opacity = 1;
        flash.style.transition = "opacity 0.3s ease-in";
        
        const params = new URLSearchParams(window.location.search);
        let destination = params.get('page') || 'index.html';
        
        setTimeout(() => { window.location.href = destination; }, 300);
    }

    window.onload = init;
</script>
</body>
</html>
