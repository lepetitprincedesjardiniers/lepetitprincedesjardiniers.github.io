<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Régulation - Le Petit Prince des Jardiniers</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive; background-color: #E3F2FD; color: #01579b; margin: 0; text-align: center; }
        .header-tools { display: flex; justify-content: flex-start; padding: 5px; background: rgba(255,255,255,0.3); }
        #google_translate_element { transform: scale(0.7); transform-origin: top left; opacity: 0.6; }
        .menu-table { margin: 15px auto; background-color: #0288d1; border-collapse: collapse; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .menu-table td { padding: 10px 18px; border: 1px solid #FFFFFF; transition: 0.3s; }
        .menu-table td:hover { background: #03a9f4; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; font-size: 0.9em; }
        .intro-box { background: white; border: 3px solid #0288d1; border-radius: 20px; width: 85%; max-width: 800px; margin: 20px auto; padding: 25px; }
        .zone-explication { text-align: left; background: #E1F5FE; border-left: 5px solid #0288d1; padding: 20px; margin-bottom: 25px; border-radius: 10px; }
        .action-hub { margin: 20px 0; display: flex; justify-content: center; gap: 15px; }
        .btn-principal { padding: 12px 25px; border-radius: 25px; font-weight: bold; transition: 0.3s; cursor: pointer; border: none; text-decoration: none; }
        .btn-consult { background: #0288d1; color: white; }
        .btn-declare { background: white; color: #0288d1; border: 2px solid #0288d1; }
        #section-formulaire { display: none; animation: fadeIn 0.6s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .form-container { background: white; border: 5px solid #0288d1; border-radius: 30px; width: 85%; max-width: 800px; margin: 20px auto; padding: 25px; box-shadow: 8px 8px 0px #0288d1; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; }
        input, textarea, select { width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #0288d1; font-family: inherit; box-sizing: border-box; }
        .full-width { grid-column: 1 / -1; }
        .btn-envoi { background: #0288d1; color: white; border: none; padding: 15px 35px; border-radius: 20px; font-weight: bold; cursor: pointer; width: 100%; }
        .copyright { margin: 50px 0 30px; font-size: 0.85em; }
        .copyright a { color: #0288d1; text-decoration: none; font-weight: bold; padding: 4px 8px; transition: 0.4s; }
        .copyright a:hover { background: #E67E22; color: white; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header-tools"><div id="google_translate_element"></div></div>
    <audio id="snd-pop" src="https://www.soundjay.com/buttons/sounds/button-37.mp3"></audio>
    <audio id="snd-oiseaux" src="oiseaux.mp3"></audio>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="regulation.html">Régulation</a></td>
            <td><a href="impot.html">Impôt Public</a></td>
            <td><a href="registre_public.html">Le Registre</a></td>
        </tr>
    </table>

    <h1>⚖️ Régulation & Harmonie</h1>

    <div class="intro-box">
        <div class="zone-explication">
            <p>XXX (Phrase 1 : Justice & Équité)</p>
            <p>XXX (Phrase 2 : Rôle du Conseil)</p>
            <p>XXX (Phrase 3 : Médiation Citoyenne)</p>
            <p>XXX (Phrase 4 : Harmonie du Jardin)</p>
        </div>
        <div class="action-hub">
            <a href="registre_regulation.html" class="btn-principal btn-consult">📖 VOIR LES AVIS</a>
            <div onclick="ouvrirFormulaire()" class="btn-principal btn-declare">✍️ SAISIR LE CONSEIL</div>
        </div>
    </div>

    <div id="section-formulaire" class="form-container">
        <form id="regForm">
            <div class="form-grid">
                <div><label>Identité :</label><input type="text" id="nom" required></div>
                <div><label>Zone concernée :</label><input type="text" id="ville" required></div>
                <div class="full-width">
                    <label>Nature de la Saisie :</label>
                    <select id="categorie">
                        <optgroup label="⚖️ JUSTICE & ARBITRAGE">
                            <option value="Arbitrage">Demande d'Arbitrage (Conflit)</option>
                            <option value="Médiation">Médiation entre Jardiniers</option>
                        </optgroup>
                        <optgroup label="🧠 CONSEIL DES SAGES">
                            <option value="Avis">Demande d'Avis (Éthique/Futur)</option>
                            <option value="Harmonie">Proposition pour l'Harmonie Globale</option>
                        </optgroup>
                    </select>
                </div>
                <div class="full-width"><label>Exposé des faits ou de l'idée :</label><textarea id="message" rows="4" required></textarea></div>
            </div>
            <button type="submit" id="btnEnvoi" class="btn-envoi">SOUMETTRE AU CONSEIL 🌿</button>
        </form>
    </div>

    <div class="copyright">© 2000 <a href="transition-externe.html">Le Petit Prince des Jardiniers</a></div>

    <script>
        const URL_SERVEUR = "https://script.google.com/macros/s/AKfycbz4ncs9qw_AfmKSER5QST-P0OeKQggQaq86QC6liS53uZ9sx4Lo_-4-h1knXKWqgQMc/exec";
        function ouvrirFormulaire() { document.getElementById('section-formulaire').style.display = 'block'; window.scrollTo({ top: document.getElementById('section-formulaire').offsetTop, behavior: 'smooth' }); }
        
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const song = document.getElementById('snd-oiseaux');
            song.play().catch(()=>{});
            setTimeout(() => { song.pause(); song.currentTime = 0; }, 2000);

            fetch(URL_SERVEUR, { 
                method: 'POST', mode: 'no-cors', 
                body: JSON.stringify({
                    date: new Date().toLocaleDateString('fr-FR'),
                    type: "regulation",
                    nom: document.getElementById('nom').value,
                    localisation: document.getElementById('ville').value,
                    message: `[${document.getElementById('categorie').value}] ${document.getElementById('message').value}`
                })
            }).then(() => { 
                setTimeout(() => { alert("Saisie enregistrée."); window.location.href = "registre_regulation.html"; }, 2000);
            });
        });
    </script>
</body>
</html>
