<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Réseau d'Entraide - Le Petit Prince</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; background-color: #F3E5F5; color: #4A148C; }
        .menu-table { margin: 15px auto; background-color: #7B1FA2; border-collapse: collapse; border-radius: 10px; overflow: hidden; }
        .menu-table td { padding: 10px 18px; border: 1px solid #FFFFFF; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; }
        .container { background: white; padding: 20px; border-radius: 20px; width: 90%; max-width: 800px; display: inline-block; border: 3px solid #7B1FA2; margin-top: 20px; }
        .carte-secours { background: #FCE4EC; border: 2px solid #7B1FA2; border-radius: 15px; padding: 15px; margin: 10px 0; text-align: left; box-shadow: 4px 4px 0px #7B1FA2; }
        .titre { color: #E67E22; font-weight: bold; display: flex; justify-content: space-between; }
        .badge { background: #D81B60; color: white; padding: 2px 8px; border-radius: 5px; font-size: 0.8em; }
        #loader { color: #7B1FA2; font-style: italic; }
    </style>
</head>
<body>
    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="aide.html">Retour Aide</a></td>
            <td><a href="registre_public.html">Registre Global</a></td>
        </tr>
    </table>
    <h2>🕊️ État du Réseau de Solidarité</h2>
    <div class="container">
        <div id="loader">Vérification de la santé du monde...</div>
        <div id="flux"></div>
    </div>

    <script>
        const URL_SERVEUR = "https://script.google.com/macros/s/AKfycbz4ncs9qw_AfmKSER5QST-P0OeKQggQaq86QC6liS53uZ9sx4Lo_-4-h1knXKWqgQMc/exec";
        async function charger() {
            try {
                const r = await fetch(URL_SERVEUR);
                const data = await r.json();
                document.getElementById('loader').style.display = "none";
                const flux = document.getElementById('flux');
                data.filter(d => d.type === "aide").reverse().forEach(item => {
                    const d = document.createElement('div');
                    d.className = 'carte-secours';
                    d.innerHTML = `<div class="titre"><span>🆘 ${item.nom}</span><span class="badge">📍 ${item.localisation}</span></div>
                                   <p>${item.message}</p><small>Appel lancé le ${item.date}</small>`;
                    flux.appendChild(d);
                });
            } catch(e) { document.getElementById('loader').innerText = "Erreur de connexion."; }
        }
        charger();
    </script>
</body>
</html>
