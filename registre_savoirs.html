<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bibliothèque Vivante - Le Petit Prince</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; background-color: #FFFDE7; color: #795548; }
        .menu-table { margin: 15px auto; background-color: #FFB300; border-collapse: collapse; border-radius: 10px; overflow: hidden; }
        .menu-table td { padding: 10px 18px; border: 1px solid #FFFFFF; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; }
        .container { background: white; padding: 20px; border-radius: 20px; width: 90%; max-width: 800px; display: inline-block; border: 3px solid #FFB300; margin-top: 20px; }
        .carte-savoir { background: #FFF9C4; border: 2px solid #FFB300; border-radius: 15px; padding: 15px; margin: 10px 0; text-align: left; box-shadow: 4px 4px 0px #FFB300; }
        .titre { color: #E67E22; font-weight: bold; display: flex; justify-content: space-between; }
        #loader { color: #FFB300; font-style: italic; }
    </style>
</head>
<body>
    <table class="menu-table">
        <tr><td><a href="index.html">Accueil</a></td><td><a href="savoirs.html">Retour Savoirs</a></td></tr>
    </table>
    <h2>📚 Bibliothèque Vivante des Savoirs</h2>
    <div class="container">
        <div id="loader">Ouverture des grimoires...</div>
        <div id="flux"></div>
    </div>
    <script>
        const URL_SERVEUR = "https://script.google.com/macros/s/AKfycbz4ncs9qw_AfmKSER5QST-P0OeKQggQaq86QC6liS53uZ9sx4Lo_-4-h1knXKWqgQMc/exec";
        async function charger() {
            try {
                const r = await fetch(URL_SERVEUR);
                const data = await r.json();
                document.getElementById('loader').style.display = "none";
                data.filter(d => d.type === "savoirs").reverse().forEach(item => {
                    const d = document.createElement('div');
                    d.className = 'carte-savoir';
                    d.innerHTML = `<div class="titre"><span>💡 ${item.nom}</span><small>📍 ${item.localisation}</small></div>
                                   <p>${item.message}</p><small>Publié le ${item.date}</small>`;
                    document.getElementById('flux').appendChild(d);
                });
            } catch(e) { document.getElementById('loader').innerText = "Erreur de chargement."; }
        }
        charger();
    </script>
</body>
</html>
