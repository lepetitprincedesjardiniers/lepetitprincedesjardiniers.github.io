<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIDE & ÉCOUTE - Le Câlin de l'Âme</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Comic Sans MS', cursive; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
            background: radial-gradient(circle at center, #1a0a2e 0%, #000000 100%);
            color: #ffffff; 
            overflow-x: hidden; 
            min-height: 100vh; 
            padding-bottom: 80px;
            scroll-behavior: smooth;
        }

        /* --- EN-TÊTE AVEC DRAPEAUX ET TRADUCTEUR PROPRE --- */
        .header-tools { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 20px; 
            background: rgba(255, 255, 255, 0.05); 
        }
        
        .drapeaux-animes {
            font-size: 1.4em;
            letter-spacing: 3px;
            animation: pulseDrapeaux 2s infinite ease-in-out;
            filter: drop-shadow(0 0 8px #9370DB);
        }
        @keyframes pulseDrapeaux {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        /* Style propre du bloc traducteur Google sans casser le menu */
        #google_translate_element { 
            opacity: 0.95; 
        }
        .goog-te-combo {
            background-color: #2a1045 !important;
            color: #D8BFD8 !important;
            border: 2px solid #9370DB !important;
            border-radius: 8px !important;
            padding: 6px 12px !important;
            font-family: inherit !important;
            font-size: 1em !important;
            outline: none;
            cursor: pointer;
        }
        .goog-te-banner-frame.skiptranslate { display: none !important; }
        body { top: 0 !important; }
        /* Masquer uniquement le logo Google pour garder l'interface épurée */
        .goog-logo-link { display: none !important; }

        .menu-table { margin: 10px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; position: relative; z-index: 10; }
        .menu-table td { border: 1px solid #FFFFFF; padding: 8px 15px; }
        .menu-table a { display: block; text-decoration: none; color: #FFFFFF; font-weight: bold; font-size: 0.85em; }
        .menu-table td:hover { background: #00b3b3; }

        .coeur { font-size: 60px; margin: 15px; animation: float 3s infinite ease-in-out; filter: drop-shadow(0 0 15px #9370DB); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .form-container { 
            background: #F3E5F5; border: 4px solid #9370DB; border-radius: 25px; 
            width: 90%; max-width: 600px; margin: 20px auto; padding: 20px; color: #4a148c; text-align: left;
            box-shadow: 0 8px 20px rgba(147,112,219,0.4);
        }
        .form-container label { font-size: 0.9em; font-weight: bold; display: block; margin-top: 8px; color: #4a148c; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0 10px 0; border-radius: 10px; border: 2px solid #9370DB; box-sizing: border-box; font-family: inherit; background: #fff; color: #333; }
        .btn-envoi { background: #9370DB; color: white; border: none; padding: 12px; border-radius: 20px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1em; font-family: inherit; margin-top: 10px; transition: 0.3s; }
        .btn-envoi:hover { background: #7B68EE; }

        .mur-reel { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 15px; 
            padding: 15px; 
            max-width: 1100px; 
            margin: 0 auto; 
        }

        .carte-message { 
            background: white; 
            border: 2px solid #9370DB; 
            border-radius: 12px; 
            padding: 12px; 
            box-shadow: 3px 3px 0px #9370DB; 
            display: flex; 
            flex-direction: column; 
            height: 220px; 
            cursor: pointer; 
            position: relative; 
            text-align: left; 
            color: #333; 
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .carte-message:hover { 
            transform: translateY(-3px); 
            box-shadow: 4px 4px 0px #9370DB; 
        }
        .nom-prenom { color: #4a148c; font-weight: bold; font-size: 0.85em; border-bottom: 1px solid #eee; margin-bottom: 4px; padding-bottom: 2px; }
        .rubrique-tag { font-size: 0.55em; background: #9370DB; color: white; padding: 1px 4px; border-radius: 5px; position: absolute; top: 8px; right: 8px; }
        
        .texte-annonce { 
            flex-grow: 1; 
            font-style: italic; 
            color: #4a148c; 
            font-size: 0.75em; 
            margin: 5px 0; 
            line-height: 1.3; 
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            white-space: pre-wrap; 
        }
        .details-bas { font-size: 0.7em; color: #666; line-height: 1.3; border-top: 1px solid #eee; padding-top: 5px; background: white; }

        #fond-sombre { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: rgba(0,0,0,0.8); 
            z-index: 99999; 
            justify-content: center; 
            align-items: center; 
        }
        .message-geant { 
            background: #F3E5F5; 
            width: 90%; 
            max-width: 650px; 
            max-height: 85vh; 
            padding: 25px; 
            border-radius: 20px; 
            border: 5px solid #9370DB; 
            position: relative; 
            overflow-y: auto; 
            color: #4a148c; 
            text-align: left; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
        }
        .bouton-fermer { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            background: #9370DB; 
            color: white; 
            border-radius: 50%; 
            width: 35px; 
            height: 35px; 
            cursor: pointer; 
            border: 2px solid white; 
            font-weight: bold; 
            font-size: 1em; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .bouton-fermer:hover { background: #7B68EE; }
    </style>
</head>
<body>

    <div class="header-tools">
        <!-- Farandole de drapeaux animés à gauche -->
        <div id="drapeaux-changeants" class="drapeaux-animes">🇫🇷 🌍 🇬🇧</div>
        <!-- Le sélecteur de langue Google propre à droite -->
        <div id="google_translate_element"></div>
    </div>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impot.html">Impôts</a></td>
            <td><a href="regulation.html">Régulation</a></td>
            <td><a href="aide.html">Aide</a></td>
        </tr>
    </table>

    <div class="coeur">💖</div>
    <h1>Aide & Écoute</h1>
    <p><i>Le Câlin de l'Âme : Le cri du cœur.</i></p>

    <div class="form-container">
        <form id="aideForm" onsubmit="envoyerAide(event)">
            <input type="hidden" name="type" value="AIDE">
            <input type="hidden" name="localisation" value="Espace Cœur">

            <label>👤 Ton petit nom :</label>
            <input type="text" name="nom" required placeholder="Ex: Âme douce">

            <label>⏳ Durée de validité (en jours) :</label>
            <input type="number" name="duree_validite" value="30" min="1" required>

            <label>💬 Mon cœur est lourd, je cherche une oreille :</label>
            <textarea name="message" rows="4" required placeholder="Écris ton message pour un câlin de l'âme..."></textarea>

            <button type="submit" id="btnEnvoi" class="btn-envoi">DÉPOSER MON CŒUR 🕊️</button>
        </form>
    </div>

    <div style="max-width: 95vw; margin: 40px auto; padding: 10px;">
        <h2 id="titre-dossiers" style="color: #D8BFD8; margin-bottom: 20px;">🌸 Les Cœurs à Écouter</h2>
        <div id="chargement" style="font-weight:bold; color:#fff;">Appel de la douceur...</div>
        <div id="flux-aide" class="mur-reel"></div>
    </div>

    <!-- Modale Grand Message -->
    <div id="fond-sombre" onclick="fermerGrandMessage()">
        <div class="message-geant" onclick="event.stopPropagation()">
            <button class="bouton-fermer" onclick="fermerGrandMessage()">X</button>
            <div id="geant-contenu"></div>
        </div>
    </div>

    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxxToz22V88elCCjxLqjRtsb5iBIC156cbBFRIlTsju2SwOj9yNnKqzAwFITXMg_wij/exec";
        let globalData = [];
        let annonceActiveId = null;

        function googleTranslateElementInit() { 
            new google.translate.TranslateElement({
                pageLanguage: 'fr',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element'); 
        }

        // --- ANIMATION DES DRAPEAUX ---
        const listeDrapeaux = ["🇫🇷 🌍 🇬🇧", "🇪🇸 🌍 🇮🇹", "🇩🇪 🌍 🇯🇵", "🇺🇸 🌍 🇨🇦", "🇧🇷 🌍 🇵🇹", "🇯🇵 🌍 🇰🇷"];
        setInterval(() => {
            const indexAleatoire = Math.floor(Math.random() * listeDrapeaux.length);
            const elementDrapeaux = document.getElementById('drapeaux-changeants');
            if(elementDrapeaux) {
                elementDrapeaux.innerText = listeDrapeaux[indexAleatoire];
            }
        }, 3000);

        function playGong() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                const freqs = [146.83, 293.66, 440.00, 587.33]; 

                freqs.forEach((f, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = index === 0 ? 'sine' : 'triangle';
                    osc.frequency.setValueAtTime(f, now);
                    osc.frequency.exponentialRampToValueAtTime(f * 0.99, now + 2.0);
                    
                    gain.gain.setValueAtTime(0.25 / (index + 1), now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start(now);
                    osc.stop(now + 2.2);
                });
            } catch(e) {}
        }

        function formaterDate(dateStr) {
            if (!dateStr) return 'Récemment';
            const d = new Date(dateStr);
            if (!isNaN(d.getTime())) {
                return d.toLocaleDateString('fr-FR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }
            return String(dateStr).replace(/[:.]?00Z$/, '').replace('T', ' à ');
        }

        async function envoyerAide(event) {
            event.preventDefault();
            playGong();

            const btn = document.getElementById('btnEnvoi');
            const texteInitial = btn.innerText;
            btn.innerText = "Le message s'envole..."; 
            btn.disabled = true;

            const form = document.getElementById('aideForm');
            const formData = new FormData(form);
            const urlParams = new URLSearchParams(formData);

            try {
                await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: urlParams 
                });

                setTimeout(async () => {
                    alert("Message déposé avec douceur. 🕊️"); 
                    form.reset();
                    await chargerAide();
                    document.getElementById('titre-dossiers').scrollIntoView({ behavior: 'smooth' });
                }, 1000);

            } catch (err) {
                console.error(err);
                alert("Erreur lors de l'envoi.");
            } finally {
                setTimeout(() => {
                    btn.innerText = texteInitial;
                    btn.disabled = false;
                }, 1000);
            }
        }

        async function chargerAide() {
            try {
                const response = await fetch(WEB_APP_URL + "?v=" + Date.now());
                if (!response.ok) throw new Error("Erreur réseau");
                
                globalData = await response.json();
                
                const chargementEl = document.getElementById('chargement');
                if (chargementEl) chargementEl.style.display = 'none';

                const flux = document.getElementById('flux-aide');
                flux.innerHTML = "";

                if (!Array.isArray(globalData)) {
                    globalData = [];
                }

                const annonces = globalData.filter(d => {
                    const typeVal = String(d.type || "").trim().toUpperCase();
                    return typeVal === "AIDE" || typeVal === "URGENCE";
                });

                if (annonces.length === 0) {
                    flux.innerHTML = `<div style="grid-column: 1 / -1; padding: 20px; font-weight: bold; background: #2a1045; border-radius: 10px; color: #fff;">Aucun cœur à écouter pour l'instant... 💖</div>`;
                    return;
                }

                annonces.reverse();

                annonces.forEach(c => {
                    const d = document.createElement('div');
                    d.className = 'carte-message';
                    d.onclick = () => ouvrirGrandMessage(c);
                    d.innerHTML = `
                        <div class="nom-prenom">${c.nom || "Anonyme"}</div>
                        <div class="rubrique-tag">Câlin de l'Âme</div>
                        <div class="texte-annonce">"${c.message}"</div>
                        <div class="details-bas">
                            📍 ${c.localisation || 'Espace Cœur'}<br>
                            ⏳ Validité : ${c.duree_validite || '30'}j<br>
                            📅 ${formaterDate(c.Horodateur || c.date)}
                        </div>
                    `;
                    flux.appendChild(d);
                });
            } catch (error) {
                console.error("Erreur de chargement :", error);
                const chargementEl = document.getElementById('chargement');
                if (chargementEl) chargementEl.innerText = "Impossible de charger les cœurs... 🕊️";
            }
        }

        function ouvrirGrandMessage(ann) {
            playGong();
            
            let rawRef = ann.Horodateur || ann.nom;
            annonceActiveId = String(rawRef).replace(/[:.]?00Z$/, '').replace(/Z$/, '');

            const reponses = globalData.filter(d => {
                const typeVal = String(d.type || "").trim().toUpperCase();
                const locVal = String(d.localisation || "");
                return typeVal === "REPONSE_AIDE" && locVal.includes(annonceActiveId);
            });
            reponses.reverse();

            let htmlReponses = "";
            if (reponses.length > 0) {
                htmlReponses += `<h4 style="color: #4a148c; margin-top: 15px; margin-bottom: 8px;">💬 Réponses & Soutiens (${reponses.length}) :</h4>`;
                htmlReponses += `<div style="max-height: 150px; overflow-y: auto; border: 2px solid #9370DB; border-radius: 10px; padding: 10px; background: #ffffff;">`;
                
                reponses.forEach(r => {
                    htmlReponses += `
                        <div style="background: #F3E5F5; border-left: 4px solid #7B68EE; padding: 8px 10px; margin-bottom: 8px; border-radius: 6px; font-size: 0.9em; text-align: left; color: #4a148c; white-space: pre-wrap;">
                            <strong>🕊️ ${r.nom || "Une âme douce"} :</strong> ${r.message}
                            <div style="font-size: 0.7em; color: #666; margin-top: 3px;">📅 ${formaterDate(r.Horodateur)}</div>
                        </div>
                    `;
                });
                htmlReponses += `</div>`;
            } else {
                htmlReponses += `<p style="font-style: italic; color: #666; margin-top: 15px;">Aucune réponse pour l'instant. Soyez le premier à apporter votre soutien ! 💖</p>`;
            }

            document.getElementById('geant-contenu').innerHTML = `
                <div style="font-size:1.3em; color:#4a148c; font-weight:bold; border-bottom:3px solid #9370DB; margin-bottom:12px; padding-bottom:5px;">💖 Cœur de ${ann.nom || "Anonyme"}</div>
                
                <div style="background:white; padding:15px; border-radius:12px; border-left:8px solid #9370DB; font-size:1em; color:#333; text-align:left; margin-bottom:12px; max-height: 160px; overflow-y: auto; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); word-break: break-word; white-space: pre-wrap;">"${ann.message}"</div>
                
                <div style="text-align:left; background:#E1BEE7; padding:10px; border-radius:8px; font-size:0.9em; color:#4a148c; margin-bottom:12px;">
                    <strong>📍 Localisation :</strong> Espace Cœur<br>
                    <strong>⏳ Durée de validité :</strong> ${ann.duree_validite || "30"} jours<br>
                    <strong>📅 Date :</strong> ${formaterDate(ann.Horodateur || ann.date)}
                </div>

                <div id="section-reponses">
                    ${htmlReponses}
                </div>

                <div style="margin-top: 15px; background: white; padding: 12px; border-radius: 10px; border: 2px dashed #9370DB;">
                    <h4 style="margin-top: 0; color: #4a148c; margin-bottom: 6px; font-size: 1em;">🌿 Apporter un soutien :</h4>
                    <form id="formReponse" onsubmit="envoyerReponse(event, '${annonceActiveId}')">
                        <input type="text" id="repNom" placeholder="Votre nom ou pseudo..." required style="margin-bottom: 6px; padding: 8px;">
                        <textarea id="repMessage" rows="2" placeholder="Rédigez votre message de soutien ici..." required style="margin-bottom: 6px; padding: 8px;"></textarea>
                        <button type="submit" id="btnReponseSubmit" style="background: #9370DB; color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%;">Envoyer ma réponse 🕊️</button>
                    </form>
                </div>
            `;
            document.getElementById('fond-sombre').style.display = 'flex';
        }

        async function envoyerReponse(event, refId) {
            event.preventDefault();
            playGong();

            const nomRep = document.getElementById('repNom').value;
            const msgRep = document.getElementById('repMessage').value;
            const btnSub = document.getElementById('btnReponseSubmit');
            btnSub.innerText = "Transmission...";
            btnSub.disabled = true;

            const formData = new URLSearchParams();
            formData.append('type', 'REPONSE_AIDE');
            formData.append('nom', nomRep);
            formData.append('localisation', 'Espace Cœur (' + refId + ')');
            formData.append('message', msgRep);
            formData.append('duree_validite', '30');

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formData
                });

                alert("Votre réponse a été transmise ! 🕊️");

                const sectionRep = document.getElementById('section-reponses');
                sectionRep.innerHTML += `
                    <div style="background: #C8E6C9; color: #1B5E20; padding: 10px; border-radius: 8px; margin-top: 10px; font-weight: bold; text-align: center;">
                        ✓ Réponse envoyée avec succès ! Rechargement...
                    </div>
                `;

                setTimeout(async () => {
                    fermerGrandMessage();
                    await chargerAide();
                }, 2000);

            } catch (err) {
                console.error(err);
                alert("Erreur lors de l'envoi de la réponse.");
                btnSub.innerText = "Envoyer ma réponse 🕊️";
                btnSub.disabled = false;
            }
        }

        function fermerGrandMessage() { 
            annonceActiveId = null;
            document.getElementById('fond-sombre').style.display = 'none'; 
        }

        window.onload = chargerAide;
    </script>
</body>
</html>
