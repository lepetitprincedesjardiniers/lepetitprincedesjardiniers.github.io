<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aide & Écoute - Le Câlin de l'Âme</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            color: #333;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #5a4b81;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        input, textarea {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
        }
        button {
            padding: 12px;
            background-color: #7b68ee;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #6a5acd;
        }
        .mur-reel {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }
        .carte-message {
            background: #fdfbf7;
            border: 2px dashed #b19cd9;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .carte-message:hover {
            transform: scale(1.02);
        }
        /* Modale */
        #fond-sombre {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modale-contenu {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌹 Le Câlin de l'Âme</h1>
        <p>Déposez un mot doux, une écoute, un éclat d'étoile...</p>
    </header>

    <div class="container">
        <!-- Formulaire d'envoi relié à la fonction universelle -->
        <form id="form-aide" onsubmit="envoyerFormulaireGoogleScript(event, 'VOTRE_URL_GOOGLE_APPS_SCRIPT_AIDE', chargerMessages)">
            <input type="text" name="nom" placeholder="Votre nom ou pseudo" required>
            <textarea name="message" rows="4" placeholder="Votre message de soutien..." required></textarea>
            <button type="submit">Envoyer mon cœur 💖</button>
        </form>

        <h2>Les cœurs à écouter</h2>
        <div class="mur-reel" id="mur-messages">
            <!-- Les messages s'afficheront ici -->
        </div>
    </div>

    <!-- Modale d'affichage -->
    <div id="fond-sombre" onclick="fermerModale(event)">
        <div class="modale-contenu" onclick="event.stopPropagation()">
            <h3 id="modale-titre"></h3>
            <p id="modale-texte"></p>
            <button onclick="fermerModaleDirect()">Fermer</button>
        </div>
    </div>

    <script>
        // Fonction d'envoi universelle (commune aux deux pages)
        async function envoyerFormulaireGoogleScript(event, urlScript, callbackSuccess) {
            event.preventDefault();
            const form = event.target;
            const submitBtn = form.querySelector('button[type="submit"]');
            const texteInitial = submitBtn ? submitBtn.innerText : 'Envoyer';
            
            if (submitBtn) {
                submitBtn.innerText = 'Envoi en cours...';
                submitBtn.disabled = true;
            }

            try {
                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());
                data.dateSoumission = new Date().toISOString();

                await fetch(urlScript, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                alert('✨ Votre message a bien été envoyé avec succès !');
                form.reset();

                if (typeof callbackSuccess === 'function') {
                    callbackSuccess();
                }
            } catch (error) {
                console.error('Erreur :', error);
                alert('Une erreur est survenue lors de l\'envoi.');
            } finally {
                if (submitBtn) {
                    submitBtn.innerText = texteInitial;
                    submitBtn.disabled = false;
                }
            }
        }

        function chargerMessages() {
            // Espace pour votre logique de récupération GET des données si nécessaire
        }

        function ouvrirModale(nom, message) {
            document.getElementById('modale-titre').innerText = "De : " + nom;
            document.getElementById('modale-texte').innerText = message;
            document.getElementById('fond-sombre').style.display = 'flex';
        }

        function fermerModaleDirect() {
            document.getElementById('fond-sombre').style.display = 'none';
        }

        function fermerModale(e) {
            if (e.target.id === 'fond-sombre') {
                fermerModaleDirect();
            }
        }
    </script>
</body>
</html>
