<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aide - Le Petit Prince</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Comic Sans MS', cursive, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
            background-color: #E8F5E9; 
            color: #004d40; 
            padding-bottom: 80px; 
            scroll-behavior: smooth;
        }

        .header-tools { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; }
        #google_translate_element { transform: scale(0.85); transform-origin: top left; opacity: 0.7; }
        #google_translate_element:hover { opacity: 1; }

        .menu-table { 
            margin: 20px auto; 
            background-color: #008080; 
            border-collapse: collapse; 
            border-radius: 10px; 
            overflow: hidden; 
        }
        .menu-table td { padding: 10px 15px; border: 1px solid #FFFFFF; }
        .menu-table td a { text-decoration: none; color: #FFFFFF; font-weight: bold; display: block; }
        .menu-table td:hover { background-color: #00b3b3; }

        .phrase-rose { color: #d81b60; font-weight: bold; font-size: 1.1em; text-shadow: 1px 1px 2px #f8bbd0; margin-top: 5px; }

        /* FORMULAIRE */
        .etoile-form { 
            background: #ffffff; 
            border: 3px solid #008080; 
            width: 90%; 
            max-width: 600px; 
            margin: 20px auto; 
            padding: 25px; 
            border-radius: 20px;
            box-shadow: 0px 10px 20px rgba(0, 128, 128, 0.2);
            text-align: left;
        }
        label { display: block; margin-top: 10px; font-weight: bold; color: #00695c; font-size: 0.9em; }
        input, textarea, select { 
            width: 100%; padding: 10px; margin: 5px 0 10px 0; 
            border-radius: 10px; border: 2px solid #008080; 
            background: #fafafa; color: #333; font-family: inherit;
        }
        .btn-envoi { 
            background: #008080; color: white; border: none; 
            padding: 12px; border-radius: 20px; 
            font-weight: bold; cursor: pointer; font-size: 1.1em; 
            width: 100%; margin-top: 10px; font-family: inherit;
        }
        .btn-envoi:hover { background: #2e7d32; }

        #searchBox { 
            width: 90%; max-width: 650px; padding: 10px; 
            margin: 20px auto; border-radius: 25px; 
            border: 2px solid #008080; display: block;
            background: #ffffff; font-family: inherit;
        }

        /* --- TABLEAU DES DEMANDES (COLONNES) --- */
        .tableau-aide {
            width: 90%;
            max-width: 1000px;
            margin: 20px auto;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
        }
        .tableau-aide th, .tableau-aide td {
            padding: 12px 15px;
            border: 1px solid #ddd;
            text-align: left;
        }
        .tableau-aide th {
            background-color: #008080;
            color: white;
            font-weight: bold;
        }
        .tableau-aide tr:hover {
            background-color: #f1f8e9;
            cursor: pointer;
        }

        /* --- GRANDE FENÊTRE (MODALE) --- */
        #fond-sombre { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: rgba(0,0,0,0.8); 
            z-index: 99999; 
            justify-content: center; 
            align-items: center; 
        }
        .message-geant { 
            background: #F1F8E9; 
            width: 90%; 
            max-width: 650px; 
            max-height: 85vh; 
            padding: 25px; 
            border-radius: 20px; 
            border: 5px solid #008080; 
            position: relative; 
            overflow-y: auto; 
            color: #004d40; 
            text-align: left; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
        }
        .bouton-fermer { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            background: #008080; 
            color: white; 
            border-radius: 50%; 
            width: 35px; 
            height: 35px; 
            cursor: pointer; 
            border: 2px solid white; 
            font-weight: bold; 
            font-size: 1em; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .bouton-fermer:hover { background: #005f5f; }

        /* --- NOTIFICATION FLOTTANTE --- */
        #notification-flottante {
            display: none;
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #008080;
            color: white;
            padding: 15px 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 100000;
            font-family: inherit;
            max-width: 450px;
            width: 90%;
            text-align: left;
            border: 2px solid #ffffff;
            animation: fadeInTop 0.3s ease;
        }
        @keyframes fadeInTop {
            from { opacity: 0; transform: translate(-50%, -15px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
    </style>
</head>
<body>

    <div class="header-tools">
        <div id="google_translate_element"></div>
    </div>

    <table class="menu-table">
        <tr>
            <td><a href="index.html" onmouseover="playPop()">Accueil</a></td>
            <td><a href="formulaire.html" onmouseover="playPop()">Semer</a></td>
            <td><a href="jardin.html" onmouseover="playPop()">Le Jardin</a></td>
            <td><a href="impot.html" onmouseover="playPop()">Impôts</a></td>
            <td><a href="regulation.html" onmouseover="playPop()">Régulation</a></td>
            <td><a href="aide.html" onmouseover="playPop()">Aide</a></td>
        </tr>
    </table>

    <h2 style="color:#00695c; margin: 10px 0;">🤝 Espace d'Entraide et d'Aide Mutuelle 🤝</h2>
    <div class="phrase-rose">Besoin d'un coup de main ou envie d'aider ? Exprime ton besoin, la communauté te répondra.</div>

    <div class="etoile-form">
        <form id="regForm" onsubmit="envoyerConflit(event)">
            <input type="hidden" name="type" value="AIDE">
            
            <label>👤 Ton nom ou pseudo :</label>
            <input type="text" name="nom" placeholder="Ton nom..." required>

            <label>📍 Localisation / Domaine d'aide :</label>
            <input type="text" name="localisation" placeholder="Ex: Jardinage, Bricolage, En ligne..." required>

            <label>⏳ Durée de validité (en jours) :</label>
            <input type="number" name="duree_validite" value="30" min="1" required>

            <label>💬 Exprime ton appel à l'aide ou ta question :</label>
            <textarea name="message" rows="4" placeholder="Décris ce dont tu as besoin..." required></textarea>

            <button type="submit" id="btnEnvoi" class="btn-envoi" onmouseover="playPop()">SOUMETTRE À L'ENTRAIDE 🕊️</button>
        </form>
    </div>

    <div style="max-width: 650px; margin: auto; padding: 10px;">
        <input type="text" id="searchBox" onkeyup="filtrer()" placeholder="🔍 Chercher une aide, un nom...">
    </div>

    <div style="max-width: 1000px; margin: 40px auto; padding: 10px;">
        <h3 id="titre-dossiers" style="color:#00695c; margin-bottom: 20px; text-align: center;">🕊️ Demandes d'aide en cours</h3>
        <div id="chargement" style="font-weight:bold; color:#004d40; text-align: center;">Appel de la bienveillance...</div>
        
        <!-- Tableau structuré en colonnes d'origine -->
        <table class="tableau-aide" id="table-aide" style="display:none;">
            <thead>
                <tr>
                    <th>Nom / Pseudo</th>
                    <th>Domaine / Localisation</th>
                    <th>Message</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="flux-conflits">
                <!-- Les lignes s'inséreront ici dynamiquement -->
            </tbody>
        </table>
    </div>

    <!-- Modale Grand Message -->
    <div id="fond-sombre" onclick="fermerGrandMessage()">
        <div class="message-geant" onclick="event.stopPropagation()">
            <button class="bouton-fermer" onclick="fermerGrandMessage()">X</button>
            <div id="geant-contenu"></div>
        </div>
    </div>

    <!-- Notification Flottante -->
    <div id="notification-flottante">
        <span id="texte-notification"></span>
        <button onclick="fermerNotification()" style="background: none; border: none; color: white; font-weight: bold; font-size: 1.2em; float: right; cursor: pointer; margin-left: 10px; line-height: 1;">&times;</button>
    </div>

    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxxToz22V88elCCjxLqjRtsb5iBIC156cbBFRIlTsju2SwOj9yNnKqzAwFITXMg_wij/exec";
        let globalData = [];
        let annonceActiveId = null;
        let notificationTimer = null;

        function googleTranslateElementInit() { 
            new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element'); 
        }

        function formaterDate(dateStr) {
            if (!dateStr) return 'Récemment';
            const d = new Date(dateStr);
            if (!isNaN(d.getTime())) {
                return d.toLocaleDateString('fr-FR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }
            return String(dateStr).replace(/[:.]?00Z$/, '').replace('T', ' à ');
        }

        function montrerNotification(texte) {
            const notif = document.getElementById('notification-flottante');
            document.getElementById('texte-notification').innerText = texte;
            notif.style.display = 'block';

            if (notificationTimer) {
                clearTimeout(notificationTimer);
            }

            notificationTimer = setTimeout(() => {
                fermerNotification();
            }, 3000);
        }

        function fermerNotification() {
            const notif = document.getElementById('notification-flottante');
            notif.style.display = 'none';
            if (notificationTimer) {
                clearTimeout(notificationTimer);
                notificationTimer = null;
            }
        }

        function playPop() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.04);
            } catch(e) {}
        }

        function playGong() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                const freqs = [146.83, 293.66, 440.00, 587.33]; 

                freqs.forEach((f, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = index === 0 ? 'sine' : 'triangle';
                    osc.frequency.setValueAtTime(f, now);
                    osc.frequency.exponentialRampToValueAtTime(f * 0.99, now + 2.0);
                    
                    gain.gain.setValueAtTime(0.25 / (index + 1), now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start(now);
                    osc.stop(now + 2.2);
                });
            } catch(e) {}
        }

        async function envoyerConflit(event) {
            event.preventDefault();
            playGong();

            const btn = document.getElementById('btnEnvoi');
            const texteInitial = btn.innerText;
            btn.innerText = "Transmission en cours...";
            btn.disabled = true;

            const form = document.getElementById('regForm');
            const formData = new FormData(form);
            const urlParams = new URLSearchParams(formData);

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: urlParams
                });

                setTimeout(async () => {
                    montrerNotification("Ton appel à l'aide a été publié avec succès. 🕊️");
                    form.reset();
                    await chargerConflits();
                    document.getElementById('titre-dossiers').scrollIntoView({ behavior: 'smooth' });
                }, 1000);

            } catch (err) {
                console.error(err);
                montrerNotification("Erreur lors de l'envoi.");
            } finally {
                setTimeout(() => {
                    btn.innerText = texteInitial;
                    btn.disabled = false;
                }, 1000);
            }
        }

        async function chargerConflits() {
            try {
                const response = await fetch(WEB_APP_URL + "?v=" + Date.now());
                globalData = await response.json();
                
                document.getElementById('chargement').style.display = 'none';
                const tableEl = document.getElementById('table-aide');
                const flux = document.getElementById('flux-conflits');
                flux.innerHTML = "";

                const conflits = globalData.filter(d => {
                    const typeVal = String(d.type || "").trim().toUpperCase();
                    return typeVal === "AIDE";
                });

                if (conflits.length === 0) {
                    tableEl.style.display = "none";
                    document.getElementById('chargement').style.display = "block";
                    document.getElementById('chargement').innerText = "Aucune demande d'aide pour l'instant... 🕊️";
                    return;
                }

                tableEl.style.display = "table";
                conflits.reverse();

                conflits.forEach(c => {
                    const tr = document.createElement('tr');
                    tr.onclick = () => ouvrirGrandMessage(c);
                    tr.innerHTML = `
                        <td style="font-weight: bold; color: #2e7d32;">${c.nom || "Anonyme"}</td>
                        <td>${c.localisation || 'N/C'}</td>
                        <td style="font-style: italic; color: #004d40;">"${c.message}"</td>
                        <td style="font-size: 0.85em; color: #666;">${formaterDate(c.Horodateur || c.date)}</td>
                    `;
                    flux.appendChild(tr);
                });
            } catch (error) {
                console.error("Erreur de chargement :", error);
                document.getElementById('chargement').innerText = "Impossible de charger le registre d'aide.";
            }
        }

        function ouvrirGrandMessage(ann) {
            playPop();
            
            let rawRef = ann.Horodateur || ann.nom;
            annonceActiveId = String(rawRef).replace(/[:.]?00Z$/, '').replace(/Z$/, '');

            const reponses = globalData.filter(d => {
                const typeVal = String(d.type || "").trim().toUpperCase();
                return typeVal === "REPONSE_AIDE" && String(d.localisation || "").includes(annonceActiveId);
            });
            reponses.reverse();

            let htmlReponses = "";
            if (reponses.length > 0) {
                htmlReponses += `<h4 style="color: #00695c; margin-top: 15px; margin-bottom: 8px;">💬 Réponses de la communauté (${reponses.length}) :</h4>`;
                htmlReponses += `<div style="max-height: 150px; overflow-y: auto; border: 2px solid #008080; border-radius: 10px; padding: 10px; background: #ffffff;">`;
                
                reponses.forEach(r => {
                    htmlReponses += `
                        <div style="background: #E8F5E9; border-left: 4px solid #2e7d32; padding: 8px 10px; margin-bottom: 8px; border-radius: 6px; font-size: 0.9em; text-align: left; color: #004d40; white-space: pre-wrap;">
                            <strong>🕊️ ${r.nom || "Un bienveillant"} :</strong> ${r.message}
                            <div style="font-size: 0.7em; color: #555; margin-top: 3px;">📅 ${formaterDate(r.Horodateur)}</div>
                        </div>
                    `;
                });
                htmlReponses += `</div>`;
            } else {
                htmlReponses += `<p style="font-style: italic; color: #555; margin-top: 15px;">Aucune réponse pour l'instant. Soyez le premier à apporter votre aide ! 🌿</p>`;
            }

            document.getElementById('geant-contenu').innerHTML = `
                <div style="font-size:1.3em; color:#00695c; font-weight:bold; border-bottom:3px solid #008080; margin-bottom:12px; padding-bottom:5px;">🤝 Demande de ${ann.nom || "Anonyme"}</div>
                
                <div style="background:white; padding:15px; border-radius:12px; border-left:8px solid #008080; font-size:1em; color:#333; text-align:left; margin-bottom:12px; max-height: 160px; overflow-y: auto; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); word-break: break-word; white-space: pre-wrap;">"${ann.message}"</div>
                
                <div style="text-align:left; background:#E0F2F1; padding:10px; border-radius:8px; font-size:0.9em; color:#004d40; margin-bottom:12px;">
                    <strong>📍 Domaine / Localisation :</strong> ${ann.localisation || "N/C"}<br>
                    <strong>⏳ Durée de validité :</strong> ${ann.duree_validite || "30"} jours<br>
                    <strong>📅 Date :</strong> ${formaterDate(ann.Horodateur || ann.date)}
                </div>

                <div id="section-reponses">
                    ${htmlReponses}
                </div>

                <div style="margin-top: 15px; background: white; padding: 12px; border-radius: 10px; border: 2px dashed #008080;">
                    <h4 style="margin-top: 0; color: #00695c; margin-bottom: 6px; font-size: 1em;">🌿 Apporter mon aide :</h4>
                    <form id="formReponse" onsubmit="envoyerReponse(event, '${annonceActiveId}')">
                        <input type="text" id="repNom" placeholder="Votre nom ou pseudo..." required style="margin-bottom: 6px; padding: 8px; width:100%;">
                        <textarea id="repMessage" rows="2" placeholder="Rédigez votre réponse ou proposition d'aide..." required style="margin-bottom: 6px; padding: 8px; width:100%;"></textarea>
                        <button type="submit" id="btnReponseSubmit" style="background: #008080; color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%;">Envoyer ma réponse 🕊️</button>
                    </form>
                </div>
            `;
            document.getElementById('fond-sombre').style.display = 'flex';
        }

        async function envoyerReponse(event, refId) {
            event.preventDefault();
            playGong();

            const nomRep = document.getElementById('repNom').value;
            const msgRep = document.getElementById('repMessage').value;
            const btnSub = document.getElementById('btnReponseSubmit');
            btnSub.innerText = "Transmission...";
            btnSub.disabled = true;

            const formData = new URLSearchParams();
            formData.append('type', 'REPONSE_AIDE');
            formData.append('nom', nomRep);
            formData.append('localisation', 'Ref:' + refId);
            formData.append('message', msgRep);
            formData.append('duree_validite', '30');

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formData
                });

                montrerNotification("Votre réponse d'aide a été transmise ! 🕊️");

                const sectionRep = document.getElementById('section-reponses');
                sectionRep.innerHTML += `
                    <div style="background: #C8E6C9; color: #1B5E20; padding: 10px; border-radius: 8px; margin-top: 10px; font-weight: bold; text-align: center;">
                        ✓ Réponse envoyée avec succès ! Retour...
                    </div>
                `;

                setTimeout(async () => {
                    fermerGrandMessage();
                    await chargerConflits();
                    setTimeout(() => {
                        document.getElementById('titre-dossiers').scrollIntoView({ behavior: 'smooth' });
                    }, 100);
                }, 3000);

            } catch (err) {
                console.error(err);
                montrerNotification("Erreur lors de l'envoi de la réponse.");
                btnSub.innerText = "Envoyer ma réponse 🕊️";
                btnSub.disabled = false;
            }
        }

        function fermerGrandMessage() { 
            annonceActiveId = null;
            document.getElementById('fond-sombre').style.display = 'none'; 
        }

        function filtrer() {
            let val = document.getElementById('searchBox').value.toLowerCase();
            let rows = document.querySelectorAll('#flux-conflits tr');
            rows.forEach(r => {
                let match = r.innerText.toLowerCase().includes(val);
                r.style.display = match ? "" : "none";
            });
        }

        window.onload = chargerConflits;
    </script>
</body>
</html>
