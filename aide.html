<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>AIDE & ÉCOUTE - Le Câlin de l'Âme</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; 
            background: radial-gradient(circle at center, #1a0a2e 0%, #000000 100%);
            color: #ffffff; overflow-x: hidden; min-height: 100vh; padding-bottom: 80px;
        }

        .header-tools { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: rgba(255,255,255,0.05); }
        #google_translate_element { transform: scale(0.85); transform-origin: top left; opacity: 0.7; }
        #google_translate_element:hover { opacity: 1; }

        .menu-table { margin: 10px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; position: relative; z-index: 10; }
        .menu-table td { border: 1px solid #FFFFFF; padding: 8px 15px; }
        .menu-table a { display: block; text-decoration: none; color: #FFFFFF; font-weight: bold; font-size: 0.85em; }
        .menu-table td:hover { background: #00b3b3; }

        .coeur { font-size: 60px; margin: 15px; animation: float 3s infinite ease-in-out; filter: drop-shadow(0 0 15px #9370DB); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .form-container { 
            background: #F3E5F5; border: 4px solid #9370DB; border-radius: 25px; 
            width: 90%; max-width: 600px; margin: 20px auto; padding: 20px; color: #4a148c; text-align: left;
            box-shadow: 0 8px 20px rgba(147,112,219,0.4);
        }
        .form-container label { font-size: 0.9em; font-weight: bold; display: block; margin-top: 8px; color: #4a148c; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0 10px 0; border-radius: 10px; border: 2px solid #9370DB; box-sizing: border-box; font-family: inherit; background: #fff; color: #333; }
        .btn-envoi { background: #9370DB; color: white; border: none; padding: 12px; border-radius: 20px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1em; font-family: inherit; margin-top: 10px; transition: 0.3s; }
        .btn-envoi:hover { background: #7B68EE; }

        /* --- GRILLE ET CARTES MINIATURES --- */
        .mur-reel { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 10px; padding: 10px; max-width: 98vw; margin: 0 auto; }
        @media (max-width: 768px) { .mur-reel { grid-template-columns: repeat(2, 1fr); } }

        .carte-message { background: white; border: 2px solid #9370DB; border-radius: 12px; padding: 10px; box-shadow: 0 4px 10px rgba(147,112,219,0.3); display: flex; flex-direction: column; height: 260px; cursor: pointer; position: relative; overflow: hidden; text-align: left; color: #333; transition: transform 0.2s; }
        .carte-message:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(147,112,219,0.5); }
        .nom-prenom { color: #4a148c; font-weight: bold; font-size: 0.85em; border-bottom: 1px solid #eee; margin-bottom: 4px; padding-bottom: 2px; }
        .rubrique-tag { font-size: 0.55em; background: #9370DB; color: white; padding: 1px 5px; border-radius: 5px; position: absolute; top: 8px; right: 8px; }
        .texte-annonce { flex-grow: 1; font-style: italic; color: #333; overflow-y: auto; font-size: 0.75em; margin: 5px 0; line-height: 1.3; padding-right: 5px; }
        .details-bas { font-size: 0.7em; color: #666; line-height: 1.3; border-top: 1px solid #eee; padding-top: 5px; background: white; }

        /* --- MODALE GRAND MESSAGE --- */
        #fond-sombre { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; }
        .message-geant { background: #F3E5F5; width: 95%; max-width: 800px; padding: 25px; border-radius: 25px; border: 6px solid #9370DB; position: relative; max-height: 85vh; overflow-y: auto; color: #4a148c; text-align: left; box-shadow: 0 10px 30px rgba(147,112,219,0.6); }
        .bouton-fermer { position: absolute; top: 15px; right: 15px; background: #9370DB; color: white; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; border: 2px solid white; font-weight: bold; font-size: 1.1em; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <!-- Effets sonores -->
    <audio id="snd-pop" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>
    <audio id="snd-oiseaux" src="https://assets.mixkit.co/active_storage/sfx/512/512-preview.mp3" preload="auto"></audio>

    <div class="header-tools">
        <div id="google_translate_element"></div>
    </div>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impots.html">Impôts</a></td>
            <td><a href="impot.html">Impôts</a></td>
            <td><a href="regulation.html">Régulation</a></td>
            <td><a href="aide.html">Aide</a></td>
            <td><a href="index.html" onmouseover="playPop()">Accueil</a></td>
            <td><a href="formulaire.html" onmouseover="playPop()">Semer</a></td>
            <td><a href="jardin.html" onmouseover="playPop()">Le Jardin</a></td>
            <td><a href="impot.html" onmouseover="playPop()">Impôts</a></td>
            <td><a href="regulation.html" onmouseover="playPop()">Régulation</a></td>
            <td><a href="aide.html" onmouseover="playPop()">Aide</a></td>
        </tr>
    </table>

    <div class="coeur">💖</div>
    <h1>Aide & Écoute</h1>
    <p><i>Le Câlin de l'Âme : Le cri du cœur.</i></p>

    <div class="form-container">
        <form id="aideForm" onsubmit="envoyerAide(event)">
            <input type="hidden" name="type" value="AIDE">
            <input type="hidden" name="localisation" value="Espace Cœur">

            <label>👤 Ton petit nom :</label>
            <input type="text" name="nom" required placeholder="Ex: Âme douce">

            <label>⏳ Durée de validité (en jours) :</label>
            <input type="number" name="duree_validite" value="30" min="1" required>

            <label>💬 Mon cœur est lourd, je cherche une oreille :</label>
            <textarea name="message" rows="4" required placeholder="Écris ton message pour un câlin de l'âme..."></textarea>

            <button type="submit" class="btn-envoi">DÉPOSER MON CŒUR 🕊️</button>
            <button type="submit" class="btn-envoi" onmouseover="playPop()" style="display:none;">DÉPOSER MON CŒUR 🕊️</button>
        </form>
    </div>

    <div style="max-width: 95vw; margin: 40px auto; padding: 10px;">
        <h2 style="color: #D8BFD8; margin-bottom: 20px;">🌸 Les Cœurs à Écouter</h2>
        <div id="flux-aide" class="mur-reel"><p style="grid-column: span 5; color: #fff;">Appel de la douceur...</p></div>
    </div>

    <!-- Modale Grand Message -->
    <div id="fond-sombre" onclick="fermerGrandMessage()">
        <div class="message-geant" onclick="event.stopPropagation()">
            <button class="bouton-fermer" onclick="fermerGrandMessage()">X</button>
            <div id="geant-contenu"></div>
        </div>
    </div>

    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxxToz22V88elCCjxLqjRtsb5iBIC156cbBFRIlTsju2SwOj9yNnKqzAwFITXMg_wij/exec";
        let allAnnonces = []; // Stockage global pour les réponses

        function googleTranslateElementInit() { 
            new google.translate.TranslateElement({pageLanguage: 'fr', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element'); 
        }

        function playPop() {
            const pop = document.getElementById('snd-pop');
            pop.currentTime = 0;
            pop.play().catch(()=>{});
        }

        function playOiseaux() {
            const song = document.getElementById('snd-oiseaux');
            song.currentTime = 0;
            song.play().catch(()=>{});
            setTimeout(() => {
                song.pause();
                song.currentTime = 0;
            }, 2000);
        }

        async function envoyerAide(event) {
            event.preventDefault();
            playOiseaux();

            const btn = event.target.querySelector('button');
            const texteInitial = btn.innerText;
            btn.innerText = "Le message s'envole..."; 
            btn.disabled = true;

            const form = document.getElementById('aideForm');
            const formData = new FormData(form);
            const urlParams = new URLSearchParams(formData);

            try {
                await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: urlParams 
                });
                
                setTimeout(() => {
                    alert("Message déposé avec douceur. 🕊️"); 
                    form.reset();
                    chargerAide();
                }, 1500);

            } catch (err) {
                console.error(err);
                alert("Erreur lors de l'envoi.");
            } finally {
                setTimeout(() => {
                    btn.innerText = texteInitial;
                    btn.disabled = false;
                }, 1500);
            }
        }

        async function envoyerReponse(event, annonceId) {
            event.preventDefault();
            playOiseaux();

            const btn = event.target.querySelector('button');
            const texteInitial = btn.innerText;
            btn.innerText = "Envoi en cours...";
            btn.disabled = true;

            const form = event.target;
            const formData = new FormData(form);
            const urlParams = new URLSearchParams(formData);

            try {
                await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: urlParams 
                });
                
                alert("Réponse envoyée avec douceur. 🕊️");
                form.reset();
                await chargerAide();
                
                // Rouvrir la modale avec l'annonce mise à jour
                const updatedAnn = allAnnonces.find(i => (i.id == annonceId) || (i.Horodateur == annonceId) || (i.message == annonceId));
                if (updatedAnn) {
                    ouvrirGrandMessage(updatedAnn);
                } else {
                    fermerGrandMessage();
                }
            } catch (err) {
                console.error(err);
                alert("Erreur lors de l'envoi de la réponse.");
            } finally {
                btn.innerText = texteInitial;
                btn.disabled = false;
            }
        }

        async function chargerAide() {
            try {
                const response = await fetch(WEB_APP_URL + "?v=" + Date.now());
                const data = await response.json();
                allAnnonces = data; // Sauvegarde des données

                const f = document.getElementById('flux-aide'); 
                f.innerHTML = "";
                
                const annonces = data.filter(i => i.type === "AIDE" || i.type === "Urgence");

                if (annonces.length === 0) {
                    f.innerHTML = `<div style="grid-column: span 5; padding: 20px; font-weight: bold; background: #2a1045; border-radius: 10px; color: #fff;">Aucun cœur à écouter pour l'instant... 💖</div>`;
                    return;
                }

                // Inversion pour afficher les derniers messages en premier
                annonces.reverse();

                annonces.forEach(i => {
                    const d = document.createElement('div');
                    d.className = 'carte-message';
                    d.onclick = () => ouvrirGrandMessage(i);

                    // Compter les réponses associées à cette annonce
                    const nbRep = allAnnonces.filter(r => r.type === "REPONSE" && (
                        (i.id && r.id_annonce == i.id) || 
                        (i.Horodateur && r.parent == i.Horodateur) || 
                        (i.message && r.reference && i.message.includes(r.reference)) ||
                        (r.id_annonce == i.Horodateur)
                    )).length;

                    d.innerHTML = `
                        <div class="nom-prenom">${i.nom || "Anonyme"}</div>
                        <div class="rubrique-tag">Câlin de l'Âme</div>
                        <div class="texte-annonce">"${i.message}"</div>
                        <div class="details-bas">
                            📅 Date : ${i.Horodateur || i.date || 'N/C'}<br>
                            ⏳ Validité : ${i.duree_validite || '30'} jours
                            ${nbRep > 0 ? `<br>💬 Réponses : ${nbRep}` : ''}
                        </div>
                    `;
                    f.appendChild(d);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('flux-aide').innerHTML = `<p style="grid-column: span 5; color: #ff9999;">Impossible de charger les cœurs... 🕊️</p>`;
            }
        }

        function ouvrirGrandMessage(ann) {
            // Filtrer les réponses liées à cette annonce
            const repList = allAnnonces.filter(i => 
                i.type === "REPONSE" && (
                    (ann.id && i.id_annonce == ann.id) || 
                    (ann.Horodateur && i.parent == ann.Horodateur) || 
                    (ann.message && i.reference && ann.message.includes(i.reference)) ||
                    (i.id_annonce == ann.Horodateur)
                )
            );

            let htmlReponses = "";
            if (repList.length > 0) {
                htmlReponses += `<div style="margin-top: 20px;"><h4 style="color: #4a148c; border-bottom: 2px dashed #9370DB; padding-bottom: 5px;">💬 Réponses & Soutiens (${repList.length})</h4>`;
                repList.forEach(r => {
                    htmlReponses += `
                        <div style="background: white; padding: 12px; border-radius: 10px; margin-bottom: 10px; border-left: 5px solid #9370DB; text-align: left;">
                            <div style="font-weight: bold; color: #4a148c; font-size: 0.85em; margin-bottom: 4px;">👤 ${r.nom || "Anonyme"} <span style="font-size: 0.7em; color: #666; font-weight: normal; float: right;">${r.Horodateur || r.date || ''}</span></div>
                            <div style="color: #333; font-size: 0.9em; white-space: pre-wrap;">${r.message}</div>
                        </div>
                    `;
                });
                htmlReponses += `</div>`;
            } else {
                htmlReponses += `<div style="margin-top: 20px; font-size: 0.9em; color: #666; font-style: italic;">Aucune réponse pour l'instant. Sois le premier à apporter un soutien ! 💖</div>`;
            }

            document.getElementById('geant-contenu').innerHTML = `
                <div style="font-size:1.6em; color:#4a148c; font-weight:bold; border-bottom:3px solid #9370DB; margin-bottom:20px; padding-bottom:5px;">💖 Cœur de ${ann.nom || "Anonyme"}</div>
                <div style="background:white; padding:20px; border-radius:15px; border-left:8px solid #9370DB; font-size:1.2em; color:#333; text-align:left; margin-bottom:20px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);">"${ann.message}"</div>
                <div style="text-align:left; background:#E1BEE7; padding:15px; border-radius:10px; font-size:1em; color:#4a148c; margin-bottom: 20px;">
                    <strong>📍 Localisation :</strong> ${ann.localisation || "Espace Cœur"}<br>
                    <strong>⏳ Durée de validité :</strong> ${ann.duree_validite || "30"} jours<br>
                    <strong>📅 Date :</strong> ${ann.Horodateur || ann.date || "N/C"}
                </div>

                ${htmlReponses}

                <form onsubmit="envoyerReponse(event, '${ann.Horodateur || ann.id || ''}')" style="margin-top: 25px; background: #fff; padding: 20px; border-radius: 15px; border: 2px solid #9370DB; text-align: left;">
                    <h4 style="color: #4a148c; margin-top: 0; margin-bottom: 10px;">🕊️ Apporter une réponse / un réconfort :</h4>
                    <input type="hidden" name="type" value="REPONSE">
                    <input type="hidden" name="id_annonce" value="${ann.id || ann.Horodateur || ''}">
                    <input type="hidden" name="parent" value="${ann.Horodateur || ''}">
                    <input type="hidden" name="reference" value="${ann.message ? ann.message.substring(0, 30) : ''}">
                    
                    <label style="font-size: 0.85em; font-weight: bold; color: #4a148c;">👤 Ton petit nom :</label>
                    <input type="text" name="nom" required placeholder="Ex: Âme bienveillante">
                    
                    <label style="font-size: 0.85em; font-weight: bold; color: #4a148c;">💬 Ton message de soutien :</label>
                    <textarea name="message" rows="3" required placeholder="Écris un mot doux ou une réponse..."></textarea>
                    
                    <button type="submit" class="btn-envoi" style="margin-top: 10px;">ENVOYER MA RÉPONSE 💌</button>
                </form>
            `;
            document.getElementById('fond-sombre').style.display = 'flex';
        }

        function fermerGrandMessage() { 
            document.getElementById('fond-sombre').style.display = 'none'; 
        }

        window.onload = chargerAide;
    </script>
</body>
</html>
