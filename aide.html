<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>AIDE & ÉCOUTE - Le Câlin de l'Âme</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; 
            background: radial-gradient(circle, #1a0a2e 0%, #000000 100%);
            color: #ffffff; min-height: 100vh;
        }

        .menu-table { margin: 20px auto; background-color: #008080; border-collapse: collapse; border-radius: 10px; }
        .menu-table td { border: 1px solid #FFFFFF; }
        .menu-table a { display: block; padding: 12px 20px; text-decoration: none; color: #FFFFFF; font-weight: bold; }

        .coeur-aide { font-size: 80px; margin: 20px; filter: drop-shadow(0 0 20px #9370DB); animation: float 3s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .form-aide {
            background: #F3E5F5; color: #4a148c; max-width: 600px; margin: 20px auto;
            padding: 25px; border-radius: 30px; border: 5px solid #9370DB;
        }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border-radius: 10px; border: 2px solid #9370DB; box-sizing: border-box; }
        .btn-envoi { background: #9370DB; color: white; border: none; padding: 15px 30px; border-radius: 20px; font-weight: bold; cursor: pointer; width: 100%; }

        .carte-aide { background: white; color: #333; border-left: 10px solid #9370DB; margin-bottom: 15px; padding: 20px; border-radius: 10px; text-align: left; box-shadow: 0 4px 15px rgba(147,112,219,0.2); }
    </style>
</head>
<body>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="regulation.html">Régulation</a></td>
            <td><a href="urgence.html">Urgences</a></td>
            <td><a href="aide.html">Aide</a></td>
        </tr>
    </table>

    <div class="coeur-aide">💖</div>
    <h1>Aide & Écoute</h1>
    <p><i>Câlin de l'âme, oreille attentive, besoin d'un espoir...</i></p>

    <div class="form-aide">
        <form id="aideForm">
            <input type="text" id="nom" placeholder="Ton petit nom">
            <textarea id="msg" rows="4" placeholder="De quoi ton cœur a-t-il besoin ?"></textarea>
            <button type="submit" class="btn-envoi">DÉPOSER MON CŒUR 🕊️</button>
        </form>
    </div>

    <div style="max-width: 800px; margin: 40px auto; padding: 10px;" id="flux-aide">
        </div>

    <script>
        const URL_SERVEUR = "https://script.google.com/macros/s/AKfycbz4ncs9qw_AfmKSER5QST-P0OeKQggQaq86QC6liS53uZ9sx4Lo_-4-h1knXKWqgQMc/exec";

        document.getElementById('aideForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const d = { 
                date: new Date().toLocaleDateString('fr-FR'), type: "AIDE", 
                nom: document.getElementById('nom').value, localisation: "Espace Cœur", 
                message: document.getElementById('msg').value 
            };
            fetch(URL_SERVEUR, { method: 'POST', mode: 'no-cors', body: JSON.stringify(d) })
            .then(() => { alert("Message déposé avec douceur."); location.reload(); });
        });

        fetch(URL_SERVEUR).then(r => r.json()).then(data => {
            const flux = document.getElementById('flux-aide');
            data.filter(i => i.type === "AIDE").reverse().forEach(i => {
                flux.innerHTML += `<div class="carte-aide"><b>${i.nom}</b> (${i.date})<br>"${i.message}"</div>`;
            });
        });
    </script>
</body>
</html>
