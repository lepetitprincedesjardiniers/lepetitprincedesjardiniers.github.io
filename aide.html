<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>AIDE & ÉCOUTE - Le Câlin de l'Âme</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; 
            background: radial-gradient(circle at center, #1a0a2e 0%, #000000 100%);
            color: #ffffff; overflow-x: hidden; min-height: 100vh;
        }

        /* MENU FIDÈLE */
        .menu-table { margin: 10px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; position: relative; z-index: 10; }
        .menu-table td { border: 1px solid #FFFFFF; transition: 0.3s; }
        .menu-table a { display: block; padding: 12px 20px; text-decoration: none; color: #FFFFFF; font-weight: bold; }

        .coeur { font-size: 80px; margin: 20px; animation: float 3s infinite ease-in-out; filter: drop-shadow(0 0 15px #9370DB); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* FORMULAIRE AIDE */
        .form-container { 
            background: #F3E5F5; border: 5px solid #9370DB; border-radius: 30px; 
            width: 90%; max-width: 600px; margin: 20px auto; padding: 25px; color: #4a148c;
        }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: 2px solid #9370DB; box-sizing: border-box; font-family: inherit; }
        .btn-envoi { background: #9370DB; color: white; border: none; padding: 18px; border-radius: 25px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1em; }

        /* LISTE DES ANNONCES */
        .liste-annonces { max-width: 700px; margin: 40px auto; padding: 20px; }
        .carte { background: white; border-left: 10px solid #9370DB; border-radius: 15px; padding: 20px; margin-bottom: 20px; text-align: left; color: #333; box-shadow: 0 4px 15px rgba(147,112,219,0.3); }
    </style>
</head>
<body>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impot.html">Impôts</a></td>
            <td><a href="regulation.html">Régulation</a></td>
            <td><a href="urgence.html">Urgences</a></td>
            <td><a href="aide.html">Aide</a></td>
        </tr>
    </table>

    <div class="coeur">💖</div>
    <h1>Aide & Écoute</h1>
    <p><i>Le Câlin de l'Âme.</i></p>

    <div class="form-container">
        <form id="aideForm">
            <input type="text" id="nomA" placeholder="Ton petit nom" required>
            <textarea id="msgA" rows="4" placeholder="Mon cœur est lourd, je cherche une oreille attentive..." required></textarea>
            <button type="submit" class="btn-envoi">DÉPOSER MON CŒUR 🕊️</button>
        </form>
    </div>

    <div class="liste-annonces">
        <h2 style="color: #9370DB;">🌸 Les Cœurs à Écouter</h2>
        <div id="flux-aide"><p>Appel de la douceur...</p></div>
    </div>

    <footer>
        <a href="transition-externe.html" style="color: rgba(255,255,255,0.4); text-decoration: none;">© 2000 le petit prince des jardiniers</a>
    </footer>

    <script>
        const URL = "https://script.google.com/macros/s/AKfycbz4ncs9qw_AfmKSER5QST-P0OeKQggQaq86QC6liS53uZ9sx4Lo_-4-h1knXKWqgQMc/exec";

        document.getElementById('aideForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "Le message s'envole..."; btn.disabled = true;
            const d = { date: new Date().toLocaleDateString('fr-FR'), type: "AIDE", nom: document.getElementById('nomA').value, localisation: "Espace Cœur", message: document.getElementById('msgA').value };
            fetch(URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(d) }).then(() => { alert("Message déposé avec douceur."); location.reload(); });
        });

        fetch(URL).then(r => r.json()).then(data => {
            const f = document.getElementById('flux-aide'); f.innerHTML = "";
            data.filter(i => i.type === "AIDE").reverse().forEach(i => {
                f.innerHTML += `<div class="carte"><small>${i.date}</small><br><b>${i.nom} :</b><p>"${i.message}"</p></div>`;
            });
        });
    </script>
</body>
</html>
