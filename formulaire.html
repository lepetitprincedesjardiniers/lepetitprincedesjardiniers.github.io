<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Semer un Don - Le Petit Prince des Jardiniers</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; background-color: #FFFF00; color: #000080; overflow-x: hidden; min-height: 100vh; }
        #google_translate_element { position: absolute; top: 5px; left: 5px; z-index: 1000; opacity: 0.7; transform: scale(0.8); }
        .menu-table { margin: 20px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; margin-left: auto; margin-right: auto;}
        .menu-table td { padding: 10px 15px; border: 1px solid #FFFFFF; transition: 0.3s; }
        .menu-table td:hover { background-color: #00b3b3; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; font-size: 0.9em; }
        .form-container { background: white; padding: 30px; border-radius: 20px; display: inline-block; margin-top: 10px; box-shadow: 0px 10px 20px rgba(0,0,0,0.1); width: 90%; max-width: 550px; margin-bottom: 180px; position: relative; z-index: 10; }
        .form-group { text-align: left; margin: 10px 20px; }
        label { font-weight: bold; color: #008080; display: block; margin-bottom: 5px; }
        .sous-label { font-size: 0.75em; color: #006666; margin-bottom: 5px; display: block; font-style: italic; }
        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #008080; border-radius: 10px; font-family: 'Comic Sans MS'; font-size: 1em; box-sizing: border-box; background-color: #fcfcfc; }
        .btn-envoyer { width: 100%; padding: 20px; background: #E67E22; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 1.1em; box-shadow: 0px 4px 0px #b35900; transition: 0.1s; }
        .btn-envoyer:active { transform: translateY(4px); box-shadow: 0px 0px 0px #b35900; }
        .section-logistique { border-top: 2px dashed #008080; margin-top: 20px; padding-top: 15px; background: #fff9f0; border-radius: 15px; }
        #sub_cat_group { background: #f0fdfa; padding: 10px; border-radius: 15px; border: 1px dashed #008080; margin-bottom: 15px; }
        .msg-alerte { color: #d32f2f; font-size: 0.8em; font-weight: bold; display: none; margin-bottom: 10px; }
        #animal-container { position: fixed; z-index: 900; white-space: nowrap; display: flex; align-items: center; pointer-events: none; }
        #corps-animal { font-size: 50px; }
        #bulle-texte { background: white; border-radius: 15px; padding: 8px 15px; font-style: italic; color: #2E7D32; border: 2px solid #2E7D32; opacity: 0; }
    </style>
</head>
<body>

    <div id="google_translate_element"></div>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impot.html">Trésor Public</a></td>
            <td><a href="regulation.html">Régulation</a></td>
            <td><a href="urgence.html">Urgences</a></td>
            <td><a href="aide.html">Aide</a></td>
            <td><a href="savoirs.html">Savoirs</a></td>
        </tr>
    </table>

    <h2 style="color:#E67E22;">🌟 Semer un Don Amoureux</h2>

    <div class="form-container">
        <form id="monFormulaire" onsubmit="envoyerDon(event)">

            <div class="form-group">
                <label>Identité de l'âme</label>
                <input type="text" name="nom" placeholder="Ton Prénom de coeur" required>
            </div>

            <div class="form-group">
                <label>Ta Terre d'Origine</label>
                <select name="pays_select" id="pays_select" onchange="gererPays('select')">
                    <option value="" selected>--- Choisir ton lieu 🌍 ---</option>
                    <optgroup label="✨ Dimensions Poétiques">
                        <option value="L'astéroïde B 612">L'astéroïde B 612</option>
                        <option value="Pays de la grande gentillesse">Pays de la grande gentillesse</option>
                    </optgroup>
                    <optgroup label="Continents">
                        <option value="Europe">Europe (France, Belgique, Suisse...)</option>
                        <option value="Afrique">Afrique (Maghreb, Afrique de l'Ouest...)</option>
                        <option value="Amériques">Amériques (Canada, Haïti, Sud...)</option>
                        <option value="Asie-Oceanie">Asie & Océanie</option>
                    </optgroup>
                </select>
                <input type="text" name="localisation" id="pays_libre" placeholder="Ou précise ton pays ici..." oninput="gererPays('libre')">
                <input type="text" name="ville" placeholder="Ville ou Village" required>
            </div>

            <div class="form-group">
                <label>Destination du semis (Rubrique)</label>
                <select name="type" id="main_cat" onchange="updateSubCats()" required>
                    <option value="">-- Vers quel jardin ? --</option>
                    <option value="IMPOT">📜 TRÉSOR PUBLIC (Don pour tous / Bien Commun)</option>
                    <option value="REGULATION">⚖️ RÉGULATION (Conflits, Justice, Équilibre)</option>
                    <option value="URGENCE">🚑 URGENCE & DÉTRESSE (Survie, Santé, Soutien)</option>
                    <option value="SAVOIR">💡 SAVOIR (Éducation, Transmission, Art)</option>
                </select>
            </div>

            <div id="sub_cat_group" class="form-group">
                <label>Précision de la situation</label>
                <select name="sousType" id="sub_cat">
                    <option value="">-- Choisis d'abord une rubrique --</option>
                </select>
                <div id="msgImpot" class="msg-alerte">NB: Ce don alimentera les projets collectifs visibles sur la page Trésor Public.</div>
            </div>

            <div class="form-group">
                <label>Rayon d'action du don</label>
                <select name="rayon" id="rayon_select" onchange="updateLogistique()">
                    <option value="Local">Local (Ma ville / 10km)</option>
                    <option value="National">National (Mon pays)</option>
                    <option value="International" selected>International (Monde Entier)</option>
                    <option value="Infini">Rayon Infini (Cosmique)</option>
                </select>
            </div>

            <div class="section-logistique">
                <div class="form-group">
                    <label>Acheminement du cadeau</label>
                    <span class="sous-label">Comment ton don voyage-t-il ?</span>
                    <select name="logistique" id="logistique_select">
                        <option value="Main à main">Main à main (Rencontre)</option>
                        <option value="Numérique">Numérique (Email, Code, Audio/Vidéo)</option>
                        <option value="Transporteur">Transporteur (Poste / Colis)</option>
                        <option value="Déplacement">Je me déplace pour l'offrir</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Durée de vie</label>
                    <select name="validite">
                        <option value="Ephémère">Éphémère (Besoin immédiat)</option>
                        <option value="1_mois" selected>Saisonnier (1 mois)</option>
                        <option value="Eternel">Éternel (Racines profondes)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Description du Don</label>
                <textarea name="message" rows="4" placeholder="Ex: Je propose 2h d'écoute, un sac de graines, ou la réparation d'un toit..." required></textarea>
            </div>

            <button type="submit" class="btn-envoyer" id="btnTexte">ENGENDRER LA FRATERNITÉ</button>
        </form>
    </div>

    <div id="animal-container"><div id="bulle-texte"></div><div id="corps-animal">🕊️</div></div>

    <script type="text/javascript">
        const tree = {
            "IMPOT": [
                "Entretien des chemins & routes", 
                "Création d'espaces verts communs", 
                "Matériel partagé (Outils, Livres)", 
                "Soutien financier au Trésor", 
                "Travaux d'utilité publique",
                "Organisation de fêtes de village"
            ],
            "REGULATION": [
                "Médiation entre voisins", 
                "Conseil juridique fraternel", 
                "Aide à la paperasse administrative", 
                "Réparation d'une injustice", 
                "Équilibre des ressources",
                "Écoute neutre pour conflit"
            ],
            "URGENCE": [
                "Aide alimentaire (Faim)", 
                "Hébergement temporaire (Toit)", 
                "Soin du corps (Santé)", 
                "Détresse psy (Écoute urgente)", 
                "Catastrophe naturelle",
                "Protection des plus faibles"
            ],
            "SAVOIR": [
                "Cours de cuisine / Pain", 
                "Apprentissage technique (Brico/Code)", 
                "Lecture & Écriture", 
                "Art, Musique & Poésie", 
                "Savoir jardiner / Nature",
                "Philosophie & Sagesse"
            ]
        };

        function updateSubCats() {
            const cat = document.getElementById('main_cat').value;
            const subSelect = document.getElementById('sub_cat');
            const msgImpot = document.getElementById('msgImpot');
            subSelect.innerHTML = "";
            if (cat && tree[cat]) {
                tree[cat].forEach(s => {
                    let opt = document.createElement('option');
                    opt.value = s; opt.text = s;
                    subSelect.appendChild(opt);
                });
                msgImpot.style.display = (cat === "IMPOT") ? "block" : "none";
            }
        }

        function updateLogistique() {
            const rayon = document.getElementById('rayon_select').value;
            const logSelect = document.getElementById('logistique_select');
            
            if (rayon === "International" || rayon === "Infini") {
                logSelect.innerHTML = `
                    <option value="Transfert Numérique">Transfert Numérique (Internet)</option>
                    <option value="Envoi Postal">Envoi Postal International</option>
                    <option value="Don de Savoir">Don Immatériel (Savoir/Conseil)</option>
                    <option value="Réseau de Fraternité">Via un relais local</option>
                `;
            } else {
                logSelect.innerHTML = `
                    <option value="Main à main">Main à main (Rencontre)</option>
                    <option value="Déplacement">Je me déplace</option>
                    <option value="A récupérer">À récupérer chez moi</option>
                `;
            }
        }

        function gererPays(source) {
            const select = document.getElementById('pays_select');
            const libre = document.getElementById('pays_libre');
            if (source === 'select' && select.value !== "") libre.value = "";
            else if (source === 'libre' && libre.value.trim() !== "") select.selectedIndex = 0;
        }

        function envoyerDon(event) {
            event.preventDefault();
            const btn = document.getElementById('btnTexte');
            btn.innerText = "Semailles en cours... 🌱";
            const data = new FormData(document.getElementById('monFormulaire'));
            fetch("https://script.google.com/macros/s/AKfycbxz40XE2KiPXTNZsW-mIg-fm55EivK0r9wzZ5ECFRdEIY53nYH9nLGYRoI71OX93oII/exec", 
            { method: 'POST', mode: 'no-cors', body: data })
            .then(() => { window.location.href = "merci_annonce.html"; })
            .catch(() => { window.location.href = "merci_annonce.html"; });
        }

        // Animation Oiseau
        let aniX = -200;
        function loop() {
            aniX += 2;
            if (aniX > window.innerWidth + 200) aniX = -200;
            const ani = document.getElementById('animal-container');
            ani.style.left = aniX + "px";
            ani.style.bottom = "50px";
            requestAnimationFrame(loop);
        }
        loop();
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
