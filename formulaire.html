<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Semer un Don - Le Petit Prince des Jardiniers</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; background-color: #FFFF00; color: #000080; overflow-x: hidden; min-height: 100vh; }
        #google_translate_element { position: absolute; top: 5px; left: 5px; z-index: 1000; opacity: 0.7; transform: scale(0.8); }
        
        .menu-table { margin: 20px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; }
        .menu-table td { padding: 10px 15px; border: 1px solid #FFFFFF; transition: 0.3s; }
        .menu-table td:hover { background-color: #00b3b3; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; font-size: 0.9em; }

        .form-container { background: white; padding: 30px; border-radius: 20px; display: inline-block; margin-top: 10px; box-shadow: 0px 10px 20px rgba(0,0,0,0.1); width: 90%; max-width: 600px; margin-bottom: 180px; position: relative; z-index: 10; }
        .form-group { text-align: left; margin: 10px 20px; }
        label { font-weight: bold; color: #008080; display: block; margin-bottom: 5px; }
        .sous-label { font-size: 0.75em; color: #006666; margin-bottom: 5px; display: block; font-style: italic; }
        
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #008080; border-radius: 10px; font-family: 'Comic Sans MS'; }
        textarea { width: 100%; padding: 12px; border: 2px solid #008080; border-radius: 10px; font-family: 'Comic Sans MS'; min-height: 180px; resize: vertical; }

        .btn-envoyer { width: 100%; padding: 20px; background: #E67E22; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 1.1em; box-shadow: 0px 4px 0px #b35900; transition: 0.1s; }
        .btn-envoyer:active { transform: translateY(4px); box-shadow: 0px 0px 0px #b35900; }

        /* --- Style du Copyright & Explosion --- */
        footer { margin: 40px 0 20px 0; }
        .copyright-link { 
            color: #008080; text-decoration: none; font-weight: bold; padding: 12px; border-radius: 10px; 
            transition: all 0.3s; cursor: pointer; display: inline-block; position: relative;
        }
        .copyright-link:hover { background: #008080; color: #FFFF00; box-shadow: 0 0 15px #008080; transform: scale(1.1); }
        .star { position: absolute; pointer-events: none; color: #E67E22; font-size: 20px; z-index: 1000; }

        #coffre-magique { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 60px; z-index: 800; transition: transform 0.3s; }
        #animal-container { position: fixed; z-index: 900; display: flex; align-items: center; pointer-events: none; }
        #bulle-texte { background: white; border-radius: 15px; padding: 8px 15px; font-style: italic; color: #2E7D32; border: 2px solid #2E7D32; opacity: 0; }
        .pop { transform: translateX(-50%) scale(1.4) !important; }
    </style>
</head>
<body>

    <div id="google_translate_element"></div>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impot.html">Impôts Publics</a></td>
            <td><a href="regulation.html">Régulation</a></td>
            <td><a href="aide.html">Aide & Urgences</a></td>
            <td><a href="savoirs.html">Savoirs</a></td>
        </tr>
    </table>

    <h2 style="color:#E67E22;">🌟 Semer un Don - Le Petit Prince des Jardiniers</h2>

    <div class="form-container">
        <form id="monFormulaire" onsubmit="envoyerDon(event)">
            <div class="form-group">
                <label>Identité amoureuse</label>
                <input type="text" name="nom" placeholder="Ton Prénom de coeur" required>
            </div>

            <div class="form-group">
                <label>Provenance</label>
                <select name="pays_select" id="pays_select" onchange="gererPays('select')">
                    <option value="" selected>--- Choisir ton Pays 🌍 ---</option>
                    <optgroup label="Europe">
                        <option value="France">France</option><option value="Belgique">Belgique</option><option value="Suisse">Suisse</option>
                    </optgroup>
                    <option value="Pays de la grande gentillesse">✨ Pays de la grande gentillesse</option>
                </select>
                <input type="text" name="localisation" id="pays_libre" placeholder="Ou tape ton pays ici..." oninput="gererPays('libre')">
            </div>

            <div class="form-group">
                <label>Destination du semis</label>
                <select name="type" id="main_cat" onchange="updateSubCats()" required>
                    <option value="">-- Quel Jardin ? --</option>
                    <option value="AIDE">💖 AIDE & URGENCES (Cœur, Santé, Matière)</option>
                    <option value="SAVOIR">💡 SAVOIR (Transmission)</option>
                    <option value="REGULATION">⚖️ RÉGULATION (Équilibre)</option>
                    <option value="IMPOT">📜 TRÉSOR PUBLIC (Travaux)</option>
                </select>
            </div>

            <div id="sub_cat_group" class="form-group" style="display:none;">
                <label>Précision</label>
                <select name="sousType" id="sub_cat"></select>
            </div>

            <div class="form-group">
                <label>Acheminement & Logistique</label>
                <select name="logistique" required>
                    <option value="">-- Comment ça arrive ? --</option>
                    <optgroup label="🤝 Proximité (Prioritaire)">
                        <option value="Rencontre">Remise en main propre (Lieu public)</option>
                        <option value="Don Entier">J'assure le transport entièrement</option>
                        <option value="À récupérer">À récupérer chez moi (Le bénéficiaire vient)</option>
                    </optgroup>
                    <optgroup label="🚚 National & Route">
                        <option value="Relais">Point Relais (Simple & Rapide)</option>
                        <option value="Poste">La Poste / Courrier</option>
                        <option value="Covoit">Colis-voiturage (Covoiturage de colis)</option>
                        <option value="Transporteur">Transporteur Routier (Camion)</option>
                    </optgroup>
                    <optgroup label="✈️ Grand Large (International)">
                        <option value="Avion">Fret Aérien</option>
                        <option value="Bateau">Fret Maritime</option>
                        <option value="Rail">Fret Ferroviaire (Train)</option>
                    </optgroup>
                    <optgroup label="🚀 Immatériel">
                        <option value="Numérique">Transfert Web / E-mail</option>
                        <option value="Pensée">Ondes de fraternité</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label>Description du Don amoureux</label>
                <textarea name="message" placeholder="Ouvre ton cœur ici... Décris ton don en détails." required></textarea>
            </div>

            <button type="submit" class="btn-envoyer" id="btnTexte">ENGENDRER DE LA FRATERNITÉ UNIVERSELLE</button>
        </form>
    </div>

    <footer>
        <div id="copyright-container">
            <span class="copyright-link" onclick="exploserEtPartir(event)">© 2000 Le petit prince des jardiniers</span>
        </div>
    </footer>

    <div id="coffre-magique">🎁</div>
    <div id="animal-container"><div id="bulle-texte"></div><div id="corps-animal">🕊️</div></div>

    <script>
        function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element'); }

        const tree = {
            "AIDE": ["🚑 URGENCE VITALE", "Matière (Faim/Toit)", "Santé (Corps)", "Câlin de l'âme", "Besoin de parler"],
            "SAVOIR": ["Technique (Code/Brico)", "Nature (Jardin/Pain)", "Esprit (Arts/Philo)"],
            "REGULATION": ["Médiation de conflits", "Aide au Droit", "Gestion de l'équilibre"],
            "IMPOT": ["Voirie/Routes", "Entretien Nature", "Soutien Technique"]
        };

        function updateSubCats() {
            const cat = document.getElementById('main_cat').value;
            const subGroup = document.getElementById('sub_cat_group');
            const subSelect = document.getElementById('sub_cat');
            if (cat && tree[cat]) {
                subSelect.innerHTML = tree[cat].map(s => `<option value="${s}">${s}</option>`).join('');
                subGroup.style.display = 'block';
            } else { subGroup.style.display = 'none'; }
        }

        function gererPays(source) {
            const select = document.getElementById('pays_select');
            const libre = document.getElementById('pays_libre');
            if (source === 'select') libre.value = ""; else select.selectedIndex = 0;
        }

        // --- EFFET EXPLOSION D'ÉTOILES ---
        function exploserEtPartir(e) {
            for (let i = 0; i < 15; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.innerHTML = '⭐';
                star.style.left = e.pageX + 'px';
                star.style.top = e.pageY + 'px';
                document.body.appendChild(star);
                
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 100 + 50;
                
                star.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0)`, opacity: 0 }
                ], { duration: 800, easing: 'ease-out' });
                
                setTimeout(() => star.remove(), 800);
            }
            setTimeout(() => { window.location.href = "transition_externe.html"; }, 600);
        }

        function envoyerDon(event) {
            event.preventDefault();
            document.getElementById('btnTexte').innerText = "Semailles en cours... 🌱";
            setTimeout(() => { window.location.href = "merci_annonce.html"; }, 1500);
        }

        // Animation de l'oiseau (simplifiée pour l'exemple)
        const animalCont = document.getElementById('animal-container');
        let x = -100;
        function fly() {
            x += 2;
            animalCont.style.left = x + 'px';
            animalCont.style.top = (200 + Math.sin(x/50)*50) + 'px';
            if (x > window.innerWidth) x = -100;
            requestAnimationFrame(fly);
        }
        fly();
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
