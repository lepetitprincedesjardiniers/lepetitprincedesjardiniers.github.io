<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Semer un Don - Le Petit Prince des Jardiniers</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; background-color: #FFFF00; color: #000080; overflow-x: hidden; min-height: 100vh; }
        #google_translate_element { position: absolute; top: 5px; left: 5px; z-index: 1000; opacity: 0.7; transform: scale(0.8); }
        
        .menu-table { margin: 20px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; margin-left: auto; margin-right: auto;}
        .menu-table td { padding: 10px 15px; border: 1px solid #FFFFFF; transition: 0.3s; }
        .menu-table td:hover { background-color: #00b3b3; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; font-size: 0.85em; }

        .form-container { background: white; padding: 30px; border-radius: 20px; display: inline-block; margin-top: 10px; box-shadow: 0px 10px 20px rgba(0,0,0,0.1); width: 95%; max-width: 750px; margin-bottom: 180px; position: relative; z-index: 10; }
        .form-group { text-align: left; margin: 15px 20px; }
        label { font-weight: bold; color: #008080; display: block; margin-bottom: 5px; }
        .sous-label { font-size: 0.75em; color: #006666; margin-bottom: 5px; display: block; font-style: italic; }
        
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #008080; border-radius: 10px; font-family: 'Comic Sans MS'; font-size: 1em; box-sizing: border-box; }
        textarea { min-height: 280px; resize: vertical; background-color: #fffdf0; }

        .btn-envoyer { width: 100%; padding: 25px; background: #E67E22; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 1.2em; box-shadow: 0px 4px 0px #b35900; }
        .btn-envoyer:active { transform: translateY(4px); box-shadow: 0px 0px 0px #b35900; }

        footer { margin: 40px 0 80px 0; }
        .copyright-link { color: #008080; text-decoration: none; font-weight: bold; transition: 0.3s; padding: 10px; cursor: pointer; display: inline-block; position: relative; }
        .star { position: absolute; pointer-events: none; color: #FFD700; font-size: 24px; z-index: 9999; }

        #coffre-magique { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 60px; z-index: 800; transition: 0.3s; }
        #animal-container { position: fixed; z-index: 900; display: flex; align-items: center; pointer-events: none; }
        #bulle-texte { background: white; border-radius: 15px; padding: 8px 15px; font-style: italic; color: #2E7D32; border: 2px solid #2E7D32; opacity: 0; transition: 0.3s; font-weight: bold; }
        .pop { transform: translateX(-50%) scale(1.4) !important; }
    </style>
</head>
<body>

    <audio id="chantOiseaux" loop><source src="oiseaux.mp3" type="audio/mpeg"></audio>
    <div id="google_translate_element"></div>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impot.html">Impôts Publics</a></td>
            <td><a href="regulation.html">Régulation</a></td>
            <td><a href="aide.html">Aide & Harmonie</a></td>
            <td><a href="savoirs.html">Savoirs</a></td>
            <td><a href="vie.html">Vie Citoyenne</a></td>
        </tr>
    </table>

    <h2 style="color:#E67E22;">🌍 Engendrer la Fraternité Universelle</h2>

    <div class="form-container">
        <form id="monFormulaire" onsubmit="envoyerDon(event)">
            
            <div class="form-group">
                <label>Identité amoureuse</label>
                <input type="text" name="nom" placeholder="Ton Prénom de coeur / Pseudo" required>
            </div>

            <div class="form-group">
                <label>Zone Géographique & Rayon d'action</label>
                <span class="sous-label">Où la graine doit-elle pousser ?</span>
                <div style="display: flex; gap: 10px;">
                    <select name="pays_select" id="pays_select" onchange="gererPays('select')" style="flex: 1;">
                        <option value="" selected>-- Pays --</option>
                        <option value="France">France</option><option value="Belgique">Belgique</option><option value="Suisse">Suisse</option><option value="Canada">Canada</option>
                        <option value="B612">L'astéroïde B 612</option>
                    </select>
                    <select name="rayon" style="flex: 1;">
                        <option value="0">Rayon : Sur place uniquement</option>
                        <option value="10">Rayon : 10 km</option>
                        <option value="50">Rayon : 50 km</option>
                        <option value="100">Rayon : 100 km</option>
                        <option value="National">Rayon : National</option>
                        <option value="Monde">Rayon : Monde Entier (Numérique)</option>
                    </select>
                </div>
                <input type="text" name="localisation" id="pays_libre" placeholder="Ville, Code Postal ou Quartier précis..." oninput="gererPays('libre')" required>
            </div>

            <div class="form-group">
                <label>Domaine du Don</label>
                <select name="type" id="main_cat" onchange="updateSubCats()" required>
                    <option value="">-- Que souhaites-tu offrir ? --</option>
                    <option value="SAVOIR">💡 SAVOIRS (Apprendre, Transmettre, Perfectionner)</option>
                    <option value="VIE">🏠 VIE CITOYENNE (Espaces, Partages, Mobilité)</option>
                    <option value="AIDE">💖 AIDE & HARMONIE (Santé, Écoute, Matière)</option>
                    <option value="REGULATION">⚖️ RÉGULATION (Équilibre, Médiation, Aide Vie)</option>
                    <option value="IMPOT">📜 TRÉSOR PUBLIC (Travaux, Bien Commun)</option>
                </select>
            </div>

            <div id="sub_cat_group" class="form-group" style="display:none;">
                <label>Nature précise</label>
                <select name="sousType" id="sub_cat"></select>
            </div>

            <div class="form-group">
                <label>Durée de validité de l'annonce</label>
                <span class="sous-label">L'annonce s'effacera automatiquement après ce délai</span>
                <select name="duree_validite" required>
                    <option value="1">1 Jour (Urgence immédiate)</option>
                    <option value="7">1 Semaine</option>
                    <option value="30" selected>1 Mois (Standard)</option>
                    <option value="90">3 Mois (Savoirs / Transmission)</option>
                    <option value="365">1 An (Projet long terme)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Logistique & Acheminement</label>
                <select name="logistique" required>
                    <optgroup label="🤝 Proximité">
                        <option value="Direct">Main à main / Rencontre</option>
                        <option value="Accueil">Je reçois chez moi</option>
                        <option value="Voyage">Je me déplace chez toi</option>
                    </optgroup>
                    <optgroup label="🚚 Distance">
                        <option value="Relais">Envoi (Relais/Poste)</option>
                        <option value="Numérique">À distance (Visio/Web/Téléphone)</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label>Description du Don (Ton message au monde)</label>
                <textarea name="message" placeholder="Décris ici ton don avec précision. 
Exemple Savoir : 'Je transmets mon expérience de 20 ans en menuiserie, tous niveaux.'
Exemple Vie : 'Je prête mon garage pour de l'auto-réparation le samedi.'" required></textarea>
            </div>

            <button type="submit" class="btn-envoyer" id="btnTexte">SEMER CETTE GRAINE DE FRATERNITÉ</button>
        </form>
    </div>

    <footer>
        <span class="copyright-link" onclick="exploserEtoiles(event)">© 2000 Le petit prince des jardiniers</span>
    </footer>

    <div id="coffre-magique">🎁</div>
    <div id="animal-container"><div id="bulle-texte"></div><div id="corps-animal">🕊️</div></div>

    <script>
        function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element'); }

        const tree = {
            "SAVOIR": [
                "🌱 Éveil & Soutien Scolaire (Tous âges)",
                "💼 Transmission d'expérience métier (Mentorat)",
                "🚀 Perfectionnement expert (Tech, Science, Artisanat)",
                "🎨 Arts & Loisirs créatifs (Musique, Dessin, Cuisine)",
                "🧠 Savoirs de vie & Philosophie (Sagesse, Expérience)",
                "💻 Numérique & IA (Apprendre l'outil moderne)"
            ],
            "VIE": [
                "🏠 Accueil & Hébergement (Chambre d'amis, Urgence)",
                "🛠️ Prêt d'espaces (Atelier, Jardin, Stockage)",
                "🚗 Mobilité & Transport (Covoiturage humain, Prêt vélo)",
                "🎉 Culture & Loisirs (Organisation de sorties, Fêtes)",
                "🧹 Aide à la vie quotidienne (Courses, Bricolage)"
            ],
            "AIDE": [
                "🚑 URGENCE VITALE (Alimentaire, Toit immédiat)",
                "🏥 Santé & Soins (Soin du corps, Hygiène)",
                "🌈 Harmonie & Écoute (Psy, Soutien moral, Bien-être)",
                "🤝 Présence & Visites (Lutter contre la solitude)"
            ],
            "REGULATION": [
                "🕊️ Médiation de vie (Conflits de voisinage/famille)",
                "⚖️ Aide aux épreuves (Conseils administratifs et humains)",
                "🌍 Équilibre & Orientation (Aide aux choix de vie)"
            ],
            "IMPOT": [
                "🏗️ Chantier Commun (Entretien des biens publics)",
                "🌲 Environnement (Protection de la nature locale)",
                "⚙️ Maintenance Technique (Outils et réseaux partagés)"
            ]
        };

        function updateSubCats() {
            const cat = document.getElementById('main_cat').value;
            const subGroup = document.getElementById('sub_cat_group');
            const subSelect = document.getElementById('sub_cat');
            if (cat && tree[cat]) {
                subSelect.innerHTML = tree[cat].map(s => `<option value="${s}">${s}</option>`).join('');
                subGroup.style.display = 'block';
            } else { subGroup.style.display = 'none'; }
        }

        function gererPays(source) {
            const select = document.getElementById('pays_select');
            const libre = document.getElementById('pays_libre');
            if (source === 'select' && select.value !== "") select.value = select.value;
            else if (source === 'libre' && libre.value.trim() !== "") { /* On garde les deux si besoin */ }
        }

        function exploserEtoiles(e) {
            for (let i = 0; i < 25; i++) {
                const star = document.createElement('div');
                star.className = 'star'; star.innerHTML = '⭐';
                star.style.left = e.pageX + 'px'; star.style.top = e.pageY + 'px';
                document.body.appendChild(star);
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 160 + 40;
                star.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0) rotate(360deg)`, opacity: 0 }
                ], { duration: 1000 });
                setTimeout(() => star.remove(), 1000);
            }
            setTimeout(() => { window.location.href = "transition_externe.html"; }, 800);
        }

        function envoyerDon(event) {
            event.preventDefault();
            document.getElementById('btnTexte').innerText = "Semailles en cours... 🌱";
            const data = new FormData(document.getElementById('monFormulaire'));
            fetch("https://script.google.com/macros/s/AKfycbxz40XE2KiPXTNZsW-mIg-fm55EivK0r9wzZ5ECFRdEIY53nYH9nLGYRoI71OX93oII/exec", { method: 'POST', mode: 'no-cors', body: data })
            .then(() => { window.location.href = "merci_annonce.html"; })
            .catch(() => { window.location.href = "merci_annonce.html"; });
        }

        // --- Animations Messagers ---
        const phrases = ["Graine de savoir semée...", "Le jardin s'agrandit !", "Merci pour cette fraternité.", "La solidarité est en route..."];
        const animaux = ['🕊️', '🦋', '🐝', '🦜'];
        const animalCont = document.getElementById('animal-container');
        const bulle = document.getElementById('bulle-texte');
        const corps = document.getElementById('corps-animal');
        const coffre = document.getElementById('coffre-magique');
        let aniX = -200, aniY = 250, targetX, state = "FLY";

        function messenger() {
            if (state === "FLY") {
                aniX += 2.5;
                if (Math.abs(aniX - window.innerWidth/2) < 5) {
                    state = "TALK";
                    bulle.innerText = phrases[Math.floor(Math.random()*phrases.length)];
                    bulle.style.opacity = 1;
                    coffre.classList.add('pop');
                    setTimeout(() => { bulle.style.opacity = 0; coffre.classList.remove('pop'); state = "EXIT"; }, 3000);
                }
            } else if (state === "EXIT") {
                aniX += 3;
                if (aniX > window.innerWidth + 200) {
                    aniX = -200; 
                    corps.innerText = animaux[Math.floor(Math.random()*animaux.length)];
                    state = "FLY";
                }
            }
            animalCont.style.left = aniX + 'px';
            animalCont.style.top = (aniY + Math.sin(aniX/60)*30) + 'px';
            requestAnimationFrame(messenger);
        }

        document.addEventListener('click', () => { 
            const a = document.getElementById('chantOiseaux');
            if(a.paused) { a.volume = 0.05; a.play(); }
        });

        messenger();
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
