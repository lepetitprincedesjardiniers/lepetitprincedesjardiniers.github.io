<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Semer un Don - Le Petit Prince des Jardiniers</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; background-color: #FFFF00; color: #000080; overflow-x: hidden; min-height: 100vh; }
        #google_translate_element { position: absolute; top: 5px; left: 5px; z-index: 1000; opacity: 0.7; transform: scale(0.8); }
        
        .menu-table { margin: 20px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; margin-left: auto; margin-right: auto;}
        .menu-table td { padding: 10px 15px; border: 1px solid #FFFFFF; transition: 0.3s; }
        .menu-table td:hover { background-color: #00b3b3; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; font-size: 0.85em; }

        .form-container { background: white; padding: 30px; border-radius: 20px; display: inline-block; margin-top: 10px; box-shadow: 0px 10px 20px rgba(0,0,0,0.1); width: 95%; max-width: 800px; margin-bottom: 180px; position: relative; z-index: 10; }
        .form-group { text-align: left; margin: 15px 20px; }
        label { font-weight: bold; color: #008080; display: block; margin-bottom: 5px; }
        .sous-label { font-size: 0.75em; color: #006666; margin-bottom: 5px; display: block; font-style: italic; }
        
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #008080; border-radius: 10px; font-family: 'Comic Sans MS'; font-size: 1em; box-sizing: border-box; }
        textarea { min-height: 250px; resize: vertical; background-color: #fffdf0; }

        .extra-field { display: none; animation: fadeIn 0.5s; background: #f0fdf4; padding: 10px; border-radius: 10px; margin-top: -5px; margin-bottom: 10px; border: 1px dashed #008080; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .btn-envoyer { width: 100%; padding: 25px; background: #E67E22; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 1.2em; box-shadow: 0px 4px 0px #b35900; transition: 0.2s; }
        .btn-envoyer:active { transform: translateY(4px); box-shadow: 0px 0px 0px #b35900; }

        footer { margin: 40px 0 80px 0; }
        .copyright-link { color: #008080; text-decoration: none; font-weight: bold; transition: 0.3s; padding: 10px; cursor: pointer; display: inline-block; position: relative; z-index: 20; }
        
        .particle { position: absolute; pointer-events: none; z-index: 9999; }

        #coffre-magique { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 60px; z-index: 800; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; }
        #animal-container { position: fixed; z-index: 900; display: flex; align-items: center; cursor: pointer; pointer-events: auto; }
        #bulle-texte { background: white; border-radius: 15px; padding: 8px 15px; font-style: italic; color: #2E7D32; border: 2px solid #2E7D32; opacity: 0; transition: 0.3s; font-weight: bold; white-space: nowrap; margin-right: 10px; }
        #corps-animal { font-size: 40px; transition: transform 0.2s; }
        .pop { transform: translateX(-50%) scale(1.4) !important; }
        .cadeau-envole { transform: translateX(-50%) translateY(-100vh) rotate(360deg) scale(0) !important; opacity: 0; }
    </style>
</head>
<body onclick="activerAudio()">

    <audio id="chantOiseaux" loop><source src="oiseaux.mp3" type="audio/mpeg"></audio>
    <div id="google_translate_element"></div>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impot.html">Impôts Publics</a></td>
            <td><a href="regulation.html">Régulation</a></td>
            <td><a href="aide.html">Aide & Harmonie</a></td>
            <td><a href="savoirs.html">Savoirs</a></td>
            <td><a href="vie.html">Vie Citoyenne</a></td>
        </tr>
    </table>

    <h2 style="color:#E67E22;">🌍 Engendrer la Fraternité Universelle</h2>

    <div class="form-container">
        <form id="monFormulaire" onsubmit="envoyerDon(event)">
            
            <div class="form-group">
                <label>Identité amoureuse</label>
                <input type="text" name="nom" placeholder="Ton Prénom de coeur / Pseudo" required>
            </div>

            <div class="form-group">
                <label>Provenance & Territoire</label>
                <div style="display: flex; gap: 10px; margin-bottom: 5px;">
                    <select name="pays_select" id="pays_select" onchange="checkOther(this, 'extra_pays')" style="flex: 1.5;">
                        <option value="" selected>-- Pays / Royaume --</option>
                        <optgroup label="✨ Territoires de l'Imaginaire">
                            <option value="B612">L'astéroïde B 612</option>
                            <option value="Merveilles">Le Pays des Merveilles</option>
                            <option value="Utopie">L'Archipel d'Utopie</option>
                            <option value="Gentillesse">Pays de la grande gentillesse</option>
                            <option value="AUTRE_PAYS">☁️ Autre lieu imaginaire...</option>
                        </optgroup>
                        <optgroup label="🌍 Europe">
                            <option value="France">France (et Outre-mer)</option><option value="Belgique">Belgique</option><option value="Suisse">Suisse</option><option value="AUTRE_PAYS">Autre pays Europe...</option>
                        </optgroup>
                        <optgroup label="🌍 Afrique">
                            <option value="Maroc">Maroc</option><option value="Algérie">Algérie</option><option value="Sénégal">Sénégal</option><option value="AUTRE_PAYS">Autre pays Afrique...</option>
                        </optgroup>
                        <optgroup label="🌍 Amériques">
                            <option value="Canada">Canada / Québec</option><option value="Haiti">Haïti</option><option value="USA">États-Unis</option><option value="AUTRE_PAYS">Autre pays Amérique...</option>
                        </optgroup>
                        <option value="AUTRE_PAYS">🌐 Un pays non listé...</option>
                    </select>
                    <select name="rayon" style="flex: 1;">
                        <option value="0">Sur place</option>
                        <option value="10">Rayon 10 km</option>
                        <option value="50">Rayon 50 km</option>
                        <option value="National">National</option>
                        <option value="Univers">Universel (Web)</option>
                    </select>
                </div>
                <div id="extra_pays" class="extra-field">
                    <input type="text" name="pays_precision" placeholder="Nom de ton pays secret ou oublié...">
                </div>
                <input type="text" name="localisation" placeholder="Ville, Code Postal ou Quartier précis..." required>
            </div>

            <div class="form-group">
                <label>Destination du semis</label>
                <select name="type" id="main_cat" onchange="updateSubCats()" required>
                    <option value="">-- Domaine d'action --</option>
                    <option value="SAVOIR">💡 SAVOIRS (Scolaire, Pro, Mentorat, Arts)</option>
                    <option value="VIE">🏠 VIE CITOYENNE (Hébergement, Espace, Mobilité)</option>
                    <option value="AIDE">💖 AIDE & HARMONIE (Santé, Urgence, Écoute)</option>
                    <option value="REGULATION">⚖️ RÉGULATION (Médiation, Aide Administrative)</option>
                    <option value="IMPOT">📜 TRÉSOR PUBLIC (Chantiers, Bien Commun)</option>
                    <option value="AUTRE_CAT">🌈 AUTRE DOMAINE...</option>
                </select>
                <div id="extra_cat" class="extra-field">
                    <input type="text" name="cat_precision" placeholder="Précisez ce nouveau domaine...">
                </div>
            </div>

            <div id="sub_cat_group" class="form-group" style="display:none;">
                <label>Précision de la graine</label>
                <select name="sousType" id="sub_cat" onchange="checkOther(this, 'extra_sub')"></select>
                <div id="extra_sub" class="extra-field">
                    <input type="text" name="sub_precision" placeholder="Décrivez votre spécialité précise...">
                </div>
            </div>

            <div class="form-group">
                <label>Cycle de Vie (Durée de validité)</label>
                <span class="sous-label">Note poétique pour l'automate de gestion</span>
                <select name="duree_validite" required>
                    <option value="1">🌱 Un brin d'herbe (1 jour - Urgence)</option>
                    <option value="7">🌿 Une petite fleur (1 semaine)</option>
                    <option value="30" selected>🌳 Un buisson (1 mois - Standard)</option>
                    <option value="90">🌲 Un jeune arbre (3 mois)</option>
                    <option value="365">🍃 Un chêne séculaire (1 an - Transmission)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Logistique & Acheminement</label>
                <span class="sous-label">Comment le don voyage-t-il ?</span>
                <select name="logistique" required>
                    <optgroup label="🤝 Proximité / Humain">
                        <option value="Main Propre">Remise en main propre (Lieu public)</option>
                        <option value="Moi-même">J'assure le transport moi-même</option>
                        <option value="Récupérer">À récupérer sur place</option>
                        <option value="Covoit">Covoiturage humain (Je t'emmène)</option>
                    </optgroup>
                    <optgroup label="🚚 Route & National">
                        <option value="Relais">Point Relais (Mondial Relay / Colis Privé)</option>
                        <option value="Poste">La Poste / Courrier</option>
                        <option value="Colis-voiturage">Colis-voiturage (Via un voyageur)</option>
                        <option value="Transporteur">Transporteur Routier (Fret camion)</option>
                    </optgroup>
                    <optgroup label="✈️ Grand Large & Rail">
                        <option value="Avion">Fret Aérien (International)</option>
                        <option value="Bateau">Fret Maritime (Conteneur / Bateau)</option>
                        <option value="Train">Fret Ferroviaire (Rail)</option>
                    </optgroup>
                    <optgroup label="🚀 Immatériel">
                        <option value="Numérique">Transfert Numérique / Visio</option>
                        <option value="Pensée">Ondes de fraternité</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label>Description du Don amoureux</label>
                <textarea name="message" placeholder="Ouvre ton cœur... Détaille ton don ou ton besoin." required></textarea>
            </div>

            <button type="submit" class="btn-envoyer" id="btnTexte">ENGENDRER LA FRATERNITÉ UNIVERSELLE</button>
        </form>
    </div>

    <footer>
        <span class="copyright-link" onclick="exploserEtoiles(event)">© 2000 Le petit prince des jardiniers</span>
    </footer>

    <div id="coffre-magique">🎁</div>
    <div id="animal-container" onclick="animationSpeciale()">
        <div id="bulle-texte"></div>
        <div id="corps-animal">🕊️</div>
    </div>

    <script>
        function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element'); }

        const tree = {
            "SAVOIR": ["🌱 Éveil & Soutien Scolaire", "🎓 Études Supérieures", "💼 Mentorat Professionnel", "🎨 Arts, Musique & Cuisine", "AUTRE_SUB"],
            "VIE": ["🏠 Accueil & Hébergement", "🛠️ Prêt d'espaces (Atelier, Jardin)", "🚗 Mobilité & Aide au transport", "🧹 Aide au quotidien", "AUTRE_SUB"],
            "AIDE": ["🚑 URGENCE VITALE", "🏥 Santé & Soins", "🌈 Harmonie & Écoute", "🤝 Présence contre la solitude", "AUTRE_SUB"],
            "REGULATION": ["🕊️ Médiation & Conflits", "⚖️ Aide Administrative", "AUTRE_SUB"],
            "IMPOT": ["🏗️ Travaux de Bien Commun", "🌲 Protection de la Nature", "AUTRE_SUB"]
        };

        function updateSubCats() {
            const cat = document.getElementById('main_cat').value;
            const subGroup = document.getElementById('sub_cat_group');
            const subSelect = document.getElementById('sub_cat');
            document.getElementById('extra_cat').style.display = (cat === "AUTRE_CAT") ? "block" : "none";
            if (cat && tree[cat]) {
                subSelect.innerHTML = tree[cat].map(s => `<option value="${s}">${s === 'AUTRE_SUB' ? '🌈 Autre précision...' : s}</option>`).join('');
                subGroup.style.display = 'block';
            } else { subGroup.style.display = 'none'; }
        }

        function checkOther(select, divId) {
            const extraDiv = document.getElementById(divId);
            if (select.value.includes("AUTRE")) { extraDiv.style.display = "block"; extraDiv.querySelector('input').focus(); }
            else { extraDiv.style.display = "none"; }
        }

        // --- MAGIE & EFFETS ---
        function exploserParticules(x, y, emojis, count = 20) {
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                p.style.left = x + 'px'; p.style.top = y + 'px';
                p.style.fontSize = (Math.random() * 20 + 10) + 'px';
                document.body.appendChild(p);
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 200 + 50;
                p.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0) rotate(360deg)`, opacity: 0 }
                ], { duration: 1500, easing: 'ease-out' });
                setTimeout(() => p.remove(), 1500);
            }
        }

        function exploserEtoiles(e) {
            exploserParticules(e.pageX, e.pageY, ['⭐', '✨', '🌟']);
            setTimeout(() => { window.location.href = "transition_externe.html"; }, 1000);
        }

        const phrases = ["Graine de bonheur !", "La fraternité arrive !", "Un don précieux !", "Toc toc ! Cadeau !"];
        const animaux = ['🕊️', '🦋', '🐝', '🐞', '🦜'];
        const animalCont = document.getElementById('animal-container');
        const bulle = document.getElementById('bulle-texte');
        const corps = document.getElementById('corps-animal');
        const coffre = document.getElementById('coffre-magique');
        let aniX = -200, state = "FLY", targetY = 250;

        function animationSpeciale() {
            if (state === "FLY" || state === "TALK") {
                state = "MAGIC";
                bulle.innerText = "Pour toi ! ✨";
                bulle.style.opacity = 1;
                // L'oiseau descend vers le cadeau
                targetY = window.innerHeight - 100;
                setTimeout(() => {
                    exploserParticules(window.innerWidth/2, window.innerHeight - 50, ['🌸', '🌺', '🌼', '✨', '💝'], 40);
                    coffre.classList.add('cadeau-envole');
                    setTimeout(() => {
                        coffre.classList.remove('cadeau-envole');
                        state = "EXIT";
                        targetY = 250;
                    }, 2000);
                }, 1000);
            }
        }

        function messenger() {
            if (state === "FLY") {
                aniX += 2;
                if (Math.abs(aniX - window.innerWidth/2) < 5) {
                    state = "TALK";
                    bulle.innerText = phrases[Math.floor(Math.random()*phrases.length)];
                    bulle.style.opacity = 1;
                    coffre.classList.add('pop');
                    setTimeout(() => { if(state === "TALK") { bulle.style.opacity = 0; coffre.classList.remove('pop'); state = "EXIT"; } }, 3000);
                }
            } else if (state === "EXIT") {
                aniX += 3;
                if (aniX > window.innerWidth + 200) {
                    aniX = -200; 
                    corps.innerText = animaux[Math.floor(Math.random()*animaux.length)]; 
                    state = "FLY";
                    bulle.style.opacity = 0;
                }
            } else if (state === "MAGIC") {
                aniX = window.innerWidth / 2;
            }
            
            animalCont.style.left = aniX + 'px';
            // Inversion de l'oiseau selon le sens
            corps.style.transform = (state === "EXIT") ? "scaleX(-1)" : "scaleX(1)";
            
            let wave = (state === "MAGIC") ? 0 : Math.sin(aniX/60)*30;
            animalCont.style.top = (targetY + wave) + 'px';
            requestAnimationFrame(messenger);
        }

        function activerAudio() { 
            const a = document.getElementById('chantOiseaux');
            if(a.paused) { a.volume = 0.05; a.play(); }
        }

        function envoyerDon(event) {
            event.preventDefault();
            document.getElementById('btnTexte').innerText = "Semailles en cours... 🌱";
            const data = new FormData(document.getElementById('monFormulaire'));
            fetch("https://script.google.com/macros/s/AKfycbxz40XE2KiPXTNZsW-mIg-fm55EivK0r9wzZ5ECFRdEIY53nYH9nLGYRoI71OX93oII/exec", { method: 'POST', mode: 'no-cors', body: data })
            .then(() => { window.location.href = "merci_annonce.html"; })
            .catch(() => { window.location.href = "merci_annonce.html"; });
        }

        messenger();
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
