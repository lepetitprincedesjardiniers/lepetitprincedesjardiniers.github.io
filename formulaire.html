<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de Don - Le Don Entier</title>
    <style>
        body {
            background-color: #f4f6f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 30px 20px;
            color: #333;
        }
        .paysage-cosmos {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }
        .rubrique-carte {
            width: 200px;
            text-decoration: none;
            padding: 20px 15px;
            border-radius: 20px;
            background: white;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .rubrique-carte:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .form-container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .form-container h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #bdc3c7;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1em;
            background-color: #fafafa;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
            background-color: #fff;
        }
        .btn-submit {
            background: #e67e22;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background: #d35400;
        }
        .note-bienveillance {
            background: #e0f2f1;
            border-left: 4px solid #008080;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #004d40;
            border-radius: 5px;
            line-height: 1.4;
        }
        .nav-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
            text-decoration: none;
        }
        .nav-link:hover { color: #34495e; text-decoration: underline; }
    </style>
</head>
<body>

    <!-- Cartes de Navigation Hautes -->
    <div class="paysage-cosmos">
        <a href="jardin.html?cat=IMPOT" class="rubrique-carte" style="border: 2px solid #00ced1;">
            <h3 style="margin:0; font-size: 1.1em; color: #008080;">📜 Trésor Public</h3>
        </a>
        <a href="jardin.html?cat=AIDE" class="rubrique-carte" style="border: 2px solid #ff69b4;">
            <h3 style="margin:0; font-size: 1.1em; color: #ff69b4;">💖 Aide & Harmonie</h3>
        </a>
        <a href="jardin.html?cat=REGULATION" class="rubrique-carte" style="border: 2px solid #9370DB;">
            <h3 style="margin:0; font-size: 1.1em; color: #9370DB;">⚖️ Régulation</h3>
        </a>
        <a href="jardin.html?cat=SAVOIR" class="rubrique-carte" style="border: 2px solid #f1c40f;">
            <h3 style="margin:0; font-size: 1.1em; color: #e67e22;">💡 Savoirs</h3>
        </a>
    </div>

    <!-- Conteneur du Formulaire -->
    <div class="form-container">
        <h2>Semer un Don</h2>
        <form action="jardin.html" method="GET">
            
            <div class="form-group">
                <label>Domaine d'action</label>
                <select id="main_cat" name="main_cat" required onchange="updateSubCats()">
                    <option value="">-- Choisir le domaine principal --</option>
                    <option value="IMPOT">Trésor Public</option>
                    <option value="AIDE">Aide & Harmonie</option>
                    <option value="REGULATION">Régulation / Vie citoyenne</option>
                    <option value="SAVOIR">Savoirs</option>
                </select>
            </div>

            <div class="form-group">
                <label>Sous-catégorie</label>
                <select id="sub_cat" name="sub_cat" required>
                    <option value="">-- Choisir d'abord un domaine --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Description de votre don</label>
                <div class="note-bienveillance">
                    <strong>🤝 Note pour le Cocon d'Écoute & l'Aide :</strong> Le site agit uniquement comme une première mise en contact. Les échanges se font ensuite directement entre vous, en toute bienveillance et autonomie.
                </div>
                <textarea name="description" rows="5" placeholder="Décrivez les détails de ce que vous souhaitez offrir ou partager..." required></textarea>
            </div>
            
            <button type="submit" class="btn-submit">Planter la graine (Publier)</button>
        </form>
    </div>

    <a href="index.html" class="nav-link">← Retour à l'accueil Cosmos</a>

    <script>
        const tree = {
            "SAVOIR": [
                "Soutien scolaire & cours",
                "Art, artisanat & musique",
                "Mentorat pro & compétences techniques",
                "Autres interprétations"
            ],
            "REGULATION": [ 
                "Aide sociale, médiation & paix",
                "Assemblées & décisions collectives",
                "Repas, graines & eau",
                "Prêt d'objets & outils",
                "Logement & covoiturage"
            ],
            "AIDE": [ 
                "Secours immédiat",
                "Cocon d'Écoute & présence bienveillante",
                "Soutien aux aînés & garde d'enfants",
                "Soin des animaux & maison"
            ],
            "IMPOT": [
                "Entretien des réseaux vitaux (eau, énergie)",
                "Voirie & chantiers participatifs",
                "Espaces verts, forêts & parcs publics"
            ]
        };

        function updateSubCats() {
            const mainCat = document.getElementById("main_cat").value;
            const subCatSelect = document.getElementById("sub_cat");
            
            subCatSelect.innerHTML = '<option value="">-- Choisir une sous-catégorie --</option>';
            
            if (mainCat && tree[mainCat]) {
                tree[mainCat].forEach(sub => {
                    let opt = document.createElement("option");
                    opt.value = sub;
                    opt.textContent = sub;
                    subCatSelect.appendChild(opt);
                });
            }
        }
    </script>
</body>
</html>
