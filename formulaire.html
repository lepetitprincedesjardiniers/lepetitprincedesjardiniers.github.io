<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Semer au Palais Nature - Guichet Unique</title>
    
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <style>
        body { 
            font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; 
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff; overflow-x: hidden; min-height: 100vh;
        }

        #google_translate_element { position: absolute; top: 10px; left: 10px; z-index: 3000; opacity: 0.6; }

        /* MENU */
        .menu-table { margin: 20px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; position: relative; z-index: 10; }
        .menu-table td { border: 1px solid #FFFFFF; }
        .menu-table a { display: block; padding: 12px 20px; text-decoration: none; color: #FFFFFF; font-weight: bold; }

        /* FORMULAIRE */
        .form-container { 
            background: rgba(255, 255, 255, 0.95); color: #333;
            width: 90%; max-width: 650px; margin: 30px auto; 
            padding: 30px; border-radius: 50px; border: 8px double #008080;
            box-shadow: 0 0 30px rgba(255,255,255,0.2); position: relative; z-index: 5;
        }

        label { display: block; text-align: left; font-weight: bold; margin: 15px 0 5px 20px; color: #004d40; }
        input, select, textarea { width: 95%; padding: 12px; border-radius: 20px; border: 2px solid #008080; margin-bottom: 10px; font-family: inherit; }

        .btn-submit { 
            background: linear-gradient(45deg, #008080, #00b3b3); color: white; border: none; 
            padding: 20px; border-radius: 30px; font-weight: bold; cursor: pointer; width: 80%; 
            font-size: 1.3em; margin-top: 20px; transition: 0.3s;
        }

        /* EFFETS */
        .star { position: fixed; color: white; z-index: -1; animation: twinkle 3s infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        #btn-son { position: fixed; top: 20px; right: 20px; z-index: 1000; background: none; border: none; font-size: 40px; cursor: pointer; }
        #coffre-magique { position: fixed; bottom: 20px; right: 20px; font-size: 50px; cursor: pointer; z-index: 100; }
        
        .phrase-motivation { font-size: 0.8em; color: #d32f2f; font-weight: bold; display: none; margin-top: -5px; }
        
        /* FOOTER COPYRIGHT */
        .footer-copyright { margin: 40px 0; padding: 20px; position: relative; z-index: 10; }
        .footer-copyright a { color: rgba(255,255,255,0.6); text-decoration: none; font-weight: bold; }
        .footer-copyright a:hover { color: #f0e68c; text-shadow: 0 0 10px #fff; }
    </style>
</head>
<body>

    <div id="google_translate_element"></div>
    <button id="btn-son" onclick="toggleSon()">🕊️</button>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impot.html">Impôts</a></td>
            <td><a href="regulation.html">Régulation</a></td>
            <td><a href="urgence.html">Urgences</a></td>
            <td><a href="aide.html">Aide</a></td>
            <td><a href="savoirs.html">Savoirs</a></td>
        </tr>
    </table>

    <div class="form-container">
        <h1>🌱 Semer au Palais Nature</h1>
        <form id="mainForm">
            <input type="text" id="nom" placeholder="Ton nom de jardinier..." required>
            <input type="text" id="ville" placeholder="Ville / Pays / Code Postal..." required>

            <label>Jardin de destination :</label>
            <select id="categorie" onchange="updateSubCats()" required>
                <option value="">-- Choisir --</option>
                <option value="URGENCE">🚑 URGENCE (Santé & Matière)</option>
                <option value="AIDE">💖 AIDE (Cœur & Écoute)</option>
                <option value="SAVOIR">💡 SAVOIR (Transmission)</option>
                <option value="IMPOT">📜 TRÉSOR PUBLIC (Travaux)</option>
            </select>

            <div id="subCatContainer" style="display:none;">
                <label>Sous-rubrique :</label>
                <select id="sousCategorie"></select>
                <div id="msgImpot" class="phrase-motivation">⚠️ Motivation indispensable. Travaux ingrats !</div>
            </div>

            <label>Validité :</label>
            <select id="validite">
                <option value="48h">48 heures (Graine)</option>
                <option value="1mois" selected>1 mois (Plante)</option>
                <option value="infini">Permanent (Arbre)</option>
            </select>

            <textarea id="message" rows="5" placeholder="Ton message (ex: Ma charpente vacille...)" required></textarea>
            <button type="submit" class="btn-submit" id="btnTexte">LANCER LE SEMIS 🕊️</button>
        </form>
    </div>

    <div id="coffre-magique" onclick="exploserCadeau()">🎁</div>

    <footer class="footer-copyright">
        <a href="transition-externe.html">© 2000 le petit prince des jardiniers</a>
    </footer>

    <script>
        // SOUS-RUBRIQUES DÉTAILLÉES
        const tree = {
            "URGENCE": ["Matière (Faim/Toit)", "Santé (Corps)", "Mental (Cervelle)", "Urgence Vitale"],
            "AIDE": ["Câlin de l'âme", "Besoin de parler", "Solitude", "Médiation fraternelle"],
            "SAVOIR": ["Technique (Code/Brico)", "Nature (Jardin/Pain)", "Esprit (Arts/Philo)", "Autre graine"],
            "IMPOT": ["Voirie/Routes", "Administration", "Entretien Nature", "Soutien Technique"]
        };

        function updateSubCats() {
            const cat = document.getElementById('categorie').value;
            const subContainer = document.getElementById('subCatContainer');
            const subSelect = document.getElementById('sousCategorie');
            const msgImpot = document.getElementById('msgImpot');
            
            if (cat && tree[cat]) {
                subSelect.innerHTML = tree[cat].map(s => `<option value="${s}">${s}</option>`).join('');
                subContainer.style.display = 'block';
                msgImpot.style.display = (cat === "IMPOT") ? "block" : "none";
                document.querySelector('.form-container').style.borderColor = 
                    {"URGENCE":"#ff1493", "AIDE":"#9370DB", "SAVOIR":"#FFB300", "IMPOT":"#008080"}[cat];
            } else { subContainer.style.display = 'none'; }
        }

        // CODES ORIGINAUX CONSERVÉS (SON, ÉTOILES, CADEAU, ENVOI)
        let audio = new Audio('oiseaux.mp3'); audio.loop = true;
        function toggleSon() { if (audio.paused) audio.play(); else audio.pause(); }

        function createStar() {
            let s = document.createElement('div'); s.className = 'star'; s.innerHTML = '✦';
            s.style.left = Math.random()*100+'vw'; s.style.top = Math.random()*100+'vh';
            document.body.appendChild(s);
        }
        for(let i=0; i<40; i++) createStar();

        function exploserCadeau() { /* ton code d'explosion */ }

        const URL_SHEETS = "https://script.google.com/macros/s/AKfycbz4ncs9qw_AfmKSER5QST-P0OeKQggQaq86QC6liS53uZ9sx4Lo_-4-h1knXKWqgQMc/exec";
        document.getElementById('mainForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('btnTexte').innerText = "Voyage dans le cosmos...";
            const d = {
                date: new Date().toLocaleDateString('fr-FR'),
                type: document.getElementById('categorie').value,
                sousType: document.getElementById('sousCategorie').value,
                nom: document.getElementById('nom').value,
                localisation: document.getElementById('ville').value,
                message: document.getElementById('message').value,
                validite: document.getElementById('validite').value
            };
            fetch(URL_SHEETS, { method: 'POST', mode: 'no-cors', body: JSON.stringify(d) })
            .then(() => { alert("Semé !"); window.location.href="jardin.html"; });
        });
    </script>
</body>
</html>
