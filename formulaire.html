<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Semer un Don - Le Petit Prince des Jardiniers</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; background-color: #FFFF00; color: #000080; overflow-x: hidden; min-height: 100vh; }
        #google_translate_element { position: absolute; top: 5px; left: 5px; z-index: 1000; opacity: 0.7; transform: scale(0.8); }
        
        .menu-table { margin: 20px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; margin-left: auto; margin-right: auto;}
        .menu-table td { padding: 10px 15px; border: 1px solid #FFFFFF; transition: 0.3s; }
        .menu-table td:hover { background-color: #00b3b3; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; font-size: 0.85em; }

        .form-container { background: white; padding: 30px; border-radius: 20px; display: inline-block; margin-top: 10px; box-shadow: 0px 10px 20px rgba(0,0,0,0.1); width: 95%; max-width: 800px; margin-bottom: 180px; position: relative; z-index: 10; }
        .form-group { text-align: left; margin: 15px 20px; }
        label { font-weight: bold; color: #008080; display: block; margin-bottom: 5px; }
        .sous-label { font-size: 0.75em; color: #006666; margin-bottom: 5px; display: block; font-style: italic; }
        
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #008080; border-radius: 10px; font-family: 'Comic Sans MS'; font-size: 1em; box-sizing: border-box; }
        textarea { min-height: 200px; resize: vertical; background-color: #fffdf0; }

        .extra-field { display: none; animation: fadeIn 0.5s; background: #e0f2f1; padding: 10px; border-radius: 10px; margin-top: -5px; margin-bottom: 10px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .btn-envoyer { width: 100%; padding: 25px; background: #E67E22; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 1.2em; box-shadow: 0px 4px 0px #b35900; }
    </style>
</head>
<body>

    <div id="google_translate_element"></div>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impot.html">Impôts Publics</a></td>
            <td><a href="regulation.html">Régulation</a></td>
            <td><a href="aide.html">Aide & Harmonie</a></td>
            <td><a href="savoirs.html">Savoirs</a></td>
            <td><a href="vie.html">Vie Citoyenne</a></td>
        </tr>
    </table>

    <h2 style="color:#E67E22;">🌍 Engendrer la Fraternité Universelle</h2>

    <div class="form-container">
        <form id="monFormulaire" onsubmit="envoyerDon(event)">
            
            <div class="form-group">
                <label>Identité amoureuse</label>
                <input type="text" name="nom" placeholder="Ton Prénom de coeur / Pseudo" required>
            </div>

            <div class="form-group">
                <label>Provenance (Où la graine est-elle née ?)</label>
                <select name="pays_select" id="pays_select" onchange="checkOther(this, 'extra_pays')">
                    <option value="" selected>-- Choisir un Territoire --</option>
                    <optgroup label="✨ Territoires de l'Imaginaire">
                        <option value="B612">L'astéroïde B 612</option>
                        <option value="Merveilles">Le Pays des Merveilles</option>
                        <option value="Utopie">L'Archipel d'Utopie</option>
                        <option value="AUTRE_PAYS">☁️ Autre lieu imaginaire...</option>
                    </optgroup>
                    <optgroup label="🌍 Europe">
                        <option value="France">France</option><option value="Belgique">Belgique</option><option value="Suisse">Suisse</option>
                        <option value="Espagne">Espagne</option><option value="Italie">Italie</option><option value="AUTRE_PAYS">Autre pays d'Europe...</option>
                    </optgroup>
                    <optgroup label="🌍 Afrique">
                        <option value="Maroc">Maroc</option><option value="Algérie">Algérie</option><option value="Tunisie">Tunisie</option>
                        <option value="Sénégal">Sénégal</option><option value="Côte d'Ivoire">Côte d'Ivoire</option><option value="AUTRE_PAYS">Autre pays d'Afrique...</option>
                    </optgroup>
                    <optgroup label="🌍 Amériques">
                        <option value="Canada">Canada</option><option value="Québec">Québec</option><option value="USA">États-Unis</option>
                        <option value="Brésil">Brésil</option><option value="AUTRE_PAYS">Autre pays d'Amérique...</option>
                    </optgroup>
                </select>
                <div id="extra_pays" class="extra-field">
                    <input type="text" name="pays_precision" placeholder="Nom de ton pays ou royaume secret...">
                </div>
            </div>

            <div class="form-group">
                <label>Destination du semis</label>
                <select name="type" id="main_cat" onchange="updateSubCats()" required>
                    <option value="">-- Domaine d'action --</option>
                    <option value="SAVOIR">💡 SAVOIRS (Scolaire, Pro, Arts)</option>
                    <option value="VIE">🏠 VIE CITOYENNE (Espaces, Mobilité)</option>
                    <option value="AIDE">💖 AIDE & HARMONIE (Santé, Écoute)</option>
                    <option value="REGULATION">⚖️ RÉGULATION (Médiation, Justice)</option>
                    <option value="IMPOT">📜 TRÉSOR PUBLIC (Travaux, Bien Commun)</option>
                    <option value="AUTRE_CAT">🌈 AUTRE DOMAINE...</option>
                </select>
                <div id="extra_cat" class="extra-field">
                    <input type="text" name="cat_precision" placeholder="Précisez ce nouveau domaine...">
                </div>
            </div>

            <div id="sub_cat_group" class="form-group" style="display:none;">
                <label>Précision de la graine</label>
                <select name="sousType" id="sub_cat" onchange="checkOther(this, 'extra_sub')"></select>
                <div id="extra_sub" class="extra-field">
                    <input type="text" name="sub_precision" placeholder="Décrivez cette nouvelle spécialité...">
                </div>
            </div>

            <div class="form-group">
                <label>Cycle de Vie (Durée de validité)</label>
                <select name="duree_validite" required>
                    <option value="1">🌱 Un brin d'herbe (1 jour - Urgence)</option>
                    <option value="7">🌿 Une petite fleur (1 semaine)</option>
                    <option value="30" selected>🌳 Un buisson (1 mois - Standard)</option>
                    <option value="90">🌲 Un jeune arbre (3 mois)</option>
                    <option value="365">🍃 Un chêne séculaire (1 an - Transmission)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Acheminement & Fret</label>
                <select name="logistique" required>
                    <optgroup label="🤝 Humain & Proximité">
                        <option value="Main Propre">Main à main</option>
                        <option value="Covoit">Covoiturage humain</option>
                    </optgroup>
                    <optgroup label="🚚 Fret & Transport">
                        <option value="Poste">Poste / Colis</option>
                        <option value="Routier">Fret Routier (Camion)</option>
                        <option value="Rail">Fret Ferroviaire (Train)</option>
                        <option value="Mer">Fret Maritime (Bateau)</option>
                        <option value="Air">Fret Aérien (Avion)</option>
                    </optgroup>
                    <option value="Numérique">💻 Transfert Numérique / Visio</option>
                </select>
            </div>

            <div class="form-group">
                <label>Description du Don amoureux</label>
                <textarea name="message" placeholder="Détaille ton don ici..." required></textarea>
            </div>

            <button type="submit" class="btn-envoyer" id="btnTexte">SEMER LA FRATERNITÉ</button>
        </form>
    </div>

    <script>
        const tree = {
            "SAVOIR": ["🌱 Éveil Scolaire", "🎓 Études Supérieures", "💼 Mentorat Pro", "🎨 Arts & Cuisine", "AUTRE_SUB"],
            "VIE": ["🏠 Hébergement", "🛠️ Prêt d'espaces", "🚗 Mobilité", "AUTRE_SUB"],
            "AIDE": ["🚑 Urgence Vitale", "🏥 Santé", "🌈 Écoute", "AUTRE_SUB"],
            "REGULATION": ["🕊️ Médiation", "⚖️ Aide Administrative", "AUTRE_SUB"],
            "IMPOT": ["🏗️ Travaux Publics", "🌲 Nature", "AUTRE_SUB"]
        };

        function updateSubCats() {
            const cat = document.getElementById('main_cat').value;
            const subGroup = document.getElementById('sub_cat_group');
            const subSelect = document.getElementById('sub_cat');
            document.getElementById('extra_cat').style.display = (cat === "AUTRE_CAT") ? "block" : "none";
            
            if (cat && tree[cat]) {
                subSelect.innerHTML = tree[cat].map(s => `<option value="${s}">${s === 'AUTRE_SUB' ? '🌈 Autre précision...' : s}</option>`).join('');
                subGroup.style.display = 'block';
            } else { subGroup.style.display = 'none'; }
        }

        function checkOther(select, divId) {
            const extraDiv = document.getElementById(divId);
            if (select.value.includes("AUTRE")) {
                extraDiv.style.display = "block";
                extraDiv.querySelector('input').focus();
            } else {
                extraDiv.style.display = "none";
            }
        }

        function envoyerDon(event) {
            event.preventDefault();
            document.getElementById('btnTexte').innerText = "Semailles en cours... 🌱";
            const data = new FormData(document.getElementById('monFormulaire'));
            fetch("https://script.google.com/macros/s/VOTRE_ID_ICI/exec", { method: 'POST', mode: 'no-cors', body: data })
            .then(() => { window.location.href = "merci_annonce.html"; });
        }
    </script>
</body>
</html>
