<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Semer un Don - Le Petit Prince des Jardiniers</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; background-color: #FFFF00; color: #000080; overflow-x: hidden; min-height: 100vh; }
        #google_translate_element { position: absolute; top: 5px; left: 5px; z-index: 1000; opacity: 0.7; transform: scale(0.8); }
        .menu-table { margin: 20px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; margin-left: auto; margin-right: auto;}
        .menu-table td { padding: 10px 15px; border: 1px solid #FFFFFF; transition: 0.3s; }
        .menu-table td:hover { background-color: #00b3b3; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; font-size: 0.9em; }
        .form-container { background: white; padding: 30px; border-radius: 20px; display: inline-block; margin-top: 10px; box-shadow: 0px 10px 20px rgba(0,0,0,0.1); width: 90%; max-width: 550px; margin-bottom: 180px; position: relative; z-index: 10; }
        .form-group { text-align: left; margin: 10px 20px; }
        label { font-weight: bold; color: #008080; display: block; margin-bottom: 5px; }
        .sous-label { font-size: 0.75em; color: #006666; margin-bottom: 5px; display: block; font-style: italic; }
        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #008080; border-radius: 10px; font-family: 'Comic Sans MS'; font-size: 1em; box-sizing: border-box; background-color: #fcfcfc; }
        .btn-envoyer { width: 100%; padding: 20px; background: #E67E22; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 1.1em; box-shadow: 0px 4px 0px #b35900; transition: 0.1s; }
        .btn-envoyer:active { transform: translateY(4px); box-shadow: 0px 0px 0px #b35900; }
        #coffre-magique { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 60px; z-index: 800; transition: transform 0.3s; }
        #animal-container { position: fixed; z-index: 900; white-space: nowrap; display: flex; align-items: center; pointer-events: none; }
        #corps-animal { font-size: 50px; }
        #bulle-texte { background: rgba(255, 255, 255, 0.9); border-radius: 15px; padding: 8px 15px; font-style: italic; color: #2E7D32; margin-right: 10px; font-weight: bold; border: 2px solid #2E7D32; opacity: 0; transition: opacity 0.3s; }
        .pop { transform: translateX(-50%) scale(1.4) !important; }
        .section-logistique { border-top: 2px dashed #008080; margin-top: 20px; padding-top: 15px; background: #f9f9f9; border-radius: 15px; }
        .msg-alerte { color: #d32f2f; font-size: 0.8em; font-weight: bold; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

    <audio id="chantOiseaux" loop><source src="oiseaux.mp3" type="audio/mpeg"></audio>
    <div id="google_translate_element"></div>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impot.html">Trésor Public</a></td>
            <td><a href="regulation.html">Régulation</a></td>
            <td><a href="urgence.html">Urgences</a></td>
            <td><a href="aide.html">Aide</a></td>
            <td><a href="savoirs.html">Savoirs</a></td>
        </tr>
    </table>

    <h2 style="color:#E67E22;">🌟 Semer un Don - Le Petit Prince des Jardiniers</h2>

    <div class="form-container">
        <form id="monFormulaire" onsubmit="envoyerDon(event)">

            <div class="form-group">
                <label>Identité amoureuse</label>
                <input type="text" name="nom" placeholder="Ton Prénom de coeur" required>
            </div>

            <div class="form-group">
                <label>Provenance (Monde sans frontières)</label>
                <select name="pays_select" id="pays_select" onchange="gererPays('select')">
                    <option value="" selected>--- Choisir dans la liste 🌍 ---</option>
                    <optgroup label="✨ Les pays sages">
                        <option value="L'astéroïde B 612">L'astéroïde B 612</option>
                        <option value="Pays de la grande gentillesse">Pays de la grande gentillesse</option>
                        <option value="Le Pays des Merveilles">Le Pays des Merveilles</option>
                    </optgroup>
                    <optgroup label="Europe">
                        <option value="Allemagne">Allemagne</option><option value="Belgique">Belgique</option><option value="Espagne">Espagne</option><option value="France">France</option><option value="Italie">Italie</option><option value="Luxembourg">Luxembourg</option><option value="Portugal">Portugal</option><option value="Suisse">Suisse</option>
                    </optgroup>
                    <optgroup label="Afrique">
                        <option value="Algérie">Algérie</option><option value="Bénin">Bénin</option><option value="Cameroun">Cameroun</option><option value="Côte d'Ivoire">Côte d'Ivoire</option><option value="Gabon">Gabon</option><option value="Maroc">Maroc</option><option value="Sénégal">Sénégal</option><option value="Tunisie">Tunisie</option>
                    </optgroup>
                    <optgroup label="Amériques">
                        <option value="Argentine">Argentine</option><option value="Brésil">Brésil</option><option value="Canada">Canada</option><option value="Colombie">Colombie</option><option value="États-Unis">États-Unis</option><option value="Haïti">Haïti</option><option value="Mexique">Mexique</option>
                    </optgroup>
                    <optgroup label="Asie & Océanie">
                        <option value="Australie">Australie</option><option value="Chine">Chine</option><option value="Inde">Inde</option><option value="Japon">Japon</option><option value="Liban">Liban</option><option value="Vietnam">Vietnam</option>
                    </optgroup>
                </select>
                <input type="text" name="localisation" id="pays_libre" placeholder="Ou ton pays ici..." oninput="gererPays('libre')">
                <input type="text" name="ville" placeholder="Ta Ville" required>
            </div>

            <div class="form-group">
                <label>Urgence du Semis (Priorité)</label>
                <select name="priorite" required>
                    <option value="Graine de Patience">🌱 Graine de Patience (Projet à long terme)</option>
                    <option value="Feu de Joie" selected>🔥 Feu de Joie (Vie quotidienne & Animation)</option>
                    <option value="Cri du Coeur">🚨 Cri du Cœur (Action immédiate requise)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Destination du semis (Rubrique)</label>
                <select name="type" id="main_cat" onchange="updateSubCats()" required>
                    <option value="">-- Vers quel jardin ? --</option>
                    <option value="IMPOT">📜 TRÉSOR PUBLIC (Bien Commun & Infrastructures)</option>
                    <option value="REGULATION">⚖️ RÉGULATION (Équilibre & Justice Fraternelle)</option>
                    <option value="URGENCE">🚑 URGENCE & DÉTRESSE (Survie & Matière)</option>
                    <option value="SAVOIR">💡 SAVOIR (Transmission & Arts)</option>
                </select>
            </div>

            <div id="sub_cat_group" class="form-group" style="display:none;">
                <label>Précision du semis (Sous-rubrique)</label>
                <select name="sousType" id="sub_cat"></select>
                <div id="msgImpot" class="msg-alerte">NB: Les dons au Trésor Public servent aux travaux visibles par tous.</div>
            </div>

            <div class="form-group">
                <label>Zone d'offrande (Rayon d'action)</label>
                <select name="rayon" id="rayon_select" onchange="updateLogistique()" required>
                    <option value="Local">Local (Ma ville / 10km)</option>
                    <option value="National">National (Mon pays)</option>
                    <option value="Monde Entier" selected>Monde Entier (International)</option>
                    <option value="Infini">Rayon Infini (Cosmique)</option>
                </select>
            </div>

            <div class="section-logistique">
                <div class="form-group">
                    <label>Acheminement du cadeau (Logistique)</label>
                    <select name="logistique" id="logistique_select" required>
                        <option value="Don Entier (J'assure)">Don Entier (J'assure le transport)</option>
                        <option value="À récupérer">À récupérer sur place</option>
                        <option value="Numérique">Transfert Numérique (Email/Web)</option>
                        <option value="Postal">Envoi Postal / Colis</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Durée de vie de la graine</label>
                    <select name="validite" required>
                        <option value="48h">48 heures (Éphémère)</option>
                        <option value="1_mois" selected>1 Mois (Plante)</option>
                        <option value="Eternel">Éternel (Arbre)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Description du Don amoureux</label>
                <textarea name="message" rows="4" placeholder="Décris ici ton Don avec précision..." required></textarea>
            </div>

            <button type="submit" class="btn-envoyer" id="btnTexte">ENGENDRER DE LA FRATERNITÉ UNIVERSELLE</button>
        </form>
    </div>

    <div id="coffre-magique">🎁</div>
    <div id="animal-container"><div id="bulle-texte"></div><div id="corps-animal">🕊️</div></div>

    <script type="text/javascript">
        function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element'); }

        const tree = {
            "IMPOT": ["Voirie & Chemins", "Bâtiments Communs", "Entretien Nature", "Outils partagés", "Administration du village"],
            "REGULATION": ["Médiation de conflit", "Aide juridique", "Gestion des ressources", "Équilibre social", "Paperasse & Droit"],
            "URGENCE": ["Faim (Alimentaire)", "Toit (Hébergement)", "Santé (Corps)", "Détresse (Mental)", "Urgence Vitale"],
            "SAVOIR": ["Technique (Brico/Code)", "Terre (Jardin/Pain)", "Esprit (Arts/Philo)", "Éducation & Lecture"]
        };

        function updateSubCats() {
            const cat = document.getElementById('main_cat').value;
            const subGroup = document.getElementById('sub_cat_group');
            const subSelect = document.getElementById('sub_cat');
            const msgImpot = document.getElementById('msgImpot');
            
            if (cat && tree[cat]) {
                subSelect.innerHTML = tree[cat].map(s => `<option value="${s}">${s}</option>`).join('');
                subGroup.style.display = 'block';
                msgImpot.style.display = (cat === "IMPOT") ? "block" : "none";
            } else { subGroup.style.display = 'none'; }
        }

        function updateLogistique() {
            const rayon = document.getElementById('rayon_select').value;
            const logSelect = document.getElementById('logistique_select');
            if (rayon === "Monde Entier" || rayon === "Infini") {
                logSelect.innerHTML = `
                    <option value="Numérique">Transfert Numérique (Internet)</option>
                    <option value="Postal International">Envoi Postal International</option>
                    <option value="Conseil">Don Immatériel (Conseil/Savoir)</option>
                `;
            } else {
                logSelect.innerHTML = `
                    <option value="Main à main">Main à main (Rencontre)</option>
                    <option value="À récupérer">À récupérer chez moi</option>
                    <option value="J'assure">J'assure le transport local</option>
                `;
            }
        }

        function gererPays(source) {
            const select = document.getElementById('pays_select');
            const libre = document.getElementById('pays_libre');
            if (source === 'select' && select.value !== "") { libre.value = ""; }
            else if (source === 'libre' && libre.value.trim() !== "") { select.selectedIndex = 0; }
        }

        function envoyerDon(event) {
            event.preventDefault();
            document.getElementById('btnTexte').innerText = "Semailles en cours... 🌱";
            const data = new FormData(document.getElementById('monFormulaire'));
            fetch("https://script.google.com/macros/s/AKfycbxz40XE2KiPXTNZsW-mIg-fm55EivK0r9wzZ5ECFRdEIY53nYH9nLGYRoI71OX93oII/exec", 
            { method: 'POST', mode: 'no-cors', body: data })
            .then(() => { window.location.href = "merci_annonce.html"; })
            .catch(() => { window.location.href = "merci_annonce.html"; });
        }

        // --- ANIMATIONS ORIGINALES CONSERVÉES ---
        const mesPhrases = ["Semer un don amoureux...", "Engendrer de la fraternité...", "Prendre soin du jardin..."];
        const animaux = ['🕊️', '🦋', '🐝', '🐞', '🦜'];
        const animalCont = document.getElementById('animal-container');
        const bulle = document.getElementById('bulle-texte');
        const corps = document.getElementById('corps-animal');
        const coffre = document.getElementById('coffre-magique');
        let aniX = -200, aniY = 200, targetX, targetY, state = "APPROACHING";

        function startNewMessenger() {
            bulle.innerText = mesPhrases[Math.floor(Math.random() * mesPhrases.length)];
            corps.innerText = animaux[Math.floor(Math.random() * animaux.length)];
            aniX = -200; aniY = 200;
            targetX = window.innerWidth / 2; targetY = window.innerHeight - 110;
            state = "APPROACHING";
        }

        function loop() {
            if (state === "APPROACHING") {
                aniX += (targetX - aniX) * 0.015; aniY += (targetY - aniY) * 0.015;
                bulle.style.opacity = "1";
                if (Math.sqrt(Math.pow(targetX-aniX,2)+Math.pow(targetY-aniY,2)) < 60) {
                    state = "DEPOSITING"; coffre.classList.add('pop');
                    setTimeout(() => { 
                        bulle.style.opacity = "0"; coffre.classList.remove('pop'); state = "LEAVING"; 
                        targetX = window.innerWidth + 500; targetY = 200; 
                    }, 2500);
                }
            } else if (state === "LEAVING") {
                aniX += (targetX - aniX) * 0.02; aniY += (targetY - aniY) * 0.02;
                if (Math.abs(aniX - targetX) < 100) startNewMessenger();
            }
            animalCont.style.left = aniX + "px"; animalCont.style.top = aniY + "px";
            corps.style.transform = (aniX < targetX) ? "scaleX(-1)" : "scaleX(1)";
            requestAnimationFrame(loop);
        }
        startNewMessenger(); loop();
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
