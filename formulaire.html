        /* Traducteur Google */

        .menu-table td { padding: 10px 15px; border: 1px solid #FFFFFF; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; }

        .form-container { 
            background: white; border: 4px solid #E67E22; border-radius: 30px; 
            width: 90%; max-width: 600px; margin: 30px auto; padding: 30px;
            box-shadow: 10px 10px 0px #E67E22;
        }
        input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 15px; border: 2px solid #008080; box-sizing: border-box; font-family: inherit; }
        .btn-envoyer { background: #E67E22; color: white; border: none; padding: 15px 30px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 1.2em; }
        .btn-envoyer:hover { transform: scale(1.05); background: #d35400; }
        body { font-family: 'Comic Sans MS', cursive; background-color: #FFFF00; text-align: center; padding: 20px; }
        .form-container { background: white; padding: 30px; border-radius: 20px; max-width: 500px; margin: auto; border: 4px solid #E67E22; }
        input, textarea { width: 100%; margin: 10px 0; padding: 10px; border-radius: 10px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #E67E22; color: white; border: none; padding: 15px 30px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="google_translate_element"></div>
    <script type="text/javascript">
        function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element'); }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="contact.html">Contact</a></td>
        </tr>
    </table>

    <h2 style="color: #E67E22;">🌱 Semer une Graine de Générosité</h2>
    <p><i>"Cadeaux sans détour, cadeaux sans demande de retour."</i></p>

    <h1>🌱 Semer une Graine</h1>
    <div class="form-container">
        <form action="https://formspree.io/f/ton-id-ici" method="POST">
            <label>Ton Identité (Pseudo ou Nom) :</label>
            <input type="text" name="nom" placeholder="Ex: Le Jardinier du Dimanche" required>

            <label>Ta Localisation :</label>
            <input type="text" name="ville" placeholder="Ville, Pays..." required>

            <label>Ce que tu offres au monde :</label>
            <textarea name="offre" rows="5" placeholder="Décris ton cadeau sans détour (objet, service, temps...)" required></textarea>

            <label>Comment te contacter ?</label>
            <input type="text" name="contact" placeholder="Email, téléphone ou pigeon voyageur..." required>

            <button type="submit" class="btn-envoyer">LÂCHER LA GRAINE 🌻</button>
        <form id="seedForm">
            <input type="text" id="nom" placeholder="Ton Nom / Pseudo" required>
            <input type="text" id="ville" placeholder="Ta Ville" required>
            <textarea id="offre" rows="4" placeholder="Que veux-tu offrir sans détour ?" required></textarea>
            <button type="submit" id="btnEnvoi">LÂCHER LA GRAINE 🌻</button>
        </form>
    </div>

    <p><a href="index.html" style="color: #000080; font-weight: bold;">← Retourner au Trésor Public</a></p>

    <script>
        const URL_SERVEUR = "https://script.google.com/macros/s/AKfycbz4ncs9qw_AfmKSER5QST-P0OeKQggQaq86QC6liS53uZ9sx4Lo_-4-h1knXKWqgQMc/exec";

        document.getElementById('seedForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnEnvoi');
            btn.innerText = "Envoi en cours...";
            btn.disabled = true;

            const donnees = {
                date: new Date().toLocaleDateString('fr-FR'),
                type: "Cadeau",
                nom: document.getElementById('nom').value,
                localisation: document.getElementById('ville').value,
                message: document.getElementById('offre').value
            };

            fetch(URL_SERVEUR, {
                method: 'POST',
                mode: 'no-cors', // Important pour Google Apps Script
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(donnees)
            }).then(() => {
                alert("Bravo ! Ta graine est enregistrée.");
                window.location.href = "jardin.html";
            }).catch(err => {
                alert("Erreur d'envoi. Réessaie !");
                btn.disabled = false;
                btn.innerText = "LÂCHER LA GRAINE 🌻";
            });
        });
    </script>
</body>
