<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Semer au Palais Nature - Guichet Unique</title>
    
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <style>
        body { 
            font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; 
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff; overflow-x: hidden; min-height: 100vh;
        }

        #google_translate_element { position: absolute; top: 10px; left: 10px; z-index: 3000; opacity: 0.6; }

        /* TON MENU FIDÈLE */
        .menu-table { margin: 20px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; position: relative; z-index: 10; }
        .menu-table td { border: 1px solid #FFFFFF; }
        .menu-table a { display: block; padding: 12px 20px; text-decoration: none; color: #FFFFFF; font-weight: bold; }

        /* LE CADRE DE SEMIS */
        .form-container { 
            background: rgba(255, 255, 255, 0.95); color: #333;
            width: 90%; max-width: 650px; margin: 30px auto; 
            padding: 30px; border-radius: 50px; border: 8px double #008080;
            box-shadow: 0 0 30px rgba(255,255,255,0.2); position: relative; z-index: 5;
        }

        h1 { color: #008080; font-size: 2.2em; margin-bottom: 5px; text-shadow: 1px 1px 2px #ccc; }
        .fleur-titre { font-size: 40px; margin-bottom: 10px; }

        label { display: block; text-align: left; font-weight: bold; margin: 15px 0 5px 20px; color: #004d40; }
        input, select, textarea { 
            width: 95%; padding: 12px; border-radius: 20px; border: 2px solid #008080; 
            margin-bottom: 10px; font-family: inherit; font-size: 1rem;
        }

        /* BOUTON DE SEMIS MAGIQUE */
        .btn-submit { 
            background: linear-gradient(45deg, #008080, #00b3b3); color: white; border: none; 
            padding: 20px; border-radius: 30px; font-weight: bold; cursor: pointer; width: 80%; 
            font-size: 1.3em; margin-top: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .btn-submit:hover { transform: scale(1.05) rotate(1deg); background: #00b3b3; }

        /* ÉTOILES (TES EFFETS) */
        .star { position: fixed; color: white; z-index: -1; animation: twinkle var(--duration) infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

        #btn-son { position: fixed; top: 20px; right: 20px; z-index: 1000; background: none; border: none; font-size: 40px; cursor: pointer; }
        #coffre-magique { position: fixed; bottom: 20px; right: 20px; font-size: 50px; cursor: pointer; z-index: 100; }
        .particule { position: fixed; pointer-events: none; z-index: 1001; }

        .phrase-motivation { font-size: 0.8em; color: #d32f2f; font-weight: bold; margin-top: -10px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

    <div id="google_translate_element"></div>
    <button id="btn-son" onclick="toggleSon()">🕊️</button>

    <div class="header-container">
        <table class="menu-table">
            <tr>
                <td><a href="index.html">Accueil</a></td>
                <td><a href="formulaire.html">Semer</a></td>
                <td><a href="jardin.html">Le Jardin</a></td>
                <td><a href="impot.html">Impôts</a></td>
                <td><a href="regulation.html">Régulation</a></td>
                <td><a href="urgence.html">Urgences</a></td>
                <td><a href="aide.html">Aide</a></td>
                <td><a href="savoirs.html">Savoirs</a></td>
            </tr>
        </table>
    </div>

    <div class="form-container">
        <div class="fleur-titre">🌱</div>
        <h1>Semer au Palais Nature</h1>
        <p><i>"On ne voit bien qu'avec le cœur..."</i></p>

        <form id="mainForm">
            <label>Ton nom de jardinier</label>
            <input type="text" id="nom" placeholder="Ton pseudo ou ton cri..." required>

            <label>Où es-tu ? (Ville / Pays)</label>
            <input type="text" id="ville" placeholder="Pour la fraternité locale..." required>

            <label>Quelle graine souhaites-tu semer ?</label>
            <select id="categorie" onchange="updateSubCats()" required>
                <option value="">-- Choisir une rubrique --</option>
                <option value="URGENCE">🏥 URGENCE (Santé, faim, cervelle...)</option>
                <option value="AIDE">💖 AIDE (Câlin de l'âme, écoute...)</option>
                <option value="SAVOIR">💡 SAVOIR (Apprendre, transmettre...)</option>
                <option value="IMPOT">📜 TRÉSOR PUBLIC (Travaux ingrats...)</option>
            </select>

            <div id="subCatContainer" style="display:none;">
                <label>Précise ton semis :</label>
                <select id="sousCategorie"></select>
                <div id="msgImpot" class="phrase-motivation">⚠️ Motivation indispensable. Travaux ingrats en vue !</div>
            </div>

            <label>Durée de vie de l'annonce</label>
            <select id="validite">
                <option value="48h">Graine éphémère (48 heures)</option>
                <option value="1mois" selected>Plante de saison (1 mois)</option>
                <option value="infini">Arbre pérenne (Permanent)</option>
            </select>

            <label>Ton Message</label>
            <textarea id="message" rows="5" placeholder="Décris ton besoin ou ton offre... ex: Ma charpente vacille, j'ai besoin d'aide pour mon toit..." required></textarea>

            <button type="submit" class="btn-submit" id="btnTexte">LANCER LE SEMIS DANS LE COSMOS 🕊️</button>
        </form>
    </div>

    <div id="coffre-magique" onclick="exploserCadeau()">🎁</div>

    <script>
        // SOUS-RUBRIQUES AVEC TES PHRASES
        const subOptions = {
            "URGENCE": ["Cervelle/Mental", "Charpente/Physique", "Faim/Matière", "Toit/Logement"],
            "AIDE": ["Câlin de l'âme", "Oreille attentive", "Besoin de parler", "Médiation fraternelle"],
            "SAVOIR": ["Faire son pain/Cuisine", "Code/Informatique", "Terre/Jardinage", "Art/Esprit"],
            "IMPOT": ["Réfection des routes", "Aide aux papiers", "Espaces verts", "Soutien technique"]
        };

        function updateSubCats() {
            const cat = document.getElementById('categorie').value;
            const subContainer = document.getElementById('subCatContainer');
            const subSelect = document.getElementById('sousCategorie');
            const msgImpot = document.getElementById('msgImpot');
            
            if (cat && subOptions[cat]) {
                subSelect.innerHTML = subOptions[cat].map(opt => `<option value="${opt}">${opt}</option>`).join('');
                subContainer.style.display = 'block';
                msgImpot.style.display = (cat === "IMPOT") ? "block" : "none";
                document.querySelector('.form-container').style.borderColor = 
                    {"URGENCE":"#ff1493", "AIDE":"#9370DB", "SAVOIR":"#FFB300", "IMPOT":"#008080"}[cat];
            } else {
                subContainer.style.display = 'none';
            }
        }

        // ÉTOILES (TES EFFETS)
        function createStar() {
            let s = document.createElement('div'); s.className = 'star';
            s.innerHTML = '✦';
            s.style.left = Math.random()*100 + 'vw'; s.style.top = Math.random()*100 + 'vh';
            s.style.setProperty('--duration', (Math.random()*3+2)+'s');
            document.body.appendChild(s);
        }
        for(let i=0; i<50; i++) createStar();

        // SON (OISEAUX)
        let audio = new Audio('oiseaux.mp3'); audio.loop = true;
        function toggleSon() {
            if (audio.paused) audio.play(); else audio.pause();
        }

        // CADEAU EXPLOSIF
        function exploserCadeau() {
            const els = ['🌸', '✨', '🌻', '🌟', '❤️'];
            for(let i=0; i<20; i++) {
                const p = document.createElement('div'); p.className = 'particule';
                p.innerHTML = els[Math.floor(Math.random()*els.length)];
                p.style.left = '90vw'; p.style.top = '90vh';
                document.body.appendChild(p);
                const a = Math.random()*Math.PI*2, d = Math.random()*150+50;
                p.animate([{transform:'scale(1)', opacity:1}, {transform:`translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px) scale(0)`, opacity:0}], {duration:1000});
                setTimeout(() => p.remove(), 1000);
            }
        }

        // ENVOI VERS GOOGLE SHEETS
        const URL_SHEETS = "https://script.google.com/macros/s/AKfycbz4ncs9qw_AfmKSER5QST-P0OeKQggQaq86QC6liS53uZ9sx4Lo_-4-h1knXKWqgQMc/exec";
        document.getElementById('mainForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnTexte');
            btn.innerText = "La graine s'envole..."; btn.disabled = true;

            const d = {
                date: new Date().toLocaleDateString('fr-FR'),
                type: document.getElementById('categorie').value,
                sousType: document.getElementById('sousCategorie').value,
                nom: document.getElementById('nom').value,
                localisation: document.getElementById('ville').value,
                message: document.getElementById('message').value,
                validite: document.getElementById('validite').value
            };

            fetch(URL_SHEETS, { method: 'POST', mode: 'no-cors', body: JSON.stringify(d) })
            .then(() => { alert("Semis réussi !"); window.location.href="jardin.html"; });
        });
    </script>
</body>
</html>
