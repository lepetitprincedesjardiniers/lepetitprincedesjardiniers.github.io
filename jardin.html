<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Jardin de la Fraternité - Registre</title>
    <style>
        /* --- STYLE DE BASE --- */
        body { font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; background-color: #FFFF00; color: #000080; min-height: 100vh; padding-bottom: 80px; transition: background 0.3s, color 0.3s; }
        .top-bar { position: relative; width: 100%; min-height: 50px; background: rgba(255,255,255,0.3); padding: 5px 0; display: flex; justify-content: center; align-items: center; }
        
        /* TRADUCTEUR REMIS EN HAUT A GAUCHE ET BIEN VISIBLE */
        #google_translate_element { position: absolute; left: 10px; top: 10px; z-index: 2000; transform: scale(0.85); transform-origin: top left; }

        .menu-table { margin: 5px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; }
        .menu-table td { padding: 8px 15px; border: 1px solid #FFFFFF; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; font-size: 0.85em; }

        #btn-mode { position: absolute; right: 10px; top: 10px; background: #444; color: #FFD700; border: 1px solid #222; border-radius: 5px; cursor: pointer; font-size: 14px; padding: 2px 5px; z-index: 1001; }

        .phrase-rose { color: #ff1493; font-weight: bold; font-size: 1.1em; text-shadow: 1px 1px 2px #ff69b4; margin-top: 5px; }
        .phrase-sous { color: #000080; font-weight: bold; margin: 1px 0; font-size: 0.9em; }

        /* --- MOTEUR DE RECHERCHE --- */
        .search-box { background: #008080; padding: 15px; margin: 10px auto; max-width: 95%; width: 1100px; border-radius: 25px; color: white; box-shadow: 0 8px 20px rgba(0,0,0,0.2); border: 3px solid #fff; }
        .search-container { display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .search-main-input { width: 90%; padding: 12px; border-radius: 15px; border: none; font-size: 1em; text-align: center; font-weight: bold; color: #004D40; }
        .search-row { display: flex; gap: 10px; width: 90%; justify-content: center; }
        .search-item { display: flex; flex-direction: column; width: 45%; }
        .search-item input { padding: 8px; border-radius: 10px; border: none; text-align: center; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
        .btn-filtre-rapide { background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-family: 'Comic Sans MS'; font-size: 0.8em; transition: 0.3s; }
        .btn-filtre-rapide.actif { background: #fff !important; color: #008080 !important; font-weight: bold; }

        /* --- GRILLE --- */
        .mur-reel { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 10px; padding: 10px; max-width: 98vw; margin: 0 auto; }
        @media (max-width: 768px) { .mur-reel { grid-template-columns: repeat(2, 1fr); } }

        /* CARTES ET SCROLLBARS */
        .carte-message { background: white; border: 2px solid #008080; border-radius: 10px; padding: 8px; box-shadow: 3px 3px 0px #008080; display: flex; flex-direction: column; height: 300px; cursor: pointer; position: relative; overflow: hidden; text-align: left; }
        .nom-prenom { color: #2E7D32; font-weight: bold; font-size: 0.8em; border-bottom: 1px solid #eee; margin-bottom: 3px; }
        .rubrique-tag { font-size: 0.55em; background: #ff1493; color: white; padding: 1px 4px; border-radius: 5px; position: absolute; top: 5px; right: 5px; }
        
        .texte-annonce { flex-grow: 1; font-style: italic; color: #000080; overflow-y: auto; font-size: 0.75em; margin: 5px 0; line-height: 1.2; padding-right: 5px; scrollbar-width: thin; }
        .texte-annonce::-webkit-scrollbar { width: 4px; }
        .texte-annonce::-webkit-scrollbar-thumb { background: #008080; border-radius: 10px; }

        .btn-arrosage { background: #E1F5FE; border: 1px solid #00BFFF; border-radius: 8px; color: #0277BD; font-size: 0.75em; padding: 5px; cursor: pointer; margin: 4px 0; font-weight: bold; width: 100%; }
        .details-bas { font-size: 0.75em; color: #444; line-height: 1.3; border-top: 1px solid #eee; padding-top: 5px; background: white; }

        /* FOND SOMBRE ET ETOILES */
        body.dark-mode { background-color: #0a0a1a; color: #e0e0e0; }
        .star { position: fixed; background: white; border-radius: 50%; opacity: 0; pointer-events: none; animation: twinkle var(--d) infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        #fond-sombre { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; }
        .message-geant { background: #FFFFF0; width: 95%; max-width: 800px; padding: 25px; border-radius: 25px; border: 8px solid #008080; position: relative; max-height: 80vh; overflow-y: auto; }
        .bouton-fermer { position: absolute; top: 15px; right: 15px; background: #FF1493; color: white; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; border: 2px solid white; font-weight: bold; }
        
        .fleur-pluie { position: fixed; pointer-events: none; font-size: 20px; z-index: 9999; animation: monter 3s linear forwards; }
        @keyframes monter { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100vh); opacity: 0; } }
        .copyright-link { color: #008080; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div id="google_translate_element"></div>
        <table class="menu-table">
            <tr>
                <td><a href="index.html">Accueil</a></td>
                <td><a href="formulaire.html">Semer</a></td>
                <td><a href="jardin.html">Le Jardin</a></td>
                <td><a href="impots.html">Impôts Publics</a></td>
                <td><a href="regulation.html">Régulation</a></td>
                <td><a href="aide.html">Aide</a></td>
            </tr>
        </table>
        <button id="btn-mode" onclick="basculerModeSombre()">🏮</button>
    </div>

    <h2 style="color:#2E7D32; margin: 10px 0;">🍃 Le Jardin des Cadeaux Existentiels 🍃</h2>
    <div class="phrase-rose">Bienvenue au Jardin des Dons entiers</div>
    <div class="phrase-sous">Talents, savoirs, objets et fraternité.</div>

    <div class="search-box">
        <div class="search-container">
            <input type="text" id="searchKeyword" class="search-main-input" onkeyup="executerFiltrage()" placeholder="🔍 Recherche par la première lettre de l'annonce...">
            <div class="search-row">
                <div class="search-item"><input type="text" id="searchPays" onkeyup="executerFiltrage()" placeholder="📍 Pays"></div>
                <div class="search-item"><input type="text" id="searchVille" onkeyup="executerFiltrage()" placeholder="🏙️ Ville"></div>
            </div>
            <div class="btn-group">
                <button class="btn-filtre-rapide" onclick="rechercheRapide('Savoir', this)">🎓 Savoir</button>
                <button class="btn-filtre-rapide" onclick="rechercheRapide('Citoyenne', this)">🏛️ Vie Citoyenne</button>
                <button class="btn-filtre-rapide" onclick="rechercheRapide('Harmonie', this)">🤝 Aide & Harmonie</button>
                <button class="btn-filtre-rapide" onclick="rechercheRapide('Régulation', this)">⚖️ Régulation</button>
                <button class="btn-filtre-rapide" onclick="rechercheRapide('Trésor', this)">💰 Trésor Public</button>
                <button class="btn-filtre-rapide" onclick="rechercheRapide('Autre', this)">✨ Autre domaine</button>
                <button class="btn-filtre-rapide btn-reset" onclick="resetRecherche()">🔄 Tout voir</button>
            </div>
        </div>
    </div>

    <h3 id="titre-registre" style="color: #008080;">📖 Registre de la Fraternité</h3>
    <div id="mur-messages" class="mur-reel"></div>

    <div class="phrase-etoiles" id="phrase-petit-prince" style="font-style: italic; color: #2E7D32; margin: 20px;"></div>

    <div id="fond-sombre" onclick="fermerGrandMessage()">
        <div class="message-geant" onclick="event.stopPropagation()">
            <button class="bouton-fermer" onclick="fermerGrandMessage()">X</button>
            <div id="geant-contenu"></div>
        </div>
    </div>

    <div class="footer-copyright">
        <a href="merci.html" class="copyright-link" onmousemove="creerFleur(event)">© 2000 Le petit prince des jardiniers</a>
    </div>

    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        const SCRIPT_URL = "annonces.json";
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxz40XE2KiPXTNZsW-mIg-fm55EivK0r9wzZ5ECFRdEIY53nYH9nLGYRoI71OX93oII/exec";
        let toutesLesAnnonces = [], filtreTypeActuel = "";
        const mappingBoutons = { "Savoir": "SAVOIR", "Citoyenne": "VIE", "Harmonie": ["AIDE", "URGENCE"], "Régulation": "REGULATION", "Trésor": "IMPOT", "Autre": "AUTRE_CAT" };
        const nomBoutonAffiche = { "SAVOIR": "Savoir", "VIE": "Vie Citoyenne", "AIDE": "Aide & Harmonie", "URGENCE": "Aide & Harmonie", "REGULATION": "Régulation", "IMPOT": "Trésor Public", "AUTRE_CAT": "Autre domaine" };

        function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element'); }

        function basculerModeSombre() {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                for(let i=0; i<60; i++) {
                    let s = document.createElement('div'); s.className = 'star';
                    s.style.left = Math.random()*100+'vw'; s.style.top = Math.random()*100+'vh';
                    s.style.width = s.style.height = Math.random()*3+'px';
                    s.style.setProperty('--d', (Math.random()*3+2)+'s');
                    document.body.appendChild(s);
                }
            } else { document.querySelectorAll('.star').forEach(s => s.remove()); }
        }

        async function chargerAnnonces() {
            const response = await fetch(SCRIPT_URL + "?v=" + Date.now());
            toutesLesAnnonces = await response.json();
            document.getElementById('phrase-petit-prince').innerHTML = `✨ Aujourd'hui, le Petit Prince a aidé <b>0</b> fleurs fatiguées à rejoindre les étoiles pour laisser la place aux nouvelles pousses du monde entier...`;
            executerFiltrage();
        }

        function executerFiltrage() {
            const pi = document.getElementById('searchPays').value.toLowerCase();
            const vi = document.getElementById('searchVille').value.toLowerCase();
            const mi = document.getElementById('searchKeyword').value.toLowerCase();

            const filtrées = toutesLesAnnonces.filter(ann => {
                const matchP = pi === "" || (ann.pays_select || "").toLowerCase().startsWith(pi);
                const matchV = vi === "" || (ann.localisation || "").toLowerCase().startsWith(vi);
                
                // NOUVELLE LOGIQUE : Recherche par le début de l'annonce (startsWith)
                const texteMsg = (ann.message || "").toLowerCase();
                const matchM = mi === "" || texteMsg.startsWith(mi);
                
                let matchT = true;
                if (filtreTypeActuel !== "") {
                    const c = mappingBoutons[filtreTypeActuel];
                    matchT = Array.isArray(c) ? c.includes(ann.type) : ann.type === c;
                }
                return matchP && matchV && matchM && matchT;
            });

            const cont = document.getElementById('mur-messages');
            cont.innerHTML = "";
            filtrées.forEach(ann => {
                const d = document.createElement('div');
                d.className = 'carte-message';
                d.onclick = () => ouvrirGrandMessage(ann);
                d.innerHTML = `
                    <div class="nom-prenom">${ann.nom || "Anonyme"}</div>
                    <div class="rubrique-tag">${nomBoutonAffiche[ann.type] || "Graine"}</div>
                    <div class="texte-annonce">"${ann.message}"</div>
                    <div class="details-bas">
                        <button class="btn-arrosage" onclick="arroser(event, '${ann.Horodateur}', this)">💧 Arroser (${ann.votes_arrosage || 0})</button>
                        📍 Localisation : ${ann.localisation || 'N/C'}<br>
                        📍 Pays : ${ann.pays_select || 'N/C'}<br>
                        🌍 Portée : ${ann.portee || 'Locale'}<br>
                        🚚 Logistique : ${ann.logistique || 'Main Propre'}
                    </div>
                `;
                cont.appendChild(d);
            });
        }

        async function arroser(e, id, btn) {
            e.stopPropagation();
            btn.innerHTML = "Merci ! la pluie arrose cette annonce 24h";
            btn.style.background = "#C8E6C9";
            const fd = new URLSearchParams(); fd.append('action', 'arroser'); fd.append('id', id);
            fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: fd });
        }

        function ouvrirGrandMessage(ann) {
            document.getElementById('geant-contenu').innerHTML = `
                <div style="font-size:1.8em; color:#2E7D32; font-weight:bold; border-bottom:3px solid #008080; margin-bottom:20px;">🌱 Offrande de ${ann.nom || "Anonyme"}</div>
                <div style="background:white; padding:25px; border-radius:15px; border-left:10px solid #FF1493; font-size:1.4em; color:#000080; text-align:left; margin-bottom:20px;">"${ann.message}"</div>
                <div style="text-align:left; background:#E0F2F1; padding:20px; border-radius:10px; font-size:1.1em;">
                    <strong>📍 Localisation :</strong> ${ann.localisation || "N/C"}<br>
                    <strong>📍 Pays :</strong> ${ann.pays_select || "N/C"}<br>
                    <strong>🌍 Portée :</strong> ${ann.portee || "Locale"}<br>
                    <strong>🚚 Logistique :</strong> ${ann.logistique || "Main Propre"}
                </div>
            `;
            document.getElementById('fond-sombre').style.display = 'flex';
        }

        function rechercheRapide(t, el) {
            document.querySelectorAll('.btn-filtre-rapide').forEach(b => b.classList.remove('actif'));
            filtreTypeActuel = (filtreTypeActuel === t) ? "" : t;
            if(filtreTypeActuel) el.classList.add('actif');
            executerFiltrage();
        }

        function resetRecherche() {
            document.getElementById('searchKeyword').value = ""; document.getElementById('searchPays').value = ""; document.getElementById('searchVille').value = "";
            filtreTypeActuel = ""; document.querySelectorAll('.btn-filtre-rapide').forEach(b => b.classList.remove('actif'));
            executerFiltrage();
        }

        function fermerGrandMessage() { document.getElementById('fond-sombre').style.display = 'none'; }
        function creerFleur(e) {
            if (Math.random() > 0.05) return;
            const f = document.createElement('div'); f.className = 'fleur-pluie'; f.innerText = '🌸';
            f.style.left = e.clientX + 'px'; f.style.top = e.clientY + 'px';
            document.body.appendChild(f); setTimeout(() => f.remove(), 3000);
        }

        window.onload = chargerAnnonces;
    </script>
</body>
</html>
