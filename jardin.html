<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Jardin de la Fraternité - Registre</title>
    <style>
        /* --- STYLE DE BASE (RÉTABLI) --- */
        body { font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; background-color: #FFFF00; color: #000080; overflow-x: hidden; min-height: 100vh; padding-bottom: 80px; }

        .top-bar { position: relative; width: 100%; min-height: 40px; background: rgba(255,255,255,0.3); padding: 5px 0; }
        #google_translate_element { position: absolute; left: 10px; top: 10px; transform: scale(0.8); transform-origin: top left; }
        
        .menu-table { margin: 5px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; }
        .menu-table td { padding: 8px 15px; border: 1px solid #FFFFFF; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; font-size: 0.85em; }
        .menu-table td:hover { background-color: #006666; box-shadow: 0 0 10px #FFFFFF; }

        .phrase-rose { color: #ff1493; font-weight: bold; font-size: 1.1em; text-shadow: 1px 1px 2px #ff69b4; animation: eclat 1.5s infinite alternate; margin-top: 5px; }
        @keyframes eclat { from { opacity: 0.7; } to { opacity: 1; } }

        /* ZONE DÉCO HAUTE */
        #jardin-sacre { position: relative; height: 100px; width: 100%; overflow: hidden; background: rgba(255,255,255,0.1); }
        .fleur-clonée { position: absolute; font-size: 25px; animation: apparitionFleur 1s ease-out forwards; }
        @keyframes apparitionFleur { 0% { transform: scale(0) rotate(-50deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }

        /* PLUIE DE FLEURS */
        .fleur-etoile { position: fixed; pointer-events: none; z-index: 999; font-size: 15px; animation: volEtoile linear infinite; opacity: 0.8; }
        @keyframes volEtoile {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(200px, 1000px) rotate(360deg); }
        }

        /* OISEAUX ET MESSAGES (LOGIQUE ORIGINALE) */
        #animal-container { position: fixed; z-index: 900; white-space: nowrap; display: flex; align-items: center; pointer-events: none; top: 50px; }
        #corps-animal { font-size: 50px; order: 1; pointer-events: auto; cursor: pointer; }
        #bulle-texte { order: 2; background: rgba(255, 255, 255, 0.9); border-radius: 15px; padding: 8px 15px; font-style: italic; color: #2E7D32; margin-left: 10px; font-weight: bold; border: 2px solid #2E7D32; opacity: 0; transition: opacity 0.3s; max-width: 250px; white-space: normal; }

        /* CARTES ET ZOOM */
        .mur-reel { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; padding: 10px; max-width: 1200px; margin: 0 auto; }
        .carte-message { background: white; border: 3px solid #008080; border-radius: 12px; padding: 12px; box-shadow: 4px 4px 0px #008080; cursor: pointer; transition: 0.3s; height: 160px; overflow: hidden; text-align: left; }
        .carte-message:hover { transform: scale(1.02); }

        #fond-sombre { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; }
        .message-geant { background: #FFFFF0; width: 90%; max-width: 800px; padding: 30px; border-radius: 20px; border: 8px solid #008080; position: relative; }

        /* COPYRIGHT HYPERTEXTE (RÉTABLI) */
        .copyright-wrapper { position: fixed; bottom: 5px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.6); padding: 3px 10px; border-radius: 15px; z-index: 1000; border: 1px solid rgba(0,128,128,0.3); font-size: 0.7em; }
        .copyright-wrapper a { color: #008080; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .copyright-wrapper a:hover { color: #ff1493; text-shadow: 0 0 5px #ff1493; }

        /* MOTEUR DE RECHERCHE */
        .search-box { background: #008080; padding: 10px; margin: 10px auto; max-width: 600px; border-radius: 15px; color: white; }
        .search-box input { padding: 5px; border-radius: 5px; border: none; margin: 5px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div id="google_translate_element"></div>
        <table class="menu-table">
            <tr>
                <td><a href="index.html">Accueil</a></td>
                <td><a href="formulaire.html">Semer</a></td>
                <td><a href="jardin.html">Le Jardin</a></td>
                <td><a href="impots.html">Impôts Publics</a></td>
                <td><a href="regulation.html">Régulation</a></td>
                <td><a href="aide.html">Aide</a></td>
            </tr>
        </table>
    </div>

    <audio id="chantOiseaux" loop src="oiseaux.mp3"></audio>

    <h2 style="color:#2E7D32;">🍃 Le Jardin des Cadeaux Existentiels 🍃</h2>
    <div class="phrase-rose">Bienvenue au Jardin ensoleilleur des Dons entiers</div>

    <div id="jardin-sacre"></div>

    <div class="search-box">
        <input type="text" id="searchVille" onkeyup="filtrer()" placeholder="Ville...">
        <input type="text" id="searchPays" onkeyup="filtrer()" placeholder="Pays...">
        <input type="text" id="searchKeyword" onkeyup="filtrer()" placeholder="Mots-clés...">
    </div>

    <div id="mur-messages" class="mur-reel"></div>

    <div id="fond-sombre" onclick="this.style.display='none'"><div class="message-geant" id="geant-contenu"></div></div>

    <div id="animal-container">
        <div id="corps-animal" onclick="exploser(this)">🕊️</div>
        <div id="bulle-texte"></div>
    </div>

    <div class="copyright-wrapper">
        <a href="copyright.html">© 2024-2025 Le Jardin de la Fraternité - Tous droits réservés</a>
    </div>

    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element'); }

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxz40XE2KiPXTNZsW-mIg-fm55EivK0r9wzZ5ECFRdEIY53nYH9nLGYRoI71OX93oII/exec";
        let annonces = [];

        async function charger() {
            const res = await fetch(SCRIPT_URL);
            annonces = await res.json();
            afficher(annonces);
            document.body.onclick = () => document.getElementById('chantOiseaux').play();
        }

        function afficher(data) {
            const m = document.getElementById('mur-messages');
            m.innerHTML = '';
            data.forEach(a => {
                const d = a.date ? new Date(a.date).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'}) : "Récent";
                const div = document.createElement('div');
                div.className = 'carte-message';
                div.onclick = () => {
                    document.getElementById('geant-contenu').innerHTML = `<h2>${a.nom}</h2><p>${a.message}</p><small>${d} - ${a.ville}</small>`;
                    document.getElementById('fond-sombre').style.display = 'flex';
                };
                div.innerHTML = `<strong>${a.nom}</strong><br><small>${d}</small><p>${a.message}</p>`;
                m.appendChild(div);
            });
        }

        function filtrer() {
            const v = document.getElementById('searchVille').value.toLowerCase();
            const p = document.getElementById('searchPays').value.toLowerCase();
            const k = document.getElementById('searchKeyword').value.toLowerCase();
            afficher(annonces.filter(a => (a.ville||"").toLowerCase().includes(v) && (a.pays||"").toLowerCase().includes(p) && (a.message||"").toLowerCase().includes(k)));
        }

        // ANIMATIONS ORIGINALES
        let posX = -200;
        function vol() {
            const c = document.getElementById('animal-container');
            const b = document.getElementById('bulle-texte');
            posX += 2;
            c.style.left = posX + "px";
            if(posX > window.innerWidth) { posX = -200; c.style.top = Math.random()*200 + "px"; }
            if(Math.random() < 0.01 && b.style.opacity == 0) {
                b.innerText = "Un message pour vous...";
                b.style.opacity = 1;
                setTimeout(() => b.style.opacity = 0, 3000);
            }
            requestAnimationFrame(vol);
        }

        function exploser(el) {
            el.innerText = "✨";
            setTimeout(() => el.innerText = "🕊️", 500);
            for(let i=0; i<8; i++) {
                const f = document.createElement('div');
                f.className = 'fleur-etoile';
                f.innerText = "🌸";
                f.style.left = posX + "px"; f.style.top = document.getElementById('animal-container').style.top;
                document.body.appendChild(f);
                setTimeout(() => f.remove(), 2000);
            }
        }

        setInterval(() => {
            const f = document.createElement('div');
            f.className = 'fleur-etoile';
            f.innerText = "🌸";
            f.style.left = Math.random()*100 + "vw"; f.style.top = "-20px";
            f.style.animationDuration = "5s";
            document.body.appendChild(f);
            setTimeout(() => f.remove(), 5000);
        }, 1000);

        window.onload = () => { charger(); vol(); };
    </script>
</body>
</html>
