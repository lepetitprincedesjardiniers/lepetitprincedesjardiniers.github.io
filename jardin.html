<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadeau Existentiel</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f8ff;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* --- Animation des Fleurs --- */
        .flower {
            position: fixed;
            top: -20px;
            font-size: 20px;
            z-index: 1000;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }

        /* --- Titre Centré --- */
        h1 {
            text-align: center;
            color: #ff69b4;
            font-size: 2.5rem;
            margin: 20px;
            max-width: 80%;
            /* Suppression de la ligne pointillée ici */
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Le cadeau... existentiel</h1>
    </div>

    <script>
        function createFlower() {
            const flowers = ['🌸', '🌼', '🌺', '🌻', '🌷'];
            const flower = document.createElement('div');
            flower.className = 'flower';
            flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
            
            // Position aléatoire en haut
            flower.style.left = Math.random() * 100 + 'vw';
            // Durée de chute aléatoire
            flower.style.animationDuration = Math.random() * 3 + 2 + 's';
            // Taille aléatoire
            flower.style.fontSize = Math.random() * 10 + 15 + 'px';
            
            document.body.appendChild(flower);

            // Supprimer la fleur après l'animation
            setTimeout(() => {
                flower.remove();
            }, 5000);
        }

        // Générer des fleurs à intervalle régulier
        setInterval(createFlower, 300);
    </script>
</body>
</html>
