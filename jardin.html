<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Jardin de la Fraternité - Registre</title>
    <style>
        /* --- STYLE DE BASE INTÉGRAL --- */
        body { font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; background-color: #FFFF00; color: #000080; overflow-x: hidden; min-height: 100vh; padding-bottom: 80px; }

        .top-bar { position: relative; width: 100%; min-height: 40px; background: rgba(255,255,255,0.3); padding: 5px 0; }
        #google_translate_element { position: absolute; left: 10px; top: 10px; transform: scale(0.8); transform-origin: top left; }
        
        .menu-table { margin: 5px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; }
        .menu-table td { padding: 8px 15px; border: 1px solid #FFFFFF; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; font-size: 0.85em; }
        .menu-table td:hover { background-color: #006666; box-shadow: 0 0 10px #FFFFFF; }

        .phrase-rose { color: #ff1493; font-weight: bold; font-size: 1.1em; text-shadow: 1px 1px 2px #ff69b4; animation: eclat 1.5s infinite alternate; margin-top: 5px; }
        @keyframes eclat { from { opacity: 0.7; } to { opacity: 1; } }
        .phrase-sous { color: #000080; font-weight: bold; margin: 1px 0; font-size: 0.9em; }

        /* DÉCORATIONS FLORALES HAUTES */
        #jardin-sacre { position: relative; height: 100px; width: 100%; overflow: hidden; background: rgba(255,255,255,0.1); margin-top: 5px; }
        .fleur-clonée { position: absolute; font-size: 25px; animation: apparitionFleur 1s ease-out forwards; }
        @keyframes apparitionFleur { 0% { transform: scale(0) rotate(-50deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }

        /* PLUIE DE FLEURS */
        .fleur-etoile { position: fixed; pointer-events: none; z-index: 999; font-size: 15px; animation: volEtoile linear infinite; opacity: 0.8; top: -50px; }
        @keyframes volEtoile {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        /* MOTEUR DE RECHERCHE */
        .search-box { background: #008080; padding: 12px; margin: 10px auto 10px auto; max-width: 700px; border-radius: 20px; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative; z-index: 10; }
        .search-container { display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .search-row { display: flex; gap: 10px; width: 95%; max-width: 550px; }
        .search-item { display: flex; flex-direction: column; align-items: center; width: 100%; }
        .search-item label { font-size: 0.8em; margin-bottom: 3px; font-weight: bold; }
        .search-item input { padding: 8px; border-radius: 10px; border: 2px solid transparent; outline: none; text-align: center; color: #004D40; font-weight: bold; width: 100%; }

        /* EFFETS FOCUS */
        .effet-croissance:focus { transform: scale(1.03); background: #e0f2f1; }
        .effet-lueur:focus { box-shadow: 0 0 10px #FFD700; border-color: #FFD700; }
        .effet-secousse:focus { animation: shake 0.3s; }
        @keyframes shake { 0%, 100% {transform:translateX(0)} 25% {transform:translateX(-3px)} 75% {transform:translateX(3px)} }

        /* CARTES DU REGISTRE */
        .mur-reel { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; padding: 10px; max-width: 1200px; margin: 0 auto 50px auto; }
        .carte-message { 
            background: white; border: 3px solid #008080; border-radius: 12px; padding: 12px; 
            box-shadow: 4px 4px 0px #008080; cursor: pointer; text-align: left; font-size: 0.85em; 
            height: 190px; overflow-y: auto; white-space: pre-wrap;
        }

        /* OISEAUX ET BULLES */
        #animal-container { position: fixed; z-index: 900; display: flex; align-items: center; pointer-events: none; top: 50%; left: -100px; }
        #corps-animal { font-size: 50px; }
        #bulle-texte { background: white; border: 2px solid #2E7D32; border-radius: 15px; padding: 5px 10px; font-weight: bold; opacity: 0; transition: 0.5s; margin-left: 10px; color: #2E7D32; max-width: 150px; }

        /* COPYRIGHT */
        .copyright-wrapper { position: fixed; bottom: 5px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.7); padding: 3px 15px; border-radius: 20px; border: 1px solid #008080; font-size: 0.7em; z-index: 1000; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div id="google_translate_element"></div>
        <table class="menu-table">
            <tr>
                <td><a href="index.html">Accueil</a></td>
                <td><a href="formulaire.html">Semer</a></td>
                <td><a href="jardin.html">Le Jardin</a></td>
                <td><a href="impots.html">Impôts Publics</a></td>
                <td><a href="regulation.html">Régulation</a></td>
                <td><a href="aide.html">Aide</a></td>
            </tr>
        </table>
    </div>

    <audio id="chantOiseaux" loop><source src="oiseaux.mp3" type="audio/mpeg"></audio>

    <h2 style="color:#2E7D32; margin: 5px 0;">🍃 Le Jardin des Cadeaux Existentiels 🍃</h2>
    <div class="phrase-rose">Bienvenue au Jardin ensoleilleur des Dons entiers :</div>
    <p class="phrase-sous">Les talents, les créations, les savoirs, les offrandes... Une pure joie altruiste.</p>

    <div id="jardin-sacre"></div>

    <div class="search-box">
        <div class="search-container">
            <div class="search-row">
                <div class="search-item">
                    <label>Ville</label>
                    <input type="text" id="searchVille" onkeyup="filtrerAnnonces()" onfocus="focusEffet(this)" placeholder="Chercher ville...">
                </div>
                <div class="search-item">
                    <label>Pays</label>
                    <input type="text" id="searchPays" onkeyup="filtrerAnnonces()" onfocus="focusEffet(this)" placeholder="Chercher pays...">
                </div>
            </div>
            <div class="search-item" style="width:95%">
                <label>Mots-clés (Quoi ? Pourquoi ?)</label>
                <input type="text" id="searchKeyword" onkeyup="filtrerAnnonces()" onfocus="focusEffet(this)" placeholder="Une envie, un don...">
            </div>
        </div>
    </div>

    <div id="chargement">✨ Récolte en cours...</div>
    <div class="mur-reel" id="mur-messages"></div>

    <div id="animal-container">
        <div id="corps-animal">🕊️</div>
        <div id="bulle-texte"></div>
    </div>

    <div class="copyright-wrapper">© 2024-2025 Le Jardin de la Fraternité</div>

    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script>
        function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element'); }

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxz40XE2KiPXTNZsW-mIg-fm55EivK0r9wzZ5ECFRdEIY53nYH9nLGYRoI71OX93oII/exec";
        let toutesLesAnnonces = [];

        function focusEffet(el) {
            const effets = ['effet-croissance', 'effet-lueur', 'effet-secousse'];
            effets.forEach(ef => el.classList.remove(ef));
            el.classList.add(effets[Math.floor(Math.random()*effets.length)]);
        }

        async function chargerAnnonces() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                toutesLesAnnonces = data.reverse();
                afficherAnnonces(toutesLesAnnonces);
                document.getElementById('chargement').style.display = 'none';
            } catch (e) { document.getElementById('chargement').innerText = "Erreur de connexion."; }
        }

        function afficherAnnonces(annonces) {
            const conteneur = document.getElementById('mur-messages');
            conteneur.innerHTML = '';
            annonces.forEach(ann => {
                // CORRECTION DATE PUBLICATION
                let dateAffichee = "Récemment";
                if(ann.date) {
                    let d = new Date(ann.date);
                    if(!isNaN(d)) dateAffichee = d.toLocaleDateString('fr-FR');
                }

                const carte = document.createElement('div');
                carte.className = 'carte-message';
                carte.innerHTML = `
                    <div style="font-weight:bold;color:#2E7D32;">${ann.nom || "Anonyme"}</div>
                    <div style="color:#000080;margin:8px 0;font-weight:bold;">"${ann.message || ""}"</div>
                    <div style="font-size:0.75em;color:#666;border-top:1px solid #eee;padding-top:5px;">
                        📍 ${ann.ville || ""} (${ann.pays || ""})<br>
                        🏠 Lieu: ${ann.rayon || "N/A"}<br>
                        ⌛ Validité: ${(ann.duree || "").replace(/_/g, " ")}<br>
                        📅 Publié le : ${dateAffichee}
                    </div>
                `;
                conteneur.appendChild(carte);
            });
        }

        function filtrerAnnonces() {
            const v = document.getElementById('searchVille').value.toLowerCase();
            const p = document.getElementById('searchPays').value.toLowerCase();
            const k = document.getElementById('searchKeyword').value.toLowerCase();
            const filtered = toutesLesAnnonces.filter(ann => {
                return (ann.ville||"").toLowerCase().includes(v) && 
                       (ann.pays||"").toLowerCase().includes(p) && 
                       ((ann.message||"").toLowerCase().includes(k) || (ann.nom||"").toLowerCase().includes(k));
            });
            afficherAnnonces(filtered);
        }

        // ANIMATIONS DÉCO RÉTABLIES
        function lancerAnimations() {
            // Pluie de fleurs
            setInterval(() => {
                const f = document.createElement('div');
                f.className = 'fleur-etoile';
                f.innerText = ['🌸', '🌼', '🌻', '🌺', '🌷'][Math.floor(Math.random()*5)];
                f.style.left = Math.random() * 100 + "vw";
                f.style.animationDuration = (Math.random()*5 + 5) + "s";
                document.body.appendChild(f);
                setTimeout(() => f.remove(), 10000);
            }, 1500);

            // Oiseaux porteurs
            const oiseau = document.getElementById('animal-container');
            const bulle = document.getElementById('bulle-texte');
            let pos = -100;
            setInterval(() => {
                pos += 2;
                oiseau.style.left = pos + "px";
                if(pos > window.innerWidth + 100) pos = -100;
                if(Math.random() < 0.01) {
                    bulle.innerText = "La fraternité grandit...";
                    bulle.style.opacity = 1;
                    setTimeout(() => bulle.style.opacity = 0, 3000);
                }
            }, 30);
        }

        window.onload = () => { chargerAnnonces(); lancerAnimations(); };
    </script>
</body>
</html>
