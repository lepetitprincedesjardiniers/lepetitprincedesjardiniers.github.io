<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Jardin de la Fraternité - Registre</title>
    <style>
        /* --- STYLE CONSERVÉ --- */
        body { font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; background-color: #FFFF00; color: #000080; overflow-x: hidden; min-height: 100vh; padding-bottom: 80px; }
        .top-bar { position: relative; width: 100%; min-height: 40px; background: rgba(255,255,255,0.3); padding: 5px 0; }
        #google_translate_element { position: absolute; left: 10px; top: 10px; transform: scale(0.8); transform-origin: top left; }
        .menu-table { margin: 5px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; }
        .menu-table td { padding: 8px 15px; border: 1px solid #FFFFFF; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; font-size: 0.85em; }
        .phrase-rose { color: #ff1493; font-weight: bold; font-size: 1.1em; text-shadow: 1px 1px 2px #ff69b4; animation: eclat 1.5s infinite alternate; margin-top: 5px; }
        @keyframes eclat { from { opacity: 0.7; } to { opacity: 1; } }
        .phrase-sous { color: #000080; font-weight: bold; margin: 1px 0; font-size: 0.9em; }
        
        #jardin-sacre { position: relative; height: 100px; width: 100%; overflow: hidden; background: rgba(255,255,255,0.1); margin-top: 5px; }
        .fleur-clonée { position: absolute; font-size: 25px; animation: apparitionFleur 1s ease-out forwards; }
        @keyframes apparitionFleur { 0% { transform: scale(0) rotate(-50deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }

        .search-box { background: #008080; padding: 12px; margin: 10px auto; max-width: 700px; border-radius: 20px; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .search-container { display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .search-row { display: flex; gap: 10px; width: 90%; }
        .search-item { display: flex; flex-direction: column; width: 100%; }
        .search-item input { padding: 8px; border-radius: 10px; border: none; text-align: center; font-family: 'Comic Sans MS'; }

        .mur-reel { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; padding: 15px; max-width: 1200px; margin: 0 auto; }
        .carte-message { 
            background: white; border: 3px solid #008080; border-radius: 15px; padding: 12px; 
            box-shadow: 5px 5px 0px #008080; transition: 0.3s; text-align: left; cursor: pointer;
            display: flex; flex-direction: column; min-height: 250px;
        }
        .carte-message:hover { transform: translateY(-5px); border-color: #ff1493; }
        
        /* STYLE POUR LES PRÉCISIONS EN BAS */
        .details-bas { 
            margin-top: auto; padding-top: 10px; border-top: 1px dashed #ccc; 
            font-size: 0.75em; color: #555; line-height: 1.4;
        }
        .badge-type { background: #E0F2F1; color: #00695C; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.9em; margin-bottom: 5px; display: inline-block; }

        .copyright-wrapper { position: fixed; bottom: 5px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.7); padding: 5px 15px; border-radius: 15px; border: 2px solid #ff1493; z-index: 1000; }
        .copyright-wrapper a { text-decoration: none; color: #ff1493; font-weight: bold; }

        #animal-container { position: fixed; z-index: 900; pointer-events: none; transition: all 5s ease-in-out; font-size: 30px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div id="google_translate_element"></div>
        <table class="menu-table">
            <tr>
                <td><a href="index.html">Accueil</a></td>
                <td><a href="formulaire.html">Semer</a></td>
                <td><a href="jardin.html">Le Jardin</a></td>
                <td><a href="impots.html">Impôts Publics</a></td>
                <td><a href="regulation.html">Régulation</a></td>
                <td><a href="aide.html">Aide</a></td>
            </tr>
        </table>
    </div>

    <h2 style="color:#2E7D32;">🍃 Le Jardin de la Fraternité 🍃</h2>
    <div class="phrase-rose">Bienvenue au Jardin ensoleilleur des Dons entiers :</div>
    <div class="phrase-sous">Les talents, les créations, les savoirs, les offrandes...</div>

    <div id="jardin-sacre"></div>

    <div class="search-box">
        <div class="search-container">
            <div class="search-row">
                <div class="search-item"><label>Pays</label><input type="text" id="searchPays" onkeyup="filtrer()"></div>
                <div class="search-item"><label>Ville</label><input type="text" id="searchVille" onkeyup="filtrer()"></div>
            </div>
            <div style="width:90%"><label>Rechercher un mot-clé</label><br>
            <input type="text" id="searchKeyword" style="width:100%; padding:8px; border-radius:10px; border:none;" onkeyup="filtrer()" placeholder="Ex: musique, potager, aide..."></div>
        </div>
    </div>

    <div id="chargement">✨ Récolte des messages en cours...</div>
    <div class="mur-reel" id="mur-messages"></div>

    <div class="copyright-wrapper">
        <a href="transition-externe.html">© Le Petit Prince des Jardiniers 🌹</a>
    </div>

    <div id="animal-container">🕊️</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxz40XE2KiPXTNZsW-mIg-fm55EivK0r9wzZ5ECFRdEIY53nYH9nLGYRoI71OX93oII/exec"; 
    let toutesLesAnnonces = [];

    // --- FONCTION POUR TROUVER LE TEXTE QUEL QUE SOIT LE NOM DE LA COLONNE ---
    function trouverLeTexte(ann) {
        return ann.sub_precision || ann.message || ann.offre || ann.description || ann.Message || "Graine de fraternité sans texte";
    }

    async function chargerAnnonces() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            toutesLesAnnonces = data.reverse();
            document.getElementById('chargement').style.display = 'none';
            afficher(toutesLesAnnonces);
        } catch (e) { document.getElementById('chargement').innerText = "Erreur de connexion au jardin."; }
    }

    function afficher(liste) {
        const conteneur = document.getElementById('mur-messages');
        conteneur.innerHTML = '';
        liste.forEach(ann => {
            const carte = document.createElement('div');
            carte.className = 'carte-message';
            
            const texteAnnonce = trouverLeTexte(ann);
            
            carte.innerHTML = `
                <div style="font-weight:bold;color:#2E7D32;font-size:1.1em;">${ann.nom || "Anonyme"}</div>
                <div class="badge-type">${ann.rubrique || "Don Entier"}</div>
                
                <div style="color:#000080; font-weight:bold; font-style:italic; margin: 10px 0;">
                    "${texteAnnonce}"
                </div>

                <div class="details-bas">
                    📅 <b>Date :</b> ${ann.timestamp || "Récemment"}<br>
                    ⏳ <b>Validité :</b> ${ann.duree_validite || "Permanente"}<br>
                    🌍 <b>Pays :</b> ${ann.pays_select || ann.pays || "Terre"}<br>
                    📍 <b>Lieu :</b> ${ann.localisation || ann.ville || "Partout"}<br>
                    🚀 <b>Rayon :</b> ${ann.rayon_action || "Local"}
                </div>
            `;
            conteneur.appendChild(carte);
        });
    }

    function filtrer() {
        const p = document.getElementById('searchPays').value.toLowerCase();
        const v = document.getElementById('searchVille').value.toLowerCase();
        const k = document.getElementById('searchKeyword').value.toLowerCase();

        const filtres = toutesLesAnnonces.filter(ann => {
            const texte = JSON.stringify(ann).toLowerCase();
            const matchPays = texte.includes(p);
            const matchVille = texte.includes(v);
            const matchKey = texte.includes(k);
            return matchPays && matchVille && matchKey;
        });
        afficher(filtres);
    }

    function initAnims() {
        const animal = document.getElementById('animal-container');
        setInterval(() => {
            animal.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            animal.style.top = Math.random() * (window.innerHeight - 100) + 'px';
        }, 5000);

        const j = document.getElementById('jardin-sacre');
        for(let i=0; i<15; i++) {
            const f = document.createElement('div'); f.className = 'fleur-clonée';
            f.innerHTML = '🌸'; f.style.left = Math.random()*95 + '%'; f.style.top = Math.random()*60 + 'px';
            j.appendChild(f);
        }
    }

    window.onload = () => { chargerAnnonces(); initAnims(); };
</script>

<script type="text/javascript">
    function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element'); }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
