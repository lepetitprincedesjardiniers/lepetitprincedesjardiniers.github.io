<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Jardin de la Fraternité - Registre</title>
    <meta name="description" content="Découvrez le registre du Jardin de la Fraternité : partagez vos dons, talents, savoirs et participez à l'élan de solidarité.">
    <style>
        body { font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; background-color: #FFFF00; color: #000080; min-height: 100vh; padding-bottom: 80px; transition: background 0.3s, color 0.3s; }
        .top-bar { position: relative; width: 100%; min-height: 50px; background: rgba(255,255,255,0.3); padding: 5px 0; display: flex; justify-content: center; align-items: center; }
        #google_translate_element { position: absolute; left: 10px; top: 10px; z-index: 2000; transform: scale(0.85); transform-origin: top left; }

        .menu-wrapper { position: relative; display: flex; justify-content: center; align-items: center; width: 100%; margin: 5px 0; }
        .menu-table { margin: 0 !important; border-radius: 10px; background-color: #008080; border-collapse: collapse; }
        .menu-table td { padding: 8px 15px; border: 1px solid #FFFFFF; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; font-size: 0.85em; }

        #btn-mode { position: absolute; right: 10px; top: 10px; background: #444; color: #FFD700; border: 1px solid #222; border-radius: 5px; cursor: pointer; font-size: 14px; padding: 2px 5px; z-index: 1001; }
        .phrase-rose { color: #ff1493; font-weight: bold; font-size: 1.1em; text-shadow: 1px 1px 2px #ff69b4; margin-top: 5px; }
        .phrase-sous { color: #000080; font-weight: bold; margin: 1px 0; font-size: 0.9em; }

        .search-box { background: #008080; padding: 15px; margin: 10px auto; max-width: 95%; width: 1100px; border-radius: 20px; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 2px solid #fff; }
        .search-container { display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .search-main-input { width: 90%; padding: 10px; border-radius: 12px; border: none; font-size: 0.95em; text-align: center; font-weight: bold; color: #004D40; }
        .search-row { display: flex; gap: 10px; width: 90%; justify-content: center; }
        .search-item { display: flex; flex-direction: column; width: 45%; }
        .search-item input { padding: 8px; border-radius: 10px; border: none; text-align: center; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 5px; }
        .btn-filtre-rapide { background: rgba(255,255,255,0.2); border: 2px solid white; color: white; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-family: 'Comic Sans MS'; font-size: 0.8em; transition: 0.3s; font-weight: bold; }
        .btn-filtre-rapide.actif { background: #fff !important; color: #008080 !important; font-weight: bold; }
        .btn-reset { border-color: #ffffff !important; background: rgba(255,255,255,0.1); }

        .mur-reel { display: grid; grid-template-columns: repeat(3, minmax(280px, 1fr)); gap: 20px; padding: 15px; max-width: 1200px; margin: 0 auto; align-items: start; }
        @media (max-width: 1024px) { .mur-reel { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .mur-reel { grid-template-columns: repeat(1, 1fr); } }

        .carte-message { 
            background: white; border: 1px solid #e0e0e0; border-right: 5px solid #008080; border-radius: 12px; padding: 16px; 
            box-shadow: 0 4px 14px rgba(0,0,0,0.08); display: flex; flex-direction: column; height: 400px; box-sizing: border-box;
            cursor: pointer; position: relative; overflow: hidden; text-align: left; transition: transform 0.25s ease; 
        }
        .nom-prenom { color: #2E7D32; font-weight: bold; font-size: 0.95em; border-bottom: 1px solid #f0f0f0; margin-bottom: 8px; padding-bottom: 6px; padding-right: 90px; }
        .rubrique-tag { font-size: 0.6em; color: white; padding: 3px 8px; border-radius: 6px; position: absolute; top: 12px; right: 12px; font-weight: bold; }
        .texte-annonce { flex-grow: 1; font-style: italic; color: #000080; overflow-y: auto; font-size: 0.85em; margin: 8px 0; line-height: 1.4; white-space: pre-line; word-break: break-word; }
        
        .btn-arrosage { background: #E1F5FE; border: 1px solid #00BFFF; border-radius: 8px; color: #0277BD; font-size: 0.8em; padding: 6px; cursor: pointer; margin: 4px 0; font-weight: bold; width: 100%; }
        .btn-repondre { background: #E67E22; border: 1px solid #b35900; border-radius: 8px; color: white; font-size: 0.8em; padding: 7px; cursor: pointer; margin: 4px 0; font-weight: bold; width: 100%; }
        .details-bas { font-size: 0.68em; color: #555; line-height: 1.4; border-top: 1px solid #f0f0f0; padding-top: 8px; background: white; margin-top: auto; }

        .pagination-container { display: flex; justify-content: center; align-items: center; gap: 5px; margin: 25px 0; }
        .page-btn { background: white; border: 2px solid #008080; color: #008080; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .page-btn.active { background: #008080; color: white; }

        body.dark-mode { background-color: #0a0a1a; color: #e0e0e0; }
        #fond-sombre, #modal-reponse { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; }
        .message-geant { background: #FFFFF0; width: 95%; max-width: 800px; padding: 25px; border-radius: 20px; border: 6px solid #008080; position: relative; max-height: 85vh; overflow-y: auto; color: #000; text-align: left; }
        .form-reponse-box { background: #FFFFFF; width: 90%; max-width: 500px; padding: 25px; border-radius: 20px; border: 5px solid #E67E22; position: relative; text-align: left; color: #000; }
        .bouton-fermer { position: absolute; top: 15px; right: 15px; background: #FF1493; color: white; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; border: 2px solid white; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .field-rep { width: 100%; padding: 10px; margin: 8px 0; border: 2px solid #008080; border-radius: 10px; font-family: 'Comic Sans MS'; box-sizing: border-box; }
        .btn-retour { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #34495e; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div id="google_translate_element"></div>
        <div class="menu-wrapper">
            <table class="menu-table">
                <tr>
                    <td><a href="index.html">Accueil</a></td>
                    <td><a href="formulaire.html">Semer</a></td>
                    <td><a href="jardin.html">Le Jardin</a></td>
                    <td><a href="jardin.html?cat=IMPOT">Trésor Public</a></td>
                    <td><a href="jardin.html?cat=REGULATION">Régulation</a></td>
                    <td><a href="jardin.html?cat=AIDE">Aide & Harmonie</a></td>
                    <td><a href="jardin.html?cat=SAVOIR">Savoirs</a></td>
                    <td><a href="jardin.html?cat=VIE">Vie Citoyenne</a></td>
                </tr>
            </table>
        </div>
        <button id="btn-mode" onclick="basculerModeSombre()">🏮</button>
    </div>

    <h2 style="color:#2E7D32; margin: 15px 0 5px 0;">🍃 Le Jardin des Cadeaux Existentiels 🍃</h2>
    <div class="phrase-rose">Bienvenue au Jardin des Dons entiers</div>
    <div class="phrase-sous">Talents, savoirs, objets et fraternité.</div>

    <div class="search-box">
        <div class="search-container">
            <input type="text" id="searchKeyword" class="search-main-input" onkeyup="changerFiltreEtResetPage()" placeholder="✨ Rechercher un don, un savoir...">

            <div class="search-row">
                <div class="search-item"><input type="text" id="searchPays" onkeyup="changerFiltreEtResetPage()" placeholder="📍 Pays"></div>
                <div class="search-item"><input type="text" id="searchVille" onkeyup="changerFiltreEtResetPage()" placeholder="🏙 Ville"></div>
            </div>

            <div class="btn-group">
                <button class="btn-filtre-rapide" data-cat="Savoir" onclick="rechercheRapide('Savoir', this)">🎓 Savoirs</button>
                <button class="btn-filtre-rapide" data-cat="Citoyenne" onclick="rechercheRapide('Citoyenne', this)">🏛 Vie Citoyenne</button>
                <button class="btn-filtre-rapide" data-cat="Harmonie" onclick="rechercheRapide('Harmonie', this)">🤝 Aide & Harmonie</button>
                <button class="btn-filtre-rapide" data-cat="Régulation" onclick="rechercheRapide('Régulation', this)">⚖ Régulation</button>
                <button class="btn-filtre-rapide" data-cat="Trésor" onclick="rechercheRapide('Trésor', this)">💰 Trésor Public</button>
                <button class="btn-filtre-rapide btn-reset" onclick="resetRecherche()">🔄 Tout voir</button>
            </div>
        </div>
    </div>

    <h3 style="color: #008080; margin: 15px 0 5px 0;">📖 Registre de la Fraternité</h3>
    
    <div id="mur-messages" class="mur-reel"></div>
    <div id="pagination-numeros" class="pagination-container"></div>
    <div id="phrase-petit-prince" style="font-style: italic; color: #2E7D32; margin: 15px;"></div>

    <div style="text-align: center; margin-bottom: 20px;">
        <a href="formulaire.html" class="btn-retour" style="background:#e67e22; margin-right: 10px;">Semer un Don</a>
        <a href="index.html" class="btn-retour">Retour à l'Accueil</a>
    </div>

    <div id="fond-sombre" onclick="fermerGrandMessage()">
        <div class="message-geant" onclick="event.stopPropagation()">
            <button class="bouton-fermer" onclick="fermerGrandMessage()">X</button>
            <div id="geant-contenu"></div>
        </div>
    </div>

    <div id="modal-reponse" onclick="fermerModalReponse()">
        <div class="form-reponse-box" onclick="event.stopPropagation()">
            <button class="bouton-fermer" onclick="fermerModalReponse()">X</button>
            <h3 style="color: #E67E22; margin-top: 0;">💌 Répondre à cette graine</h3>
            <div id="rappel-annonce" style="font-size: 0.85em; background: #fffdf0; padding: 10px; border-radius: 8px; margin-bottom: 15px; color: #444;"></div>

            <form id="formReponse" onsubmit="envoyerReponse(event)">
                <input type="hidden" id="rep_id_annonce" name="ref_id">
                <input type="hidden" id="rep_row_index" name="row_index">
                <input type="hidden" id="rep_type_annonce" name="type_annonce">

                <label style="font-weight: bold; color: #008080; font-size: 0.9em;">Ton Prénom / Pseudo :</label>
                <input type="text" id="rep_nom" class="field-rep" placeholder="Ton nom de cœur..." required>

                <label style="font-weight: bold; color: #008080; font-size: 0.9em;">Ton Message :</label>
                <textarea id="rep_message" class="field-rep" rows="4" placeholder="Propose ton aide..." required></textarea>

                <button type="submit" id="btnSubmitReponse" class="btn-repondre" style="font-size: 1em; padding: 10px; margin-top: 5px;">ENVOYER MA RÉPONSE ✨</button>
            </form>
        </div>
    </div>

    <script>
        const TOKEN_SECRET = "MonJardinSecuritToken2026";
        // URL mise à jour avec ton nouveau déploiement
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxnut45uaiH_GhVoNQ4jYzw53thmlc-KHOwhvYfl23Owfh2iyRoT1DBAAeFDepiQCo2/exec";
        
        let annoncesPrincipales = [], filtreTypeActuel = "";
        let pageActuelle = 1;
        const elementsParPage = 20;

        const mappingBoutons = { 
            "Savoir": ["SAVOIR"], 
            "Citoyenne": ["VIE"], 
            "Harmonie": ["AIDE"], 
            "Régulation": ["REGULATION"], 
            "Trésor": ["IMPOT"]
        };

        const couleursBordures = {
            "SAVOIR": "#ffc107", "VIE": "#2ECC71", "AIDE": "#ff69b4",
            "REGULATION": "#9370DB", "IMPOT": "#1E90FF"
        };

        const nomBoutonAffiche = { 
            "SAVOIR": "Savoir", "VIE": "Vie Citoyenne", "AIDE": "Aide & Harmonie", 
            "REGULATION": "Régulation", "IMPOT": "Trésor Public" 
        };

        function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element'); }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        async function chargerAnnonces() {
            try {
                const response = await fetch(WEB_APP_URL + "?token=" + TOKEN_SECRET + "&v=" + Date.now());
                const toutesLesDonnees = await response.json();

                annoncesPrincipales = toutesLesDonnees.filter(item => {
                    const type = String(item.type || item.Type || '').toUpperCase();
                    return type !== 'VIDEO' && type !== 'VIDÉO';
                });

                document.getElementById('phrase-petit-prince').innerHTML = `✨ Le Jardin prend soin de <b>${annoncesPrincipales.length}</b> fleurs resplendissantes...`;
                executerFiltrage();

            } catch (error) {
                console.error("Erreur de chargement :", error);
                document.getElementById('mur-messages').innerHTML = `<div style="grid-column: span 3; padding: 20px; font-weight: bold; background: white;">Impossible de charger les annonces du jardin... 🌱</div>`;
            }
        }

        function changerFiltreEtResetPage() {
            pageActuelle = 1;
            executerFiltrage();
        }

        function executerFiltrage() {
            const pi = document.getElementById('searchPays').value.toLowerCase();
            const vi = document.getElementById('searchVille').value.toLowerCase();
            const mi = document.getElementById('searchKeyword').value.toLowerCase();

            const filtrées = annoncesPrincipales.filter(ann => {
                const matchP = pi === "" || (ann.pays_select || "").toLowerCase().startsWith(pi);
                const matchV = vi === "" || (ann.localisation || "").toLowerCase().startsWith(vi);
                const matchM = mi === "" || (ann.message || "").toLowerCase().includes(mi);

                let matchT = true;
                if (filtreTypeActuel !== "") {
                    const catsPermises = mappingBoutons[filtreTypeActuel] || [];
                    matchT = catsPermises.includes(ann.type);
                }
                return matchP && matchV && matchM && matchT;
            });

            const totalPages = Math.ceil(filtrées.length / elementsParPage) || 1;
            const elementsPage = filtrées.slice((pageActuelle - 1) * elementsParPage, pageActuelle * elementsParPage);

            const cont = document.getElementById('mur-messages');
            cont.innerHTML = "";

            if (elementsPage.length === 0) {
                cont.innerHTML = `<div style="grid-column: span 3; padding: 20px; font-weight: bold; background: white;">Aucune annonce trouvée dans le jardin... 🌸</div>`;
                document.getElementById('pagination-numeros').innerHTML = "";
                return;
            }

            elementsPage.forEach(ann => {
                const d = document.createElement('div');
                d.className = 'carte-message';
                const couleurTag = couleursBordures[ann.type] || "#008080";
                d.style.borderRightColor = couleurTag;
                d.onclick = () =>ouvrirGrandMessage(ann);

                d.innerHTML = `
                    <div class="nom-prenom">${escapeHtml(ann.nom || "Anonyme")}</div>
                    <div class="rubrique-tag" style="background-color: ${couleurTag};">${escapeHtml(nomBoutonAffiche[ann.type] || "Graine")}</div>
                    <div class="texte-annonce">${escapeHtml(ann.message || "")}</div>
                    <div class="details-bas">
                        📅 Publié : ${escapeHtml(ann.Horodateur || '')}<br>
                        📍 ${escapeHtml(ann.localisation || 'N/C')} (${escapeHtml(ann.pays_select || 'N/C')})
                        <button class="btn-arrosage">💧 Arroser</button>
                        <button class="btn-repondre">💌 Répondre</button>
                    </div>
                `;
                cont.appendChild(d);
            });
        }

        function rechercheRapide(t, el) {
            document.querySelectorAll('.btn-filtre-rapide').forEach(b => b.classList.remove('actif'));
            filtreTypeActuel = (filtreTypeActuel === t) ? "" : t;
            if (filtreTypeActuel && el) el.classList.add('actif');
            pageActuelle = 1;
            executerFiltrage();
        }

        function resetRecherche() {
            document.getElementById('searchKeyword').value = ""; 
            document.getElementById('searchPays').value = ""; 
            document.getElementById('searchVille').value = "";
            filtreTypeActuel = "";
            document.querySelectorAll('.btn-filtre-rapide').forEach(b => b.classList.remove('actif'));
            pageActuelle = 1;
            executerFiltrage();
        }

        function ouvrirGrandMessage(ann) {
            document.getElementById('geant-contenu').innerHTML = `<h3>${escapeHtml(ann.nom)}</h3><p>${escapeHtml(ann.message)}</p>`;
            document.getElementById('fond-sombre').style.display = 'flex';
        }
        function fermerGrandMessage() { document.getElementById('fond-sombre').style.display = 'none'; }
        function fermerModalReponse() { document.getElementById('modal-reponse').style.display = 'none'; }

        window.onload = chargerAnnonces;
    </script>
</body>
</html>
