<!DOCTYPE html> 
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Jardin de la Fraternité - Registre</title>
    <style>
        /* --- STYLE DE BASE --- */
        body { font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; background-color: #FFFF00; color: #000080; overflow-x: hidden; min-height: 100vh; padding-bottom: 80px; }

        .top-bar { position: relative; width: 100%; min-height: 40px; background: rgba(255,255,255,0.3); padding: 5px 0; }
        #google_translate_element { position: absolute; left: 10px; top: 10px; transform: scale(0.8); transform-origin: top left; }
        
        .menu-table { margin: 5px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; }
        .menu-table td { padding: 8px 15px; border: 1px solid #FFFFFF; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; font-size: 0.85em; }
        .menu-table td:hover { background-color: #006666; }

        .phrase-rose { color: #ff1493; font-weight: bold; font-size: 1.1em; text-shadow: 1px 1px 2px #ff69b4; animation: eclat 1.5s infinite alternate; margin-top: 5px; }
        @keyframes eclat { from { opacity: 0.7; } to { opacity: 1; } }
        .phrase-sous { color: #000080; font-weight: bold; margin: 1px 0; font-size: 0.9em; }

        /* ZONE DÉCO HAUTE */
        #jardin-sacre { position: relative; height: 100px; width: 100%; overflow: hidden; background: rgba(255,255,255,0.1); margin-top: 5px; }
        .fleur-clonée { position: absolute; font-size: 25px; animation: apparitionFleur 1s ease-out forwards; }
        @keyframes apparitionFleur { 0% { transform: scale(0) rotate(-50deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }

        /* MOTEUR DE RECHERCHE */
        .search-box { background: #008080; padding: 12px; margin: 10px auto 10px auto; max-width: 700px; border-radius: 20px; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative; z-index: 10; }
        .search-container { display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .search-row { display: flex; gap: 10px; width: 100%; justify-content: center; }
        .search-item { display: flex; flex-direction: column; align-items: center; width: 100%; }
        .search-item label { font-size: 0.9em; margin-bottom: 4px; font-weight: bold; color: #FFFFFF; }
        .search-item input { padding: 10px; border-radius: 12px; border: none; outline: none; text-align: center; color: #004D40; font-weight: bold; width: 90%; }

        /* REGISTRE & CARTES */
        .registre-titre { color: #008080; margin: 10px 0 5px 0; font-size: 1.2em; }
        .mur-reel { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; padding: 10px; max-width: 1200px; margin: 0 auto 50px auto; }
        
        .carte-message { 
            background: rgba(255, 255, 255, 0.95); border: 3px solid #008080; border-radius: 12px; padding: 12px; 
            box-shadow: 4px 4px 0px #008080; transition: 0.3s; color: #333; cursor: pointer; 
            font-size: 0.85em; height: 180px; overflow-y: auto; display: flex; flex-direction: column;
            overflow-wrap: break-word; word-break: break-word; white-space: pre-wrap;
            text-align: left !important; /* Force l'alignement global de la carte à gauche */
        }
        .carte-message:hover { transform: scale(1.05); box-shadow: 0px 10px 20px rgba(0,0,0,0.2); border-color: #ff1493; }

        /* ZOOM GÉANT */
        #fond-sombre { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; }
        .message-geant { 
            background: #FFFFF0; width: 92%; max-width: 850px; max-height: 85vh; padding: 35px; border-radius: 30px; 
            border: 10px solid #008080; position: relative; overflow-y: auto;
            overflow-wrap: break-word; word-break: break-word; white-space: pre-wrap;
            text-align: left !important; /* Force l'alignement à gauche dans le zoom */
        }
        .bouton-fermer { position: absolute; top: 10px; right: 15px; background: #FF1493; color: white; border: 4px solid white; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-weight: bold; font-size: 20px; z-index: 10; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div id="google_translate_element"></div>
        <table class="menu-table">
            <tr>
                <td><a href="index.html">Accueil</a></td>
                <td><a href="formulaire.html">Semer</a></td>
                <td><a href="jardin.html">Le Jardin</a></td>
                <td><a href="impots.html">Impôts Publics</a></td>
                <td><a href="regulation.html">Régulation</a></td>
                <td><a href="aide.html">Aide</a></td>
            </tr>
        </table>
    </div>

    <h2 style="color:#2E7D32; margin-top: 5px; font-size: 1.4em;">🍃 Le Jardin des Cadeaux Existentiels 🍃</h2>
    <div class="phrase-rose">Bienvenue au Jardin ensoleilleur des Dons entiers :</div>
    <div id="jardin-sacre"></div>

    <div class="search-box">
        <h3 style="margin:0 0 10px 0; font-size: 1.1em;">🔍 Chercher une graine</h3>
        <div class="search-container">
            <div class="search-row">
                <div class="search-item"><input type="text" id="searchPays" onkeyup="filtrerAnnonces()" placeholder="Pays..."></div>
                <div class="search-item"><input type="text" id="searchVille" onkeyup="filtrerAnnonces()" placeholder="Ville..."></div>
            </div>
            <input type="text" id="searchKeyword" onkeyup="filtrerAnnonces()" placeholder="Mots clés..." style="width:90%; padding:10px; border-radius:12px; border:none; margin-top:5px;">
        </div>
    </div>

    <h3 class="registre-titre">📖 Registre de la Fraternité</h3>
    <div id="chargement" style="font-weight: bold; color: #008080;">✨ Récolte en cours...</div>
    <div class="mur-reel" id="mur-messages"></div>

    <div id="fond-sombre" onclick="fermerGrandMessage()">
        <div class="message-geant" onclick="event.stopPropagation()">
            <button class="bouton-fermer" onclick="fermerGrandMessage()">X</button>
            <div id="geant-contenu"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxz40XE2KiPXTNZsW-mIg-fm55EivK0r9wzZ5ECFRdEIY53nYH9nLGYRoI71OX93oII/exec"; 
        let toutesLesAnnonces = [];

        async function chargerAnnonces() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                toutesLesAnnonces = data.reverse(); 
                afficherAnnonces(toutesLesAnnonces);
                document.getElementById('chargement').style.display = 'none';
            } catch (e) { document.getElementById('chargement').innerText = "Erreur."; }
        }

        function afficherAnnonces(annonces) {
            const conteneur = document.getElementById('mur-messages');
            conteneur.innerHTML = '';
            annonces.forEach(ann => {
                const carte = document.createElement('div');
                carte.className = 'carte-message';
                carte.onclick = () => ouvrirGrandMessage(ann);
                
                const datePub = ann.date ? new Date(ann.date).toLocaleDateString('fr-FR') : "N/C";
                const dateVal = ann.validite || "Permanente";
                
                carte.innerHTML = `
                    <div style="margin-bottom:4px; font-weight:bold; color:#2E7D32; text-align:center !important; width:100%; border-bottom:1px dashed #ccc; padding-bottom:2px;">
                        ${ann.nom || "Anonyme"}
                    </div>
                    <div style="font-weight:bold; color:#000080; flex-grow:1; font-size:0.95em; text-align:left !important; padding-top:4px;">
                        "${ann.message || ""}"
                    </div>
                    <div style="font-size:0.65em; margin-top:4px; color:#555; line-height:1; text-align:left !important;">
                        <span style="display:block;">📅 ${datePub} | ⏳ ${dateVal}</span>
                        <span style="display:block;">📍 ${ann.ville || ""}, ${ann.pays || ""}</span>
                    </div>
                `;
                conteneur.appendChild(carte);
            });
        }

        function ouvrirGrandMessage(ann) {
            const datePub = ann.date ? new Date(ann.date).toLocaleDateString('fr-FR') : "N/C";
            const dateVal = ann.validite || "Permanente";
            document.getElementById('geant-contenu').innerHTML = `
                <div style="font-size:1.5em; color:#2E7D32; border-bottom:3px solid #008080; margin-bottom:15px; padding-bottom:10px; font-weight:bold; text-align:center !important;">
                    🌱 L'offrande de ${ann.nom || "Anonyme"}
                </div>
                <div style="font-size:1.3em; color:#000080; line-height:1.2; margin:10px 0; font-weight:bold; text-align:left !important; background:white; padding:15px; border-radius:15px; border-left:8px solid #FF1493;">
                    "${ann.message || ""}"
                </div>
                <div style="font-size:0.8em; background:#f4fbfb; padding:8px 12px; border-radius:10px; color:#555; text-align:left !important; border:1px solid #d0e8e8; line-height:1.1;">
                    <strong>📍 Lieu :</strong> ${ann.ville || ""}, ${ann.pays || ""}<br>
                    <strong>📅 Publication :</strong> ${datePub} | <strong>⏳ Validité :</strong> ${dateVal}
                </div>
            `;
            document.getElementById('fond-sombre').style.display = 'flex';
        }

        function fermerGrandMessage() { document.getElementById('fond-sombre').style.display = 'none'; }
        
        function filtrerAnnonces() {
            const pays = document.getElementById('searchPays').value.toLowerCase();
            const ville = document.getElementById('searchVille').value.toLowerCase();
            const mot = document.getElementById('searchKeyword').value.toLowerCase();
            const filtrees = toutesLesAnnonces.filter(ann => {
                return (ann.pays||"").toLowerCase().includes(pays) && (ann.ville||"").toLowerCase().includes(ville) && (ann.message||"").toLowerCase().includes(mot);
            });
            afficherAnnonces(filtrees);
        }

        window.onload = chargerAnnonces;
    </script>
</body>
</html>
