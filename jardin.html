<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Jardin de la Fraternité - Registre</title>
    <style>
        /* --- STYLE DE BASE --- */
        body { font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; background-color: #FFFF00; color: #000080; min-height: 100vh; padding-bottom: 80px; transition: background 0.3s; position: relative; }
        
        .top-bar { position: relative; width: 100%; min-height: 60px; background: rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; }
        #google_translate_element { position: absolute; left: 10px; top: 15px; transform: scale(0.8); transform-origin: left; }

        /* LANTERNE INTEGRÉE AU MENU */
        #btn-mode { background: #444; color: #FFD700; border: 2px solid #222; border-radius: 8px; cursor: pointer; padding: 5px 10px; font-size: 20px; margin-left: 15px; transition: 0.3s; }
        body.dark-mode #btn-mode { background: #FFD700; color: #444; box-shadow: 0 0 10px #FFD700; }

        .menu-table { border-radius: 10px; background-color: #008080; border-collapse: collapse; }
        .menu-table td { padding: 8px 15px; border: 1px solid #FFFFFF; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; font-size: 0.85em; }

        .phrase-rose { color: #ff1493; font-weight: bold; font-size: 1.1em; text-shadow: 1px 1px 2px #ff69b4; margin-top: 10px; }
        .phrase-sous { color: #000080; font-weight: bold; margin: 1px 0; font-size: 0.9em; }

        /* --- MOTEUR DE RECHERCHE --- */
        .search-box { background: #008080; padding: 15px; margin: 10px auto; max-width: 95%; width: 1100px; border-radius: 25px; color: white; border: 3px solid #fff; }
        .search-container { display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .search-main-input { width: 90%; padding: 12px; border-radius: 15px; border: none; text-align: center; font-weight: bold; }
        .search-row { display: flex; gap: 10px; width: 90%; justify-content: center; }
        .search-item { width: 45%; }
        .search-item input { width: 100%; padding: 8px; border-radius: 10px; border: none; text-align: center; }

        /* --- GRILLE & CARTES --- */
        .mur-reel { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 10px; padding: 10px; max-width: 98vw; margin: 0 auto; }
        @media (max-width: 768px) { .mur-reel { grid-template-columns: repeat(2, 1fr); } }

        .carte-message { background: white; border: 2px solid #008080; border-radius: 10px; padding: 8px; box-shadow: 3px 3px 0px #008080; display: flex; flex-direction: column; height: 280px; position: relative; overflow: hidden; text-align: left; }
        .nom-prenom { color: #2E7D32; font-weight: bold; font-size: 0.85em; border-bottom: 1px solid #eee; margin-bottom: 3px; }
        .rubrique-tag { font-size: 0.55em; background: #ff1493; color: white; padding: 2px 5px; border-radius: 5px; position: absolute; top: 5px; right: 5px; }
        
        .texte-annonce { flex-grow: 1; font-style: italic; color: #000080; overflow-y: auto; font-size: 0.7em; margin: 5px 0; line-height: 1.2; padding-right: 5px; }

        /* BOUTON ARROSAGE */
        .btn-arrosage { background: #E1F5FE; border: 1px solid #00BFFF; border-radius: 8px; color: #0277BD; font-size: 0.75em; padding: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 5px; }
        .arrose-succes { font-size: 0.9em !important; color: #1B5E20 !important; background: #C8E6C9 !important; }

        .details-bas { font-size: 0.75em; color: #444; line-height: 1.3; border-top: 1px solid #eee; padding-top: 5px; background: white; margin-top: auto; }

        /* EFFETS NUIT */
        body.dark-mode { background-color: #0a0a1a; color: #e0e0e0; }
        .star { position: fixed; background: white; border-radius: 50%; opacity: 0; pointer-events: none; animation: twinkle var(--d) infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .fleur-pluie { position: fixed; pointer-events: none; font-size: 20px; z-index: 9999; animation: monter 3s linear forwards; }
        @keyframes monter { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100vh); opacity: 0; } }
        
        .copyright-link { color: #008080; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div id="google_translate_element"></div>
        <table class="menu-table">
            <tr>
                <td><a href="index.html">Accueil</a></td>
                <td><a href="formulaire.html">Semer</a></td>
                <td><a href="jardin.html">Le Jardin</a></td>
                <td><a href="impots.html">Impôts Publics</a></td>
                <td><a href="regulation.html">Régulation</a></td>
                <td><a href="aide.html">Aide</a></td>
            </tr>
        </table>
        <button id="btn-mode" onclick="basculerModeSombre()" title="Mode Nuit">🏮</button>
    </div>

    <h2 style="color:#2E7D32; margin: 15px 0;">🍃 Le Jardin des Cadeaux Existentiels 🍃</h2>
    <div class="phrase-rose">Bienvenue au Jardin des Dons entiers</div>
    <p class="phrase-sous">Talents, savoirs, objets et fraternité.</p>

    <div class="search-box">
        <div class="search-container">
            <input type="text" id="searchKeyword" class="search-main-input" onkeyup="filtrerAnnonces()" placeholder="🔍 Mots-clés...">
            <div class="search-row">
                <div class="search-item"><input type="text" id="searchPays" onkeyup="filtrerAnnonces()" placeholder="📍 Pays"></div>
                <div class="search-item"><input type="text" id="searchVille" onkeyup="filtrerAnnonces()" placeholder="🏙️ Ville"></div>
            </div>
        </div>
    </div>

    <h3 id="titre-registre" style="color: #008080;">📖 Registre de la Fraternité</h3>
    <div id="mur-messages" class="mur-reel"></div>

    <div class="phrase-etoiles" id="phrase-petit-prince" style="margin: 20px; font-style: italic;"></div>

    <div class="footer-copyright">
        <a href="merci.html" class="copyright-link" onmouseenter="lancerFleurs(event)">© 2000 Le petit prince des jardiniers</a>
    </div>

    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        let toutesLesAnnonces = [];

        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element');
        }

        function basculerModeSombre() {
            document.body.classList.toggle('dark-mode');
            if(document.body.classList.contains('dark-mode')) {
                for(let i=0; i<40; i++) {
                    let s = document.createElement('div');
                    s.className = 'star';
                    s.style.left = Math.random()*100+'vw'; s.style.top = Math.random()*100+'vh';
                    s.style.width = s.style.height = Math.random()*3+'px';
                    s.style.setProperty('--d', (Math.random()*3+2)+'s');
                    document.body.appendChild(s);
                }
            } else { document.querySelectorAll('.star').forEach(s => s.remove()); }
        }

        async function chargerAnnonces() {
            const data = await (await fetch("annonces.json?v="+Date.now())).json();
            toutesLesAnnonces = data;
            document.getElementById('phrase-petit-prince').innerHTML = `✨ Aujourd'hui, le Petit Prince a aidé <b>${Math.floor(Math.random()*6)}</b> fleurs fatiguées...`;
            executerFiltrage();
        }

        function executerFiltrage() {
            const k = document.getElementById('searchKeyword').value.toLowerCase();
            const p = document.getElementById('searchPays').value.toLowerCase();
            const v = document.getElementById('searchVille').value.toLowerCase();

            const filtrées = toutesLesAnnonces.filter(ann => {
                // Filtre par première lettre sur Pays et Ville
                const matchP = p === "" || (ann.pays_select || "").toLowerCase().startsWith(p);
                const matchV = v === "" || (ann.localisation || "").toLowerCase().startsWith(v);
                const matchK = k === "" || (ann.message || "").toLowerCase().includes(k);
                return matchP && matchV && matchK;
            });

            const container = document.getElementById('mur-messages');
            container.innerHTML = "";
            filtrées.forEach(ann => {
                const div = document.createElement('div');
                div.className = 'carte-message';
                div.innerHTML = `
                    <div class="nom-prenom">${ann.nom}</div>
                    <div class="rubrique-tag">${ann.type || 'Graine'}</div>
                    <div class="texte-annonce">"${ann.message}"</div>
                    <div class="details-bas">
                        <button class="btn-arrosage" onclick="arroser(this)">💧 Arroser (${ann.votes_arrosage || 0})</button>
                        📍 Localisation : ${ann.localisation || 'N/C'}<br>
                        📍 Pays : ${ann.pays_select || 'N/C'}<br>
                        🌍 Portée : ${ann.portee || 'Locale'}<br>
                        🚚 Logistique : ${ann.logistique || 'Main Propre'}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function arroser(btn) {
            btn.innerHTML = "Merci ! la pluie arrose cette annonce 24h";
            btn.classList.add('arrose-succes');
        }

        function lancerFleurs(e) {
            for(let i=0; i<5; i++) {
                let f = document.createElement('div');
                f.className = 'fleur-pluie'; f.innerText = '🌸';
                f.style.left = (e.clientX + (Math.random()*40-20)) + 'px';
                f.style.top = e.clientY + 'px';
                document.body.appendChild(f);
                setTimeout(() => f.remove(), 3000);
            }
        }

        window.onload = chargerAnnonces;
    </script>
</body>
</html>
