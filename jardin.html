<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Jardin de la Fraternité - Registre</title>
    <style>
        /* --- STYLE ORIGINAL CONSERVÉ --- */
        body { font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; background-color: #FFFF00; color: #000080; overflow-x: hidden; min-height: 100vh; }

        .menu-table { margin: 20px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; }
        .menu-table td { padding: 10px 15px; border: 1px solid #FFFFFF; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; }

        #jardin-sacre { position: relative; height: 200px; width: 100%; overflow: hidden; }
        
        .fleur-clonée {
            position: absolute;
            font-size: 25px;
            animation: apparitionFleur 1s ease-out forwards;
        }

        @keyframes apparitionFleur {
            0% { transform: scale(0) rotate(-50deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* --- ZONE DE RECHERCHE --- */
        .search-box {
            background: #008080;
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
            border-radius: 15px;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .search-box input {
            padding: 10px;
            width: 70%;
            border-radius: 5px;
            border: none;
            font-size: 1em;
        }

        /* --- AFFICHAGE DES ANNONCES (MUR RÉEL) --- */
        .mur-reel {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }
        .carte-message {
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #008080;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 5px 5px 0px #008080;
            transition: 0.3s;
            color: #333;
            text-align: left;
        }
        .carte-message:hover { transform: scale(1.03); }
        .carte-header { border-bottom: 1px solid #ddd; margin-bottom: 10px; padding-bottom: 5px; }
        .nom-donneur { font-weight: bold; color: #2E7D32; font-size: 1.1em; }
        .lieu-tag { font-size: 0.8em; color: #666; font-style: italic; }
        .message-contenu { margin-top: 10px; font-size: 0.95em; line-height: 1.4; }

        /* --- ÉLÉMENTS MAGIQUES --- */
        #coffre-magique { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 60px; z-index: 800; }
        #animal-container { position: fixed; z-index: 900; white-space: nowrap; display: flex; align-items: center; pointer-events: none; }
        #corps-animal { font-size: 50px; }
        #bulle-texte { background: rgba(255, 255, 255, 0.9); border-radius: 15px; padding: 8px 15px; font-style: italic; color: #2E7D32; margin-right: 10px; font-weight: bold; border: 2px solid #2E7D32; opacity: 0; transition: opacity 0.3s; }

        .copyright-link { color: #000080; text-decoration: none; font-weight: bold; }
        #chargement { font-weight: bold; color: #008080; margin: 20px; }
    </style>
</head>
<body>

    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.3);">
        <div id="google_translate_element"></div>
        <table class="menu-table" style="margin: 0;">
            <tr>
                <td><a href="index.html">Accueil</a></td>
                <td><a href="formulaire.html">Semer</a></td>
                <td><a href="jardin.html">Le Jardin</a></td>
                <td><a href="contact.html">Contact</a></td>
                <td><a href="urgence.html">Urgences</a></td>
            </tr>
        </table>
    </div>

    <audio id="chantOiseaux" loop><source src="oiseaux.mp3" type="audio/mpeg"></audio>

    <h2 style="color:#2E7D32; margin-top: 30px;">🍃 Le Jardin des Cadeaux Existentiels 🍃</h2>
    
    <div id="jardin-sacre">
        </div>

    <div class="search-box">
        <h3>🔍 Chercher une graine de fraternité</h3>
        <input type="text" id="searchInput" onkeyup="filtrerAnnonces()" placeholder="Ville, Nom ou Message...">
    </div>

    <h3 style="color:#008080;">📖 Registre de la Fraternité</h3>
    <div id="chargement">✨ Récolte des messages en cours dans le jardin...</div>
    
    <div class="mur-reel" id="mur-messages"></div>

    <br><br>
    <font size="2">
        Copyright 2026 <a href="https://youtube.com" class="copyright-link">Le Petit Prince des Jardiniers</a>
    </font>

    <div id="coffre-magique">🎁</div>
    <div id="animal-container">
        <div id="bulle-texte"></div>
        <div id="corps-animal">🕊️</div>
    </div>

    <script type="text/javascript">
        function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element'); }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        // --- CONFIGURATION DE LA BASE DE DONNÉES ---
        // Remplacez URL_DE_VOTRE_SCRIPT par l'URL Web App fournie par Google Apps Script
        const SCRIPT_URL = "URL_DE_VOTRE_SCRIPT"; 
        let toutesLesAnnonces = [];

        async function chargerAnnonces() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                toutesLesAnnonces = data;
                afficherAnnonces(toutesLesAnnonces);
                document.getElementById('chargement').style.display = 'none';
            } catch (error) {
                console.error("Erreur de chargement:", error);
                document.getElementById('chargement').innerText = "Le jardin se repose, réessayez plus tard.";
            }
        }

        function afficherAnnonces(annonces) {
            const conteneur = document.getElementById('mur-messages');
            conteneur.innerHTML = '';

            annonces.forEach(ann => {
                const carte = document.createElement('div');
                carte.className = 'carte-message';
                carte.innerHTML = `
                    <div class="carte-header">
                        <span class="nom-donneur">${ann.Nom}</span><br>
                        <span class="lieu-tag">📍 ${ann.Ville}, ${ann.Pays}</span>
                    </div>
                    <div class="message-contenu">
                        "${ann.Message}"
                    </div>
                    <div style="font-size:0.7em; margin-top:10px; color:#888;">
                        Semé le ${ann.Date}
                    </div>
                `;
                conteneur.appendChild(carte);
            });
        }

        function filtrerAnnonces() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            const filtre = toutesLesAnnonces.filter(ann => 
                ann.Nom.toLowerCase().includes(val) || 
                ann.Ville.toLowerCase().includes(val) || 
                ann.Message.toLowerCase().includes(val)
            );
            afficherAnnonces(filtre);
        }

        // --- LOGIQUE D'ANIMATION ORIGINALE ---
        const mesPhrases = ["Une fleur vient d'éclore", "La fraternité grandit...", "Un cadeau déposé !", "Paix sur ce jardin"];
        const animaux = ['🕊️', '🦋', '🐝', '🐞', '🦜', '🐰'];
        const fleurs = ['🌸', '🌼', '🌻', '🌺', '🌷', '🌹'];
        const jardin = document.getElementById('jardin-sacre');
        const animalCont = document.getElementById('animal-container');
        const bulle = document.getElementById('bulle-texte');
        const corps = document.getElementById('corps-animal');

        let aniX = -200, aniY = 100, state = "CROSSING";

        function plantFlower() {
            const f = document.createElement('div');
            f.className = 'fleur-clonée';
            f.innerText = fleurs[Math.floor(Math.random()*fleurs.length)];
            f.style.left = Math.random() * 90 + "%";
            f.style.top = Math.random() * 70 + "%";
            jardin.appendChild(f);
        }

        function loop() {
            if (state === "CROSSING") {
                aniX += 2;
                aniY += Math.sin(aniX/50) * 1;
                if(Math.random() < 0.005) plantFlower();
                if (aniX > window.innerWidth + 100) {
                    aniX = -200;
                    bulle.innerText = mesPhrases[Math.floor(Math.random()*mesPhrases.length)];
                    corps.innerText = animaux[Math.floor(Math.random()*animaux.length)];
                }
            }
            animalCont.style.left = aniX + "px";
            animalCont.style.top = aniY + "px";
            bulle.style.opacity = (aniX > 0 && aniX < window.innerWidth) ? "1" : "0";
            requestAnimationFrame(loop);
        }

        // Lancement
        chargerAnnonces();
        loop();
        document.addEventListener('click', () => { 
            const a = document.getElementById('chantOiseaux');
            a.volume = 0.1; a.play(); 
        });
    </script>
</body>
</html>
