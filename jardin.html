<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jardin Public - Le Don Entier</title>
    <style>
        body {
            background-color: #e8f5e9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            color: #2c3e50;
        }
        .header-jardin {
            text-align: center;
            margin-bottom: 50px;
        }
        h1 {
            color: #27ae60;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .search-container {
            max-width: 700px;
            margin: 0 auto;
        }
        .search-main-input {
            width: 100%;
            padding: 18px 25px;
            font-size: 1.2em;
            border-radius: 40px;
            border: 2px solid #2ecc71;
            outline: none;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.2);
            transition: box-shadow 0.3s;
            box-sizing: border-box;
        }
        .search-main-input:focus {
            box-shadow: 0 4px 20px rgba(46, 204, 113, 0.4);
        }
        .grid-dons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .carte-don {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-top: 5px solid #27ae60;
            transition: transform 0.2s;
        }
        .carte-don:hover {
            transform: translateY(-5px);
        }
        .carte-don h3 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 1.4em;
        }
        .etiquette {
            display: inline-block;
            background: #f1f8e9;
            color: #33691e;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.85em;
            margin-right: 5px;
            margin-bottom: 10px;
        }
        .btn-retour {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 25px;
            background: #34495e;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-retour:hover {
            background: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="header-jardin">
        <h1>Le Jardin Public des Fraternels</h1>
        <div class="search-container">
            <!-- Votre phrase personnalisée dans le moteur de recherche -->
            <input type="text" id="searchKeyword" class="search-main-input" onkeyup="executerFiltrage()" placeholder="✨ Votre phrase personnalisée ici (ex: Rechercher un don, un savoir...)">
        </div>
    </div>

    <!-- Grille d'affichage des dons -->
    <div class="grid-dons" id="listeDons">
        <!-- Les cartes semées via le formulaire s'afficheront dynamiquement ici -->
    </div>

    <div style="text-align: center;">
        <a href="formulaire.html" class="btn-retour" style="background:#e67e22; margin-right: 10px;">Semer un Don</a>
        <a href="index.html" class="btn-retour">Retour à l'Accueil</a>
    </div>

    <script>
        // Récupération et affichage du don soumis par le formulaire
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const mainCat = urlParams.get('main_cat');
            const subCat = urlParams.get('sub_cat');
            const description = urlParams.get('description');
            
            const grilleDons = document.getElementById('listeDons');

            // Si un formulaire vient d'être validé, on crée la carte dynamiquement
            if (mainCat || description) {
                const nouvelleCarte = document.createElement('div');
                nouvelleCarte.className = 'carte-don';
                
                // Traduction propre du domaine principal pour l'affichage
                const nomsDomaines = {
                    "IMPOT": "Trésor Public",
                    "AIDE": "Aide & Harmonie",
                    "REGULATION": "Régulation",
                    "SAVOIR": "Savoirs"
                };
                let libelleDomaine = nomsDomaines[mainCat] || mainCat || "Don";

                nouvelleCarte.innerHTML = `
                    <h3>${subCat ? subCat : 'Offre du Jardin'}</h3>
                    <div>
                        <span class="etiquette">${libelleDomaine}</span>
                        ${subCat ? `<span class="etiquette">${subCat}</span>` : ''}
                    </div>
                    <p>${description ? description : 'Aucune description fournie.'}</p>
                `;
                
                grilleDons.appendChild(nouvelleCarte);
            }

            // Gestion du filtre si on arrive depuis les cartes colorées de l'accueil/formulaire
            const categorie = urlParams.get('cat');
            const traductions = {
                "IMPOT": "Trésor Public",
                "AIDE": "Aide & Harmonie",
                "REGULATION": "Régulation",
                "SAVOIR": "Savoirs"
            };

            if (categorie && traductions[categorie]) {
                const searchInput = document.getElementById('searchKeyword');
                searchInput.value = traductions[categorie];
                executerFiltrage();
            }
        };

        // Moteur de recherche instantanée
        function executerFiltrage() {
            const input = document.getElementById('searchKeyword').value.toLowerCase();
            const cartes = document.querySelectorAll('.carte-don');
            
            cartes.forEach(carte => {
                const texteGlobal = carte.innerText.toLowerCase();
                if (texteGlobal.includes(input)) {
                    carte.style.display = "block";
                } else {
                    carte.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
