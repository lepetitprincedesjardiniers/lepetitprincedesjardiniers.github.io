<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Jardin de la Fraternité - Registre</title>
    <style>
        /* STYLE ORIGINAL COMPLET */
        body { font-family: 'Comic Sans MS', cursive; text-align: center; margin: 0; padding: 0; background-color: #FFFF00; color: #000080; overflow-x: hidden; min-height: 100vh; padding-bottom: 120px; }
        
        .top-bar { position: relative; width: 100%; min-height: 40px; background: rgba(255,255,255,0.3); padding: 5px 0; }
        
        .menu-table { margin: 10px auto; border-radius: 10px; background-color: #008080; border-collapse: collapse; }
        .menu-table td { padding: 10px 18px; border: 1px solid #FFFFFF; transition: 0.3s; }
        .menu-table td:hover { background-color: #00b3b3; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; font-size: 0.85em; }

        .phrase-rose { color: #ff1493; font-weight: bold; font-size: 1.2em; text-shadow: 1px 1px 2px #ff69b4; animation: eclat 1.5s infinite alternate; margin: 15px 0; }
        @keyframes eclat { from { opacity: 0.7; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        /* MOTEUR DE RECHERCHE DESIGN */
        .search-container { margin: 20px auto; width: 90%; max-width: 500px; position: relative; }
        .search-input { width: 100%; padding: 12px 20px; border-radius: 25px; border: 3px solid #008080; font-family: 'Comic Sans MS'; font-size: 1em; outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        /* JARDIN ANIME */
        #jardin-sacre { position: relative; height: 120px; width: 100%; overflow: hidden; background: rgba(255,255,255,0.2); border-top: 2px solid #008080; border-bottom: 2px solid #008080; }
        .fleur-clonée { position: absolute; font-size: 30px; animation: apparitionFleur 1s ease-out forwards; cursor: pointer; }
        @keyframes apparitionFleur { 0% { transform: scale(0) rotate(-50deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }

        /* OISEAU ET BULLE (ANIMATION FLUIDE) */
        #animal-container { position: fixed; z-index: 900; display: flex; align-items: center; pointer-events: auto; transition: all 4s ease-in-out; }
        #bulle-texte { background: white; border-radius: 15px; padding: 8px 15px; font-style: italic; color: #2E7D32; border: 2px solid #2E7D32; opacity: 0; transition: 0.3s; font-weight: bold; margin-right: 10px; white-space: nowrap; }
        #corps-animal { font-size: 40px; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2)); }

        /* GRILLE DE CARTES */
        .mur-reel { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; max-width: 1300px; margin: 0 auto; }
        .carte-message { background: white; border: 3px solid #008080; border-radius: 15px; padding: 18px; text-align: left; box-shadow: 6px 6px 0px #008080; transition: 0.3s; position: relative; overflow: hidden; }
        .carte-message:hover { transform: translateY(-5px); box-shadow: 8px 8px 0px #E67E22; border-color: #E67E22; }
        
        .nom-jardinier { color: #2E7D32; font-weight: bold; font-size: 1.1em; border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .texte-message { color: #000080; font-style: italic; line-height: 1.4; margin-bottom: 15px; font-size: 1.05em; }
        .details { font-size: 0.8em; color: #666; background: #f9f9f9; padding: 8px; border-radius: 8px; }

        /* PIED DE PAGE */
        .copyright-wrapper { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.9); padding: 8px 25px; border-radius: 25px; border: 2px solid #ff1493; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .copyright-wrapper a { text-decoration: none; color: #ff1493; font-weight: bold; }
        
        #coffre-magique { position: fixed; bottom: 20px; right: 20px; font-size: 50px; cursor: pointer; z-index: 800; transition: 0.3s; }
        #coffre-magique:hover { transform: scale(1.2) rotate(10deg); }
    </style>
</head>
<body>

    <div class="top-bar">
        <table class="menu-table">
            <tr>
                <td><a href="index.html">Accueil</a></td>
                <td><a href="formulaire.html">Semer</a></td>
                <td><a href="jardin.html">Le Jardin</a></td>
                <td><a href="impots.html">Impôts Publics</a></td>
                <td><a href="regulation.html">Régulation</a></td>
                <td><a href="aide.html">Aide</a></td>
                <td><a href="savoirs.html">Savoirs</a></td>
            </tr>
        </table>
    </div>

    <h2 style="color:#2E7D32; margin-top: 20px;">🍃 Le Jardin de la Fraternité 🍃</h2>
    <div class="phrase-rose">Bienvenue au Jardin ensoleilleur des Dons entiers</div>

    <div class="search-container">
        <input type="text" id="moteurRecherche" class="search-input" placeholder="🔍 Rechercher une graine, une ville, un donateur..." onkeyup="filtrerAnnonces()">
    </div>

    <div id="jardin-sacre"></div>

    <div id="chargement" style="padding: 50px; font-size: 1.2em;">✨ Récolte des messages en cours... 🌱</div>
    <div class="mur-reel" id="mur-messages"></div>

    <div id="coffre-magique">🎁</div>

    <div class="copyright-wrapper">
        <a href="transition-externe.html">© Le Petit Prince des Jardiniers 🌹</a>
    </div>

    <div id="animal-container">
        <div id="bulle-texte">L'essentiel est invisible pour les yeux...</div>
        <div id="corps-animal">🕊️</div>
    </div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxz40XE2KiPXTNZsW-mIg-fm55EivK0r9wzZ5ECFRdEIY53nYH9nLGYRoI71OX93oII/exec"; 
    let toutesLesAnnonces = [];

    // CHARGEMENT DES DONNÉES
    async function chargerDonnees() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            toutesLesAnnonces = data.reverse(); 
            document.getElementById('chargement').style.display = 'none';
            afficherAnnonces(toutesLesAnnonces);
        } catch (e) {
            document.getElementById('chargement').innerText = "Le jardin est en sommeil... Réessaie plus tard. 🥀";
        }
    }

    // AFFICHAGE DES CARTES
    function afficherAnnonces(annonces) {
        const conteneur = document.getElementById('mur-messages');
        conteneur.innerHTML = '';
        
        annonces.forEach(ann => {
            const carte = document.createElement('div');
            carte.className = 'carte-message';
            
            // On cherche le message dans 'sub_precision' ou 'message'
            const messageTexte = ann.sub_precision || ann.message || "Graine de fraternité";
            
            carte.innerHTML = `
                <div class="nom-jardinier">
                    <span>👤 ${ann.nom || "Anonyme"}</span>
                    <span style="font-size:0.7em; opacity:0.6;">✨</span>
                </div>
                <div class="texte-message">"${messageTexte}"</div>
                <div class="details">
                    📍 ${ann.localisation || "Partout"}<br>
                    🌍 ${ann.pays_select || ""}<br>
                    🤝 ${ann.logistique || ""}<br>
                    ⏳ ${ann.duree_validite || "Toujours"}
                </div>
            `;
            conteneur.appendChild(carte);
        });
    }

    // FILTRE DE RECHERCHE
    function filtrerAnnonces() {
        const recherche = document.getElementById('moteurRecherche').value.toLowerCase();
        const filtre = toutesLesAnnonces.filter(ann => {
            return JSON.stringify(ann).toLowerCase().includes(recherche);
        });
        afficherAnnonces(filtre);
    }

    // ANIMATIONS (Oiseau, Fleurs)
    function lancerAnimations() {
        const animal = document.getElementById('animal-container');
        const bulle = document.getElementById('bulle-texte');
        const citations = ["On sème la paix ✨", "Un don, une fleur 🌸", "Vive la fraternité ! 🌍", "Cultivons l'entraide 🌱"];

        // Vol de l'oiseau
        setInterval(() => {
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 150);
            animal.style.left = x + 'px';
            animal.style.top = y + 'px';
            
            if(Math.random() > 0.5) {
                bulle.innerText = citations[Math.floor(Math.random()*citations.length)];
                bulle.style.opacity = 1;
                setTimeout(() => bulle.style.opacity = 0, 3000);
            }
        }, 5000);

        // Apparition des fleurs
        const jardin = document.getElementById('jardin-sacre');
        for(let i=0; i<20; i++) {
            setTimeout(() => {
                const f = document.createElement('div');
                f.className = 'fleur-clonée';
                f.innerHTML = ['🌸','🌼','🌻','🌷'][Math.floor(Math.random()*4)];
                f.style.left = Math.random() * 95 + '%';
                f.style.top = Math.random() * 70 + 'px';
                jardin.appendChild(f);
            }, i * 200);
        }
    }

    window.onload = () => {
        chargerDonnees();
        lancerAnimations();
    };
</script>
</body>
</html>
