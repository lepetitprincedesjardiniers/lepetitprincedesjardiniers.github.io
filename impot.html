<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impôt Public - Le Trésor Public</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive; background-color: #E8F5E9; color: #004d40; margin: 0; text-align: center; }
        #google_translate_element { padding: 10px; background: rgba(255,255,255,0.5); border-bottom: 2px solid #008080; }
        
        .menu-table { margin: 20px auto; background-color: #008080; border-collapse: collapse; border-radius: 10px; overflow: hidden; margin-left: auto; margin-right: auto; }
        .menu-table td { padding: 12px 20px; border: 1px solid #FFFFFF; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; }
        
        .form-container { background: white; border: 5px solid #008080; border-radius: 30px; width: 90%; max-width: 700px; margin: 20px auto; padding: 25px; box-shadow: 10px 10px 0px #008080; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

        label { display: block; margin-top: 10px; font-weight: bold; color: #00695c; }
        input, textarea, select { width: 100%; padding: 12px; margin: 5px 0; border-radius: 12px; border: 2px solid #008080; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        
        .full-width { grid-column: 1 / -1; }
        
        .btn-envoi { background: #008080; color: white; border: none; padding: 18px 40px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 1.2em; transition: 0.3s; margin-top: 20px; }
        .btn-envoi:hover { transform: scale(1.05); background: #2e7d32; }
        
        .logistique-tag { color: #E67E22; font-weight: bold; font-size: 0.85em; }
    </style>
</head>
<body>

    <div id="google_translate_element"></div>
    <script>function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element'); }</script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impot.html">Impôt Public</a></td>
            <td><a href="registre_public.html">Le Registre</a></td>
            <td><a href="regulation.html">Régulation</a></td>
            <td><a href="aide.html">Aide</a></td>
        </tr>
    </table>

    <h1>📜 Registre de l'Impôt Public</h1>
    <p>Déclarez ici vos travaux citoyens ou vos offres de service pour la communauté.</p>

    <div class="form-container">
        <form id="impotForm">
            <div class="form-grid">
                <div>
                    <label>Identité / Pseudo :</label>
                    <input type="text" id="nom" placeholder="Qui es-tu ?" required>
                </div>
                <div>
                    <label>Localisation (Ville/Pays) :</label>
                    <input type="text" id="ville" placeholder="Où s'est passé l'action ?" required>
                </div>
                <div>
                    <label>Catégorie de l'Action :</label>
                    <select id="categorie">
                        <option value="Environnement">🌿 Environnement / Nature</option>
                        <option value="Social">🤝 Aide Sociale / Entraide</option>
                        <option value="Administratif">📑 Aide Administrative</option>
                        <option value="Technique">🛠️ Bricolage / Technique</option>
                        <option value="Savoir">📚 Transmission de Savoir</option>
                    </select>
                </div>
                <div>
                    <label>Temps consacré :</label>
                    <input type="text" id="temps" placeholder="Ex: 2 heures, 1 matinée...">
                </div>

                <div>
                    <label>Portée de l'action :</label>
                    <select id="portee">
                        <option value="Local">Cité Locale</option>
                        <option value="International">International / Flux Mondiaux</option>
                    </select>
                </div>
                <div>
                    <label>Mode d'appui logistique :</label>
                    <select id="logistique">
                        <option value="Autonome">Don Entier (J'assure tout)</option>
                        <option value="Point Fixe">À récupérer sur place</option>
                        <option value="Appui requis">Besoin d'appui (Travaux Publics)</option>
                    </select>
                </div>

                <div class="full-width">
                    <label>Description détaillée de l'Impôt Citoyen :</label>
                    <textarea id="message" rows="4" placeholder="Qu'as-tu accompli pour le bien commun ?" required></textarea>
                </div>
                <div class="full-width">
                    <label>Besoins pour continuer (facultatif) :</label>
                    <input type="text" id="besoin" placeholder="Matériel, aide, outils...">
                </div>
            </div>
            <button type="submit" id="btnEnvoi" class="btn-envoi">DÉPOSER MA GRAINE AU REGISTRE 🌿</button>
        </form>
    </div>

    <script>
        const URL_SERVEUR = "https://script.google.com/macros/s/AKfycbz4ncs9qw_AfmKSER5QST-P0OeKQggQaq86QC6liS53uZ9sx4Lo_-4-h1knXKWqgQMc/exec";

        document.getElementById('impotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnEnvoi');
            btn.innerText = "Inscription au registre..."; btn.disabled = true;

            const locComplet = `${document.getElementById('ville').value} | Portée: ${document.getElementById('portee').value}`;
            const msgComplet = `${document.getElementById('message').value} [Logistique: ${document.getElementById('logistique').value}] (Besoin: ${document.getElementById('besoin').value || 'Aucun'})`;

            fetch(URL_SERVEUR, { 
                method: 'POST', mode: 'no-cors', 
                body: JSON.stringify({
                    date: new Date().toLocaleDateString('fr-FR'),
                    type: "impot",
                    nom: document.getElementById('nom').value,
                    localisation: locComplet,
                    message: msgComplet
                })
            }).then(() => { 
                alert("Action inscrite au Trésor Public ! Merci."); 
                window.location.href = "registre_public.html"; 
            }).catch(() => {
                window.location.href = "registre_public.html";
            });
        });
    </script>
</body>
</html>
