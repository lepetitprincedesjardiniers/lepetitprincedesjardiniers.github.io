<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impôt Public - Le Petit Prince des Jardiniers</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive; background-color: #E8F5E9; color: #004d40; margin: 0; text-align: center; }
        
        /* Traducteur Discret en haut à gauche */
        .header-tools { display: flex; justify-content: flex-start; align-items: center; padding: 10px; background: rgba(255,255,255,0.5); border-bottom: 2px solid #008080; }
        #google_translate_element { margin-right: 20px; }

        /* Boutons Musique style Index */
        .music-controls { display: flex; gap: 10px; }
        .btn-music { background: #008080; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-music:hover { background: #2e7d32; }

        /* Menu */
        .menu-table { margin: 20px auto; background-color: #008080; border-collapse: collapse; border-radius: 10px; overflow: hidden; }
        .menu-table td { padding: 12px 20px; border: 1px solid #FFFFFF; transition: 0.3s; }
        .menu-table td:hover { background: #2e7d32; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; }
        
        .intro-box { background: white; border: 3px solid #008080; border-radius: 20px; width: 90%; max-width: 800px; margin: 20px auto; padding: 30px; box-shadow: 5px 5px 15px rgba(0,0,0,0.1); }
        .zone-explication { text-align: left; background: #F1F8E9; border-left: 5px solid #008080; padding: 20px; margin-bottom: 25px; border-radius: 10px; line-height: 1.6; }

        .action-hub { margin: 20px 0; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .btn-principal { text-decoration: none; padding: 15px 30px; border-radius: 25px; font-weight: bold; transition: 0.3s; box-shadow: 4px 4px 0px #004d40; cursor: pointer; border: none; display: inline-block; }
        .btn-consult { background: #2e7d32; color: white; }
        .btn-declare { background: #FFFFFF; color: #2e7d32; border: 2px solid #2e7d32; }
        .btn-principal:hover { transform: scale(1.05); }

        #section-formulaire { display: none; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .form-container { background: white; border: 5px solid #008080; border-radius: 30px; width: 90%; max-width: 800px; margin: 20px auto; padding: 25px; box-shadow: 10px 10px 0px #008080; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 12px; margin: 5px 0; border-radius: 12px; border: 2px solid #008080; font-family: inherit; }
        .full-width { grid-column: 1 / -1; }
        
        .btn-envoi { background: #008080; color: white; border: none; padding: 18px 40px; border-radius: 25px; font-weight: bold; cursor: pointer; margin-top: 20px; }

        .copyright { margin: 40px 0; font-size: 0.9em; }
        .copyright a { color: #008080; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-tools">
        <div id="google_translate_element"></div>
        <div class="music-controls">
            <button class="btn-music" onclick="playMusic()">▶ PLAY</button>
            <button class="btn-music" onclick="stopMusic()">◼ STOP</button>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="votre-musique.mp3" type="audio/mpeg">
    </audio>
    <audio id="snd-pop" src="https://www.soundjay.com/buttons/sounds/button-37.mp3"></audio>
    <audio id="snd-valid" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

    <script>
        function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element'); }
        function playMusic() { document.getElementById('bgMusic').play(); }
        function stopMusic() { document.getElementById('bgMusic').pause(); document.getElementById('bgMusic').currentTime = 0; }
        function playPop() { document.getElementById('snd-pop').play().catch(()=>{}); }
        function playValid() { document.getElementById('snd-valid').play().catch(()=>{}); }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impot.html">Impôt Public</a></td>
            <td><a href="registre_public.html">Le Registre</a></td>
        </tr>
    </table>

    <h1>📜 Le Trésor Public : Participation aux Communs</h1>

    <div class="intro-box">
        <div class="zone-explication">
            <p>XXX (Phrase 1)</p>
            <p>XXX (Phrase 2)</p>
            <p>XXX (Phrase 3)</p>
            <p>XXX (Phrase 4)</p>
            <p>XXX (Phrase 5)</p>
        </div>

        <div class="action-hub">
            <a href="registre_public.html" class="btn-principal btn-consult" onmouseover="playPop()">📖 CONSULTER LE REGISTRE</a>
            <div onclick="ouvrirFormulaire()" class="btn-principal btn-declare" onmouseover="playPop()">✍️ DÉCLARER UNE ACTION</div>
        </div>
    </div>

    <div id="section-formulaire" class="form-container">
        <form id="impotForm">
            <div class="form-grid">
                <div><label>Identité / Pseudo :</label><input type="text" id="nom" required></div>
                <div><label>Localisation :</label><input type="text" id="ville" required></div>
                <div class="full-width">
                    <label>Sous-rubrique d'intervention :</label>
                    <select id="categorie">
                        <option value="Maintenance">🏗️ Maintenance des Infrastructures Globales</option>
                        <option value="Brigade Ingrate">🧹 La Brigade des Travaux Ingrats</option>
                        <option value="Ingénierie">⚙️ Soutien Technique et Ingénierie</option>
                    </select>
                </div>
                <div class="full-width"><label>Description :</label><textarea id="message" rows="4" required></textarea></div>
                <div class="full-width"><label>Besoins :</label><input type="text" id="besoin"></div>
            </div>
            <button type="submit" id="btnEnvoi" class="btn-envoi" onmouseover="playPop()">GRAVER AU REGISTRE 🌿</button>
        </form>
    </div>

    <div class="copyright">
        © 2000 <a href="transition-externe.html">Le Petit Prince des Jardiniers</a>
    </div>

    <script>
        const URL_SERVEUR = "https://script.google.com/macros/s/AKfycbz4ncs9qw_AfmKSER5QST-P0OeKQggQaq86QC6liS53uZ9sx4Lo_-4-h1knXKWqgQMc/exec";

        function ouvrirFormulaire() {
            playPop();
            document.getElementById('section-formulaire').style.display = 'block';
            window.scrollTo({ top: document.getElementById('section-formulaire').offsetTop, behavior: 'smooth' });
        }

        document.getElementById('impotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            playValid();
            const btn = document.getElementById('btnEnvoi');
            btn.innerText = "Gravure..."; btn.disabled = true;

            fetch(URL_SERVEUR, { 
                method: 'POST', mode: 'no-cors', 
                body: JSON.stringify({
                    date: new Date().toLocaleDateString('fr-FR'),
                    type: "impot",
                    nom: document.getElementById('nom').value,
                    localisation: document.getElementById('ville').value,
                    message: `[${document.getElementById('categorie').value}] ${document.getElementById('message').value}`
                })
            }).then(() => { 
                alert("Action gravée !"); 
                window.location.href = "registre_public.html"; 
            });
        });
    </script>
</body>
</html>
