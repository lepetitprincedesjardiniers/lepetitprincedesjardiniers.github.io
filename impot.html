<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impôt Public - Participation Citoyenne</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive; background-color: #E8F5E9; color: #004d40; margin: 0; text-align: center; }
        .menu-table { margin: 20px auto; background-color: #008080; border-collapse: collapse; border-radius: 10px; overflow: hidden; margin-left: auto; margin-right: auto; }
        .menu-table td { padding: 12px 20px; border: 1px solid #FFFFFF; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; }
        
        .intro-box { background: white; border: 3px solid #008080; border-radius: 20px; width: 90%; max-width: 800px; margin: 20px auto; padding: 25px; box-shadow: 5px 5px 15px rgba(0,0,0,0.1); }
        .action-hub { margin: 20px 0; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .btn-principal { text-decoration: none; padding: 15px 25px; border-radius: 25px; font-weight: bold; transition: 0.3s; box-shadow: 4px 4px 0px #004d40; cursor: pointer; }
        .btn-consult { background: #2e7d32; color: white; }
        .btn-declare { background: #FFFFFF; color: #2e7d32; border: 2px solid #2e7d32; }

        #section-formulaire { display: none; }
        .form-container { background: white; border: 5px solid #008080; border-radius: 30px; width: 90%; max-width: 800px; margin: 20px auto; padding: 25px; box-shadow: 10px 10px 0px #008080; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #00695c; font-size: 0.9em; }
        input, textarea, select { width: 100%; padding: 12px; margin: 5px 0; border-radius: 12px; border: 2px solid #008080; box-sizing: border-box; font-family: inherit; }
        .full-width { grid-column: 1 / -1; }
        .btn-envoi { background: #008080; color: white; border: none; padding: 18px 40px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 1.2em; margin-top: 20px; }
    </style>
</head>
<body>

    <table class="menu-table">
        <tr>
            <td><a href="index.html">Accueil</a></td>
            <td><a href="formulaire.html">Semer</a></td>
            <td><a href="jardin.html">Le Jardin</a></td>
            <td><a href="impot.html">Impôt Public</a></td>
            <td><a href="registre_public.html">Le Registre</a></td>
        </tr>
    </table>

    <h1>📜 Le Trésor Public : Participation aux Communs</h1>

    <div class="intro-box">
        <h2>Travaux & Participation</h2>
        <p>Ici, on remplace la fiscalité par la contribution aux tâches critiques. Choisissez votre mode d'action :</p>
        <div class="action-hub">
            <a href="registre_public.html" class="btn-principal btn-consult">📖 CONSULTER LES ANNONCES</a>
            <div onclick="ouvrirFormulaire()" class="btn-principal btn-declare">✍️ PASSER UNE ANNONCE</div>
        </div>
    </div>

    <div id="section-formulaire" class="form-container">
        <form id="impotForm">
            <div class="form-grid">
                <div>
                    <label>Identité / Pseudo :</label>
                    <input type="text" id="nom" placeholder="Qui êtes-vous ?" required>
                </div>
                <div>
                    <label>Localisation de l'action :</label>
                    <input type="text" id="ville" placeholder="Ville, Cité ou Zone" required>
                </div>
                <div class="full-width">
                    <label>Sous-rubrique d'intervention :</label>
                    <select id="categorie">
                        <option value="Maintenance">🏗️ Maintenance (Eaux, Numérique, Routes, Satellites)</option>
                        <option value="Brigade Ingrate">🧹 Brigade des Travaux Ingrats (Rotation Déchets/Assainissement)</option>
                        <option value="Ingénierie">⚙️ Soutien Technique & Ingénierie (Brevets et Plans Libres)</option>
                    </select>
                </div>
                <div class="full-width">
                    <label>Description de votre contribution :</label>
                    <textarea id="message" rows="4" placeholder="Détaillez votre action pour la communauté..." required></textarea>
                </div>
                <div class="full-width">
                    <label>Besoins (facultatif) :</label>
                    <input type="text" id="besoin" placeholder="Matériel ou aide souhaitée pour continuer">
                </div>
            </div>
            <button type="submit" id="btnEnvoi" class="btn-envoi">AJOUTER AU REGISTRE 🌿</button>
        </form>
    </div>

    <script>
        const URL_SERVEUR = "https://script.google.com/macros/s/AKfycbz4ncs9qw_AfmKSER5QST-P0OeKQggQaq86QC6liS53uZ9sx4Lo_-4-h1knXKWqgQMc/exec";

        function ouvrirFormulaire() {
            document.getElementById('section-formulaire').style.display = 'block';
            window.scrollTo({ top: document.getElementById('section-formulaire').offsetTop, behavior: 'smooth' });
        }

        document.getElementById('impotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnEnvoi');
            btn.innerText = "Inscription..."; btn.disabled = true;

            const msgComplet = `[${document.getElementById('categorie').value}] ${document.getElementById('message').value} (Besoins : ${document.getElementById('besoin').value || 'Aucun'})`;

            fetch(URL_SERVEUR, { 
                method: 'POST', mode: 'no-cors', 
                body: JSON.stringify({
                    date: new Date().toLocaleDateString('fr-FR'),
                    type: "impot",
                    nom: document.getElementById('nom').value,
                    localisation: document.getElementById('ville').value,
                    message: msgComplet
                })
            }).then(() => { 
                alert("Votre action a été ajoutée au Registre Public."); 
                window.location.href = "registre_public.html"; 
            });
        });
    </script>
</body>
</html>
