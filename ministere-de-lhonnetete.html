<!-- Script de liaison Google Sheets (Ultra-robuste) -->
    <script>
        const sheetID = "1jJZm_WSIMgM5r-Y5zTSrC8FUiLhRN-dOcPnIcSyTpSI";
        const gid = "1311533436";
        const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetID}/export?format=csv&gid=${gid}`;

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            complete: function(results) {
                const data = results.data;
                
                let alauneHTML = '';
                let articlesHTML = '';
                let videosHTML = '';

                data.forEach(row => {
                    // Normalise les clés (ignore les majuscules et les accents du tableau Google Sheets)
                    const cleanRow = {};
                    Object.keys(row).forEach(key => {
                        const cleanKey = key.toLowerCase()
                            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                            .trim();
                        cleanRow[cleanKey] = row[key];
                    });

                    const pos = (cleanRow.position || "").trim().toLowerCase();
                    const titre = cleanRow.titre || "";
                    const desc = cleanRow.description || "";
                    const lien = cleanRow.lien || "#";
                    const cat = cleanRow.categorie || "Général";
                    const date = cleanRow.date || "";

                    if (!titre) return; // Ignore les lignes vides

                    if (pos === 'alaune-article') {
                        alauneHTML = `
                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                                <div class="space-y-6">
                                    <span class="inline-flex items-center gap-2 bg-joy-gold/20 text-joy-gold border border-joy-gold/30 px-3.5 py-1.5 rounded-full text-xs font-black uppercase tracking-wider">
                                        <i class="fa-solid fa-bolt"></i> À la une • Enquête exclusive
                                    </span>
                                    <h2 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold leading-tight tracking-tight text-white">
                                        ${titre}
                                    </h2>
                                    <p class="text-amber-100/80 text-lg leading-relaxed">
                                        ${desc}
                                    </p>
                                    <div class="flex flex-wrap gap-4 pt-2">
                                        <a href="${lien}" target="_blank" class="bg-joy-gold text-joy-dark px-6 py-3.5 rounded-xl font-black hover:bg-amber-400 transition shadow-lg shadow-amber-500/20">
                                            Lire l'enquête <i class="fa-solid fa-arrow-right ml-1 text-xs"></i>
                                        </a>
                                    </div>
                                </div>
                                <div class="relative rounded-2xl overflow-hidden shadow-2xl border border-white/10 bg-gray-900 p-8 flex flex-col justify-center min-h-[300px]">
                                    <span class="text-xs text-joy-gold font-bold uppercase tracking-wider mb-2">${cat}</span>
                                    <h3 class="text-2xl font-bold text-white mb-4">${titre}</h3>
                                    <p class="text-gray-300 text-sm">${desc}</p>
                                </div>
                            </div>
                        `;
                    } else if (pos === 'article') {
                        articlesHTML += `
                            <article class="bg-white rounded-3xl border border-orange-100 overflow-hidden shadow-sm hover:shadow-xl hover:-translate-y-1 transition duration-300 flex flex-col justify-between">
                                <div>
                                    <div class="h-48 bg-gradient-to-br from-amber-100 to-orange-100 flex items-center justify-center text-joy-orange">
                                        <i class="fa-solid fa-newspaper text-4xl"></i>
                                    </div>
                                    <div class="p-6 space-y-3">
                                        <div class="flex items-center justify-between text-xs font-bold">
                                            <span class="bg-amber-100 text-amber-800 px-3 py-1 rounded-full">${cat}</span>
                                            <span class="text-gray-400 font-normal">${date}</span>
                                        </div>
                                        <h3 class="text-xl font-extrabold text-gray-900 leading-snug">
                                            ${titre}
                                        </h3>
                                        <p class="text-gray-600 text-sm leading-relaxed">
                                            ${desc}
                                        </p>
                                    </div>
                                </div>
                                <div class="p-6 pt-0">
                                    <a href="${lien}" target="_blank" class="text-joy-orange font-bold text-sm hover:underline inline-flex items-center gap-1.5">
                                        Lire l'article complet <i class="fa-solid fa-arrow-right text-xs"></i>
                                    </a>
                                </div>
                            </article>
                        `;
                    } else if (pos === 'video' || pos === 'alaune-video') {
                        videosHTML += `
                            <div class="space-y-4 group">
                                <div class="bg-joy-dark rounded-2xl overflow-hidden relative shadow-lg aspect-video flex items-center justify-center">
                                    <div class="absolute inset-0 bg-gradient-to-tr from-indigo-950 to-orange-950 opacity-90 group-hover:scale-105 transition duration-500"></div>
                                    <a href="${lien}" target="_blank" class="w-16 h-16 bg-joy-orange rounded-full flex items-center justify-center text-white shadow-xl z-10 group-hover:scale-110 transition">
                                        <i class="fa-solid fa-play ml-1 text-lg"></i>
                                    </a>
                                    <span class="absolute bottom-4 left-4 z-10 text-xs font-bold text-amber-300 bg-black/40 px-3 py-1 rounded-lg backdrop-blur-sm">${cat}</span>
                                </div>
                                <div>
                                    <h3 class="text-lg font-extrabold text-gray-900 group-hover:text-joy-orange transition">${titre}</h3>
                                    <p class="text-gray-600 text-sm mt-1">${desc}</p>
                                </div>
                            </div>
                        `;
                    }
                });

                // Si aucune donnée n'a été trouvée ou si les blocs restent vides
                if (alauneHTML) {
                    document.getElementById('alaune-content').innerHTML = alauneHTML;
                } else {
                    document.getElementById('alaune-content').innerHTML = '<div class="text-center py-12 text-amber-200">Aucun article "À la une" trouvé dans le tableau.</div>';
                }

                if (articlesHTML) document.getElementById('articles-grid').innerHTML = articlesHTML;
                if (videosHTML) document.getElementById('videos-grid').innerHTML = videosHTML;
            }
        });
    </script>
