<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualités & Médias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        joy: { orange: '#f97316', dark: '#1e293b' }
                    }
                }
            }
        }
    </script>
    <style>
        .desc-content { display: none; }
        .desc-content.expanded { display: block; }
        .arrow-icon { transition: transform 0.3s ease; }
        .arrow-icon.rotated { transform: rotate(180deg); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- En-tête et Recherche -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-black text-joy-dark">MEDIA<span class="text-joy-orange">MAG</span></h1>
            <div class="relative w-full sm:w-96">
                <!-- IMPORTANT : oninput appelle filterContent() pour filtrer vidéos ET articles -->
                <input type="text" id="search-input" oninput="filterContent()" placeholder="Rechercher vidéos, articles, catégories..." class="w-full pl-10 pr-4 py-2 rounded-full border border-gray-200 focus:outline-none focus:border-joy-orange focus:ring-1 focus:ring-joy-orange bg-gray-50">
                <i class="fa-solid fa-search absolute left-4 top-3.5 text-gray-400"></i>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-12">
        <!-- À la une -->
        <section id="hero-section" class="hidden mb-12">
            <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4">À la une</h2>
            <div id="hero-container"></div>
        </section>

        <!-- Grille des Vidéos -->
        <section>
            <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-6">Vidéos & Shorts</h2>
            <div id="videos-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Chargement... -->
                <div class="col-span-full text-center py-12 text-gray-500"><i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-joy-orange"></i><br>Chargement des vidéos...</div>
            </div>
            <!-- Bouton Charger plus de Vidéos -->
            <div id="load-more-videos-container" class="text-center pt-6 hidden">
                <button onclick="showMoreVideos()" class="bg-orange-50 hover:bg-joy-orange hover:text-white text-joy-orange font-bold text-sm px-6 py-3 rounded-xl transition border border-orange-200 shadow-sm cursor-pointer inline-flex items-center gap-2">
                    <span>Charger plus de vidéos</span> <i class="fa-solid fa-chevron-down text-xs"></i>
                </button>
            </div>
        </section>

        <!-- Grille des Articles -->
        <section>
            <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-6">Articles</h2>
            <div id="articles-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            <!-- Bouton Charger plus d'Articles -->
            <div id="load-more-container" class="text-center pt-6 hidden">
                <button onclick="showMoreArticles()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-sm px-6 py-3 rounded-xl transition border border-gray-200 shadow-sm cursor-pointer inline-flex items-center gap-2">
                    <span>Charger plus d'articles</span> <i class="fa-solid fa-chevron-down text-xs"></i>
                </button>
            </div>
        </section>
    </main>

    <!-- Modal Visionneuse -->
    <div id="content-modal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col backdrop-blur-sm transition-opacity">
        <div class="flex justify-between items-center p-4 text-white">
            <h3 id="modal-title" class="font-bold text-lg truncate pr-4 text-gray-200"></h3>
            <button onclick="closeModal()" class="text-white hover:text-joy-orange p-2 bg-white/10 rounded-full w-10 h-10 flex items-center justify-center transition">
                <i class="fa-solid fa-times text-xl"></i>
            </button>
        </div>
        <div class="flex-grow flex items-center justify-center p-2 sm:p-6">
            <iframe id="modal-iframe" class="w-full h-full max-w-5xl rounded-2xl shadow-2xl bg-black" frameborder="0" allow="autoplay; fullscreen"></iframe>
        </div>
    </div>

    <!-- SCRIPT COMPLET -->
    <script>
        const sheetID = "1jJZm_WSIMgM5r-Y5zTSrC8FUiLhRN-dOcPnIcSyTpSI";
        const gid = "1311533436";
        const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetID}/export?format=csv&gid=${gid}`;

        let allArticles = []; 
        let allVideos = [];
        let displayedArticleLimit = 9; 
        let displayedVideoLimit = 9;

        // DÉTECTEUR YOUTUBE ULTRA-ROBUSTE (Nettoie les espaces et trouve l'ID partout)
        function getYouTubeId(url) {
            if (!url) return '';
            const cleanUrl = url.trim(); 
            const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/|youtube\.com\/shorts\/)([^"&?\/\s]{11})/i;
            const match = cleanUrl.match(regExp);
            return match ? match[1] : '';
        }

        // URL D'INTÉGRATION
        function getEmbedUrl(url) {
            if (!url) return '';
            const cleanUrl = url.trim();
            if (cleanUrl.includes('docs.google.com/document/d/')) {
                const match = cleanUrl.match(/\/document\/d\/([a-zA-Z0-9-_]+)/);
                return match ? `https://docs.google.com/document/d/${match[1]}/preview` : cleanUrl;
            }
            const videoId = getYouTubeId(cleanUrl);
            if (videoId) {
                return `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            }
            return cleanUrl;
        }

        // GESTION DES MODALES
        function openModal(title, url) {
            if (!url) return;
            const modal = document.getElementById('content-modal');
            const modalTitle = document.getElementById('modal-title');
            const iframe = document.getElementById('modal-iframe');
            
            modalTitle.textContent = title;
            iframe.src = getEmbedUrl(url);
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function openArticleByIndex(index) {
            if (allArticles[index]) openModal(allArticles[index].titre, allArticles[index].lien);
        }

        function openVideoByIndex(index) {
            if (allVideos[index]) openModal(allVideos[index].titre, allVideos[index].lien);
        }

        function closeModal() {
            const modal = document.getElementById('content-modal');
            const iframe = document.getElementById('modal-iframe');
            modal.classList.add('hidden');
            iframe.src = ''; 
            document.body.style.overflow = 'auto';
        }

        // SYSTÈME DE DÉPLIANT (Chevron MINIMALISTE)
        function toggleDesc(btn) {
            const container = btn.closest('.desc-container');
            const content = container.querySelector('.desc-content');
            const icon = btn.querySelector('.arrow-icon');
            content.classList.toggle('expanded');
            icon.classList.toggle('rotated');
        }

        // RECHERCHE GLOBALE
        function filterContent() {
            renderVideos();
            renderArticles();
        }
        // AFFICHAGE DES VIDÉOS (Avec recherche et pagination)
        function renderVideos() {
            const grid = document.getElementById('videos-grid');
            const searchInput = document.getElementById('search-input');
            const loadMoreContainer = document.getElementById('load-more-videos-container');
            
            const query = searchInput ? searchInput.value.toLowerCase().trim() : "";

            const filtered = allVideos.filter(item => {
                const searchStr = `${item.titre || ''} ${item.description || ''} ${item.categorie || ''}`.toLowerCase();
                return searchStr.includes(query);
            });

            const limit = query ? filtered.length : displayedVideoLimit;
            const videosToDisplay = filtered.slice(0, limit);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500 font-medium bg-white rounded-3xl border border-gray-100">Aucune vidéo trouvée pour "${query}".</div>`;
                if (loadMoreContainer) loadMoreContainer.classList.add('hidden');
                return;
            }

            let html = '';
            videosToDisplay.forEach(vid => {
                const realIndex = allVideos.findIndex(v => v === vid);
                const videoId = getYouTubeId(vid.lien);
                const thumbUrl = videoId ? `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg` : 'https://via.placeholder.com/600x400?text=Vidéo';

                html += `
                    <div class="bg-white rounded-3xl border border-orange-100 overflow-hidden shadow-sm flex flex-col justify-between p-6 space-y-4">
                        <h3 class="text-lg font-extrabold text-joy-dark leading-snug line-clamp-2">${vid.titre}</h3>
                        
                        <div onclick="openVideoByIndex(${realIndex})" class="rounded-2xl overflow-hidden relative shadow-md aspect-video flex items-center justify-center cursor-pointer group bg-gray-900 bg-cover bg-center" style="background-image: url('${thumbUrl}');">
                            <div class="absolute inset-0 bg-black/30 group-hover:bg-black/10 transition duration-300"></div>
                            <div class="w-14 h-14 bg-joy-orange text-white rounded-full flex items-center justify-center shadow-xl z-10 group-hover:scale-110 transition duration-300">
                                <i class="fa-solid fa-play ml-1"></i>
                            </div>
                            <span class="absolute top-3 left-3 z-10 text-[10px] font-bold text-amber-900 bg-amber-100/90 px-2.5 py-1 rounded-full uppercase tracking-wider">${vid.categorie || 'Vidéo'}</span>
                        </div>

                        <div class="desc-container border-t border-orange-100 pt-3 space-y-2">
                            <div class="flex items-center justify-between text-xs text-gray-400 font-medium px-1">
                                <span>${vid.date || ''}</span>
                            </div>
                            <div class="text-center pt-1">
                                <button onclick="toggleDesc(this)" class="inline-flex items-center justify-center w-9 h-9 rounded-full bg-orange-50 text-joy-orange hover:bg-joy-orange hover:text-white transition shadow-sm cursor-pointer">
                                    <i class="fa-solid fa-chevron-down arrow-icon text-sm"></i>
                                </button>
                            </div>
                            <div class="desc-content text-gray-600 text-sm leading-relaxed whitespace-pre-line pt-2 bg-orange-50/40 p-4 rounded-2xl border border-orange-100/60">
                                ${vid.description || 'Aucune description fournie.'}
                            </div>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;

            if (loadMoreContainer) {
                if (!query && displayedVideoLimit < filtered.length) {
                    loadMoreContainer.classList.remove('hidden');
                } else {
                    loadMoreContainer.classList.add('hidden');
                }
            }
        }

        // AFFICHAGE DES ARTICLES
        function renderArticles() {
            const grid = document.getElementById('articles-grid');
            const searchInput = document.getElementById('search-input');
            const loadMoreContainer = document.getElementById('load-more-container');
            
            const query = searchInput ? searchInput.value.toLowerCase().trim() : "";

            const filtered = allArticles.filter(item => {
                const searchStr = `${item.titre || ''} ${item.description || ''} ${item.categorie || ''}`.toLowerCase();
                return searchStr.includes(query);
            });

            const limit = query ? filtered.length : displayedArticleLimit;
            const articlesToDisplay = filtered.slice(0, limit);

            if (filtered.length === 0) {
                if (grid) grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500 font-medium bg-white rounded-3xl border border-gray-100">Aucun article trouvé pour "${query}".</div>`;
                if (loadMoreContainer) loadMoreContainer.classList.add('hidden');
                return;
            }

            let html = '';
            articlesToDisplay.forEach(art => {
                const realIndex = allArticles.findIndex(a => a === art);
                
                html += `
                    <div class="bg-white rounded-3xl border border-gray-100 overflow-hidden shadow-sm flex flex-col justify-between p-6 space-y-4">
                        <h3 class="text-lg font-extrabold text-gray-800 leading-snug line-clamp-2">${art.titre}</h3>
                        
                        <div onclick="openArticleByIndex(${realIndex})" class="rounded-2xl overflow-hidden relative shadow-md aspect-video flex items-center justify-center cursor-pointer group bg-gray-100 border border-gray-200">
                            <div class="absolute inset-0 bg-black/5 group-hover:bg-black/0 transition duration-300"></div>
                            <div class="w-12 h-12 bg-white text-gray-800 rounded-full flex items-center justify-center shadow-lg z-10 group-hover:scale-110 transition duration-300">
                                <i class="fa-solid fa-arrow-right"></i>
                            </div>
                            <span class="absolute top-3 left-3 z-10 text-[10px] font-bold text-gray-700 bg-white/90 px-2.5 py-1 rounded-full uppercase tracking-wider">${art.categorie || 'Article'}</span>
                        </div>

                        <div class="desc-container border-t border-gray-100 pt-3 space-y-2">
                            <div class="flex items-center justify-between text-xs text-gray-400 font-medium px-1">
                                <span>${art.date || ''}</span>
                            </div>
                            <div class="text-center pt-1">
                                <button onclick="toggleDesc(this)" class="inline-flex items-center justify-center w-9 h-9 rounded-full bg-gray-50 text-gray-500 hover:bg-gray-200 hover:text-gray-800 transition shadow-sm cursor-pointer">
                                    <i class="fa-solid fa-chevron-down arrow-icon text-sm"></i>
                                </button>
                            </div>
                            <div class="desc-content text-gray-600 text-sm leading-relaxed whitespace-pre-line pt-2 bg-gray-50/50 p-4 rounded-2xl border border-gray-100">
                                ${art.description || 'Aucune description fournie.'}
                            </div>
                        </div>
                    </div>
                `;
            });

            if (grid) grid.innerHTML = html;

            if (loadMoreContainer) {
                if (!query && displayedArticleLimit < filtered.length) {
                    loadMoreContainer.classList.remove('hidden');
                } else {
                    loadMoreContainer.classList.add('hidden');
                }
            }
        }

        // FONCTIONS CHARGER PLUS
        function showMoreVideos() {
            displayedVideoLimit += 9;
            renderVideos();
        }

        function showMoreArticles() {
            displayedArticleLimit += 9;
            renderArticles();
        }

        // CHARGEMENT DEPUIS GOOGLE SHEETS
        window.addEventListener('DOMContentLoaded', () => {
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const data = results.data;
                    
                    // Séparation automatique Vidéos vs Articles
                    data.forEach(row => {
                        if (!row.titre || !row.lien) return; // Ignore les lignes vides
                        
                        if (getYouTubeId(row.lien)) {
                            allVideos.push(row);
                        } else {
                            allArticles.push(row);
                        }
                    });

                    // Si on a un article, on le met "À la une"
                    if (allArticles.length > 0) {
                        const heroSection = document.getElementById('hero-section');
                        const heroContainer = document.getElementById('hero-container');
                        const firstArt = allArticles[0];
                        
                        if (heroSection && heroContainer) {
                            heroSection.classList.remove('hidden');
                            heroContainer.innerHTML = `
                                <div onclick="openArticleByIndex(0)" class="bg-joy-dark rounded-3xl overflow-hidden shadow-lg cursor-pointer group relative">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent z-10"></div>
                                    <div class="p-8 md:p-12 relative z-20 flex flex-col justify-end min-h-[300px]">
                                        <span class="inline-block px-3 py-1 bg-joy-orange text-white text-xs font-bold rounded-full uppercase tracking-wider w-max mb-4">${firstArt.categorie || 'En Vedette'}</span>
                                        <h3 class="text-2xl md:text-4xl font-black text-white leading-tight mb-4 group-hover:text-joy-orange transition">${firstArt.titre}</h3>
                                        <p class="text-gray-300 line-clamp-2 max-w-3xl">${firstArt.description || ''}</p>
                                    </div>
                                </div>
                            `;
                        }
                    }

                    renderVideos();
                    renderArticles();
                },
                error: function(error) {
                    console.error("Erreur PapaParse:", error);
                    document.getElementById('videos-grid').innerHTML = `<div class="col-span-full text-center py-12 text-red-500">Erreur de connexion au document.</div>`;
                }
            });
        });
    </script>
</body>
</html>
