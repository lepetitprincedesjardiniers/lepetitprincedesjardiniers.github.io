<div class="video-comment-box" id="apropos">
  
  <!-- Zone Vidéo / Lecteur YouTube (Lancement direct au clic) -->
  <div class="video-container" id="videoContainer" onclick="playYouTubeVideo('VOTRE_ID_DE_VIDEO')">
    <div class="video-thumbnail-overlay">
      <!-- Remplacez VOTRE_ID_DE_VIDEO par l'identifiant YouTube de votre vidéo (ex: dQw4w9WgXcQ) -->
      <img src="https://img.youtube.com/vi/VOTRE_ID_DE_VIDEO/hqdefault.jpg" alt="Miniature vidéo" class="video-thumb">
      <div class="play-button-overlay">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="#ff8c00">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Résumé principal (toujours visible) -->
  <div class="video-summary">
    <p>Ceci est le résumé principal de la vidéo. Les phrases sont bien espacées et aérées pour un confort de lecture optimal.</p>
  </div>

  <!-- Contenu supplémentaire masqué par défaut (développé via la flèche) -->
  <div class="video-details" id="extra-details">
    <!-- Nom de l'auteur -->
    <div class="author-name">Auteur : Nom de la Chaîne</div>

    <!-- Hashtags -->
    <div class="video-hashtags">
      <span>#MinistereDeLHonnetete</span> <span>#LePetitPrinceDesJardiniers</span> <span>#Video</span>
    </div>

    <!-- Copyright -->
    <div class="video-copyright">
      <small>© 2026 Ministère de l'Honnêteté. Tous droits réservés.</small>
    </div>
  </div>

  <!-- Flèche orange au centre pour développer -->
  <div class="arrow-container">
    <button class="orange-arrow-btn" onclick="toggleVideoDetails()" aria-label="Développer les commentaires">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff8c00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="arrow-icon">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </div>
</div>
