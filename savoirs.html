<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savoirs & Éclosion - Le Petit Prince des Jardiniers</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive; background-color: #FFFDE7; color: #795548; margin: 0; text-align: center; }
        .header-tools { display: flex; justify-content: flex-start; padding: 5px; background: rgba(255,255,255,0.3); }
        #google_translate_element { transform: scale(0.7); transform-origin: top left; opacity: 0.6; }
        .menu-table { margin: 15px auto; background-color: #FFB300; border-collapse: collapse; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-left: auto; margin-right: auto; }
        .menu-table td { padding: 10px 18px; border: 1px solid #FFFFFF; transition: 0.3s; }
        .menu-table td:hover { background: #FFA000; }
        .menu-table a { text-decoration: none; color: #FFFFFF; font-weight: bold; font-size: 0.9em; }
        .intro-box { background: white; border: 3px solid #FFB300; border-radius: 20px; width: 85%; max-width: 800px; margin: 20px auto; padding: 25px; }
        .zone-explication { text-align: left; background: #FFF9C4; border-left: 5px solid #FFB300; padding: 20px; margin-bottom: 25px; border-radius: 10px; color: #5D4037; }
        .action-hub { margin: 20px 0; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .btn-principal { padding: 12px 25px; border-radius: 25px; font-weight: bold; transition: 0.3s; cursor: pointer; border: none; text-decoration: none; display: inline-block; box-shadow: 3px 3px 0px #795548; }
        .btn-consult { background: #FFB300; color: white; }
        .btn-declare { background: white; color: #FFB300; border: 2px solid #FFB300; }
        #section-formulaire { display: none; animation: fadeIn 0.6s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .form-container { background: white; border: 5px solid #FFB300; border-radius: 30px; width: 85%; max-width: 800px; margin: 20px auto; padding: 25px; box-shadow: 8px 8px 0px #FFB300; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; }
        input, textarea, select { width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #FFB300; font-family: inherit; box-sizing: border-box; }
        .full-width { grid-column: 1 / -1; }
        .btn-envoi { background: #FFB300; color: white; border: none; padding: 15px 35px; border-radius: 20px; font-weight: bold; cursor: pointer; width: 100%; }
        .copyright { margin: 50px 0 30px; font-size: 0.85em; }
        .copyright a { color: #FFA000; text-decoration: none; font-weight: bold; padding: 4px 8px; transition: 0.4s; display: inline-block; }
        .copyright a:hover { background: #E67E22; color: white; border-radius: 5px; transform: scale(1.15) rotate(-2deg); }
    </style>
</head>
<body>
    <div class="header-tools"><div id="google_translate_element"></div></div>
    <audio id="snd-pop" src="https://www.soundjay.com/buttons/sounds/button-37.mp3"></audio>
    <audio id="snd-oiseaux" src="oiseaux.mp3"></audio>

    <script>
        function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'fr', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element'); }
        function playPop() { document.getElementById('snd-pop').play().catch(()=>{}); }
        function playOiseaux() { 
            const song = document.getElementById('snd-oiseaux');
            song.play().catch(()=>{});
            setTimeout(() => { song.pause(); song.currentTime = 0; }, 2000);
        }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <table class="menu-table">
        <tr>
            <td><a href="index.html" onmouseover="playPop()">Accueil</a></td>
            <td><a href="formulaire.html" onmouseover="playPop()">Semer</a></td>
            <td><a href="savoirs.html" onmouseover="playPop()">Savoirs</a></td>
            <td><a href="regulation.html" onmouseover="playPop()">Régulation</a></td>
            <td><a href="aide.html" onmouseover="playPop()">Aide & Soins</a></td>
            <td><a href="impot.html" onmouseover="playPop()">Impôt Public</a></td>
        </tr>
    </table>

    <h1 style="text-shadow: 1px 1px 0px white;">💡 Savoirs & Éclosion</h1>

    <div class="intro-box">
        <div class="zone-explication">
            <p>XXX (Phrase 1 : L'Université Buissonnière)</p>
            <p>XXX (Phrase 2 : Recherche & Low-Tech)</p>
            <p>XXX (Phrase 3 : Imaginer le futur commun)</p>
        </div>
        <div class="action-hub">
            <a href="registre_savoirs.html" class="btn-principal btn-consult" onmouseover="playPop()">📖 BIBLIOTHÈQUE VIVANTE</a>
            <div onclick="ouvrirFormulaire()" class="btn-principal btn-declare" onmouseover="playPop()">✨ TRANSMETTRE / CRÉER</div>
        </div>
    </div>

    <div id="section-formulaire" class="form-container">
        <form id="savoirForm">
            <div class="form-grid">
                <div><label>Passeur de savoir :</label><input type="text" id="nom" required></div>
                <div><label>Lieu d'éclosion :</label><input type="text" id="ville" required></div>
                <div class="full-width">
                    <label>Domaine :</label>
                    <select id="categorie">
                        <option value="Transmission">🎓 Université Buissonnière (Mentorat/Ateliers)</option>
                        <option value="Laboratoire">🧪 Laboratoires de l'Imaginaire (Innovation/Low-Tech)</option>
                        <option value="Prospective">🔮 Chroniques du Futur (Projets à long terme)</option>
                    </select>
                </div>
                <div class="full-width"><label>Description du partage ou de l'idée :</label><textarea id="message" rows="4" required></textarea></div>
            </div>
            <button type="submit" id="btnEnvoi" class="btn-envoi" onmouseover="playPop()">DIFFUSER LA LUMIÈRE ✨</button>
        </form>
    </div>

    <div class="copyright">© 2000 <a href="transition-externe.html" onmouseover="playPop()">Le Petit Prince des Jardiniers</a></div>

    <script>
        const URL_SERVEUR = "https://script.google.com/macros/s/AKfycbz4ncs9qw_AfmKSER5QST-P0OeKQggQaq86QC6liS53uZ9sx4Lo_-4-h1knXKWqgQMc/exec";
        function ouvrirFormulaire() { playPop(); document.getElementById('section-formulaire').style.display = 'block'; window.scrollTo({ top: document.getElementById('section-formulaire').offsetTop, behavior: 'smooth' }); }
        
        document.getElementById('savoirForm').addEventListener('submit', function(e) {
            e.preventDefault(); playOiseaux();
            const btn = document.getElementById('btnEnvoi');
            btn.innerText = "Éclosion en cours..."; btn.disabled = true;
            fetch(URL_SERVEUR, { 
                method: 'POST', mode: 'no-cors', 
                body: JSON.stringify({
                    date: new Date().toLocaleDateString('fr-FR'),
                    type: "savoirs",
                    nom: document.getElementById('nom').value,
                    localisation: document.getElementById('ville').value,
                    message: `[${document.getElementById('categorie').value}] ${document.getElementById('message').value}`
                })
            }).then(() => { 
                setTimeout(() => { alert("Votre savoir a rejoint la Bibliothèque Vivante."); window.location.href = "registre_savoirs.html"; }, 2000);
            });
        });
    </script>
</body>
</html>
